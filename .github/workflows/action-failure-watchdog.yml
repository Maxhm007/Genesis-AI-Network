name: Genesis Action Failure Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: '2,12,22,32,42,52 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/action-failure-watchdog.yml'
      - 'scripts/action_failure_watchdog.py'

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: genesis-action-failure-watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Verify watchdog boundaries
        run: python -m pytest -q tests/test_action_failure_watchdog.py tests/test_action_repair_guard.py
      - name: Ensure Action repair labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ensure_label() {
            local name="$1" color="$2" description="$3"
            gh label list --repo "$GITHUB_REPOSITORY" --limit 200 --json name --jq '.[].name' | grep -Fxq "$name" || gh label create "$name" --repo "$GITHUB_REPOSITORY" --color "$color" --description "$description"
          }
          ensure_label genesis-action-failure d1242f 'Genesis detected a failed GitHub Action'
          ensure_label genesis-action-retry fbca04 'One transient retry is pending'
          ensure_label genesis-action-autonomous 1f883d 'Authorized for Genesis privileged Action repair'
          ensure_label genesis-action-verifying 0969da 'Promoted Action repair awaits a fresh passing run'
          ensure_label genesis-action-solved 8250df 'Action repair verified on a fresh run'
          ensure_label genesis-action-blocked b60205 'Action repair safely blocked or exhausted'
          ensure_label genesis-action-transient d4c5f9 'Action passed on one transient retry'
      - name: Reconcile failures and open one new issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/action_failure_watchdog.py --repository "$GITHUB_REPOSITORY"
      - name: Preserve watchdog evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-action-failure-watchdog-${{ github.run_id }}
          path: runtime/action_failure_watchdog.json
          if-no-files-found: ignore
          retention-days: 30
