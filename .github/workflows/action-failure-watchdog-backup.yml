name: Genesis Action Failure Watchdog Backup

on:
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: genesis-action-failure-watchdog-backup
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Verify backup watchdog boundary
        run: python -m pytest -q tests/test_action_failure_watchdog.py
      - name: Reconcile failures and open one new issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/action_failure_watchdog.py --repository "$GITHUB_REPOSITORY"
