name: Genesis Agentic Terminal Reconciler

on:
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/genesis-agentic-terminal-reconciler.yml

permissions:
  issues: write
  actions: write
  contents: read

concurrency:
  group: genesis-agentic-terminal-reconciler
  cancel-in-progress: false

jobs:
  close-exhausted-agentic-issues:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reconcile terminal Agentic Lab issues
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          strategies='["evidence_first","alternative_implementation","diagnostic_reframe","dependency_diagnosis"]'
          closed=0
          reopened=0

          gh api --method POST "repos/${GITHUB_REPOSITORY}/labels" \
            -f name='genesis-agentic-escalated' \
            -f color='8250df' \
            -f description='Solver exhausted; same authoritative Issue remains open with Agentic Lab' >/dev/null 2>&1 || true

          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=open&labels=agentic-lab&sort=created&direction=asc&per_page=100" --jq '.[]' | jq -s '.' > /tmp/agentic-open.json
          mapfile -t issues < <(jq -r '.[] | select(.pull_request == null) | .number' /tmp/agentic-open.json)

          for issue_number in "${issues[@]}"; do
            [ "$closed" -ge 10 ] && break
            issue_json=$(gh issue view "$issue_number" --repo "$GITHUB_REPOSITORY" --json state,labels,title)
            state=$(jq -r '.state' <<<"$issue_json")
            [ "$state" != "OPEN" ] && continue

            active=$(jq -r '([.labels[].name] | any(. == "genesis-repair-in-progress" or . == "genesis-validating" or . == "genesis-working" or . == "genesis-verifying"))' <<<"$issue_json")
            [ "$active" == "true" ] && continue

            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${issue_number}/comments?per_page=100" --jq '.[]' | jq -s '.' > /tmp/comments.json
            attempted=$(jq -c '[.[] | (.body // "") | select(startswith("<!-- genesis-agentic-strategy:")) | capture("^<!-- genesis-agentic-strategy:(?<s>[^ ]+) -->").s] | unique' /tmp/comments.json)
            complete=$(jq -n --argjson required "$strategies" --argjson attempted "$attempted" '$required - $attempted | length == 0')
            [ "$complete" != "true" ] && continue

            title=$(jq -r '.title' <<<"$issue_json")
            comment=$(printf '%s\n%s\n\n%s\n\n%s\n%s\n%s\n\n%s' '<!-- genesis-agentic-terminal-reconcile -->' '**Genesis Agentic Lab — bounded strategy set exhausted**' 'All four current bounded Agentic strategies have been attempted without a verified promotion. This Issue remains open because unsolved Genesis tasks must never be closed merely because attempts were exhausted.' "- Issue: #${issue_number} — ${title}" '- State: OPEN and still authoritative' '- Next step: retain Agentic Lab ownership for a materially different future recovery method' "Reconciler run: ${GITHUB_RUN_ID}.")
            gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body "$comment" >/dev/null

            for label in genesis-repair-in-progress genesis-validating genesis-claimed genesis-working genesis-verifying genesis-terminal genesis-deferred genesis-superseded genesis-recovery-terminal; do
              gh issue edit "$issue_number" --repo "$GITHUB_REPOSITORY" --remove-label "$label" >/dev/null 2>&1 || true
            done
            gh issue edit "$issue_number" --repo "$GITHUB_REPOSITORY" --add-label genesis-agentic-escalated --add-label genesis-solver-exhausted --add-label agentic-lab >/dev/null
            echo "Kept exhausted unsolved Agentic Lab issue #${issue_number} open."
            closed=$((closed + 1))
          done

          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=closed&labels=genesis-task&sort=updated&direction=desc&per_page=100" --jq '.[]' | jq -s '.' > /tmp/recent-closed.json
          mapfile -t closed_issues < <(jq -r '.[] | select(.pull_request == null) | select(([.labels[].name] | index("genesis-verified")) == null) | select([.labels[].name] | any(. == "genesis-deferred" or . == "genesis-superseded" or . == "genesis-terminal" or . == "genesis-recovery-terminal" or . == "genesis-solver-exhausted" or . == "genesis-blocked")) | .number' /tmp/recent-closed.json)

          for issue_number in "${closed_issues[@]}"; do
            [ "$reopened" -ge 20 ] && break
            gh api "repos/${GITHUB_REPOSITORY}/issues/${issue_number}" --method PATCH -f state=open >/dev/null
            for label in genesis-terminal genesis-deferred genesis-superseded genesis-recovery-terminal genesis-repair-in-progress genesis-validating genesis-claimed genesis-working genesis-verifying; do
              gh issue edit "$issue_number" --repo "$GITHUB_REPOSITORY" --remove-label "$label" >/dev/null 2>&1 || true
            done
            gh issue edit "$issue_number" --repo "$GITHUB_REPOSITORY" --add-label genesis-agentic-escalated --add-label genesis-solver-exhausted --add-label agentic-lab >/dev/null
            gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body "Genesis reopened this Issue because it was closed without a verified solution. Unsolved Genesis tasks stay open; only verified promoted fixes may close them. Reconciler run: ${GITHUB_RUN_ID}." >/dev/null
            echo "Reopened unsolved Genesis issue #${issue_number}."
            reopened=$((reopened + 1))
          done

          echo "Exhausted Agentic issues kept open: ${closed}."
          echo "Unsolved closed issues reopened: ${reopened}."
          gh workflow run genesis-agentic-lab-recovery.yml --repo "$GITHUB_REPOSITORY" --ref main >/dev/null 2>&1 || true
          gh workflow run genesis-sequential-issue-controller.yml --repo "$GITHUB_REPOSITORY" --ref main >/dev/null 2>&1 || true