name: Genesis Agentic Terminal Reconciler

# Safety/compatibility trigger only.
# Agentic Lab owns unresolved issue lifecycle state.
# Closure Manager owns final verified close/seal.
# Manual safety/compatibility trigger only; automatic lifecycle is owned by Agentic Lab + Closure Manager.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: genesis-agentic-terminal-reconciler
  cancel-in-progress: true

jobs:
  reconcile-by-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake authoritative lifecycle owners
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Agentic Terminal Reconciler is safety-only."
          echo "Unresolved issue authority: Agentic Lab."
          echo "Verified terminal authority: Closure Manager."
          gh workflow run genesis-agentic-lab-recovery.yml --repo "$GITHUB_REPOSITORY" --ref main
          gh workflow run genesis-issue-closure-manager.yml --repo "$GITHUB_REPOSITORY" --ref main
