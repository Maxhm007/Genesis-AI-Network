name: Genesis Agentic Terminal Reconciler

# Safety/compatibility trigger only.
# Agentic Lab owns unresolved issue lifecycle state.
# Closure Manager owns final verified close/seal.
# Manual safety/compatibility trigger only; automatic lifecycle is owned by Agentic Lab + Closure Manager.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: genesis-agentic-terminal-reconciler
  cancel-in-progress: true

jobs:
  reconcile-by-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake authoritative lifecycle owners
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Agentic Terminal Reconciler is safety-only."
          echo "Unresolved issue authority: Agentic Lab."
          echo "Verified terminal authority: Closure Manager."
          # Skip redundant wakes: a queued/running controller pass (or one woken <2 min ago) already covers this.
          lab_skip="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow genesis-agentic-lab-recovery.yml --limit 20 --json databaseId,status,createdAt,event --jq '[.[] | select(.event != "push" and .event != "pull_request") | select(.status != "completed" or (now - (.createdAt | fromdateiso8601)) < 120)] | if length > 0 then "run \(.[0].databaseId) \(.[0].status)" else "" end' 2>/dev/null || true)"
          if [[ -n "$lab_skip" ]]; then
            echo "Agentic Lab Recovery wake skipped (already active or recently woken): $lab_skip"
          else
            gh workflow run genesis-agentic-lab-recovery.yml --repo "$GITHUB_REPOSITORY" --ref main
          fi
          gh workflow run genesis-issue-closure-manager.yml --repo "$GITHUB_REPOSITORY" --ref main
