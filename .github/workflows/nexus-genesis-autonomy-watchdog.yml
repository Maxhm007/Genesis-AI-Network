name: Nexus Genesis Autonomy Watchdog

on:
  workflow_dispatch: {}
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  # Independent backup wake: the queue cleaner is already a healthy periodic
  # control-plane heartbeat. This keeps Nexus checking even if GitHub delays
  # this workflow's own schedule.
  workflow_run:
    workflows:
      - Genesis Action Queue Cleaner
    types:
      - completed

  push:
    branches: [main]
    paths:
      - scripts/nexus_autonomy_watchdog.py
      - tests/test_nexus_autonomy_watchdog.py
      - .github/workflows/nexus-genesis-autonomy-watchdog.yml
      - .github/workflows/genesis-teammate-autonomous-development.yml
      - .github/workflows/genesis-agentic-lab-recovery.yml
      - config/genesis_teammates.json

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: nexus-genesis-autonomy-watchdog
  cancel-in-progress: false

jobs:
  verify-autonomy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependency
        if: github.event_name == 'push'
        run: python -m pip install --disable-pip-version-check pytest

      - name: Validate Nexus autonomy watchdog
        if: github.event_name == 'push'
        run: python -m pytest -q tests/test_nexus_autonomy_watchdog.py

      - name: Verify Genesis autonomous operation
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/nexus_autonomy_watchdog.py --repository "$GITHUB_REPOSITORY"
