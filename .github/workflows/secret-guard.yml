name: Genesis Secret Guard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '41 2 * * 1'

permissions:
  contents: read

jobs:
  secret_guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan tracked files and all reachable Git history
        run: python scripts/secret_guard.py --history
