name: Genesis Peer Healing

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    paths:
      - 'scripts/peer_heal.py'
      - 'scripts/request_peer_healing.py'
      - '.github/workflows/peer-healing.yml'

permissions:
  actions: write
  contents: read
  issues: write

env:
  NODE_ID: genesis-node-0
  NODE_REPO: Maxhm007/Genesis-AI-Network
  PEER_REPOS: Maxhm007/Genesis-Node-2,Maxhm007/Genesis-Node-3

jobs:
  peer_heal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Process public peer recovery signals
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/peer_heal.py
