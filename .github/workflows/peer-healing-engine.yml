name: Genesis vetted peer-healing engine

# Runs version-pinned peer-authored logic with a token scoped to the opposite repository.
on:
  workflow_call:
    inputs:
      identity:
        description: Caller identity (genesis or eve)
        type: string
        required: true
    secrets:
      PEER_HEAL_TOKEN:
        description: Fine-grained token for the opposite repository's Actions and Issues permissions
        required: true
  pull_request:
    paths:
      - '.github/workflows/peer-healing-engine.yml'

permissions:
  contents: read

jobs:
  heal-caller:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      issues: write
    steps:
      - name: Load immutable Genesis healing engine without credentials
        uses: actions/checkout@v4
        with:
          repository: Maxhm007/Genesis-AI-Network
          ref: 94f6d6530d160ae67b918d211a906da8f0885dbd
          path: engine
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Genesis engine policy
        run: python -m unittest discover -s engine/tests -p test_mutual_healer.py -v
      - name: Check and recover the peer repository
        env:
          PEER_HEAL_TOKEN: ${{ secrets.PEER_HEAL_TOKEN }}
          CALLER_IDENTITY: ${{ inputs.identity }}
        run: python engine/scripts/mutual_healer.py --identity "$CALLER_IDENTITY"

  metadata-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          test -f 'scripts/mutual_healer.py'
          test -f tests/test_mutual_healer.py
