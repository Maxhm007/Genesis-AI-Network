name: Verify Agentic Script Target Support

on:
  push:
    branches: [main]
    paths:
      - scripts/agentic_strategy_repair.py
      - tests/test_agentic_script_target_support.py
      - .github/workflows/verify-agentic-script-target-support.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_agentic_script_target_support.py tests/test_agentic_strategy_repair.py tests/test_agentic_strategy_capability_signal.py
