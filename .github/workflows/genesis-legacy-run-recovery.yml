name: Genesis Legacy Run Recovery

on:
  workflow_dispatch: {}

permissions:
  actions: write
  checks: write
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect and recover legacy Gene Pulse run
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const run_id = 32215089776;
            const job_id = 95955035090;

            const run = await github.request('GET /repos/{owner}/{repo}/actions/runs/{run_id}', {owner, repo, run_id});
            core.info(`Run before recovery: status=${run.data.status} conclusion=${run.data.conclusion}`);

            const jobs = await github.request('GET /repos/{owner}/{repo}/actions/runs/{run_id}/jobs', {owner, repo, run_id, per_page: 100});
            core.info(`Jobs: ${JSON.stringify(jobs.data.jobs.map(j => ({id:j.id,name:j.name,status:j.status,conclusion:j.conclusion,check_run_url:j.check_run_url})))}`);

            for (const method of ['cancel','force-cancel']) {
              try {
                const r = await github.request(`POST /repos/{owner}/{repo}/actions/runs/{run_id}/${method}`, {owner, repo, run_id});
                core.info(`${method} accepted: HTTP ${r.status}`);
              } catch (e) {
                core.warning(`${method} rejected: ${e.status || ''} ${e.message}`);
              }
            }

            try {
              const job = jobs.data.jobs.find(j => j.id === job_id);
              if (job?.check_run_url) {
                const checkId = Number(job.check_run_url.split('/').pop());
                const chk = await github.request('GET /repos/{owner}/{repo}/check-runs/{check_run_id}', {owner, repo, check_run_id: checkId});
                core.info(`Check before recovery: id=${checkId} status=${chk.data.status} conclusion=${chk.data.conclusion}`);

                if (chk.data.status !== 'completed') {
                  try {
                    const upd = await github.request('PATCH /repos/{owner}/{repo}/check-runs/{check_run_id}', {
                      owner, repo, check_run_id: checkId,
                      status: 'completed',
                      conclusion: 'cancelled',
                      completed_at: new Date().toISOString(),
                      output: {
                        title: 'Legacy Genesis run cancelled',
                        summary: 'This stale August 19 Gene Pulse check was force-completed by Genesis recovery.'
                      }
                    });
                    core.info(`Check-run completion accepted: HTTP ${upd.status}`);
                  } catch (e) {
                    core.warning(`Check-run completion rejected: ${e.status || ''} ${e.message}`);
                  }
                }
              }
            } catch (e) {
              core.warning(`Check-run inspection failed: ${e.status || ''} ${e.message}`);
            }

            try {
              const del = await github.request('DELETE /repos/{owner}/{repo}/actions/runs/{run_id}', {owner, repo, run_id});
              core.info(`Delete accepted: HTTP ${del.status}`);
            } catch (e) {
              core.warning(`Delete rejected: ${e.status || ''} ${e.message}`);
            }

            const after = await github.request('GET /repos/{owner}/{repo}/actions/runs/{run_id}', {owner, repo, run_id}).catch(e => ({data:{status:'gone',conclusion:'deleted'}, status:e.status}));
            core.info(`Run after recovery: status=${after.data.status} conclusion=${after.data.conclusion}`);
