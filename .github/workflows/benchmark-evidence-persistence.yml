name: Genesis Benchmark Evidence Persistence

on:
  workflow_run:
    workflows:
      - Genesis SWE-bench Pro Bootstrap Baseline
    types:
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: genesis-benchmark-evidence-persistence
  cancel-in-progress: false

jobs:
  persist:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download independently validated benchmark artifact
        uses: actions/download-artifact@v4
        with:
          name: swe-bench-pro-validated-baseline
          path: validated-benchmark
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Persist quorum-validated benchmark summary
        run: >-
          python scripts/persist_validated_benchmark_snapshot.py
          --input validated-benchmark/competitive_benchmark_results.json
      - name: Commit durable validated evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Genesis Benchmark Evidence"
          git config user.email "genesis-benchmark-evidence@users.noreply.github.com"
          git add evidence/validated_benchmark_results.json
          if git diff --cached --quiet; then
            echo "Validated benchmark evidence already durable."
            exit 0
          fi
          git commit -m "Persist validated benchmark evidence"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:refs/heads/main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Could not persist validated benchmark evidence after bounded retries" >&2
          exit 1
