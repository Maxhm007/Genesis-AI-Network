name: Deploy Gene Persistent Runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - 'scripts/gene_continuous_work.py'
      - 'scripts/gene_issue_continuous.py'
      - 'genesis/pulse.py'
      - 'genesis/github_issue_task_router.py'
      - 'genesis/work_rule.py'
      - '.github/workflows/deploy-persistent-runtime.yml'

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.GENE_RUNTIME_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require runtime configuration
        env:
          HOST: ${{ secrets.GENE_RUNTIME_HOST }}
          USER: ${{ secrets.GENE_RUNTIME_USER }}
          KEY: ${{ secrets.GENE_RUNTIME_SSH_KEY }}
          GITHUB_ISSUE_TOKEN: ${{ secrets.GENE_RUNTIME_GITHUB_TOKEN }}
        run: |
          test -n "$HOST"
          test -n "$USER"
          test -n "$KEY"
          test -n "$GITHUB_ISSUE_TOKEN"

      - name: Install SSH key
        env:
          KEY: ${{ secrets.GENE_RUNTIME_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Pin runtime host key
        env:
          HOST: ${{ secrets.GENE_RUNTIME_HOST }}
          HOST_KEY: ${{ secrets.GENE_RUNTIME_HOST_KEY }}
        run: |
          test -n "$HOST_KEY"
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Provision GitHub Issue authority credential
        env:
          HOST: ${{ secrets.GENE_RUNTIME_HOST }}
          USER: ${{ secrets.GENE_RUNTIME_USER }}
          GITHUB_ISSUE_TOKEN: ${{ secrets.GENE_RUNTIME_GITHUB_TOKEN }}
        run: |
          printf 'GITHUB_TOKEN=%s\nGITHUB_REPOSITORY=Maxhm007/Genesis-AI-Network\n' "$GITHUB_ISSUE_TOKEN" \
            | ssh "$USER@$HOST" 'sudo install -d -m 0750 -o root -g gene /etc/genesis && sudo tee /etc/genesis/github.env >/dev/null && sudo chown root:gene /etc/genesis/github.env && sudo chmod 0640 /etc/genesis/github.env'

      - name: Deploy Gene 0
        env:
          HOST: ${{ secrets.GENE_RUNTIME_HOST }}
          USER: ${{ secrets.GENE_RUNTIME_USER }}
        run: |
          ssh "$USER@$HOST" 'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          if [ ! -d /opt/genesis/.git ]; then
            git clone https://github.com/Maxhm007/Genesis-AI-Network.git /opt/genesis
          else
            git -C /opt/genesis fetch origin main
            git -C /opt/genesis checkout main
            git -C /opt/genesis pull --ff-only origin main
          fi
          bash /opt/genesis/deploy/install_persistent_runtime.sh
          REMOTE

      - name: Verify continuous service
        env:
          HOST: ${{ secrets.GENE_RUNTIME_HOST }}
          USER: ${{ secrets.GENE_RUNTIME_USER }}
        run: ssh "$USER@$HOST" 'systemctl is-active --quiet gene-continuous@gene-node-1.service && systemctl is-enabled --quiet gene-continuous@gene-node-1.service'
