name: Genesis Exhausted Issue Requeue

# Compatibility trigger only.
# Agentic Lab owns exhausted-issue re-arm and recovery state.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - genesis/coding.py
      - genesis/learned_capabilities.py
      - genesis/github_issue_capability_builder.py
      - scripts/agentic_lab_recovery_dispatch.py
      - scripts/agentic_parallel_dispatch.py
      - .github/workflows/genesis-agentic-lab-recovery.yml
      - .github/workflows/genesis-exhausted-issue-requeue.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: genesis-exhausted-issue-requeue
  cancel-in-progress: true

jobs:
  handoff-to-agentic-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake Agentic Lab for new repair-engine generation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Exhausted Issue Requeue is feeder-only. Agentic Lab owns re-arm decisions."
          gh workflow run genesis-agentic-lab-recovery.yml --repo "$GITHUB_REPOSITORY" --ref main
