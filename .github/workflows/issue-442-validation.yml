name: Issue 442 Validation

on:
  push:
    branches:
      - genesis/fix-442-invalid-evolution-json
    paths:
      - .github/workflows/issue-442-validation.yml

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: genesis/fix-442-invalid-evolution-json
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Focused test
        run: python -m pytest -q tests/test_autonomy_cycle.py
      - name: Full suite
        run: python -m pytest -q
      - name: Remove temporary validation workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue-442-validation.yml
          git config user.name "Genesis Repair"
          git config user.email "genesis-ai@users.noreply.github.com"
          git add .github/workflows/issue-442-validation.yml
          git commit -m "Remove temporary issue 442 validation workflow"
          git push origin HEAD:genesis/fix-442-invalid-evolution-json
