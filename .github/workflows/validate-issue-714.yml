name: Validate Issue 714

on:
  push:
    branches:
      - genesis/engine-generation-capability-builder-714
    paths:
      - .github/workflows/validate-issue-714.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: genesis/engine-generation-capability-builder-714
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add capability builder to repair-engine generation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/requeue_exhausted_issues.py')
          text = path.read_text(encoding='utf-8')
          needle = '    "genesis/github_issue_cleanup.py",\n'
          addition = '    "genesis/github_issue_capability_builder.py",\n'
          if addition not in text:
              if needle not in text:
                  raise SystemExit('ENGINE_PATHS insertion anchor missing')
              text = text.replace(needle, addition + needle, 1)
              path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          grep -n 'github_issue_capability_builder.py' scripts/requeue_exhausted_issues.py
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Focused generation and handoff tests
        run: python -m pytest -q tests/test_requeue_engine_generation_capability_builder.py tests/test_requeue_exhausted_issues.py tests/test_unsolved_successor_handoff.py
      - name: Full repository suite
        run: python -m pytest -q
      - name: Commit validated target patch
        run: |
          git config user.name "Genesis Validation"
          git config user.email "genesis-validation@users.noreply.github.com"
          git add scripts/requeue_exhausted_issues.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Track evidence-first repair intelligence generation"
          git push origin HEAD:genesis/engine-generation-capability-builder-714
