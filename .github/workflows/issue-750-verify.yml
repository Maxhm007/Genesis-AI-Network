name: Verify Issue 750 Adaptive Routing

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/issue-750-verify.yml
      - genesis/task_router.py
      - tests/test_task_router_adaptive_budget.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Focused task-router validation
        run: >-
          python -m pytest -q
          tests/test_task_router_adaptive_budget.py
          tests/test_task_router_model_scout.py
          tests/test_autonomous_problem_solver.py
          tests/test_job_failure_intelligence.py
          tests/test_github_issue_task_router.py
