name: Issue 435 Validation

on:
  push:
    branches:
      - genesis/solve-435-benchmark-working-memory
    paths:
      - .github/workflows/issue-435-validation.yml

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: genesis/solve-435-benchmark-working-memory
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply issue 435 patch
        run: python scripts/issue_435_patch.py
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Focused tests
        run: python -m pytest -q tests/test_benchmark_execution.py
      - name: Full repository tests
        run: python -m pytest -q
      - name: Commit tested change and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue-435-validation.yml scripts/issue_435_patch.py
          git config user.name "Genesis Repair"
          git config user.email "genesis-ai@users.noreply.github.com"
          git add genesis/benchmark_execution.py tests/test_benchmark_execution.py .github/workflows/issue-435-validation.yml scripts/issue_435_patch.py
          git commit -m "Add bounded benchmark working memory (#435)"
          git push origin HEAD:genesis/solve-435-benchmark-working-memory
