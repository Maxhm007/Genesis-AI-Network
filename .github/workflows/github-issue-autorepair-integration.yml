name: Genesis GitHub Issue Autorepair Integration

on:
  workflow_call:
    inputs:
      issue_number:
        description: Reserved GitHub issue whose candidate should be integrated
        required: true
        type: number

permissions: {}

concurrency:
  group: genesis-github-issue-autorepair-integration-transaction
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    outputs:
      ready: ${{ steps.prepare.outputs.ready }}
      candidate_branch: ${{ steps.prepare.outputs.candidate_branch }}
      candidate_sha: ${{ steps.prepare.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Rebase reserved candidate onto latest main before validation
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'ready=false' >> "$GITHUB_OUTPUT"
          echo 'candidate_branch=' >> "$GITHUB_OUTPUT"
          echo 'candidate_sha=' >> "$GITHUB_OUTPUT"

          issue_json=$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,labels)
          valid=$(jq -r '
            (.state == "OPEN") and
            (([.labels[].name] | index("genesis-repair-in-progress")) != null) and
            (([.labels[].name] | index("genesis-validating")) != null) and
            (([.labels[].name] | index("genesis-blocked")) == null) and
            (([.labels[].name] | index("genesis-solved")) == null)
          ' <<<"$issue_json")
          if [[ "$valid" != 'true' ]]; then
            echo "Issue #$ISSUE_NUMBER has no reserved candidate requiring integration."
            exit 0
          fi

          status_body=$(gh issue view "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --comments \
            --json comments \
            --jq '[.comments[] | select(.body | startswith("<!-- genesis-github-issue-autorepair -->"))][-1].body // ""')
          branch=$(printf '%s\n' "$status_body" | sed -n 's/.*Genesis created candidate `\([^`]*\)` at.*/\1/p' | head -n 1)
          if [[ -z "$branch" || "$branch" != genesis/candidate-* ]]; then
            gh issue edit "$ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --add-label genesis-autonomous \
              --remove-label genesis-validating || true
            gh issue comment "$ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --body 'Genesis could not resolve the reserved candidate branch safely. The issue was returned to the autonomous queue.'
            exit 0
          fi

          git config user.name "Genesis AI"
          git config user.email "genesis-ai@users.noreply.github.com"
          git fetch origin main "$branch"
          old_sha=$(git rev-parse "origin/$branch")
          git checkout -B "$branch" "origin/$branch"

          if ! git merge-base --is-ancestor origin/main HEAD; then
            if ! git rebase origin/main; then
              git rebase --abort || true
              gh issue edit "$ISSUE_NUMBER" \
                --repo "$GITHUB_REPOSITORY" \
                --add-label genesis-autonomous \
                --remove-label genesis-validating || true
              gh issue comment "$ISSUE_NUMBER" \
                --repo "$GITHUB_REPOSITORY" \
                --body 'Genesis candidate conflicted with the latest main branch. It was not force-merged; the issue was safely returned for a new repair strategy.'
              exit 0
            fi
          fi

          candidate_sha=$(git rev-parse HEAD)
          if git diff --name-only origin/main...HEAD | grep -Eq '^(GENESIS_CONSTITUTION.md|GENESIS_BLOCK.json|\.github/)'; then
            gh issue edit "$ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --add-label genesis-autonomous \
              --remove-label genesis-validating || true
            gh issue comment "$ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --body 'Genesis candidate touched a protected boundary after integration preparation. Promotion was refused and the issue was requeued.'
            exit 0
          fi

          if [[ "$candidate_sha" != "$old_sha" ]]; then
            git push \
              --force-with-lease="refs/heads/$branch:$old_sha" \
              origin "HEAD:refs/heads/$branch"
            gh issue comment "$ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --body "Genesis rebased the candidate onto the latest main as \`$candidate_sha\`. All independent validation is being repeated on this exact SHA before promotion."
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "candidate_branch=$branch" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"

  open_pr:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Open or update exact candidate PR when repository policy permits
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.prepare.outputs.candidate_branch }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/body.md" <<EOF
          Genesis autonomous repair candidate for GitHub issue #${ISSUE_NUMBER}.

          Fixes #${ISSUE_NUMBER}

          Promotion is allowed only after two independent full-test validators, Security review, signed quorum verification, Secret Guard, protected-boundary verification, and exact candidate-SHA promotion.

          Candidate SHA: \`${CANDIDATE_SHA}\`
          EOF
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          pr=''
          if [[ -n "$existing" ]]; then
            gh pr edit "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/body.md"
            pr="$existing"
          else
            if url=$(gh pr create --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base main --title "Genesis issue repair #${ISSUE_NUMBER}" --body-file "$RUNNER_TEMP/body.md" 2>"$RUNNER_TEMP/pr-create.err"); then
              pr=${url##*/}
            elif grep -Fq 'GitHub Actions is not permitted to create or approve pull requests' "$RUNNER_TEMP/pr-create.err"; then
              cat "$RUNNER_TEMP/pr-create.err"
              echo 'Repository policy disallows Actions-created PRs; continuing with the same independently validated exact-SHA promotion path.'
            else
              cat "$RUNNER_TEMP/pr-create.err" >&2
              exit 1
            fi
          fi
          echo "pr_number=$pr" >> "$GITHUB_OUTPUT"

  validator_a:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Independent full test suite A
        run: python -m pytest -q
      - name: Enforce issue-autorepair boundary A
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if git diff --name-only origin/main...HEAD | grep -Eq '^(GENESIS_CONSTITUTION.md|GENESIS_BLOCK.json|\.github/)'; then
            echo 'Issue autorepair cannot change identity or workflow boundaries' >&2
            exit 1
          fi
      - name: Security review A
        run: |
          python - <<'PY'
          from pathlib import Path
          from genesis.security import SecurityModule
          report = SecurityModule(Path('.')).review_candidate('origin/main')
          print(report.as_dict())
          raise SystemExit(0 if report.status == 'pass' else 1)
          PY
      - name: Sign validator A approval
        run: python genesis/ephemeral_validator.py --validator-id github-issue-validator-a --candidate ${{ needs.prepare.outputs.candidate_sha }} --output validator-a.json
      - uses: actions/upload-artifact@v4
        with:
          name: github-issue-validator-a-${{ inputs.issue_number }}-${{ github.run_id }}
          path: validator-a.json

  validator_b:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Independent full test suite B
        run: python -m pytest -q
      - name: Enforce issue-autorepair boundary B
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if git diff --name-only origin/main...HEAD | grep -Eq '^(GENESIS_CONSTITUTION.md|GENESIS_BLOCK.json|\.github/)'; then
            echo 'Issue autorepair cannot change identity or workflow boundaries' >&2
            exit 1
          fi
      - name: Security review B
        run: |
          python - <<'PY'
          from pathlib import Path
          from genesis.security import SecurityModule
          report = SecurityModule(Path('.')).review_candidate('origin/main')
          print(report.as_dict())
          raise SystemExit(0 if report.status == 'pass' else 1)
          PY
      - name: Sign validator B approval
        run: python genesis/ephemeral_validator.py --validator-id github-issue-validator-b --candidate ${{ needs.prepare.outputs.candidate_sha }} --output validator-b.json
      - uses: actions/upload-artifact@v4
        with:
          name: github-issue-validator-b-${{ inputs.issue_number }}-${{ github.run_id }}
          path: validator-b.json

  secret_guard:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan candidate and reachable history for secrets
        run: python scripts/secret_guard.py --history

  promote:
    needs: [prepare, open_pr, validator_a, validator_b, secret_guard]
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    concurrency:
      group: genesis-github-issue-autorepair-promotion
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: github-issue-validator-a-${{ inputs.issue_number }}-${{ github.run_id }}
          path: votes/a
      - uses: actions/download-artifact@v4
        with:
          name: github-issue-validator-b-${{ inputs.issue_number }}-${{ github.run_id }}
          path: votes/b
      - name: Verify independent signed quorum
        run: python scripts/verify_validator_votes.py votes/a/validator-a.json votes/b/validator-b.json
      - name: Promote exact validated candidate SHA
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.prepare.outputs.candidate_branch }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          PR_NUMBER: ${{ needs.open_pr.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BRANCH" == genesis/candidate-* ]]
          git fetch origin main "$BRANCH"
          main_sha=$(git rev-parse origin/main)
          test "$(git rev-parse origin/$BRANCH)" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor "$main_sha" "$CANDIDATE_SHA"
          if git diff --name-only "$main_sha..$CANDIDATE_SHA" | grep -Eq '^(GENESIS_CONSTITUTION.md|GENESIS_BLOCK.json|\.github/)'; then
            echo 'Protected Genesis boundary changed' >&2
            exit 1
          fi
          git push origin "$CANDIDATE_SHA:refs/heads/main"
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label genesis-solved --remove-label genesis-validating --remove-label genesis-autonomous || true
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Genesis independently validated and promoted exact candidate SHA \`$CANDIDATE_SHA\` to main."
          if [[ -n "$PR_NUMBER" ]]; then
            state=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq '.state' || true)
            if [[ "$state" == 'OPEN' ]]; then
              gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --comment "Exact validated candidate SHA was promoted directly to main by the Genesis issue-autorepair quorum."
            fi
          fi

  recover_queue:
    needs: [prepare, open_pr, validator_a, validator_b, secret_guard, promote]
    if: always() && needs.prepare.outputs.ready == 'true' && needs.promote.result != 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Requeue after integration, validation, or promotion failure
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label genesis-autonomous --remove-label genesis-validating || true
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body 'Genesis integration or exact-SHA validation did not complete successfully. The issue was returned to the autonomous queue; no stale candidate was force-promoted.'

  release_claim:
    needs: [prepare, open_pr, validator_a, validator_b, secret_guard, promote, recover_queue]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Release this issue reservation only after its integration pipeline ends
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label genesis-repair-in-progress || true
