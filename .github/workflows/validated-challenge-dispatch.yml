name: Genesis Validated Challenge Dispatch

on:
  workflow_run:
    workflows: ["Genesis Independent Validator Gate"]
    types: [completed]

permissions:
  contents: write

jobs:
  dispatch:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - name: Skip validation bookkeeping-only updates
        id: scope
        shell: bash
        run: |
          changed=$(git diff --name-only HEAD^ HEAD || true)
          echo "$changed"
          meaningful=$(printf '%s\n' "$changed" | grep -Ev '^(network/blockchain\.jsonl)?$' || true)
          if [[ -z "$meaningful" ]]; then
            echo 'dispatch=false' >> "$GITHUB_OUTPUT"
          else
            echo 'dispatch=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Confirm active Genesis challenge
        if: steps.scope.outputs.dispatch == 'true'
        id: challenge
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          path = Path('config/genesis_challenge.json')
          active = False
          if path.is_file():
              try:
                  active = str(json.loads(path.read_text(encoding='utf-8')).get('status', 'active')).lower() == 'active'
              except Exception:
                  active = False
          print(f"active={'true' if active else 'false'}")
          PY
      - name: Dispatch validated Genesis challenge
        if: steps.scope.outputs.dispatch == 'true' && steps.challenge.outputs.active == 'true'
        env:
          GENESIS_GITHUB_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
          VALIDATION_RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          payload = json.dumps({
              'event_type': 'genesis_challenge_execution',
              'client_payload': {
                  'validated_sha': os.environ['VALIDATED_SHA'],
                  'validation_run_id': os.environ['VALIDATION_RUN_ID'],
              },
          }).encode('utf-8')
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/dispatches",
              data=payload,
              method='POST',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GENESIS_GITHUB_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'Genesis-AI-Network/validated-challenge-dispatch',
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              if response.status != 204:
                  raise RuntimeError(f"repository dispatch failed: HTTP {response.status}")
          print('Genesis challenge dispatch accepted')
          PY
