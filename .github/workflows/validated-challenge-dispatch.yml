name: Genesis Validated Challenge Dispatch

on:
  workflow_run:
    workflows: ["Genesis Independent Validator Gate"]
    types: [completed]

permissions:
  contents: write

jobs:
  inspect:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.scope.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - name: Confirm meaningful validated update and active challenge
        id: scope
        shell: bash
        run: |
          changed=$(git diff --name-only HEAD^ HEAD || true)
          echo "$changed"
          meaningful=$(printf '%s\n' "$changed" | grep -Ev '^(network/blockchain\.jsonl)?$' || true)
          if [[ -z "$meaningful" ]]; then
            echo 'should_run=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          active=$(python - <<'PY'
          import json
          from pathlib import Path
          path = Path('config/genesis_challenge.json')
          value = False
          if path.is_file():
              try:
                  value = str(json.loads(path.read_text(encoding='utf-8')).get('status', 'active')).lower() == 'active'
              except Exception:
                  value = False
          print('true' if value else 'false')
          PY
          )
          echo "should_run=$active" >> "$GITHUB_OUTPUT"

  execute:
    needs: inspect
    if: needs.inspect.outputs.should_run == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/file-self-review.yml
