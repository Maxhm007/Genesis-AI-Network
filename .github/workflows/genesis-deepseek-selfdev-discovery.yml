name: Genesis DeepSeek Self Development Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/deepseek_selfdev_issue_opener.py'
      - 'tests/test_deepseek_selfdev_issue_opener.py'
      - 'scripts/deepseek_agentic_selector.py'
      - 'tests/test_deepseek_agentic_selector.py'
      - '.github/workflows/genesis-deepseek-selfdev-discovery.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: genesis-deepseek-selfdev-discovery
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  HF_HOME: ~/.cache/huggingface
  PIP_CACHE_DIR: ~/.cache/pip
  GENESIS_DEEPSEEK_DISCOVERY_URL: http://127.0.0.1:8768
  GENESIS_DEEPSEEK_DISCOVERY_OPEN_CAP: '3'
  GENESIS_DEEPSEEK_DISCOVERY_FILES: '4'
  GENESIS_PROVIDER_MAX_NEW_TOKENS: '640'

jobs:
  discover-one-self-development-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install repository dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate discovery lane safeguards
        run: python -m pytest -q tests/test_deepseek_selfdev_issue_opener.py tests/test_deepseek_agentic_selector.py

      - name: Restore DeepSeek model cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
          key: genesis-deepseek-selfdev-${{ runner.os }}-py312-v1
          restore-keys: |
            genesis-deepseek-selfdev-${{ runner.os }}-py312-
            genesis-agentic-open-model-${{ runner.os }}-py312-

      - name: Install local DeepSeek inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.51,<5' safetensors accelerate

      - name: Start isolated DeepSeek discovery provider
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          nohup python scripts/local_reasoning_provider.py \
            --model deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B \
            --host 127.0.0.1 \
            --port 8768 \
            --max-new-tokens "$GENESIS_PROVIDER_MAX_NEW_TOKENS" \
            > runtime/deepseek_selfdev_provider.log 2>&1 &
          ready=false
          for i in {1..180}; do
            if python - <<'PY'
          import urllib.request
          try:
              with urllib.request.urlopen('http://127.0.0.1:8768/health', timeout=2) as response:
                  raise SystemExit(0 if response.status == 200 else 1)
          except Exception:
              raise SystemExit(1)
          PY
            then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            cat runtime/deepseek_selfdev_provider.log || true
            exit 1
          fi

      - name: Agentically inspect Gene 0 and open at most one grounded issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GENESIS_DEEPSEEK_DISCOVERY_SEED: ${{ github.run_id }}
        run: python scripts/deepseek_selfdev_issue_opener.py --output runtime/deepseek_selfdev_discovery.json

      - name: Upload discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-selfdev-discovery-${{ github.run_id }}
          path: |
            runtime/deepseek_selfdev_discovery.json
            runtime/deepseek_selfdev_provider.log
          if-no-files-found: ignore
          retention-days: 30
