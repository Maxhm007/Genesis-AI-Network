name: Genesis–Eve peer bridge tests
on:
  pull_request:
    paths:
      - 'scripts/eve_peer_bridge.py'
      - 'tests/test_eve_peer_bridge.py'
      - '.github/workflows/eve-peer-bridge-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_eve_peer_bridge.py -v
