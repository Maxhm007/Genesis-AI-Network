name: Genesis Chat

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  reply:
    if: github.event_name == 'workflow_dispatch' || github.event.issue != null
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore Genesis reasoning caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
          key: genesis-chat-${{ runner.os }}-py312-qwen3-0.6b-v1
          restore-keys: |
            genesis-chat-${{ runner.os }}-py312-
      - run: pip install -r requirements.txt
      - name: Install active local reasoning runtime
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers>=4.51,<5' safetensors
      - name: Start active Genesis reasoning provider
        shell: bash
        run: |
          nohup python scripts/local_reasoning_provider.py --host 127.0.0.1 --port 8766 > /tmp/genesis-reasoning.log 2>&1 &
          for i in {1..60}; do
            if python - <<'PY'
          import urllib.request
          try:
              with urllib.request.urlopen('http://127.0.0.1:8766/health', timeout=2) as response:
                  raise SystemExit(0 if response.status == 200 else 1)
          except Exception:
              raise SystemExit(1)
          PY
            then
              echo 'GENESIS_REASONING_PROVIDER=READY'
              exit 0
            fi
            sleep 2
          done
          cat /tmp/genesis-reasoning.log || true
          echo 'Active reasoning provider failed to become ready' >&2
          exit 1
      - name: Genesis communication bridge
        env:
          GH_TOKEN: ${{ github.token }}
          GENESIS_PROVIDER_URL: http://127.0.0.1:8766
          GENESIS_PROVIDER_NAME: qwen3-0.6b-local
        run: python scripts/genesis_issue_bridge.py
