name: Genesis Chat

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  reply:
    if: github.event_name == 'workflow_dispatch' || github.event.issue != null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Genesis communication bridge
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/genesis_issue_bridge.py
