name: Genesis Manual Pulse Recovery

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: genesis-manual-pulse-recovery
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event.issue.number == 140 &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == '/genesis pulse self-repair'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch only when no fresh repair worker exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          freshness_seconds=7200
          fresh=0

          for workflow in gene-pulse.yml file-self-review.yml manual-self-repair.yml; do
            for status in queued in_progress; do
              payload=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=main&status=${status}&per_page=100")
              while IFS=$'\t' read -r run_id created; do
                [[ -n "$run_id" && -n "$created" ]] || continue
                created_epoch=$(date -u -d "$created" +%s 2>/dev/null || echo "$now")
                age=$((now - created_epoch))
                if (( age <= freshness_seconds )); then
                  fresh=$((fresh + 1))
                fi
              done < <(printf '%s' "$payload" | jq -r '.workflow_runs[] | [.id, .created_at] | @tsv')
            done
          done

          if (( fresh > 0 )); then
            gh issue comment 140 --repo "$GITHUB_REPOSITORY" --body "Manual Pulse recovery: ${fresh} fresh repair run(s) already exist; no duplicate Pulse dispatched."
            exit 0
          fi

          # A stale queued run that GitHub refuses to cancel is not executing and
          # must not permanently disable manual recovery.
          if ! gh workflow run gene-pulse.yml --repo "$GITHUB_REPOSITORY" --ref main -f gene=gene-node-1 -f continue_chain=true; then
            gh issue comment 140 --repo "$GITHUB_REPOSITORY" --body "Manual Pulse recovery failed to dispatch Gene Pulse. Check the recovery workflow run for the GitHub API error."
            exit 1
          fi

          latest=""
          for _ in {1..10}; do
            latest=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow gene-pulse.yml --event workflow_dispatch --limit 1 --json databaseId,status,url,headSha,createdAt --jq '.[0] | "run=\(.databaseId) status=\(.status) sha=\(.headSha[0:12]) created=\(.createdAt) url=\(.url)"' 2>/dev/null || true)
            [[ -n "$latest" ]] && break
            sleep 1
          done
          gh issue comment 140 --repo "$GITHUB_REPOSITORY" --body "Manual Pulse recovery dispatched Gene Pulse. ${latest:-Run id not visible yet.}"
