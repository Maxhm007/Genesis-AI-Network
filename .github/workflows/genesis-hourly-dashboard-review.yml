name: Genesis Hourly Whole-Dashboard Review

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/genesis-hourly-dashboard-review.yml
      - scripts/dashboard_hourly_review.py
      - scripts/dashboard_continuous_improvement.py
      - tests/test_dashboard_hourly_review.py
      - tests/test_dashboard_continuous_improvement.py

permissions:
  contents: read
  issues: read
  actions: write

concurrency:
  group: genesis-hourly-dashboard-review
  cancel-in-progress: false

jobs:
  review-whole-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Verify whole-dashboard review contracts
        run: python -m pytest -q tests/test_dashboard_hourly_review.py tests/test_dashboard_continuous_improvement.py

      - name: Preserve structural reviewer as a dry-run precheck
        run: python scripts/dashboard_hourly_review.py --dry-run

      - name: Review dashboard structure and continuous improvement opportunities
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.dashboard_continuous_improvement
