name: Genesis Oldest Real Issue Solver

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/genesis-oldest-issue-solver.yml

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: genesis-oldest-real-issue-solver
  cancel-in-progress: true

jobs:
  continuous-oldest-real-issue-solver:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -q pytest cryptography PyYAML requests

      - name: Run oldest real issue solver loop
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          interval=300
          max_cycles=64
          marker='<!-- genesis-oldest-real-issue-solver -->'

          echo "Genesis Issue Solver continuous mode: one oldest real issue every 5 minutes"

          upsert_status() {
            local issue_number="$1"
            local body="$2"
            local comment_id
            comment_id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${issue_number}/comments?per_page=100" \
              | jq -r --arg marker "$marker" '[.[] | select(.body | startswith($marker))][0].id // empty')
            if [ -n "$comment_id" ]; then
              gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
                --method PATCH -f body="$body" >/dev/null
            else
              gh api "repos/${GITHUB_REPOSITORY}/issues/${issue_number}/comments" \
                --method POST -f body="$body" >/dev/null
            fi
          }

          for cycle in $(seq 1 "$max_cycles"); do
            echo "=== Genesis real issue solver cycle $cycle/$max_cycles ==="
            git fetch origin main
            git reset --hard origin/main

            issue=$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&sort=created&direction=asc&per_page=100" \
              --jq '[.[] | select(.pull_request == null) | select(.number != 1) | select((.title | startswith("Genesis Chat:")) | not) | select((.title | startswith("[Genesis Hourly Report]")) | not) | select((.title | startswith("[Genesis Gene Chat]")) | not) | select((.body // "" | contains("Persistent GitHub-native reporting channel")) | not)][0]')

            checked_at=$(date -u '+%Y-%m-%dT%H:%M:%SZ')

            if [ -z "$issue" ] || [ "$issue" = "null" ]; then
              echo "No real open issue found at $checked_at"
            else
              issue_number=$(printf '%s' "$issue" | jq -r '.number')
              title=$(printf '%s' "$issue" | jq -r '.title')
              echo "Selected oldest real issue #$issue_number: $title"

              if [ "$issue_number" = "5" ]; then
                if [ -f runtime/competitive_benchmark_results.json ]; then
                  measured=$(python -c "import json,pathlib; p=pathlib.Path('runtime/competitive_benchmark_results.json'); d=json.loads(p.read_text(encoding='utf-8')); print(len(d.get('benchmarks', {})))" 2>/dev/null || echo 0)
                else
                  measured=0
                fi

                set +e
                python -m pytest -q > /tmp/genesis-oldest-real-issue-tests.log 2>&1
                test_rc=$?
                set -e
                if [ "$test_rc" -eq 0 ]; then
                  test_outcome=success
                else
                  test_outcome=failure
                fi

                if [ "$measured" -gt 0 ] && [ "$test_outcome" = "success" ]; then
                  gh issue close "$issue_number" --repo "$GITHUB_REPOSITORY" \
                    --comment "Genesis Issue Solver found real benchmark evidence on current main (measured benchmark records: ${measured}) and repository validation passed. Closing based on current evidence. Solver run: ${GITHUB_RUN_ID}, cycle: ${cycle}."
                else
                  body=$(printf '%s\n**Genesis Issue Solver — automatic 5-minute process**\n\n- Selected oldest real issue: #%s — %s\n- Last check (UTC): %s\n- Solver run: %s\n- Cycle: %s/%s\n- Validated benchmark records on current main: %s\n- Repository validation: %s\n- Result: **still unresolved; issue remains open**\n- Next automatic check: about 5 minutes\n\nGenesis will not create a replacement issue and will not close this issue without evidence that its real condition is resolved.' \
                    "$marker" "$issue_number" "$title" "$checked_at" "$GITHUB_RUN_ID" "$cycle" "$max_cycles" "$measured" "$test_outcome")
                  upsert_status "$issue_number" "$body"
                fi
              else
                body=$(printf '%s\n**Genesis Issue Solver — automatic 5-minute process**\n\n- Selected oldest real issue: #%s — %s\n- Last check (UTC): %s\n- Solver run: %s\n- Cycle: %s/%s\n- Result: **selected and held as the current oldest real issue**\n- Next automatic check: about 5 minutes\n\nThis minimal solver preserves one-issue-at-a-time ordering and never creates new issues.' \
                  "$marker" "$issue_number" "$title" "$checked_at" "$GITHUB_RUN_ID" "$cycle" "$max_cycles")
                upsert_status "$issue_number" "$body"
              fi
            fi

            if [ "$cycle" -lt "$max_cycles" ]; then
              echo "Next oldest-real-issue check in $interval seconds"
              sleep "$interval"
            fi
          done

      - name: Start successor solver run
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Starting successor Genesis oldest-real-issue solver run"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/genesis-oldest-issue-solver.yml/dispatches" \
            -f ref=main
