name: Genesis Oldest Real Issue Solver

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/genesis-oldest-issue-solver.yml

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: genesis-oldest-real-issue-solver
  cancel-in-progress: true

jobs:
  continuous-oldest-real-issue-solver:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run oldest eligible real issue solver loop
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          marker='<!-- genesis-oldest-real-issue-solver -->'
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            interval=20
            max_cycles=3
            echo "Bootstrap mode: 3 issue-solver cycles, 20 seconds apart"
          else
            interval=300
            max_cycles=64
            echo "Continuous mode: one eligible issue-solver cycle every 5 minutes"
          fi

          upsert_status() {
            local issue_number="$1"
            local body="$2"
            local comment_id
            comment_id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${issue_number}/comments?per_page=100" \
              | jq -r --arg marker "$marker" '[.[] | select(.body | startswith($marker))][0].id // empty')
            if [ -n "$comment_id" ]; then
              gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
                --method PATCH -f body="$body" >/dev/null
            else
              gh api "repos/${GITHUB_REPOSITORY}/issues/${issue_number}/comments" \
                --method POST -f body="$body" >/dev/null
            fi
          }

          for cycle in $(seq 1 "$max_cycles"); do
            echo "=== Genesis eligible issue solver cycle $cycle/$max_cycles ==="
            git fetch origin main
            git reset --hard origin/main

            gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&sort=created&direction=asc&per_page=100" \
              > /tmp/genesis-open-issues.json

            issue_number=$(python - <<'PY'
          import json
          from pathlib import Path

          issues = json.loads(Path('/tmp/genesis-open-issues.json').read_text())
          for issue in issues:
              if issue.get('pull_request'):
                  continue
              number = int(issue.get('number') or 0)
              title = str(issue.get('title') or '')
              body = str(issue.get('body') or '')
              labels = {str(x.get('name') or '') for x in issue.get('labels') or [] if isinstance(x, dict)}
              lower_title = title.lower()
              lower_body = body.lower()

              # Persistent communication/reporting channels are not work items.
              if number == 1:
                  continue
              if lower_title.startswith('genesis chat:'):
                  continue
              if lower_title.startswith('[genesis hourly report]'):
                  continue
              if lower_title.startswith('[genesis gene chat]'):
                  continue
              if 'persistent github-native reporting channel' in lower_body:
                  continue

              # External trust-domain work and broad umbrella state/epic issues
              # remain open but must never freeze the bounded solver queue.
              if 'external-authority / independent-secret provisioning blocker' in lower_body:
                  continue
              if lower_title.startswith('[genesis escalation] ai capability below target'):
                  continue
              if lower_title.startswith('[genesis ops] ai capability below target'):
                  continue
              if lower_title.startswith('genesis model lab:'):
                  continue
              if 'genesis-validating' in labels or 'genesis-repair-in-progress' in labels:
                  continue

              # Action failures are eligible even if a legacy repair lane marked
              # them blocked: current-main reconciliation may prove them stale.
              if lower_title.startswith('genesis action failure:'):
                  print(number)
                  break

              # Machine-generated bounded tasks can be revalidated even when a
              # previous repair attempt marked them blocked.
              if 'genesis-task' in labels:
                  print(number)
                  break

              # Ordinary bounded user issues remain eligible unless explicitly
              # marked as blocked by the current solver architecture.
              if 'genesis-blocked' not in labels:
                  print(number)
                  break
          PY
            )

            checked_at=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
            if [ -z "$issue_number" ]; then
              echo "No eligible real issue found at $checked_at"
            else
              issue_json=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${issue_number}")
              title=$(printf '%s' "$issue_json" | jq -r '.title')
              body_text=$(printf '%s' "$issue_json" | jq -r '.body // ""')
              echo "Selected oldest eligible issue #$issue_number: $title"

              # First real solving route: historical Action failures are checked
              # against current main. If their referenced workflow was deliberately
              # removed, the failure is no longer an active defect and is closed.
              if [[ "$title" == Genesis\ Action\ failure:* ]]; then
                workflow_path=$(printf '%s' "$body_text" | sed -nE 's/.*\(`([^`]*\.github\/workflows\/[^`]*)`\).*/\1/p' | head -n1)
                if [ -z "$workflow_path" ]; then
                  workflow_path=$(printf '%s' "$body_text" | grep -oE '\.github/workflows/[A-Za-z0-9._-]+\.(yml|yaml)' | head -n1 || true)
                fi

                if [ -n "$workflow_path" ] && [ ! -f "$workflow_path" ]; then
                  gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" \
                    --body "Genesis Issue Solver revalidated this historical Action failure against current \`main\`. The referenced workflow \`${workflow_path}\` no longer exists after the deliberate workflow reset, so this specific failure cannot recur in the current runtime. Closing this stale failure as no longer applicable; this does not claim the broader capability is complete. Solver run: ${GITHUB_RUN_ID}, cycle: ${cycle}."
                  gh api "repos/${GITHUB_REPOSITORY}/issues/${issue_number}" \
                    --method PATCH -f state=closed -f state_reason=not_planned >/dev/null
                  echo "Closed stale Action failure #$issue_number"
                else
                  status_body=$(printf '%s\n**Genesis Issue Solver — automatic process**\n\n- Selected oldest eligible issue: #%s — %s\n- Last check (UTC): %s\n- Solver run: %s\n- Cycle: %s/%s\n- Result: **live Action failure still requires a bounded repair route; left open**\n\nThe solver skipped blocked/umbrella issues to reach this work item, but it will not fabricate a repair or close a live failure without evidence.' \
                    "$marker" "$issue_number" "$title" "$checked_at" "$GITHUB_RUN_ID" "$cycle" "$max_cycles")
                  upsert_status "$issue_number" "$status_body"
                fi

              # Second real solving route: revalidate machine-generated syntax
              # defects against the exact current target before attempting repair.
              elif printf '%s' "$body_text" | grep -qi 'Syntax error'; then
                target=$(printf '%s' "$body_text" | sed -nE 's/^- \*\*Target:\*\* `([^`]+)`.*/\1/p' | head -n1)
                if [ -n "$target" ] && [ -f "$target" ]; then
                  if python -m py_compile "$target"; then
                    gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" \
                      --body "Genesis Issue Solver revalidated the reported syntax defect against current \`main\`. Target \`${target}\` compiles successfully, so the reported syntax-error condition is no longer present. Closing as already satisfied on current main. Solver run: ${GITHUB_RUN_ID}, cycle: ${cycle}."
                    gh api "repos/${GITHUB_REPOSITORY}/issues/${issue_number}" \
                      --method PATCH -f state=closed -f state_reason=completed >/dev/null
                    echo "Closed satisfied syntax issue #$issue_number"
                  fi
                fi

              else
                status_body=$(printf '%s\n**Genesis Issue Solver — automatic process**\n\n- Selected oldest eligible issue: #%s — %s\n- Last check (UTC): %s\n- Solver run: %s\n- Cycle: %s/%s\n- Result: **eligible, but no safe bounded repair route is installed for this issue type yet**\n\nThe issue remains open. Genesis will not mark work solved without a verified change or current-main evidence that the condition disappeared.' \
                  "$marker" "$issue_number" "$title" "$checked_at" "$GITHUB_RUN_ID" "$cycle" "$max_cycles")
                upsert_status "$issue_number" "$status_body"
              fi
            fi

            if [ "$cycle" -lt "$max_cycles" ]; then
              echo "Next eligible issue check in $interval seconds"
              sleep "$interval"
            fi
          done

      - name: Start successor solver run
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Starting successor Genesis issue solver run"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/genesis-oldest-issue-solver.yml/dispatches" \
            -f ref=main
