name: Genesis Oldest Real Issue Solver

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/genesis-oldest-issue-solver.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: genesis-oldest-real-issue-solver-compat
  cancel-in-progress: true

jobs:
  delegate-to-sequential-controller:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delegate to sequential issue controller
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'Legacy oldest-solver entrypoint delegates to the single sequential queue controller.'
          gh workflow run genesis-sequential-issue-controller.yml \
            --repo "$GITHUB_REPOSITORY" --ref main
