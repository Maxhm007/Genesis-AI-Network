name: Genesis Gene Pulse Runtime Status

on:
  workflow_run:
    workflows: ["Gene Pulse"]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: genesis-gene-pulse-runtime-status
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Collect bounded Pulse result
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_STATUS: ${{ github.event.workflow_run.status }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_CREATED_AT: ${{ github.event.workflow_run.created_at }}
          RUN_UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/genesis-pulse-artifact
          mkdir -p /tmp/genesis-pulse-artifact

          artifact_id=$(python - <<'PY'
          import json, os, subprocess

          run_id = os.environ['RUN_ID']
          repo = os.environ['GITHUB_REPOSITORY']
          result = subprocess.run(
              ['gh', 'api', f'repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100'],
              text=True,
              capture_output=True,
              check=False,
          )
          if result.returncode != 0:
              print('')
              raise SystemExit(0)
          payload = json.loads(result.stdout or '{}')
          candidates = [
              item for item in payload.get('artifacts', [])
              if str(item.get('name') or '').startswith('gene-pulse-')
              and not item.get('expired')
          ]
          candidates.sort(key=lambda item: str(item.get('created_at') or ''), reverse=True)
          print(candidates[0].get('id', '') if candidates else '')
          PY
          )

          artifact_found=false
          if [[ -n "$artifact_id" ]]; then
            if gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > /tmp/genesis-pulse-artifact.zip; then
              if unzip -q /tmp/genesis-pulse-artifact.zip -d /tmp/genesis-pulse-artifact; then
                artifact_found=true
              fi
            fi
          fi
          export ARTIFACT_FOUND="$artifact_found"

          python - <<'PY'
          import json, os
          from pathlib import Path

          def bounded(value, limit=2000):
              if value is None:
                  return None
              text = str(value)
              return text[:limit]

          def subset(mapping, keys):
              if not isinstance(mapping, dict):
                  return {}
              return {key: mapping.get(key) for key in keys if key in mapping}

          result_path = None
          for candidate in Path('/tmp/genesis-pulse-artifact').rglob('pulse_result.json'):
              result_path = candidate
              break

          pulse = {}
          parse_error = None
          if result_path is not None:
              try:
                  pulse = json.loads(result_path.read_text(encoding='utf-8'))
              except Exception as exc:
                  parse_error = f'{type(exc).__name__}: {exc}'[:1000]

          payload = dict(pulse.get('payload') or {}) if isinstance(pulse, dict) else {}
          pipeline = dict(payload.get('pipeline') or {})
          record = dict(pipeline.get('record') or {})
          learning = dict(pulse.get('learning_evolution') or {}) if isinstance(pulse, dict) else {}

          status = {
              'run_id': int(os.environ['RUN_ID']),
              'run_attempt': int(os.environ.get('RUN_ATTEMPT') or 1),
              'conclusion': os.environ.get('RUN_CONCLUSION'),
              'status': os.environ.get('RUN_STATUS'),
              'head_sha': os.environ.get('RUN_HEAD_SHA'),
              'event': os.environ.get('RUN_EVENT'),
              'created_at': os.environ.get('RUN_CREATED_AT'),
              'updated_at': os.environ.get('RUN_UPDATED_AT'),
              'run_url': os.environ.get('RUN_URL'),
              'artifact_found': os.environ.get('ARTIFACT_FOUND') == 'true',
              'pulse_result_found': result_path is not None,
              'pulse_parse_error': parse_error,
              'action': pulse.get('action') if isinstance(pulse, dict) else None,
              'mode': pulse.get('mode') if isinstance(pulse, dict) else None,
              'task_id': pulse.get('task_id') if isinstance(pulse, dict) else None,
              'needs_next_pulse': pulse.get('needs_next_pulse') if isinstance(pulse, dict) else None,
              'next_pulse_reason': pulse.get('next_pulse_reason') if isinstance(pulse, dict) else None,
              'pipeline': {
                  'handled': pipeline.get('handled'),
                  'action': pipeline.get('action'),
                  'feedback': bounded(pipeline.get('feedback')),
                  'review_mode': pipeline.get('review_mode'),
                  'review_base_sha': pipeline.get('review_base_sha'),
                  'durable_review_resumed': pipeline.get('durable_review_resumed'),
                  'orphan_review_recovery': pipeline.get('orphan_review_recovery'),
                  'review_candidate': subset(pipeline.get('review_candidate'), ['branch', 'candidate_sha', 'review_ref']),
                  'validation_candidate': subset(pipeline.get('validation_candidate'), ['branch', 'candidate_sha']),
                  'record': subset(
                      record,
                      [
                          'task_id', 'stage', 'target_path', 'candidate_branch',
                          'candidate_sha', 'review_ref', 'development_attempts',
                          'repair_attempts', 'review_attempts', 'last_feedback',
                      ],
                  ),
              },
              'learning_evolution': {
                  'status': learning.get('status'),
                  'reason': bounded(learning.get('reason'), 1000),
                  'error': bounded(learning.get('error'), 1000),
              },
          }
          Path('/tmp/gene-pulse-last.json').write_text(
              json.dumps(status, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(status, sort_keys=True))
          PY

      - name: Publish latest status on non-main branch
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Genesis Pulse Status"
          git config user.email "genesis-pulse-status@users.noreply.github.com"
          git checkout --orphan genesis-runtime-status
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p ops
          cp /tmp/gene-pulse-last.json ops/gene-pulse-last.json
          git add ops/gene-pulse-last.json
          git commit -m "Gene Pulse status ${{ github.event.workflow_run.id }}"
          git push --force origin HEAD:refs/heads/genesis/runtime-status
