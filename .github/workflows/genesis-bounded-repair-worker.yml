name: Genesis Bounded Repair Worker

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing GitHub issue reserved by the Genesis Issue Solver
        required: true
        type: string

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: genesis-bounded-repair-${{ inputs.issue_number }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  GENESIS_REPAIR_PROVIDER_URL: http://127.0.0.1:8766
  GENESIS_PROVIDER_URL: http://127.0.0.1:8766
  GENESIS_PROVIDER_NAME: genesis-adaptive-bounded-repair
  GENESIS_PROVIDER_TIMEOUT_SECONDS: '600'
  GENESIS_PROVIDER_MAX_NEW_TOKENS: '128'
  GENESIS_REPAIR_FALLBACK_MODEL: Qwen/Qwen2.5-Coder-0.5B-Instruct
  GENESIS_REPAIR_ESCALATION_MODEL: Qwen/Qwen2.5-Coder-0.5B-Instruct
  GENESIS_REPAIR_ESCALATION_MAX_NEW_TOKENS: '128'
  HF_HOME: ~/.cache/huggingface
  PIP_CACHE_DIR: ~/.cache/pip

jobs:
  repair-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify reservation and safe explicit target
        id: eligibility
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          issue_json=$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,labels,body)
          state=$(jq -r '.state' <<<"$issue_json")
          reserved=$(jq -r '([.labels[].name] | index("genesis-repair-in-progress")) != null' <<<"$issue_json")
          body=$(jq -r '.body // ""' <<<"$issue_json")
          target=$(printf '%s\n' "$body" | sed -nE 's/^- \*\*Target:\*\* `([^`]+)`.*/\1/p' | head -n1)
          safe=true
          [[ "$state" == "OPEN" && "$reserved" == "true" ]] || safe=false
          [[ -n "$target" && "$target" == genesis/*.py && "$target" != *".."* && -f "$target" ]] || safe=false
          case "$target" in
            genesis/autonomy_guard.py|genesis/autonomy_proof.py|genesis/blockchain.py|genesis/ephemeral_validator.py|genesis/security.py|genesis/selfdev.py|genesis/issue_solver.py|genesis/file_self_review.py|genesis/file_self_review_policy.py) safe=false ;;
          esac
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "eligible=$safe" >> "$GITHUB_OUTPUT"
          if [[ "$safe" != true ]]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label genesis-repair-in-progress >/dev/null 2>&1 || true
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label genesis-blocked >/dev/null 2>&1 || true
            exit 1
          fi

      - name: Install repository dependencies
        if: steps.eligibility.outputs.eligible == 'true'
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Verify clean or issue-scoped failing baseline
        if: steps.eligibility.outputs.eligible == 'true'
        env:
          TARGET: ${{ steps.eligibility.outputs.target }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m pytest -q > /tmp/genesis-baseline.log 2>&1
          full_rc=$?
          set -e
          cat /tmp/genesis-baseline.log
          if [[ "$full_rc" -eq 0 ]]; then
            echo 'Repository baseline is clean.'
            exit 0
          fi
          target_test="tests/test_$(basename "$TARGET" .py).py"
          [[ -f "$target_test" ]] || { echo 'No target-specific test for failing baseline' >&2; exit "$full_rc"; }
          set +e
          python -m pytest -q "$target_test"
          target_rc=$?
          set -e
          [[ "$target_rc" -ne 0 ]] || { echo 'Target test does not reproduce baseline failure' >&2; exit "$full_rc"; }
          python -m pytest -q --ignore="$target_test"
          echo 'Accepted issue-scoped failing baseline: target test fails while remainder passes.'

      - name: Restore open-model cache
        if: steps.eligibility.outputs.eligible == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
          key: genesis-bounded-qwen-coder-${{ runner.os }}-py312-v1
          restore-keys: |
            genesis-bounded-qwen-coder-${{ runner.os }}-py312-

      - name: Install free local repair intelligence
        if: steps.eligibility.outputs.eligible == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers>=4.51,<5' safetensors

      - name: Start adaptive local coding provider
        if: steps.eligibility.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          nohup python scripts/pulse_coding_provider.py \
            --model "$GENESIS_REPAIR_FALLBACK_MODEL" \
            --escalation-model "$GENESIS_REPAIR_ESCALATION_MODEL" \
            --host 127.0.0.1 --port 8766 \
            --max-new-tokens "$GENESIS_PROVIDER_MAX_NEW_TOKENS" \
            --escalation-max-new-tokens "$GENESIS_REPAIR_ESCALATION_MAX_NEW_TOKENS" \
            > /tmp/genesis-bounded-repair-provider.log 2>&1 &
          for i in {1..120}; do
            curl -fsS http://127.0.0.1:8766/health >/dev/null 2>&1 && exit 0
            sleep 2
          done
          cat /tmp/genesis-bounded-repair-provider.log || true
          exit 1

      - name: Configure Genesis Git identity
        if: steps.eligibility.outputs.eligible == 'true'
        run: |
          git config user.name 'Genesis AI'
          git config user.email 'genesis-ai@users.noreply.github.com'

      - name: Run guarded Genesis repair engine
        if: steps.eligibility.outputs.eligible == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label genesis-autonomous >/dev/null
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label genesis-blocked >/dev/null 2>&1 || true
          python scripts/github_issue_autorepair.py --issue-number "$ISSUE_NUMBER" --repository "$GITHUB_REPOSITORY"

      - name: Read repair evidence
        if: steps.eligibility.outputs.eligible == 'true'
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          test -f runtime/github_issue_autorepair.json
          echo "status=$(jq -r '.status // ""' runtime/github_issue_autorepair.json)" >> "$GITHUB_OUTPUT"
          echo "candidate_branch=$(jq -r '.candidate_branch // ""' runtime/github_issue_autorepair.json)" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$(jq -r '.candidate_sha // ""' runtime/github_issue_autorepair.json)" >> "$GITHUB_OUTPUT"
          cat runtime/github_issue_autorepair.json

      - name: Independently validate and promote exact candidate
        if: steps.evidence.outputs.status == 'candidate_created'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          TARGET: ${{ steps.eligibility.outputs.target }}
          CANDIDATE_BRANCH: ${{ steps.evidence.outputs.candidate_branch }}
          CANDIDATE_SHA: ${{ steps.evidence.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CANDIDATE_BRANCH"
          test -n "$CANDIDATE_SHA"
          git fetch origin main "$CANDIDATE_BRANCH"
          git cat-file -e "${CANDIDATE_SHA}^{commit}"
          target_test="tests/test_$(basename "$TARGET" .py).py"
          mapfile -t changed_files < <(git diff-tree --no-commit-id --name-only -r "$CANDIDATE_SHA")
          (( ${#changed_files[@]} > 0 ))
          for path in "${changed_files[@]}"; do
            [[ "$path" == "$TARGET" || "$path" == "$target_test" ]] || { echo "Out-of-scope candidate: $path" >&2; exit 1; }
          done
          promoted_sha=''
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B "genesis/integration-${ISSUE_NUMBER}-${GITHUB_RUN_ID}" origin/main
            if ! git cherry-pick "$CANDIDATE_SHA"; then git cherry-pick --abort || true; continue; fi
            python -m py_compile "$TARGET"
            [[ ! -f "$target_test" ]] || python -m pytest -q "$target_test"
            python -m pytest -q
            git fetch origin main
            [[ "$(git rev-parse HEAD^)" == "$(git rev-parse origin/main)" ]] || continue
            if git push origin HEAD:main; then promoted_sha=$(git rev-parse HEAD); break; fi
          done
          test -n "$promoted_sha"
          git fetch origin main
          git reset --hard origin/main
          python -m py_compile "$TARGET"
          [[ ! -f "$target_test" ]] || python -m pytest -q "$target_test"
          python -m pytest -q
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Genesis verified and promoted a bounded repair. Candidate: \`${CANDIDATE_SHA}\`. Promoted main SHA: \`${promoted_sha}\`. Full repository tests passed after promotion. Worker run: ${GITHUB_RUN_ID}."
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label genesis-verified >/dev/null
          for label in genesis-repair-in-progress genesis-validating genesis-autonomous genesis-claimed genesis-working genesis-verifying genesis-blocked genesis-solver-exhausted; do
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$label" >/dev/null 2>&1 || true
          done
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" --method PATCH -f state=closed -f state_reason=completed >/dev/null
          git push origin --delete "$CANDIDATE_BRANCH" >/dev/null 2>&1 || true

      - name: Release unsuccessful reservation safely
        if: always() && steps.eligibility.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          state=$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq '.state')
          [[ "$state" == CLOSED ]] && exit 0
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label genesis-repair-in-progress >/dev/null 2>&1 || true
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label genesis-autonomous >/dev/null 2>&1 || true
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Genesis bounded repair did not promote a verified change in worker run ${GITHUB_RUN_ID}; reservation released for bounded retry."

      - name: Preserve bounded repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-bounded-repair-${{ inputs.issue_number }}-${{ github.run_id }}
          path: |
            runtime/github_issue_autorepair.json
            /tmp/genesis-bounded-repair-provider.log
          if-no-files-found: ignore
          retention-days: 30
