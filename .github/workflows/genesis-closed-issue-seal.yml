name: Genesis Closed Issue Seal

on:
  issues:
    types: [closed, reopened]
  push:
    branches: [main]
    paths:
      - .github/workflows/genesis-closed-issue-seal.yml
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  enforce-verified-close:
    if: github.event_name == 'issues' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce solve -> verify -> comment -> close
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ACTOR: ${{ github.actor }}
        shell: bash
        run: |
          set -euo pipefail

          labels=$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name]')
          verified=$(jq -r 'index("genesis-verified") != null' <<<"$labels")

          # Human closures are owner decisions. This guard only controls Genesis automation.
          if [ "$ACTOR" != 'github-actions[bot]' ]; then
            echo "Human closure detected for #${ISSUE_NUMBER}; leaving it unchanged."
            exit 0
          fi

          # Genesis automation may close only after verified resolution evidence exists.
          if [ "$verified" != 'true' ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --body "Genesis closure guard rejected this automatic close because no \`genesis-verified\` evidence exists. The Issue remains authoritative and must stay open: add failure evidence/comments, retry with another bounded strategy, verify again, and close only after a verified solution. Guard run: ${GITHUB_RUN_ID}." >/dev/null
            gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" \
              --method PATCH -f state=open >/dev/null
            for label in genesis-closed-sealed-completed genesis-closed-sealed-not-planned genesis-closed-sealed-duplicate; do
              gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$label" >/dev/null 2>&1 || true
            done
            echo "Reopened unverified automatic closure #${ISSUE_NUMBER}."
            exit 0
          fi

          gh label create genesis-closed-sealed-completed --repo "$GITHUB_REPOSITORY" \
            --color 0e8a16 --description 'Closed after verified Genesis completion evidence' --force >/dev/null
          for label in genesis-closed-sealed-not-planned genesis-closed-sealed-duplicate; do
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$label" >/dev/null 2>&1 || true
          done
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label genesis-closed-sealed-completed >/dev/null

          for label in \
            genesis-solver-exhausted genesis-priority-exhausted genesis-deferred \
            agentic-lab genesis-agentic-escalated genesis-autonomous \
            genesis-repair-in-progress genesis-validating genesis-claimed \
            genesis-working genesis-verifying genesis-priority-claim; do
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$label" >/dev/null 2>&1 || true
          done
          echo "Accepted verified automatic closure #${ISSUE_NUMBER}."

  protect-verified-close:
    if: github.event_name == 'issues' && github.event.action == 'reopened' && github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Reject automatic reopen only after verified closure
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          labels=$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name]')
          verified=$(jq -r 'index("genesis-verified") != null' <<<"$labels")
          sealed=$(jq -r 'index("genesis-closed-sealed-completed") != null' <<<"$labels")

          if [ "$verified" = 'true' ] && [ "$sealed" = 'true' ]; then
            gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" \
              --method PATCH -f state=closed -f state_reason=completed >/dev/null
            echo "Rejected automatic reopen of verified issue #${ISSUE_NUMBER}."
          else
            echo "Issue #${ISSUE_NUMBER} is not verified+sealed; leaving it open for retry."
          fi

  backfill-verified-closed:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Seal only verified existing closed Genesis issues
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh label create genesis-closed-sealed-completed --repo "$GITHUB_REPOSITORY" \
            --color 0e8a16 --description 'Closed after verified Genesis completion evidence' --force >/dev/null

          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=closed&per_page=100" --jq '.[] | select(.pull_request == null) | .number' \
            | while read -r number; do
                [ -z "$number" ] && continue
                labels=$(gh issue view "$number" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name]')
                if jq -e 'index("genesis-verified") != null' <<<"$labels" >/dev/null; then
                  gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --add-label genesis-closed-sealed-completed >/dev/null
                fi
              done
