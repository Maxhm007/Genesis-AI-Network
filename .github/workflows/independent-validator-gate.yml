name: Genesis Independent Validator Gate

on:
  push:
    branches:
      - main
      - 'genesis/candidate-*'
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  validator_a:
    name: Validator A
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Full test suite
        run: python -m pytest -q
      - name: Resolve candidate
        id: candidate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate and sign
        run: python -m genesis.ephemeral_validator --validator-id github-validator-a-${{ github.run_id }} --candidate ${{ steps.candidate.outputs.sha }} --output vote-a.json
      - uses: actions/upload-artifact@v4
        with:
          name: vote-a
          path: vote-a.json

  validator_b:
    name: Validator B
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Full test suite
        run: python -m pytest -q
      - name: Resolve candidate
        id: candidate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate and sign
        run: python -m genesis.ephemeral_validator --validator-id github-validator-b-${{ github.run_id }} --candidate ${{ steps.candidate.outputs.sha }} --output vote-b.json
      - uses: actions/upload-artifact@v4
        with:
          name: vote-b
          path: vote-b.json

  quorum_gate:
    name: Independent quorum gate
    needs: [validator_a, validator_b]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: vote-a
          path: votes/a
      - uses: actions/download-artifact@v4
        with:
          name: vote-b
          path: votes/b
      - name: Verify independent signed quorum
        run: python scripts/verify_validator_votes.py votes/a/vote-a.json votes/b/vote-b.json

  dispatch_challenge:
    name: Dispatch validated Genesis challenge
    needs: quorum_gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch challenge execution event
        env:
          GENESIS_GITHUB_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ github.sha }}
          VALIDATION_RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ["REPOSITORY"]
          payload = json.dumps({
              "event_type": "genesis_challenge_execution",
              "client_payload": {
                  "validated_sha": os.environ["VALIDATED_SHA"],
                  "validation_run_id": os.environ["VALIDATION_RUN_ID"],
              },
          }).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/dispatches",
              data=payload,
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GENESIS_GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "Genesis-AI-Network/validator-dispatch",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              if response.status != 204:
                  raise RuntimeError(f"repository dispatch failed: HTTP {response.status}")
          print("Genesis challenge dispatch accepted")
          PY
