name: Genesis Independent Validator Gate

on:
  push:
    branches:
      - main
      - 'genesis/candidate-*'
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  validator_a:
    name: Validator A
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Full test suite
        run: python -m pytest -q
      - name: Resolve candidate
        id: candidate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate and sign
        run: python -m genesis.ephemeral_validator --validator-id github-validator-a-${{ github.run_id }} --candidate ${{ steps.candidate.outputs.sha }} --output vote-a.json
      - uses: actions/upload-artifact@v4
        with:
          name: vote-a
          path: vote-a.json

  validator_b:
    name: Validator B
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Full test suite
        run: python -m pytest -q
      - name: Resolve candidate
        id: candidate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate and sign
        run: python -m genesis.ephemeral_validator --validator-id github-validator-b-${{ github.run_id }} --candidate ${{ steps.candidate.outputs.sha }} --output vote-b.json
      - uses: actions/upload-artifact@v4
        with:
          name: vote-b
          path: vote-b.json

  quorum_gate:
    name: Independent quorum gate
    needs: [validator_a, validator_b]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: vote-a
          path: votes/a
      - uses: actions/download-artifact@v4
        with:
          name: vote-b
          path: votes/b
      - name: Verify independent signed quorum
        run: python scripts/verify_validator_votes.py votes/a/vote-a.json votes/b/vote-b.json

  challenge_scope:
    name: Resolve validated challenge handoff
    needs: quorum_gate
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.scope.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Require an active challenge assignment
        id: scope
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            if ! git diff --name-only HEAD^ HEAD | grep -Fxq 'config/genesis_challenge.json'; then
              echo 'should_run=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          active=$(python - <<'PY'
          import json
          from pathlib import Path
          path = Path('config/genesis_challenge.json')
          value = False
          if path.is_file():
              try:
                  value = str(json.loads(path.read_text(encoding='utf-8')).get('status', 'active')).lower() == 'active'
              except Exception:
                  value = False
          print('true' if value else 'false')
          PY
          )
          echo "should_run=$active" >> "$GITHUB_OUTPUT"

  execute_challenge:
    name: Execute validated Genesis challenge
    needs: challenge_scope
    if: needs.challenge_scope.outputs.should_run == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/file-self-review.yml
