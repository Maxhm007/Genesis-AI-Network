name: Issue 685 Review Fix

on:
  push:
    branches:
      - genesis/fix-685-clean-baseline
    paths:
      - .github/workflows/issue-685-review-fix.yml

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: genesis/fix-685-clean-baseline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Address review finding
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          from pathlib import Path

          cleanup = Path('genesis/github_issue_cleanup.py')
          text = cleanup.read_text(encoding='utf-8')
          old = 'PYTHON_PATH_RE = re.compile(r"(?<![A-Za-z0-9_./-])(genesis/[A-Za-z0-9_./-]+\\.py)(?![A-Za-z0-9_/-])")'
          new = 'PYTHON_PATH_RE = re.compile(r"(?<![A-Za-z0-9_./-])(genesis/[A-Za-z0-9_./-]+\\.py)(?![A-Za-z0-9_/-]|\\.[A-Za-z0-9_-])")'
          if text.count(old) != 1:
              raise SystemExit('review regex insertion point not found exactly once')
          cleanup.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('tests/test_github_issue_cleanup.py')
          text = tests.read_text(encoding='utf-8')
          block = base64.b64decode('').decode()
          if 'test_dotted_suffix_after_python_path_is_not_treated_as_safe_target' not in text:
              tests.write_text(text.rstrip() + '\n' + block, encoding='utf-8')
          PY
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Focused routing tests
        run: python -m pytest -q tests/test_github_issue_cleanup.py tests/test_autonomy_heartbeat.py
      - name: Full repository tests
        run: python -m pytest -q
      - name: Commit reviewed fix and self-delete helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue-685-review-fix.yml
          git config user.name "Genesis Repair"
          git config user.email "genesis-ai@users.noreply.github.com"
          git add genesis/github_issue_cleanup.py tests/test_github_issue_cleanup.py .github/workflows/issue-685-review-fix.yml
          git commit -m "Reject dotted suffixes in issue target inference (#685)"
          git push origin HEAD:genesis/fix-685-clean-baseline
