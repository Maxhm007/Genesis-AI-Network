name: Genesis Check Suite Rerequest Test

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/genesis-checksuite-rerequest.yml
  workflow_dispatch: {}

permissions:
  actions: write
  checks: write
  contents: read

jobs:
  rerequest:
    runs-on: ubuntu-latest
    steps:
      - name: Re-request old Gene Pulse check suite
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const suite_id = 87329536345;
            const run_id = 32215089776;

            async function getRun() {
              const r = await github.request('GET /repos/{owner}/{repo}/actions/runs/{run_id}', {owner, repo, run_id});
              return {status:r.data.status, conclusion:r.data.conclusion, attempt:r.data.run_attempt};
            }

            core.info(`Before: ${JSON.stringify(await getRun())}`);
            try {
              const r = await github.request('POST /repos/{owner}/{repo}/check-suites/{check_suite_id}/rerequest', {
                owner, repo, check_suite_id: suite_id
              });
              core.info(`Check-suite rerequest accepted: HTTP ${r.status}`);
            } catch (e) {
              core.warning(`Check-suite rerequest rejected: ${e.status || ''} ${e.message}`);
            }

            await new Promise(resolve => setTimeout(resolve, 3000));
            core.info(`After: ${JSON.stringify(await getRun())}`);
