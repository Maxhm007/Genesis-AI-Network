name: Genesis Action Failure Watcher

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Genesis Agentic Strategy Worker
    types:
      - completed
    branches:
      - main
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
    paths:
      - scripts/action_failure_watchdog.py
      - scripts/action_failure_fresh_reconcile.py
      - scripts/action_issue_autorepair.py
      - scripts/action_repair_selector.py
      - .github/workflows/genesis-action-failure-watcher.yml
      - .github/workflows/genesis-action-repair-validator.yml

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: genesis-action-failure-watcher
  cancel-in-progress: false

jobs:
  detect-retry-route:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install repository dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate generalized Action failure lifecycle
        run: python -m pytest -q tests/test_action_failure_watchdog.py tests/test_action_issue_autorepair.py

      - name: Close stale Action failures proven healthy by newer main runs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/action_failure_fresh_reconcile.py --repository "$GITHUB_REPOSITORY"

      - name: Detect and reconcile Action failures across all main workflows
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/action_failure_watchdog.py --repository "$GITHUB_REPOSITORY"

      - name: Reconcile newly opened failures against newer successful main runs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/action_failure_fresh_reconcile.py --repository "$GITHUB_REPOSITORY"

      - name: Retry one newly detected or pending failure once
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/action_failure_watchdog.py --repository "$GITHUB_REPOSITORY" --retry-once

      - name: Dispatch autonomous Action repair lane when authorized work exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          issue_number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label genesis-action-autonomous --limit 1 --json number --jq '.[0].number // empty')"
          if [[ -n "$issue_number" ]]; then
            gh workflow run genesis-action-repair-worker.yml --repo "$GITHUB_REPOSITORY" --ref main
          else
            echo "No authorized Action repair issue; worker dispatch skipped."
          fi

      - name: Wake authoritative issue controller
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run genesis-agentic-lab-recovery.yml --repo "$GITHUB_REPOSITORY" --ref main || true
