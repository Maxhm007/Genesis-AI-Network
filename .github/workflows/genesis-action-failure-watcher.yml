name: Genesis Action Failure Watcher

on:
  workflow_run:
    workflows:
      - Genesis Tiny Problem Detection Test
      - Genesis Oldest Real Issue Solver
      - Genesis Action Failure Watcher Verification
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  create-failure-issue:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Create issue for failed Action run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT_NAME: ${{ github.event.workflow_run.event }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          CREATED_AT: ${{ github.event.workflow_run.created_at }}
        shell: bash
        run: |
          set -euo pipefail

          title="[Genesis Action Failure] ${WORKFLOW_NAME} — run ${RUN_ID}"
          existing=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state all \
            --limit 1000 \
            --json number,title \
            | jq -r --arg title "$title" '[.[] | select(.title == $title)][0].number // empty')

          if [ -n "$existing" ]; then
            echo "Failure run ${RUN_ID} already has issue #${existing}; no duplicate created."
            exit 0
          fi

          if ! gh label list --repo "$GITHUB_REPOSITORY" --limit 100 --json name --jq '.[].name' | grep -Fxq genesis-action-failure; then
            gh label create genesis-action-failure \
              --repo "$GITHUB_REPOSITORY" \
              --color d1242f \
              --description 'Created automatically when a GitHub Action run fails'
          fi

          jobs_json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100")
          failed_summary=$(printf '%s' "$jobs_json" | jq -r '
            [.jobs[] | select(.conclusion == "failure") | {
              job: .name,
              failed_steps: [.steps[]? | select(.conclusion == "failure") | .name]
            }]
            | if length == 0 then
                "Failure details were not available from the jobs API."
              else
                map("- Job: **" + .job + "**\n  - Failed step(s): " +
                    (if (.failed_steps|length) == 0 then "not reported" else (.failed_steps|join(", ")) end))
                | join("\n")
              end')

          marker="<!-- genesis-action-failure-run:${RUN_ID} -->"
          body=$(printf '%s\nGenesis detected a failed GitHub Actions run. This issue was created automatically by the independent **Action Failure Watcher**. The watcher does not repair or close issues.\n\n- **Workflow:** %s\n- **Run ID:** %s\n- **Run attempt:** %s\n- **Trigger event:** %s\n- **Branch:** %s\n- **Head SHA:** %s\n- **Created (UTC):** %s\n- **Run:** %s\n\n### Failure evidence\n%s\n\n### Processing rule\nThis issue now belongs to the normal GitHub issue queue. The independent Issue Solver may validate, repair, verify, and close it. The Action Failure Watcher itself performs no repair.' \
            "$marker" "$WORKFLOW_NAME" "$RUN_ID" "$RUN_ATTEMPT" "$EVENT_NAME" "$HEAD_BRANCH" "$HEAD_SHA" "$CREATED_AT" "$RUN_URL" "$failed_summary")

          issue_url=$(gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --body "$body" \
            --label genesis-action-failure)
          echo "Created failure issue: $issue_url"

  manual-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Genesis Action Failure Watcher is installed for every current non-watcher workflow.'
