name: Genesis Teammate - Autonomous Development

on:
  # Primary autonomous heartbeat: every 15 minutes.
  schedule:
    - cron: '2,17,32,47 * * * *'

  # Manual recovery remains available.
  workflow_dispatch: {}

  # A change to the team control-plane should immediately prove the lane.
  push:
    branches: [main]
    paths:
      - .github/workflows/genesis-teammate-autonomous-development.yml
      - scripts/genesis_teammate.py
      - config/genesis_teammates.json

  # Redundant heartbeat. The queue cleaner is independently scheduled and
  # currently healthy, so a completed cleaner run can wake the team if GitHub
  # misses or delays this workflow's own scheduled event.
  workflow_run:
    workflows:
      - Genesis Action Queue Cleaner
    types:
      - completed

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: genesis-teammate-autonomous-development
  cancel-in-progress: false

jobs:
  develop:
    # Do not block the backup wake merely because the upstream cleaner failed;
    # this workflow has its own authority and validation.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Let Nexus select one autonomous Genesis development task
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/genesis_teammate.py autonomous --run-id "${{ github.run_id }}"
