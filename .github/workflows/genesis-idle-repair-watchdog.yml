name: Genesis Idle Repair Watchdog

# Manual compatibility check only; Agentic Lab already provides the authoritative 5-minute heartbeat.
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: read

concurrency:
  group: genesis-idle-repair-watchdog
  cancel-in-progress: true

jobs:
  wake-if-idle:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Wake Agentic Lab when autonomous backlog is idle
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          open_count=$(gh api "search/issues?q=repo:${REPO}+is:issue+is:open+label:genesis-autonomous&per_page=1" --jq '.total_count')
          active_count=$(gh api "search/issues?q=repo:${REPO}+is:issue+is:open+label:genesis-repair-in-progress&per_page=1" --jq '.total_count')
          validating_count=$(gh api "search/issues?q=repo:${REPO}+is:issue+is:open+label:genesis-validating&per_page=1" --jq '.total_count')
          if [[ "$open_count" -gt 0 && "$active_count" -eq 0 && "$validating_count" -eq 0 ]]; then
            # Skip redundant wakes: a queued/running controller pass (or one woken <2 min ago) already covers this.
            lab_skip="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow genesis-agentic-lab-recovery.yml --limit 20 --json databaseId,status,createdAt,event --jq '[.[] | select(.event != "push" and .event != "pull_request") | select(.status != "completed" or (now - (.createdAt | fromdateiso8601)) < 120)] | if length > 0 then "run \(.[0].databaseId) \(.[0].status)" else "" end' 2>/dev/null || true)"
            if [[ -n "$lab_skip" ]]; then
              echo "Agentic Lab Recovery wake skipped (already active or recently woken): $lab_skip"
            else
              gh workflow run genesis-agentic-lab-recovery.yml --repo "$REPO" --ref main
            fi
          fi
