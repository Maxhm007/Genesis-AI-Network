name: Genesis Adaptive Development Dispatch

on:
  workflow_dispatch: {}
  schedule:
    - cron: '*/15 * * * *'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch only when no proactive cycle is active
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          active=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "Genesis Proactive Development" --limit 20 --json status --jq '[.[] | select(.status == "in_progress" or .status == "queued" or .status == "waiting" or .status == "requested" or .status == "pending")] | length')
          if [[ "$active" != "0" ]]; then
            echo "Proactive development already active/queued; skipping dispatch."
            exit 0
          fi
          gh workflow run "Genesis Proactive Development" --repo "$GITHUB_REPOSITORY" --ref main
          echo "Dispatched a bounded Genesis proactive development cycle."
