name: Genesis Task 3 Resume Solver

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/genesis-task3-resume-solver.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  resume:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Genesis oldest issue solver
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run genesis-oldest-issue-solver.yml --repo "$GITHUB_REPOSITORY" --ref main
