name: Genesis Candidate PR Opener

on:
  push:
    branches:
      - 'genesis/candidate-*'
  workflow_dispatch:
    inputs:
      candidate_branch:
        description: Candidate branch to recover into validation
        required: false
        default: ''
  workflow_run:
    workflows: ['Gene Pulse']
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  open_pr:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve exact Genesis candidate branch
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch=''
          if [[ '${{ github.event_name }}' == 'push' ]]; then
            branch='${{ github.ref_name }}'
          elif [[ '${{ github.event_name }}' == 'workflow_dispatch' ]]; then
            branch='${{ inputs.candidate_branch }}'
          else
            run_id='${{ github.event.workflow_run.id }}'
            workdir=$(mktemp -d)
            if gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --dir "$workdir"; then
              branch=$(python - "$workdir" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          for path in sorted(root.rglob('candidate_handoff.json')):
              try:
                  payload = json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  continue
              branch = str(payload.get('branch') or '').strip()
              state = str(payload.get('state') or '').strip()
              if state == 'waiting_validation' and branch.startswith('genesis/candidate-'):
                  print(branch)
                  break
          PY
              )
            fi
          fi

          if [[ -z "$branch" ]]; then
            echo 'No waiting Genesis candidate handoff found.'
            echo 'candidate_branch=' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$branch" != genesis/candidate-* ]]; then
            echo "Rejected non-candidate branch: $branch" >&2
            exit 1
          fi
          echo "candidate_branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open one PR for exact Genesis candidate branch
        if: steps.resolve.outputs.candidate_branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch='${{ steps.resolve.outputs.candidate_branch }}'
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base main --state all --json number --jq '.[0].number // empty')
          if [[ -n "$existing" ]]; then
            echo "Candidate branch already represented by PR #$existing"
            exit 0
          fi

          git fetch origin main "$branch"
          if git merge-base --is-ancestor "origin/$branch" origin/main; then
            echo 'Candidate is already represented in main.'
            exit 0
          fi

          set +e
          pr_output=$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --head "$branch" \
            --base main \
            --title "Genesis autonomous candidate: $branch" \
            --body "Autonomous Genesis candidate. Promotion requires the Genesis Candidate PR Gate: two independent full-test + Security validators, signed quorum verification, protected-boundary verification, and exact-head merge." 2>&1)
          pr_status=$?
          set -e
          if [[ "$pr_status" -eq 0 ]]; then
            printf '%s\n' "$pr_output"
            exit 0
          fi

          policy_error='GitHub Actions is not permitted to create or approve pull requests'
          if ! grep -Fq "$policy_error" <<<"$pr_output"; then
            printf '%s\n' "$pr_output" >&2
            exit "$pr_status"
          fi

          candidate=$(git rev-parse "origin/$branch")
          approval_ref="genesis/approved-${candidate}"
          if git ls-remote --exit-code --heads origin "$approval_ref" >/dev/null 2>&1; then
            echo 'Repository policy blocks Action-created PRs, but this exact candidate already has an internal-review approval ref.'
            echo 'Deferring to Genesis Candidate Promotion, which independently revalidates the exact staged candidate before main.'
            exit 0
          fi

          main_sha=$(git rev-parse origin/main)
          base=$(git merge-base "$main_sha" "$candidate")
          if [[ "$base" != "$main_sha" ]]; then
            echo 'Repository policy blocks Action-created PRs and this candidate is stale and unapproved.'
            echo 'Retiring this handoff for regeneration instead of bypassing review or replaying a stale candidate.'
            exit 0
          fi

          printf '%s\n' "$pr_output" >&2
          echo 'Current unapproved candidate cannot safely fall back without a PR or exact internal-review approval.' >&2
          exit "$pr_status"
