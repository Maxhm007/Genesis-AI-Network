name: Genesis GitHub Issue Autorepair

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Optional GitHub issue number; blank uses the next queued issue
        required: false
        default: ''
  schedule:
    - cron: '11 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/github-issue-autorepair.yml'

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

env:
  PYTHONPATH: ${{ github.workspace }}
  GENESIS_REPAIR_PROVIDER_URL: http://127.0.0.1:8766
  GENESIS_PROVIDER_URL: http://127.0.0.1:8766
  GENESIS_PROVIDER_NAME: qwen3-1.7b-github-issue-autorepair
  GENESIS_PROVIDER_TIMEOUT_SECONDS: '240'
  GENESIS_PROVIDER_MAX_NEW_TOKENS: '1024'
  HF_HOME: ~/.cache/huggingface
  PIP_CACHE_DIR: ~/.cache/pip

concurrency:
  group: genesis-github-issue-autorepair
  cancel-in-progress: false

jobs:
  bootstrap_labels:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Ensure Genesis issue-queue labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ensure_label() {
            local name="$1" color="$2" description="$3"
            if ! gh label list --repo "$GITHUB_REPOSITORY" --limit 100 --json name --jq '.[].name' | grep -Fxq "$name"; then
              gh label create "$name" --repo "$GITHUB_REPOSITORY" --color "$color" --description "$description"
            fi
          }
          ensure_label genesis-autonomous 1f883d 'Authorized for Genesis autonomous repair'
          ensure_label genesis-validating 0969da 'Genesis candidate is under independent validation'
          ensure_label genesis-blocked d1242f 'Genesis safely blocked this issue pending narrower context or review'
          ensure_label genesis-solved 8250df 'Solved through validated Genesis autonomous repair'

  solve:
    if: github.event_name != 'push' && (github.event_name != 'issues' || github.event.label.name == 'genesis-autonomous')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      issue_number: ${{ steps.issue.outputs.issue_number }}
      has_candidate: ${{ steps.candidate.outputs.has_candidate }}
      candidate_branch: ${{ steps.candidate.outputs.candidate_branch }}
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve one authorized open issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          n=''
          if [[ '${{ github.event_name }}' == 'issues' ]]; then
            n='${{ github.event.issue.number }}'
          elif [[ '${{ github.event_name }}' == 'workflow_dispatch' && -n '${{ inputs.issue_number }}' ]]; then
            n='${{ inputs.issue_number }}'
          else
            n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label genesis-autonomous --limit 1 --json number --jq '.[0].number // empty')
          fi
          if [[ -n "$n" && ! "$n" =~ ^[0-9]+$ ]]; then
            echo "Invalid issue number: $n" >&2
            exit 1
          fi
          echo "issue_number=$n" >> "$GITHUB_OUTPUT"
          [[ -n "$n" ]] && echo "Genesis selected issue #$n" || echo 'No authorized Genesis issue is queued.'
      - name: Install repository dependencies
        if: steps.issue.outputs.issue_number != ''
        run: pip install -r requirements.txt
      - name: Verify stable baseline
        if: steps.issue.outputs.issue_number != ''
        run: python -m pytest -q
      - name: Restore open-model caches
        if: steps.issue.outputs.issue_number != ''
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
          key: genesis-qwen3-1.7b-${{ runner.os }}-py312-v1
          restore-keys: |
            genesis-qwen3-1.7b-${{ runner.os }}-py312-
      - name: Install free local repair intelligence
        if: steps.issue.outputs.issue_number != ''
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers>=4.51,<5' safetensors
      - name: Start Genesis issue-repair provider
        if: steps.issue.outputs.issue_number != ''
        shell: bash
        run: |
          set -euo pipefail
          nohup python scripts/local_reasoning_provider.py --model Qwen/Qwen3-1.7B --host 127.0.0.1 --port 8766 --max-new-tokens 1024 > /tmp/genesis-github-issue-autorepair.log 2>&1 &
          ready=false
          for i in {1..120}; do
            if python - <<'PY'
          import urllib.request
          try:
              with urllib.request.urlopen('http://127.0.0.1:8766/health', timeout=2) as response:
                  raise SystemExit(0 if response.status == 200 else 1)
          except Exception:
              raise SystemExit(1)
          PY
            then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            cat /tmp/genesis-github-issue-autorepair.log || true
            exit 1
          fi
      - name: Configure Genesis Git identity
        if: steps.issue.outputs.issue_number != ''
        run: |
          git config user.name "Genesis AI"
          git config user.email "genesis-ai@users.noreply.github.com"
      - name: Let Genesis solve the selected GitHub issue
        if: steps.issue.outputs.issue_number != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/github_issue_autorepair.py --issue-number '${{ steps.issue.outputs.issue_number }}' --repository "$GITHUB_REPOSITORY"
      - name: Resolve generated candidate
        id: candidate
        if: always() && steps.issue.outputs.issue_number != ''
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          path = Path('runtime/github_issue_autorepair.json')
          if not path.is_file():
              print('has_candidate=false')
              print('candidate_branch=')
              print('candidate_sha=')
              raise SystemExit(0)
          payload = json.loads(path.read_text(encoding='utf-8'))
          branch = str(payload.get('candidate_branch') or '')
          sha = str(payload.get('candidate_sha') or '')
          valid = payload.get('status') == 'candidate_created' and branch.startswith('genesis/candidate-') and len(sha) == 40
          print(f"has_candidate={'true' if valid else 'false'}")
          print(f'candidate_branch={branch if valid else ""}')
          print(f'candidate_sha={sha if valid else ""}')
          PY
      - name: Preserve issue repair evidence
        if: always() && steps.issue.outputs.issue_number != ''
        uses: actions/upload-artifact@v4
        with:
          name: genesis-github-issue-autorepair-${{ github.run_id }}
          path: |
            runtime/github_issue_autorepair.json
            /tmp/genesis-github-issue-autorepair.log
          if-no-files-found: ignore
          retention-days: 30

  open_pr:
    needs: solve
    if: needs.solve.outputs.has_candidate == 'true'
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Open or link the exact issue-repair candidate PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.solve.outputs.candidate_branch }}
          CANDIDATE_SHA: ${{ needs.solve.outputs.candidate_sha }}
          ISSUE_NUMBER: ${{ needs.solve.outputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/body.md" <<EOF
          Genesis autonomous repair candidate for GitHub issue #${ISSUE_NUMBER}.

          Fixes #${ISSUE_NUMBER}

          Promotion is allowed only after two independent full-test validators, Security review, signed quorum verification, Secret Guard, protected-boundary verification, and exact candidate-SHA promotion.

          Candidate SHA: \`${CANDIDATE_SHA}\`
          EOF
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [[ -n "$existing" ]]; then
            gh pr edit "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/body.md"
            pr="$existing"
          else
            url=$(gh pr create --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base main --title "Genesis issue repair #${ISSUE_NUMBER}" --body-file "$RUNNER_TEMP/body.md")
            pr=${url##*/}
          fi
          echo "pr_number=$pr" >> "$GITHUB_OUTPUT"

  validator_a:
    needs: solve
    if: needs.solve.outputs.has_candidate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.solve.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Independent full test suite A
        run: python -m pytest -q
      - name: Enforce issue-autorepair boundary A
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if git diff --name-only origin/main...HEAD | grep -Eq '^(GENESIS_CONSTITUTION.md|GENESIS_BLOCK.json|\.github/)'; then
            echo 'Issue autorepair cannot change identity or workflow boundaries' >&2
            exit 1
          fi
      - name: Security review A
        run: |
          python - <<'PY'
          from pathlib import Path
          from genesis.security import SecurityModule
          report = SecurityModule(Path('.')).review_candidate('origin/main')
          print(report.as_dict())
          raise SystemExit(0 if report.status == 'pass' else 1)
          PY
      - name: Sign validator A approval
        run: python genesis/ephemeral_validator.py --validator-id github-issue-validator-a --candidate ${{ needs.solve.outputs.candidate_sha }} --output validator-a.json
      - uses: actions/upload-artifact@v4
        with:
          name: github-issue-validator-a-${{ github.run_id }}
          path: validator-a.json

  validator_b:
    needs: solve
    if: needs.solve.outputs.has_candidate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.solve.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Independent full test suite B
        run: python -m pytest -q
      - name: Enforce issue-autorepair boundary B
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if git diff --name-only origin/main...HEAD | grep -Eq '^(GENESIS_CONSTITUTION.md|GENESIS_BLOCK.json|\.github/)'; then
            echo 'Issue autorepair cannot change identity or workflow boundaries' >&2
            exit 1
          fi
      - name: Security review B
        run: |
          python - <<'PY'
          from pathlib import Path
          from genesis.security import SecurityModule
          report = SecurityModule(Path('.')).review_candidate('origin/main')
          print(report.as_dict())
          raise SystemExit(0 if report.status == 'pass' else 1)
          PY
      - name: Sign validator B approval
        run: python genesis/ephemeral_validator.py --validator-id github-issue-validator-b --candidate ${{ needs.solve.outputs.candidate_sha }} --output validator-b.json
      - uses: actions/upload-artifact@v4
        with:
          name: github-issue-validator-b-${{ github.run_id }}
          path: validator-b.json

  secret_guard:
    needs: solve
    if: needs.solve.outputs.has_candidate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.solve.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan candidate and reachable history for secrets
        run: python scripts/secret_guard.py --history

  promote:
    needs: [solve, open_pr, validator_a, validator_b, secret_guard]
    if: needs.solve.outputs.has_candidate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: github-issue-validator-a-${{ github.run_id }}
          path: votes/a
      - uses: actions/download-artifact@v4
        with:
          name: github-issue-validator-b-${{ github.run_id }}
          path: votes/b
      - name: Verify independent signed quorum
        run: python scripts/verify_validator_votes.py votes/a/validator-a.json votes/b/validator-b.json
      - name: Promote exact validated issue-repair SHA
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.solve.outputs.candidate_branch }}
          CANDIDATE_SHA: ${{ needs.solve.outputs.candidate_sha }}
          ISSUE_NUMBER: ${{ needs.solve.outputs.issue_number }}
          PR_NUMBER: ${{ needs.open_pr.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BRANCH" == genesis/candidate-* ]]
          git fetch origin main "$BRANCH"
          main_sha=$(git rev-parse origin/main)
          test "$(git rev-parse origin/$BRANCH)" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor "$main_sha" "$CANDIDATE_SHA"
          if git diff --name-only "$main_sha..$CANDIDATE_SHA" | grep -Eq '^(GENESIS_CONSTITUTION.md|GENESIS_BLOCK.json|\.github/)'; then
            echo 'Protected Genesis boundary changed' >&2
            exit 1
          fi
          git push origin "$CANDIDATE_SHA:refs/heads/main"
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label genesis-solved --remove-label genesis-validating --remove-label genesis-autonomous || true
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Genesis independently validated and promoted exact candidate SHA \`$CANDIDATE_SHA\` to main."
          if [[ -n "$PR_NUMBER" ]]; then
            state=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq '.state' || true)
            if [[ "$state" == 'OPEN' ]]; then
              gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --comment "Exact validated candidate SHA was promoted directly to main by the Genesis issue-autorepair quorum."
            fi
          fi

  recover_queue:
    needs: [solve, open_pr, validator_a, validator_b, secret_guard, promote]
    if: always() && needs.solve.outputs.has_candidate == 'true' && needs.promote.result != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Requeue issue after validation or promotion failure
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.solve.outputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label genesis-autonomous --remove-label genesis-validating || true
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Genesis validation or exact-SHA promotion did not complete successfully. The issue has been returned to the autonomous repair queue for a later retry."
