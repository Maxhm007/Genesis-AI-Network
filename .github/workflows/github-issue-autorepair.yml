name: Genesis GitHub Issue Autorepair

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Optional authorized GitHub issue number; blank fills available worker slots
        required: false
        default: ''
      refill_round:
        description: Internal bounded refill generation
        required: false
        default: '0'
  schedule:
    - cron: '11 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/github-issue-autorepair.yml'
      - '.github/workflows/github-issue-autorepair-worker.yml'

permissions: {}

env:
  PYTHONPATH: ${{ github.workspace }}
  GENESIS_ISSUE_REPAIR_MAX_PARALLEL: '3'

jobs:
  bootstrap_labels:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Ensure Genesis issue-queue labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ensure_label() {
            local name="$1" color="$2" description="$3"
            if ! gh label list --repo "$GITHUB_REPOSITORY" --limit 100 --json name --jq '.[].name' | grep -Fxq "$name"; then
              gh label create "$name" --repo "$GITHUB_REPOSITORY" --color "$color" --description "$description"
            fi
          }
          ensure_label genesis-autonomous 1f883d 'Authorized for Genesis autonomous repair'
          ensure_label genesis-validating 0969da 'Genesis candidate is under independent validation'
          ensure_label genesis-blocked d1242f 'Genesis safely blocked this issue pending narrower context or review'
          ensure_label genesis-solved 8250df 'Solved through validated Genesis autonomous repair'
          ensure_label genesis-repair-in-progress d4c5f9 'Genesis is currently processing this autonomous issue'

  plan:
    if: github.event_name != 'push' && (github.event_name != 'issues' || github.event.label.name == 'genesis-autonomous')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    concurrency:
      group: genesis-github-issue-autorepair-admission
      cancel-in-progress: false
    outputs:
      issue_numbers: ${{ steps.plan.outputs.issue_numbers }}
      has_work: ${{ steps.plan.outputs.has_work }}
      refill_round: ${{ steps.plan.outputs.refill_round }}
      allow_refill: ${{ steps.plan.outputs.allow_refill }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and claim bounded repair batch
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          round='0'
          explicit=''
          allow_refill='true'
          if [[ '${{ github.event_name }}' == 'workflow_dispatch' ]]; then
            round='${{ inputs.refill_round }}'
            explicit='${{ inputs.issue_number }}'
          fi
          [[ "$round" =~ ^[0-9]+$ ]] || round='0'
          if (( round > 1 )); then
            round='1'
          fi
          if [[ -n "$explicit" ]]; then
            [[ "$explicit" =~ ^[0-9]+$ ]] || {
              echo "Invalid issue number: $explicit" >&2
              exit 1
            }
            allow_refill='false'
          fi

          gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --limit 500 \
            --json number,state,updatedAt,labels \
            > "$RUNNER_TEMP/open-issues.json"

          selector=(python scripts/select_issue_repair_batch.py
            --issues-json "$RUNNER_TEMP/open-issues.json"
            --max-parallel "$GENESIS_ISSUE_REPAIR_MAX_PARALLEL")
          if [[ -n "$explicit" ]]; then
            selector+=(--explicit-issue-number "$explicit")
          fi
          plan_json="$("${selector[@]}")"
          selected="$(jq -c '.selected_issue_numbers' <<<"$plan_json")"

          claimed='[]'
          while IFS= read -r n; do
            [[ -n "$n" ]] || continue
            gh issue edit "$n" \
              --repo "$GITHUB_REPOSITORY" \
              --add-label genesis-repair-in-progress
            claimed="$(jq -c --argjson n "$n" '. + [$n]' <<<"$claimed")"
          done < <(jq -r '.[]' <<<"$selected")

          has_work='false'
          if [[ "$(jq 'length' <<<"$claimed")" -gt 0 ]]; then
            has_work='true'
          fi

          echo "issue_numbers=$claimed" >> "$GITHUB_OUTPUT"
          echo "has_work=$has_work" >> "$GITHUB_OUTPUT"
          echo "refill_round=$round" >> "$GITHUB_OUTPUT"
          echo "allow_refill=$allow_refill" >> "$GITHUB_OUTPUT"
          echo "Genesis repair admission: $plan_json; claimed=$claimed"

  workers:
    needs: plan
    if: needs.plan.outputs.has_work == 'true'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        issue_number: ${{ fromJSON(needs.plan.outputs.issue_numbers) }}
    uses: ./.github/workflows/github-issue-autorepair-worker.yml
    with:
      issue_number: ${{ matrix.issue_number }}
    secrets: inherit
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write

  refill:
    needs: [plan, workers]
    if: >-
      always() &&
      needs.plan.outputs.has_work == 'true' &&
      needs.plan.outputs.allow_refill == 'true' &&
      needs.plan.outputs.refill_round == '0' &&
      needs.workers.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      issues: read
    steps:
      - name: Refill one additional bounded batch if capacity remains
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          in_progress=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label genesis-repair-in-progress \
            --limit 100 \
            --json number \
            --jq 'length')
          validating=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label genesis-validating \
            --limit 100 \
            --json number \
            --jq 'length')
          eligible=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label genesis-autonomous \
            --limit 100 \
            --json number,labels \
            --jq '[.[]
              | select(([.labels[].name] | index("genesis-repair-in-progress")) | not)
              | select(([.labels[].name] | index("genesis-validating")) | not)
              | select(([.labels[].name] | index("genesis-blocked")) | not)
              | select(([.labels[].name] | index("genesis-solved")) | not)
            ] | length')

          active=$((in_progress + validating))
          if (( active < GENESIS_ISSUE_REPAIR_MAX_PARALLEL && eligible > 0 )); then
            echo "Capacity is available; dispatching one bounded refill round."
            gh workflow run github-issue-autorepair.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              -f refill_round=1
          else
            echo "No safe refill required: active=$active eligible=$eligible"
          fi
