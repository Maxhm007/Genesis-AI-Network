name: Genesis GitHub Issue Autorepair

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Optional authorized GitHub issue number; blank claims one available repair lane
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - '.github/workflows/github-issue-autorepair.yml'
      - '.github/workflows/github-issue-autorepair-worker.yml'
      - '.github/workflows/github-issue-autorepair-integration.yml'
      - 'genesis/issue_worker_pool.py'
      - 'scripts/select_issue_repair_batch.py'

permissions: {}

env:
  PYTHONPATH: ${{ github.workspace }}
  GENESIS_ISSUE_REPAIR_MAX_PARALLEL: '5'

jobs:
  bootstrap_labels:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Ensure Genesis issue-queue labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ensure_label() {
            local name="$1" color="$2" description="$3"
            if ! gh label list --repo "$GITHUB_REPOSITORY" --limit 100 --json name --jq '.[].name' | grep -Fxq "$name"; then
              gh label create "$name" --repo "$GITHUB_REPOSITORY" --color "$color" --description "$description"
            fi
          }
          ensure_label genesis-task 0e8a16 'Authoritative GitHub Issue backing for Genesis autonomous tasks'
          ensure_label genesis-autonomous 1f883d 'Authorized for Genesis autonomous repair'
          ensure_label genesis-validating 0969da 'Genesis candidate is under independent validation'
          ensure_label genesis-blocked d1242f 'Genesis safely blocked this issue pending narrower context or review'
          ensure_label genesis-solved 8250df 'Solved through validated Genesis autonomous repair'
          ensure_label genesis-repair-in-progress d4c5f9 'Genesis is currently processing this autonomous issue'

  plan:
    if: >-
      github.event_name != 'push' &&
      (github.event_name != 'issues' ||
       github.event.label.name == 'genesis-autonomous' ||
       github.event.label.name == 'genesis-task')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    concurrency:
      group: genesis-github-issue-autorepair-admission-${{ inputs.issue_number || github.event.issue.number || github.run_id }}
      cancel-in-progress: false
    outputs:
      issue_numbers: ${{ steps.plan.outputs.issue_numbers }}
      has_work: ${{ steps.plan.outputs.has_work }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and claim one repair lane
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          explicit=''
          if [[ '${{ github.event_name }}' == 'workflow_dispatch' ]]; then
            explicit='${{ inputs.issue_number }}'
          elif [[ '${{ github.event_name }}' == 'issues' ]]; then
            explicit='${{ github.event.issue.number }}'
          fi
          if [[ -n "$explicit" ]]; then
            [[ "$explicit" =~ ^[0-9]+$ ]] || {
              echo "Invalid issue number: $explicit" >&2
              exit 1
            }
          fi

          gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --limit 500 \
            --json number,title,state,updatedAt,labels \
            > "$RUNNER_TEMP/open-issues.json"

          selector=(python scripts/select_issue_repair_batch.py
            --issues-json "$RUNNER_TEMP/open-issues.json"
            --max-parallel "$GENESIS_ISSUE_REPAIR_MAX_PARALLEL")
          if [[ -n "$explicit" ]]; then
            selector+=(--explicit-issue-number "$explicit")
          fi
          plan_json="$("${selector[@]}")"
          selected="$(jq -c '.selected_issue_numbers[:1]' <<<"$plan_json")"

          claimed='[]'
          claims_committed='false'
          rollback_uncommitted_claims() {
            if [[ "$claims_committed" == 'true' ]]; then
              return
            fi
            while IFS= read -r claimed_n; do
              [[ -n "$claimed_n" ]] || continue
              gh issue edit "$claimed_n" \
                --repo "$GITHUB_REPOSITORY" \
                --remove-label genesis-repair-in-progress || true
            done < <(jq -r '.[]' <<<"$claimed")
          }
          trap rollback_uncommitted_claims EXIT

          while IFS= read -r n; do
            [[ -n "$n" ]] || continue
            # Admission is the authoritative mutation boundary. Canonical
            # genesis-task/title records are promoted here, never by heartbeat.
            gh issue edit "$n" \
              --repo "$GITHUB_REPOSITORY" \
              --add-label genesis-autonomous \
              --add-label genesis-repair-in-progress
            claimed="$(jq -c --argjson n "$n" '. + [$n]' <<<"$claimed")"
          done < <(jq -r '.[]' <<<"$selected")

          has_work='false'
          if [[ "$(jq 'length' <<<"$claimed")" -gt 0 ]]; then
            has_work='true'
          fi

          echo "issue_numbers=$claimed" >> "$GITHUB_OUTPUT"
          echo "has_work=$has_work" >> "$GITHUB_OUTPUT"
          echo "Genesis repair admission: $plan_json; single_lane_selection=$selected; claimed=$claimed"
          claims_committed='true'

  solve_workers:
    needs: plan
    if: needs.plan.outputs.has_work == 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        issue_number: ${{ fromJSON(needs.plan.outputs.issue_numbers) }}
    uses: ./.github/workflows/github-issue-autorepair-worker.yml
    with:
      issue_number: ${{ matrix.issue_number }}
    secrets: inherit
    permissions:
      actions: read
      contents: write
      issues: write

  integrate_workers:
    needs: [plan, solve_workers]
    if: always() && needs.plan.outputs.has_work == 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        issue_number: ${{ fromJSON(needs.plan.outputs.issue_numbers) }}
    uses: ./.github/workflows/github-issue-autorepair-integration.yml
    with:
      issue_number: ${{ matrix.issue_number }}
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write

  refill:
    needs: [plan, solve_workers, integrate_workers]
    if: >-
      always() &&
      needs.plan.outputs.has_work == 'true' &&
      needs.integrate_workers.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Wake read-only heartbeat to refill independent repair lanes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run github-issue-autorepair-heartbeat.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
