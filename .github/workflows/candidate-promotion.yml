name: Genesis Candidate Promotion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/candidate-promotion.yml'
  workflow_dispatch:
  schedule:
    - cron: '27 * * * *'

permissions:
  contents: write
  pull-requests: read
  checks: read

concurrency:
  group: genesis-candidate-promotion
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      candidate_branch: ${{ steps.resolve.outputs.candidate_branch }}
      candidate_sha: ${{ steps.resolve.outputs.candidate_sha }}
      source_branch: ${{ steps.resolve.outputs.source_branch }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      source_pr: ${{ steps.resolve.outputs.source_pr }}
      has_candidate: ${{ steps.resolve.outputs.has_candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve validated candidate and safely stage it
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Genesis Promotion Stager"
          git config user.email "genesis-promotion@users.noreply.github.com"
          git fetch origin '+refs/heads/genesis/candidate-*:refs/remotes/origin/genesis/candidate-*'

          selected_ref=''
          selected_branch=''
          selected_sha=''
          selected_pr=''
          required_checks=(
            'validator_a'
            'validator_b'
            'secret_guard'
            'Validator A'
            'Validator B'
            'Independent quorum gate'
          )

          while IFS= read -r ref; do
            [[ -n "$ref" ]] || continue
            source_branch=${ref#origin/}
            source_sha=$(git rev-parse "$ref")
            pr=$(gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --head "$source_branch" \
              --base main \
              --state open \
              --json number,headRefOid,isDraft \
              --jq ".[] | select(.headRefOid == \"$source_sha\" and (.isDraft | not)) | .number" \
              | head -n1)
            if [[ -z "$pr" ]]; then
              echo "Skipping $source_branch: no open non-draft PR for exact head $source_sha"
              continue
            fi

            checks=$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/commits/${source_sha}/check-runs?per_page=100")
            checks_ok=true
            for check_name in "${required_checks[@]}"; do
              if ! printf '%s' "$checks" | jq -e --arg name "$check_name" '
                ([.check_runs[] | select(.name == $name)] | sort_by(.completed_at // .started_at // "")) as $runs
                | (($runs | length) > 0
                   and $runs[-1].status == "completed"
                   and $runs[-1].conclusion == "success")
              ' >/dev/null; then
                echo "Skipping $source_branch: required exact-head check is not successful: $check_name"
                checks_ok=false
                break
              fi
            done
            if [[ "$checks_ok" != true ]]; then
              continue
            fi

            selected_ref="$ref"
            selected_branch="$source_branch"
            selected_sha="$source_sha"
            selected_pr="$pr"
            break
          done < <(git for-each-ref --sort=-committerdate --format='%(refname:short)' 'refs/remotes/origin/genesis/candidate-*')

          if [[ -z "$selected_ref" ]]; then
            echo 'has_candidate=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          main_sha=$(git rev-parse main)
          base=$(git merge-base "$main_sha" "$selected_sha")
          git checkout -B genesis-staged "$selected_sha"
          if [[ "$base" != "$main_sha" ]]; then
            git rebase --onto "$main_sha" "$base" genesis-staged
          fi
          staged_sha=$(git rev-parse HEAD)
          staged_branch="genesis/staged-${GITHUB_RUN_ID}"
          git merge-base --is-ancestor "$main_sha" "$staged_sha"
          changed=$(git diff --name-only "$main_sha..$staged_sha")
          if printf '%s\n' "$changed" | grep -Eq '^(GENESIS_CONSTITUTION.md|GENESIS_BLOCK.json)$'; then
            echo 'Protected Genesis identity file changed' >&2
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -Eq '^\.github/'; then
            echo 'Normal autonomous candidate may not change GitHub workflows/control plane' >&2
            exit 1
          fi
          git push origin "$staged_sha:refs/heads/$staged_branch"
          echo "candidate_branch=$staged_branch" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$staged_sha" >> "$GITHUB_OUTPUT"
          echo "source_branch=$selected_branch" >> "$GITHUB_OUTPUT"
          echo "source_sha=$selected_sha" >> "$GITHUB_OUTPUT"
          echo "source_pr=$selected_pr" >> "$GITHUB_OUTPUT"
          echo 'has_candidate=true' >> "$GITHUB_OUTPUT"

  validator_a:
    needs: prepare
    if: needs.prepare.outputs.has_candidate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Enforce normal candidate boundary A
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          main_sha=$(git rev-parse origin/main)
          git merge-base --is-ancestor "$main_sha" HEAD
          changed=$(git diff --name-only "$main_sha..HEAD")
          if printf '%s\n' "$changed" | grep -Eq '^(GENESIS_CONSTITUTION.md|GENESIS_BLOCK.json)$'; then
            echo 'Immutable Genesis identity boundary changed' >&2
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -Eq '^\.github/'; then
            echo 'Workflow changes require the privileged candidate lane' >&2
            exit 1
          fi
      - name: Security review staged candidate A
        run: |
          python - <<'PY'
          from pathlib import Path
          from genesis.security import SecurityModule
          report = SecurityModule(Path('.')).review_candidate('origin/main')
          print(report.as_dict())
          raise SystemExit(0 if report.status == 'pass' else 1)
          PY
      - name: Independent full test suite A
        run: python -m pytest -q
      - name: Sign validator A approval
        run: python genesis/ephemeral_validator.py --validator-id candidate-validator-a --candidate ${{ needs.prepare.outputs.candidate_sha }} --output validator-a.json
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-validator-a
          path: validator-a.json

  validator_b:
    needs: prepare
    if: needs.prepare.outputs.has_candidate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Enforce normal candidate boundary B
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          main_sha=$(git rev-parse origin/main)
          git merge-base --is-ancestor "$main_sha" HEAD
          changed=$(git diff --name-only "$main_sha..HEAD")
          if printf '%s\n' "$changed" | grep -Eq '^(GENESIS_CONSTITUTION.md|GENESIS_BLOCK.json)$'; then
            echo 'Immutable Genesis identity boundary changed' >&2
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -Eq '^\.github/'; then
            echo 'Workflow changes require the privileged candidate lane' >&2
            exit 1
          fi
      - name: Security review staged candidate B
        run: |
          python - <<'PY'
          from pathlib import Path
          from genesis.security import SecurityModule
          report = SecurityModule(Path('.')).review_candidate('origin/main')
          print(report.as_dict())
          raise SystemExit(0 if report.status == 'pass' else 1)
          PY
      - name: Independent full test suite B
        run: python -m pytest -q
      - name: Sign validator B approval
        run: python genesis/ephemeral_validator.py --validator-id candidate-validator-b --candidate ${{ needs.prepare.outputs.candidate_sha }} --output validator-b.json
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-validator-b
          path: validator-b.json

  promote:
    needs: [prepare, validator_a, validator_b]
    if: needs.prepare.outputs.has_candidate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: candidate-validator-a
          path: votes/a
      - uses: actions/download-artifact@v4
        with:
          name: candidate-validator-b
          path: votes/b
      - name: Verify signed two-job quorum
        run: python scripts/verify_validator_votes.py votes/a/validator-a.json votes/b/validator-b.json
      - name: Re-verify exact staged candidate boundary and security
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main '${{ needs.prepare.outputs.candidate_branch }}'
          candidate='${{ needs.prepare.outputs.candidate_sha }}'
          main_sha=$(git rev-parse origin/main)
          test "$(git rev-parse origin/${{ needs.prepare.outputs.candidate_branch }})" = "$candidate"
          git merge-base --is-ancestor "$main_sha" "$candidate"
          changed=$(git diff --name-only "$main_sha..$candidate")
          if printf '%s\n' "$changed" | grep -Eq '^(GENESIS_CONSTITUTION.md|GENESIS_BLOCK.json)$'; then
            echo 'Protected Genesis identity file changed' >&2
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -Eq '^\.github/'; then
            echo 'Normal autonomous candidate may not change GitHub workflows/control plane' >&2
            exit 1
          fi
          git checkout --detach "$candidate"
          PYTHONPATH=. python - <<'PY'
          from pathlib import Path
          from genesis.security import SecurityModule
          report = SecurityModule(Path('.')).review_candidate('origin/main')
          print(report.as_dict())
          raise SystemExit(0 if report.status == 'pass' else 1)
          PY
          git push origin "$candidate:refs/heads/main"
