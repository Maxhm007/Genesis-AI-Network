name: Genesis Whole Run Rerun Test

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/genesis-rerun-old-run.yml
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

jobs:
  rerun:
    runs-on: ubuntu-latest
    steps:
      - name: Re-run old Gene Pulse workflow run
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const run_id = 32215089776;
            try {
              const r = await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/rerun', {owner, repo, run_id});
              core.info(`Whole-run rerun accepted: HTTP ${r.status}`);
            } catch (e) {
              core.warning(`Whole-run rerun rejected: ${e.status || ''} ${e.message}`);
            }
            const after = await github.request('GET /repos/{owner}/{repo}/actions/runs/{run_id}', {owner, repo, run_id});
            core.info(`After: status=${after.data.status} conclusion=${after.data.conclusion} attempt=${after.data.run_attempt}`);
