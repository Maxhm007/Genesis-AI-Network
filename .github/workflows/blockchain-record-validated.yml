name: Genesis Record Validated Update

on:
  workflow_run:
    workflows: ["Genesis Independent Validator Gate"]
    types: [completed]

permissions:
  contents: write

jobs:
  record:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record validated update commitment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
          VALIDATION_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python scripts/blockchain_record_validated.py
      - name: Publish append-only blockchain ledger
        shell: bash
        run: |
          git config user.name "Genesis Blockchain"
          git config user.email "genesis-blockchain@users.noreply.github.com"
          git add network/blockchain.jsonl
          if git diff --cached --quiet; then
            echo "No new validated commitment"
            exit 0
          fi
          git commit -m "Record validated Genesis update on blockchain"
          git push
