name: Genesis Android APK Release

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: genesis-android-apk
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Build Genesis Android debug APK
        run: gradle -p mobile :app:assembleDebug --stacktrace

      - name: Prepare APK and checksum
        id: asset
        shell: bash
        run: |
          version="v0.1.0-android-alpha.${GITHUB_RUN_NUMBER}"
          apk="Genesis-AI-Android-${version}.apk"
          cp mobile/app/build/outputs/apk/debug/app-debug.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: genesis-android-apk-${{ github.run_number }}
          path: |
            ${{ steps.asset.outputs.apk }}
            ${{ steps.asset.outputs.apk }}.sha256
          retention-days: 30

      - name: Publish Android alpha prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.asset.outputs.version }}
          name: Genesis AI Android ${{ steps.asset.outputs.version }}
          prerelease: true
          generate_release_notes: false
          body: |
            First Genesis Android alpha client.

            - HTTPS-only remote Genesis API configuration
            - bearer-token authenticated chat
            - health/status check
            - token is not persisted by the app
            - debug-signed test APK; production signing comes after alpha validation
          files: |
            ${{ steps.asset.outputs.apk }}
            ${{ steps.asset.outputs.apk }}.sha256
