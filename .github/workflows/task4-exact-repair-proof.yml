name: Genesis Task 4 Exact Repair Proof

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/task4-exact-repair-proof.yml

permissions:
  contents: write
  issues: write

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  repair-verify-close:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install repository dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Configure Genesis Git identity
        run: |
          git config user.name 'Genesis AI'
          git config user.email 'genesis-ai@users.noreply.github.com'

      - name: Genesis creates deterministic candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/github_issue_autorepair.py --issue-number 561 --repository "$GITHUB_REPOSITORY"
          cat runtime/github_issue_autorepair.json
          test "$(jq -r '.status' runtime/github_issue_autorepair.json)" = candidate_created
          test "$(jq -r '.provider' runtime/github_issue_autorepair.json)" = genesis-deterministic-capability-builder

      - name: Independently validate promote and close
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch=$(jq -r '.candidate_branch' runtime/github_issue_autorepair.json)
          sha=$(jq -r '.candidate_sha' runtime/github_issue_autorepair.json)
          test -n "$branch"
          test -n "$sha"
          git fetch origin main "$branch"
          git cat-file -e "${sha}^{commit}"
          git checkout -B genesis/task4-exact-integration origin/main
          git cherry-pick "$sha"
          python -m py_compile genesis/modules/versioning.py
          python -m pytest -q tests/test_versioning.py
          python -m pytest -q
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
          git push origin HEAD:main
          promoted=$(git rev-parse HEAD)
          git fetch origin main
          git reset --hard origin/main
          python -m pytest -q tests/test_versioning.py
          python -m pytest -q
          gh issue comment 561 --repo "$GITHUB_REPOSITORY" --body "Genesis autonomously repaired and verified the rollback regression. Candidate: \`$sha\`; promoted main SHA: \`$promoted\`. Target compilation, versioning tests, and the full repository suite passed after promotion."
          gh issue edit 561 --repo "$GITHUB_REPOSITORY" --add-label genesis-verified >/dev/null
          for label in genesis-autonomous genesis-validating genesis-repair-in-progress genesis-blocked genesis-solver-exhausted; do
            gh issue edit 561 --repo "$GITHUB_REPOSITORY" --remove-label "$label" >/dev/null 2>&1 || true
          done
          gh issue close 561 --repo "$GITHUB_REPOSITORY" --reason completed
          git push origin --delete "$branch" >/dev/null 2>&1 || true
