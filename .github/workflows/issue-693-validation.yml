name: Issue 693 Validation

on:
  push:
    branches:
      - genesis/fix-controller-api-resilience-693

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: genesis/fix-controller-api-resilience-693
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Focused controller tests
        run: python -m pytest -q tests/test_github_issue_autorepair_workflow.py tests/test_github_issue_autorepair_heartbeat_workflow.py
      - name: Full repository tests
        run: python -m pytest -q
