name: Genesis Dashboard Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'GENE_REGISTRY.json'
      - '.github/workflows/genesis-dashboard-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: genesis-dashboard-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Pages site
        run: |
          mkdir -p _site
          cp web/dashboard.html _site/index.html
          cp GENE_REGISTRY.json _site/GENE_REGISTRY.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
