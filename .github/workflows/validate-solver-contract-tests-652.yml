name: Validate Solver Contract Tests 652

on:
  push:
    branches:
      - fix/solver-contract-tests-652

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Focused solver contracts
        run: python -m pytest -q tests/test_github_issue_autorepair_claim_release.py tests/test_oldest_issue_solver_pagination.py
      - name: Full repository tests
        run: python -m pytest -q
