name: Genesis GitHub Issue Autorepair Heartbeat

on:
  workflow_run:
    workflows: ["Gene Pulse"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/github-issue-autorepair-heartbeat.yml'
      - '.github/workflows/github-issue-autorepair.yml'
      - '.github/workflows/github-issue-autorepair-worker.yml'
      - '.github/workflows/github-issue-autorepair-integration.yml'
      - 'genesis/issue_worker_pool.py'
      - 'scripts/github_issue_autorepair.py'
      - 'scripts/pulse_coding_provider.py'
      - 'scripts/select_issue_repair_batch.py'
      - 'tests/test_github_issue_autorepair_workflow.py'

permissions: {}

env:
  # One authoritative autonomous repair/development lane at a time.
  GENESIS_ISSUE_REPAIR_MAX_PARALLEL: '1'
  GENESIS_ISSUE_REPAIR_STALE_MINUTES: '60'

concurrency:
  group: genesis-github-issue-autorepair-heartbeat
  cancel-in-progress: false

jobs:
  wake_dispatcher:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Detect capacity or stale claims and wake authoritative dispatcher
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --limit 500 \
            --json number,title,updatedAt,labels \
            > "$RUNNER_TEMP/open-issues.json"

          cutoff=$(date -u -d "$GENESIS_ISSUE_REPAIR_STALE_MINUTES minutes ago" +%Y-%m-%dT%H:%M:%SZ)
          stale_count=$(jq --arg cutoff "$cutoff" '[
            .[]
            | ([.labels[].name] // []) as $labels
            | select(($labels | index("genesis-autonomous")) != null)
            | select(($labels | index("genesis-repair-in-progress")) != null)
            | select(($labels | index("genesis-validating")) == null)
            | select((.updatedAt // "") < $cutoff)
          ] | length' "$RUNNER_TEMP/open-issues.json")

          # Use the exact same selector as the mutation-authorized dispatcher.
          # This prevents specialist/control/duplicate Issues from starving the
          # generic coding lane with successful no-work dispatches.
          plan_json=$(python -m scripts.select_issue_repair_batch \
            --issues-json "$RUNNER_TEMP/open-issues.json" \
            --max-parallel "$GENESIS_ISSUE_REPAIR_MAX_PARALLEL")
          mapfile -t selected < <(jq -r '.selected_issue_numbers[]' <<<"$plan_json")
          active=$(jq '.active_issue_numbers | length' <<<"$plan_json")
          available=$(jq '.available_slots' <<<"$plan_json")
          launch_count="${#selected[@]}"

          if (( launch_count > 0 )); then
            echo "Autorepair heartbeat launching $launch_count selected repair pulse(s): active=$active available=$available stale=$stale_count capacity=$GENESIS_ISSUE_REPAIR_MAX_PARALLEL plan=$plan_json"
            lane=0
            for issue_number in "${selected[@]}"; do
              lane=$((lane + 1))
              echo "Dispatching repair pulse $lane/$launch_count for issue #$issue_number"
              gh workflow run github-issue-autorepair.yml \
                --repo "$GITHUB_REPOSITORY" \
                --ref main \
                -f issue_number="$issue_number"
            done
          elif (( stale_count > 0 )); then
            echo "Capacity is saturated by at least one stale unvalidated claim; waking authoritative dispatcher for reconciliation."
            gh workflow run github-issue-autorepair.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main
          else
            echo "Autorepair heartbeat idle: active=$active available=$available stale=$stale_count capacity=$GENESIS_ISSUE_REPAIR_MAX_PARALLEL plan=$plan_json"
          fi
