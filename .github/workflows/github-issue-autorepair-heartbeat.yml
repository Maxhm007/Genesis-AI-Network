name: Genesis GitHub Issue Autorepair Heartbeat

on:
  workflow_run:
    workflows: ["Gene Pulse"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/github-issue-autorepair-heartbeat.yml'
      - '.github/workflows/github-issue-autorepair.yml'
      - 'genesis/issue_worker_pool.py'

permissions: {}

env:
  GENESIS_ISSUE_REPAIR_MAX_PARALLEL: '5'

concurrency:
  group: genesis-github-issue-autorepair-heartbeat
  cancel-in-progress: false

jobs:
  wake_dispatcher:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      issues: read
    steps:
      - name: Select and wake up to five independent autorepair pulses
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --limit 500 \
            --json number,title,updatedAt,labels \
            > "$RUNNER_TEMP/open-issues.json"

          active=$(jq '[.[]
            | select(
                (([.labels[].name] | index("genesis-repair-in-progress")) != null) or
                (([.labels[].name] | index("genesis-validating")) != null)
              )
          ] | length' "$RUNNER_TEMP/open-issues.json")

          eligible_filter='[
            .[]
            | ([.labels[].name] // []) as $labels
            | select(
                ($labels | index("genesis-autonomous")) != null or
                ($labels | index("genesis-task")) != null or
                (.title | startswith("[Genesis Task]")) or
                (.title | startswith("[Genesis Repair]")) or
                (.title | startswith("[Genesis Self Improvement]")) or
                (.title | startswith("Genesis challenge:")) or
                (.title | startswith("Genesis Control:"))
              )
            | select(($labels | index("genesis-repair-in-progress")) == null)
            | select(($labels | index("genesis-validating")) == null)
            | select(($labels | index("genesis-blocked")) == null)
            | select(($labels | index("genesis-solved")) == null)
          ] | sort_by(.updatedAt, .number)'

          eligible=$(jq "$eligible_filter | length" "$RUNNER_TEMP/open-issues.json")

          available=$((GENESIS_ISSUE_REPAIR_MAX_PARALLEL - active))
          if (( available < 0 )); then
            available=0
          fi

          launch_count="$available"
          if (( eligible < launch_count )); then
            launch_count="$eligible"
          fi

          if (( launch_count > 0 )); then
            echo "Autorepair heartbeat launching $launch_count explicit independent pulse(s): active=$active eligible=$eligible capacity=$GENESIS_ISSUE_REPAIR_MAX_PARALLEL"
            mapfile -t selected < <(jq -r --argjson limit "$launch_count" "$eligible_filter | .[:\$limit][] | .number" "$RUNNER_TEMP/open-issues.json")
            lane=0
            for issue_number in "${selected[@]}"; do
              lane=$((lane + 1))
              echo "Dispatching repair pulse $lane/$launch_count for issue #$issue_number"
              gh workflow run github-issue-autorepair.yml \
                --repo "$GITHUB_REPOSITORY" \
                --ref main \
                -f issue_number="$issue_number"
            done
          else
            echo "Autorepair heartbeat idle: active=$active eligible=$eligible capacity=$GENESIS_ISSUE_REPAIR_MAX_PARALLEL"
          fi
