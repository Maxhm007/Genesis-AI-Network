name: Genesis GitHub Issue Autorepair Heartbeat

on:
  workflow_run:
    workflows: ["Gene Pulse"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/github-issue-autorepair-heartbeat.yml'
      - '.github/workflows/github-issue-autorepair.yml'

permissions: {}

env:
  GENESIS_ISSUE_REPAIR_MAX_PARALLEL: '5'

concurrency:
  group: genesis-github-issue-autorepair-heartbeat
  cancel-in-progress: false

jobs:
  wake_dispatcher:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      issues: write
    steps:
      - name: Admit waiting Genesis tasks and wake up to five independent autorepair pulses
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --limit 500 \
            --json number,title,labels \
            > "$RUNNER_TEMP/open-issues.json"

          # GitHub Issues are the authoritative Genesis task queue. Older task
          # records may have genesis-task without genesis-autonomous, and owner
          # created [Genesis Task] records may initially have no labels. Admit
          # those records automatically while leaving reports, operational
          # channels and privileged Action-repair issues on their own lanes.
          while IFS= read -r n; do
            [[ -n "$n" ]] || continue
            echo "Admitting waiting Genesis task #$n to autonomous repair."
            gh issue edit "$n" \
              --repo "$GITHUB_REPOSITORY" \
              --add-label genesis-task \
              --add-label genesis-autonomous
          done < <(jq -r '
            .[]
            | ([.labels[].name] // []) as $labels
            | select(
                ($labels | index("genesis-task")) != null or
                (.title | startswith("[Genesis Task]")) or
                (.title | startswith("[Genesis Repair]")) or
                (.title | startswith("[Genesis Self Improvement]")) or
                (.title | startswith("Genesis challenge:")) or
                (.title | startswith("Genesis Control:"))
              )
            | select(($labels | index("genesis-autonomous")) == null)
            | select(($labels | index("genesis-repair-in-progress")) == null)
            | select(($labels | index("genesis-validating")) == null)
            | select(($labels | index("genesis-blocked")) == null)
            | select(($labels | index("genesis-solved")) == null)
            | .number
          ' "$RUNNER_TEMP/open-issues.json")

          # Refresh after intake so capacity decisions see the newly admitted backlog.
          gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --limit 500 \
            --json number,labels \
            > "$RUNNER_TEMP/open-issues.json"

          active=$(jq '[.[]
            | select(
                (([.labels[].name] | index("genesis-repair-in-progress")) != null) or
                (([.labels[].name] | index("genesis-validating")) != null)
              )
          ] | length' "$RUNNER_TEMP/open-issues.json")

          eligible=$(jq '[.[]
            | select(([.labels[].name] | index("genesis-autonomous")) != null)
            | select(([.labels[].name] | index("genesis-repair-in-progress")) == null)
            | select(([.labels[].name] | index("genesis-validating")) == null)
            | select(([.labels[].name] | index("genesis-blocked")) == null)
            | select(([.labels[].name] | index("genesis-solved")) == null)
          ] | length' "$RUNNER_TEMP/open-issues.json")

          available=$((GENESIS_ISSUE_REPAIR_MAX_PARALLEL - active))
          if (( available < 0 )); then
            available=0
          fi

          launch_count="$available"
          if (( eligible < launch_count )); then
            launch_count="$eligible"
          fi

          if (( launch_count > 0 )); then
            echo "Autorepair heartbeat launching $launch_count independent pulse(s): active=$active eligible=$eligible capacity=$GENESIS_ISSUE_REPAIR_MAX_PARALLEL"
            for lane in $(seq 1 "$launch_count"); do
              echo "Dispatching repair pulse $lane/$launch_count"
              gh workflow run github-issue-autorepair.yml \
                --repo "$GITHUB_REPOSITORY" \
                --ref main
            done
          else
            echo "Autorepair heartbeat idle: active=$active eligible=$eligible capacity=$GENESIS_ISSUE_REPAIR_MAX_PARALLEL"
          fi
