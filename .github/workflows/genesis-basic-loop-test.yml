name: Genesis Tiny Problem Detection Test

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write
  issues: write

concurrency:
  group: genesis-tiny-problem-detection-test
  cancel-in-progress: false

jobs:
  detect-and-resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect predefined tiny problem
        id: detect
        run: |
          if [ ! -f genesis_detected_issue_status.txt ]; then
            echo "problem=true" >> "$GITHUB_OUTPUT"
            echo "Detected problem: genesis_detected_issue_status.txt is missing"
          else
            echo "problem=false" >> "$GITHUB_OUTPUT"
            echo "No predefined tiny problem detected"
          fi

      - name: Open issue for detected problem
        if: steps.detect.outputs.problem == 'true'
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body='Genesis detected that genesis_detected_issue_status.txt was missing. This issue must remain open until Genesis creates the file, verifies its expected content, records the commit, and closes this same issue.'
          response=$(gh api "repos/${GITHUB_REPOSITORY}/issues" \
            --method POST \
            -f title='[Genesis Detected] Missing tiny status file' \
            -f body="$body")
          issue_number=$(printf '%s' "$response" | jq -r '.number')
          issue_url=$(printf '%s' "$response" | jq -r '.html_url')
          echo "number=$issue_number" >> "$GITHUB_OUTPUT"
          echo "url=$issue_url" >> "$GITHUB_OUTPUT"

      - name: Fix detected problem
        if: steps.detect.outputs.problem == 'true'
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          printf 'Genesis detected and resolved a tiny repository problem\nIssue: #%s\nRun: %s\n' "$ISSUE_NUMBER" "$GITHUB_RUN_ID" > genesis_detected_issue_status.txt
          git config user.name 'Genesis Tiny Detector'
          git config user.email 'genesis-tiny-detector@users.noreply.github.com'
          git add genesis_detected_issue_status.txt
          git commit -m "Genesis resolves detected issue #${ISSUE_NUMBER}"
          git push origin HEAD:main

      - name: Verify fix
        if: steps.detect.outputs.problem == 'true'
        run: |
          test -f genesis_detected_issue_status.txt
          grep -Fx 'Genesis detected and resolved a tiny repository problem' genesis_detected_issue_status.txt
          grep -Fx "Issue: #${{ steps.issue.outputs.number }}" genesis_detected_issue_status.txt

      - name: Close detected issue
        if: steps.detect.outputs.problem == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          commit_sha=$(git rev-parse HEAD)
          gh issue close "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --comment "Genesis detected the missing file, fixed it, and verified the result. Commit: $commit_sha"

      - name: Report
        run: |
          if [ "${{ steps.detect.outputs.problem }}" = "true" ]; then
            echo "Detected, opened, fixed, verified, and closed issue #${{ steps.issue.outputs.number }}"
            echo "Issue URL: ${{ steps.issue.outputs.url }}"
          else
            echo "No issue created because the predefined tiny problem does not exist."
          fi
