name: Genesis self-healing watchdog

# Every repository controls only its OWN jobs and issues.
# GitHub supplies an ephemeral GITHUB_TOKEN: no PAT or peer secret is needed.
on:
  schedule:
    - cron: '0 1,7,13,19 * * *'
  # React promptly to failed peer healing and tested repair proposals.
  # Runs use the trusted default-branch workflow; PR code is never executed with write permissions.
  workflow_run:
    workflows:
      - 'Genesis uses Eve healing engine'
      - 'Genesis accepts Eve-style tested repair proposals'
    types: [completed]
    branches: [main]
  workflow_dispatch:
  # A reviewed change to this workflow on main triggers an immediate
  # post-merge verification, without needing a PAT or GitHub CLI.
  push:
    branches: [main]
    paths:
      - '.github/workflows/self-heal.yml'
  pull_request:
    paths:
      - 'scripts/mutual_healer.py'
      - 'tests/test_mutual_healer.py'
      - '.github/workflows/self-heal.yml'

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  # Shared across self- and peer-authored healers: never race a failed-run retry.
  group: reciprocal-healing-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  watchdog:
    # PRs may only test the policy. Untrusted PR code never receives a write token.
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify watchdog security and retry tests
        run: python -m unittest discover -s tests -p test_mutual_healer.py -v
      - name: Recover one local failed run or create evidence ticket
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRIGGERED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python scripts/mutual_healer.py --identity genesis --local

  policy-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_mutual_healer.py -v
