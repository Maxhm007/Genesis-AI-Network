name: Genesis Task 4 Compact Repair Validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/genesis-task3-repair-fast.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  PYTHONPATH: ${{ github.workspace }}
  GENESIS_REPAIR_PROVIDER_URL: http://127.0.0.1:8766
  GENESIS_PROVIDER_URL: http://127.0.0.1:8766
  GENESIS_PROVIDER_NAME: genesis-task4-compact-repair
  GENESIS_PROVIDER_TIMEOUT_SECONDS: '600'
  GENESIS_PROVIDER_MAX_NEW_TOKENS: '128'
  GENESIS_REPAIR_FALLBACK_MODEL: Qwen/Qwen2.5-Coder-0.5B-Instruct
  GENESIS_REPAIR_ESCALATION_MODEL: Qwen/Qwen2.5-Coder-0.5B-Instruct
  GENESIS_REPAIR_ESCALATION_MAX_NEW_TOKENS: '128'

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers>=4.51,<5' safetensors
      - name: Confirm isolated known regression
        run: |
          set -euo pipefail
          set +e
          python -m pytest -q tests/test_versioning.py
          target_rc=$?
          set -e
          test "$target_rc" -ne 0
          python -m pytest -q --ignore=tests/test_versioning.py
      - name: Start compact Genesis coding provider
        run: |
          nohup python scripts/pulse_coding_provider.py \
            --model "$GENESIS_REPAIR_FALLBACK_MODEL" \
            --escalation-model "$GENESIS_REPAIR_ESCALATION_MODEL" \
            --host 127.0.0.1 --port 8766 \
            --max-new-tokens 128 --escalation-max-new-tokens 128 \
            > /tmp/task4-provider.log 2>&1 &
          for i in {1..120}; do
            curl -fsS http://127.0.0.1:8766/health >/dev/null 2>&1 && exit 0
            sleep 2
          done
          cat /tmp/task4-provider.log
          exit 1
      - name: Genesis creates candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'Genesis AI'
          git config user.email 'genesis-ai@users.noreply.github.com'
          python scripts/github_issue_autorepair.py --issue-number 561 --repository "$GITHUB_REPOSITORY"
          cat runtime/github_issue_autorepair.json
          test "$(jq -r '.status' runtime/github_issue_autorepair.json)" = candidate_created
      - name: Verify promote and close
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=$(jq -r '.candidate_branch' runtime/github_issue_autorepair.json)
          sha=$(jq -r '.candidate_sha' runtime/github_issue_autorepair.json)
          test -n "$branch"; test -n "$sha"
          git fetch origin main "$branch"
          git checkout -B genesis/task4-integration origin/main
          git cherry-pick "$sha"
          python -m py_compile genesis/modules/versioning.py
          python -m pytest -q tests/test_versioning.py
          python -m pytest -q
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
          git push origin HEAD:main
          promoted=$(git rev-parse HEAD)
          gh issue comment 561 --repo "$GITHUB_REPOSITORY" --body "Genesis autonomously repaired the Task #4 validation regression. Candidate: \`$sha\`; promoted: \`$promoted\`. Target compilation, versioning tests, and full repository tests passed."
          gh issue edit 561 --repo "$GITHUB_REPOSITORY" --add-label genesis-verified >/dev/null
          for label in genesis-repair-in-progress genesis-autonomous genesis-claimed genesis-working genesis-verifying genesis-blocked genesis-solver-exhausted; do gh issue edit 561 --repo "$GITHUB_REPOSITORY" --remove-label "$label" >/dev/null 2>&1 || true; done
          gh issue close 561 --repo "$GITHUB_REPOSITORY" --reason completed
          git push origin --delete "$branch" >/dev/null 2>&1 || true
