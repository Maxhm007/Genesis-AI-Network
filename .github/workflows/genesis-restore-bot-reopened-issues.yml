name: Genesis Restore Bot-Reopened Issues

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/genesis-restore-bot-reopened-issues.yml
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  restore-bot-reopened:
    runs-on: ubuntu-latest
    steps:
      - name: Re-close only verified issues reopened by automation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" --jq '.[] | select(.pull_request == null) | select(.state_reason == "reopened") | .number' \
            | while read -r number; do
                [ -z "$number" ] && continue

                actor=$(gh api -H 'Accept: application/vnd.github+json' \
                  "repos/${GITHUB_REPOSITORY}/issues/${number}/timeline?per_page=100" \
                  --jq '[.[] | select(.event == "reopened")][-1].actor.login // ""')

                if [ "$actor" != 'github-actions[bot]' ]; then
                  echo "Leaving human-reopened issue #${number} open (actor=${actor:-unknown})."
                  continue
                fi

                labels=$(gh issue view "$number" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name]')
                verified=$(jq -r 'index("genesis-verified") != null or index("genesis-closed-sealed-completed") != null or index("genesis-closed-sealed-duplicate") != null' <<<"$labels")

                if [ "$verified" != 'true' ]; then
                  echo "Leaving unsolved bot-reopened issue #${number} open; no verified completion evidence."
                  continue
                fi

                gh api "repos/${GITHUB_REPOSITORY}/issues/${number}" \
                  --method PATCH -f state=closed -f state_reason=completed >/dev/null
                echo "Restored verified bot-reopened issue #${number} to closed/completed."
              done
