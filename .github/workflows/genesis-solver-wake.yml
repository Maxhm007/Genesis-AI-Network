name: Genesis Solver Wake

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/genesis-solver-wake.yml

permissions:
  actions: write
  contents: read

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Agentic Lab
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run genesis-agentic-lab-recovery.yml --repo "$GITHUB_REPOSITORY" --ref main
