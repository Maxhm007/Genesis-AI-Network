name: Genesis Solver Wake

# Compatibility/manual trigger only; automatic continuity is owned by Agentic Lab + Idle Repair Watchdog.
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Agentic Lab
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Skip redundant wakes: a queued/running controller pass (or one woken <2 min ago) already covers this.
          lab_skip="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow genesis-agentic-lab-recovery.yml --limit 20 --json databaseId,status,createdAt,event --jq '[.[] | select(.event != "push" and .event != "pull_request") | select(.status != "completed" or (now - (.createdAt | fromdateiso8601)) < 120)] | if length > 0 then "run \(.[0].databaseId) \(.[0].status)" else "" end' 2>/dev/null || true)"
          if [[ -n "$lab_skip" ]]; then
            echo "Agentic Lab Recovery wake skipped (already active or recently woken): $lab_skip"
          else
            gh workflow run genesis-agentic-lab-recovery.yml --repo "$GITHUB_REPOSITORY" --ref main
          fi
