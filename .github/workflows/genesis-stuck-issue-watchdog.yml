name: Genesis Stuck Issue Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/genesis-stuck-issue-watchdog.yml

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: genesis-stuck-issue-watchdog
  cancel-in-progress: false

jobs:
  failover-next-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Detect 10-attempt stuck issue and dispatch next issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh label create genesis-stuck-10x --repo "$GITHUB_REPOSITORY" \
            --color b60205 --description 'Issue reached 10 unsuccessful solver attempts; queue failover activated' --force >/dev/null 2>&1 || true
          gh label create genesis-failover-dispatched --repo "$GITHUB_REPOSITORY" \
            --color 5319e7 --description 'Watchdog dispatched another solver to the next eligible issue' --force >/dev/null 2>&1 || true

          # Never start more than one failover/DeepSeek solver concurrently.
          active_deepseek=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=open&labels=genesis-deepseek-working&per_page=100" --jq '.[]' | jq -s 'length')
          if [ "$active_deepseek" -gt 0 ]; then
            echo "DeepSeek failover solver already active (${active_deepseek}); watchdog will not start another."
            exit 0
          fi

          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=open&sort=created&direction=asc&per_page=100" --jq '.[]' | jq -s '.' > /tmp/open-issues.json

          python - <<'PY' > /tmp/stuck-candidates.txt
          import json
          from pathlib import Path
          rows = json.loads(Path('/tmp/open-issues.json').read_text())
          for issue in rows:
              if issue.get('pull_request'):
                  continue
              number = int(issue.get('number') or 0)
              if number <= 1:
                  continue
              labels = {str(x.get('name') or '') for x in issue.get('labels') or [] if isinstance(x, dict)}
              if 'genesis-needs-human' in labels:
                  continue
              print(number)
          PY

          stuck_issue=''
          stuck_attempts=0

          while read -r number; do
            [ -z "$number" ] && continue
            comments=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${number}/comments?per_page=100" --jq '.[].body' || true)

            # Count unique solver attempts from authoritative attempt markers.
            attempts=$(printf '%s\n' "$comments" \
              | grep -Eo '<!-- genesis-(solver|deepseek)-attempt:[0-9]+ -->' \
              | sed -E 's/.*:([0-9]+) -->/\1/' \
              | sort -n -u \
              | wc -l \
              | tr -d ' ')
            attempts=${attempts:-0}

            # Agentic strategy results do not always carry the generic attempt marker;
            # count distinct strategy-result comments as additional failed attempts only
            # when the issue is still open and no verified-close marker exists.
            strategy_attempts=$(printf '%s\n' "$comments" \
              | grep -Ec '<!-- genesis-agentic-strategy-result:' || true)
            if [ "$strategy_attempts" -gt "$attempts" ]; then
              attempts="$strategy_attempts"
            fi

            if [ "$attempts" -ge 10 ]; then
              # Trigger once per 10-attempt bucket (10-19, 20-29, ...), not every 5 minutes.
              bucket=$(( attempts / 10 ))
              marker="<!-- genesis-stuck-watchdog:${bucket} -->"
              if printf '%s\n' "$comments" | grep -Fq "$marker"; then
                continue
              fi
              stuck_issue="$number"
              stuck_attempts="$attempts"
              break
            fi
          done < /tmp/stuck-candidates.txt

          if [ -z "$stuck_issue" ]; then
            echo 'No open issue has reached a new 10-attempt stuck threshold.'
            exit 0
          fi

          echo "Issue #${stuck_issue} is stuck after ${stuck_attempts} unsuccessful attempts."
          gh issue edit "$stuck_issue" --repo "$GITHUB_REPOSITORY" --add-label genesis-stuck-10x >/dev/null

          bucket=$(( stuck_attempts / 10 ))
          marker="<!-- genesis-stuck-watchdog:${bucket} -->"

          # Choose the next safe issue, excluding the stuck issue and anything already owned.
          next_issue=$(python - "$stuck_issue" <<'PY'
          import json, re, sys
          from pathlib import Path
          stuck = int(sys.argv[1])
          rows = json.loads(Path('/tmp/open-issues.json').read_text())
          protected = {
              'genesis/autonomy_guard.py','genesis/autonomy_proof.py','genesis/blockchain.py',
              'genesis/ephemeral_validator.py','genesis/security.py','genesis/selfdev.py',
              'genesis/issue_solver.py','genesis/file_self_review.py','genesis/file_self_review_policy.py',
              'scripts/secret_guard.py','scripts/privileged_change_gate.py',
              'scripts/verify_validator_votes.py','scripts/action_repair_guard.py',
              'scripts/issue_acceptance_guard.py',
          }
          busy = {
              'genesis-repair-in-progress','genesis-validating','genesis-claimed',
              'genesis-working','genesis-verifying','genesis-deepseek-working',
          }
          unsuitable = {'genesis-needs-human','genesis-waiting-capability'}
          pattern = re.compile(r'\b((?:genesis|scripts)/[A-Za-z0-9_./-]+\.py)\b')
          ranked = []
          for issue in rows:
              if issue.get('pull_request'):
                  continue
              number = int(issue.get('number') or 0)
              if number <= 1 or number == stuck:
                  continue
              title = str(issue.get('title') or '')
              body = str(issue.get('body') or '')
              labels = {str(x.get('name') or '') for x in issue.get('labels') or [] if isinstance(x, dict)}
              if labels & busy or labels & unsuitable:
                  continue
              lower = title.lower()
              if lower.startswith(('genesis chat:', '[genesis hourly report]', '[genesis gene chat]')):
                  continue
              target = ''
              for match in pattern.findall(f'{title}\n{body}'):
                  candidate = match.replace('\\','/')
                  if candidate not in protected and Path(candidate).is_file():
                      target = candidate
                      break
              if not target:
                  continue
              text = f'{title}\n{body}'.lower()
              score = 0
              if any(w in text for w in ('fix','repair','bug','fails','failure','incorrect','reliability')):
                  score += 30
              if 'acceptance' in text:
                  score += 16
              if any(w in text for w in ('test','pytest','regression')):
                  score += 10
              if target.startswith('genesis/'):
                  score += 8
              if target.startswith('scripts/'):
                  score += 5
              # Prefer issues that have not already reached the same stuck state.
              if 'genesis-stuck-10x' in labels:
                  score -= 40
              ranked.append((-score, number))
          if ranked:
              ranked.sort()
              print(ranked[0][1])
          PY
          )

          if [ -z "$next_issue" ]; then
            gh issue comment "$stuck_issue" --repo "$GITHUB_REPOSITORY" \
              --body "${marker}\nGenesis Stuck Issue Watchdog detected ${stuck_attempts} unsuccessful solver attempts on this same open Issue. No other safe eligible Issue is currently available, so no failover worker was launched. The Issue remains open for later recovery." >/dev/null
            echo 'No safe next issue available for failover.'
            exit 0
          fi

          gh issue edit "$stuck_issue" --repo "$GITHUB_REPOSITORY" --add-label genesis-failover-dispatched >/dev/null
          gh issue comment "$stuck_issue" --repo "$GITHUB_REPOSITORY" \
            --body "${marker}\nGenesis Stuck Issue Watchdog detected ${stuck_attempts} unsuccessful solver attempts on this same open Issue. This Issue remains open and authoritative, but it will no longer monopolize throughput. A separate DeepSeek solver is being dispatched to next eligible Issue #${next_issue}." >/dev/null

          gh issue comment "$next_issue" --repo "$GITHUB_REPOSITORY" \
            --body "Genesis Stuck Issue Watchdog selected this as the next eligible Issue because Issue #${stuck_issue} reached ${stuck_attempts} unsuccessful attempts. DeepSeek failover is being dispatched without closing or duplicating the stuck Issue." >/dev/null

          gh workflow run genesis-deepseek-agentic-solver.yml \
            --repo "$GITHUB_REPOSITORY" --ref main -f issue_number="$next_issue"
          echo "Dispatched DeepSeek failover to issue #${next_issue}; stuck issue #${stuck_issue} remains open."
