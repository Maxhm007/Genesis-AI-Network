name: Genesis Stuck Issue Watchdog

# Detection heartbeat only. Agentic Lab owns anti-stuck strategy and failover.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/genesis-stuck-issue-watchdog.yml
      - genesis/anti_stuck.py
      - scripts/agentic_lab_recovery_dispatch.py

permissions:
  actions: write
  contents: read

concurrency:
  group: genesis-stuck-issue-watchdog
  cancel-in-progress: true

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake Agentic Lab anti-stuck controller
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Stuck watchdog does not select or label issues; Agentic Lab owns anti-stuck failover."
          gh workflow run genesis-agentic-lab-recovery.yml --repo "$GITHUB_REPOSITORY" --ref main
