name: Genesis Old Issue Drain Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/old-issue-drain-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: genesis-old-issue-drain-hotfix
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply bounded old-issue drain fix
        run: python scripts/apply_old_issue_drain_hotfix.py

      - name: Verify provider fallback and backlog fairness
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q \
            tests/test_qwen_free_coding.py \
            tests/test_open_issue_backlog_manager.py \
            tests/test_old_issue_drain_regression.py

      - name: Commit verified source fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No patch required.'
            exit 0
          fi
          git config user.name 'Genesis Backlog Recovery'
          git config user.email 'genesis-ai@users.noreply.github.com'
          git add \
            genesis/autonomous_engineering.py \
            genesis/efficient_engineering.py \
            tests/test_old_issue_drain_regression.py
          git commit -m 'fix: drain older GitHub issue backlog'
          git push origin HEAD:main
