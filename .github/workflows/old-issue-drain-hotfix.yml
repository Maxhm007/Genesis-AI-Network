name: Genesis Old Issue Drain Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/old-issue-drain-hotfix.yml'

permissions:
  contents: write

concurrency:
  group: genesis-old-issue-drain-hotfix
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch provider fallback and old issue fairness
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('genesis/autonomous_engineering.py')
          text = path.read_text(encoding='utf-8')

          old = '''    @staticmethod
    def _is_qwen_provider(provider) -> bool:
        """Qwen remains available to non-coding specialists, never to code execution."""
        return "qwen" in str(getattr(provider, "name", "")).strip().lower()

    def _coding_provider(self):
        """Return the best available non-Qwen, non-bootstrap coding provider.

        The small local Qwen runtime is useful for bounded discovery/review tasks,
        but it must not be a blocking implementation dependency. Coding either
        uses another eligible provider or checkpoints without consuming repair
        budget.
        """
        candidates = []
        for provider in self.providers.available_providers():
            profile = IntelligenceRouter.profile(provider)
            if profile.name == "genesis-bootstrap" or self._is_qwen_provider(provider):
                continue
            if "coding" not in profile.capabilities and "reasoning" not in profile.capabilities:
                continue
            candidates.append((profile.resource_cost, -profile.reliability, profile.name, provider))
        if not candidates:
            return None
        candidates.sort(key=lambda item: (item[0], item[1], item[2]))
        return candidates[0][3]
'''
          new = '''    @staticmethod
    def _is_qwen_provider(provider) -> bool:
        """Return whether a provider is from the local Qwen family."""
        return "qwen" in str(getattr(provider, "name", "")).strip().lower()

    def _coding_provider(self):
        """Return the best eligible coder, preferring non-Qwen but allowing Qwen fallback.

        A locally available Qwen model must not deadlock autonomous repair when it
        is the only trained coding/reasoning provider. Non-Qwen providers remain
        preferred when available. Every generated candidate still has to pass the
        normal repository tests, Security inspection, and independent validators
        before promotion, so model fallback never bypasses quality or safety gates.
        """
        candidates = []
        for provider in self.providers.available_providers():
            profile = IntelligenceRouter.profile(provider)
            if profile.name == "genesis-bootstrap":
                continue
            if "coding" not in profile.capabilities and "reasoning" not in profile.capabilities:
                continue
            qwen_fallback = 1 if self._is_qwen_provider(provider) else 0
            candidates.append(
                (qwen_fallback, profile.resource_cost, -profile.reliability, profile.name, provider)
            )
        if not candidates:
            return None
        candidates.sort(key=lambda item: (item[0], item[1], item[2], item[3]))
        return candidates[0][4]
'''
          if old not in text:
              raise SystemExit('autonomous_engineering provider block did not match expected source')
          text = text.replace(old, new, 1)
          text = text.replace(
              '"provider_policy": "qwen_excluded_from_coding",',
              '"provider_policy": "prefer_non_qwen_qwen_validated_fallback",',
              1,
          )
          text = text.replace(
              'self.queue.pause(task.task_id, "waiting_for_non_qwen_coding_provider")',
              'self.queue.pause(task.task_id, "waiting_for_eligible_coding_provider")',
              1,
          )
          text = text.replace(
              'attempt["error"] = "no_non_qwen_coding_provider_available"',
              'attempt["error"] = "no_eligible_coding_provider_available"',
              1,
          )
          path.write_text(text, encoding='utf-8')

          path = Path('genesis/efficient_engineering.py')
          text = path.read_text(encoding='utf-8')
          old = '''    @staticmethod
    def _github_issue_fairness_key(task) -> tuple:
        """Order Issue work so older untouched issues run once, then retries rotate fairly."""
        issue_number = int(task.payload.get("github_issue_number") or 0)
        generation = int(task.payload.get("work_generation") or 1)
        untouched_first_generation = generation == 1 and task.attempt_count == 0 and task.state == "new"
        if untouched_first_generation:
            return (0, issue_number, task.created_at, task.task_id)
        return (1, task.updated_at, issue_number, generation, task.task_id)
'''
          new = '''    @staticmethod
    def _github_issue_fairness_key(task) -> tuple:
        """Keep an Issue's age across generations so newer Issues cannot starve it.

        Priority-100 work is an emergency lane. All other Issue-backed engineering
        is ordered by GitHub Issue number first, which is monotonic creation order
        inside one repository. A retry generation therefore retains the age of its
        Issue instead of becoming younger than every newly created first generation.
        """
        issue_number = int(task.payload.get("github_issue_number") or 0)
        generation = int(task.payload.get("work_generation") or 1)
        emergency_lane = 0 if int(task.priority) >= 100 else 1
        return (
            emergency_lane,
            issue_number,
            task.updated_at,
            generation,
            task.attempt_count,
            task.task_id,
        )
'''
          if old not in text:
              raise SystemExit('efficient_engineering fairness block did not match expected source')
          text = text.replace(old, new, 1)
          old_scan = 'for task in self.queue.list(state=state, limit=100):'
          if old_scan not in text:
              raise SystemExit('efficient_engineering scan limit did not match expected source')
          text = text.replace(old_scan, 'for task in self.queue.list(state=state, limit=5000):', 1)
          path.write_text(text, encoding='utf-8')

          Path('tests/test_old_issue_drain_regression.py').write_text('''from __future__ import annotations\n\nfrom pathlib import Path\n\nfrom genesis.efficient_engineering import EfficientAutonomousEngineeringLoop\n\n\ndef _issue_task(loop, key: str, issue: int, *, generation: int = 1, priority: int = 95):\n    task, _ = loop.queue.create_unique(\n        key,\n        f"Resolve GitHub issue #{issue}.",\n        module_id="genesis.self_development",\n        priority=priority,\n        payload={\n            "task_type": "github_issue_development",\n            "github_issue_number": issue,\n            "work_generation": generation,\n        },\n    )\n    return task\n\n\ndef test_old_issue_keeps_age_across_retry_generations(tmp_path: Path):\n    loop = EfficientAutonomousEngineeringLoop(tmp_path)\n    old = _issue_task(loop, "old-109-generation-5", 109, generation=5)\n    _issue_task(loop, "new-348-generation-1", 348, generation=1)\n\n    selected = loop._select_task()\n\n    assert selected is not None\n    assert selected.task_id == old.task_id\n    assert loop._selection_trace[-1]["reason"] == "github_issue_fair_rotation"\n\n\ndef test_priority_100_emergency_can_preempt_old_issue(tmp_path: Path):\n    loop = EfficientAutonomousEngineeringLoop(tmp_path)\n    _issue_task(loop, "old-normal-109", 109, generation=5, priority=95)\n    emergency = _issue_task(loop, "new-critical-500", 500, generation=1, priority=100)\n\n    selected = loop._select_task()\n\n    assert selected is not None\n    assert selected.task_id == emergency.task_id\n\n\ndef test_old_issue_is_visible_beyond_legacy_top_100_priority_window(tmp_path: Path):\n    loop = EfficientAutonomousEngineeringLoop(tmp_path)\n    old = _issue_task(loop, "old-visible-109", 109, generation=5, priority=90)\n    for number in range(300, 425):\n        _issue_task(loop, f"newer-{number}", number, generation=1, priority=96)\n\n    selected = loop._select_task()\n\n    assert selected is not None\n    assert selected.task_id == old.task_id\n''', encoding='utf-8')
          PY
      - name: Run regression tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q \
            tests/test_qwen_free_coding.py \
            tests/test_open_issue_backlog_manager.py \
            tests/test_old_issue_drain_regression.py
      - name: Commit verified hotfix
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No patch required.'
            exit 0
          fi
          git config user.name 'Genesis Backlog Recovery'
          git config user.email 'genesis-ai@users.noreply.github.com'
          git add genesis/autonomous_engineering.py genesis/efficient_engineering.py tests/test_old_issue_drain_regression.py
          git commit -m 'fix: drain older GitHub issue backlog'
          git push origin HEAD:main
