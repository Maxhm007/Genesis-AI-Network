name: Genesis Issue Closure Manager

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Optional single issue number to reconcile
        required: false
        type: string
  issues:
    types: [labeled, reopened, closed]
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
    paths:
      - scripts/issue_closure_manager.py
      - scripts/issue_lifecycle_reconcile.py
      - genesis/issue_lifecycle.py
      - tests/test_issue_closure_manager.py
      - tests/test_issue_lifecycle.py
      - .github/workflows/genesis-issue-closure-manager.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: genesis-issue-closure-manager-${{ github.event.issue.number || inputs.issue_number || 'reconcile' }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event_name != 'issues' || github.event.action != 'labeled' || github.event.label.name == 'genesis-verified'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate closure policy
        run: python -m pytest -q tests/test_issue_lifecycle.py tests/test_issue_closure_manager.py

      - name: Reconcile one issue or the current repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
          INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          issue_number="${INPUT_ISSUE_NUMBER:-${EVENT_ISSUE_NUMBER:-}}"
          if [[ -n "$issue_number" ]]; then
            python scripts/issue_closure_manager.py --issue-number "$issue_number"
          else
            python scripts/issue_closure_manager.py --max-changes 50
          fi
