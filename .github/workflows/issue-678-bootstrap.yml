name: Issue 678 Semantic Acceptance Bootstrap

on:
  push:
    branches:
      - genesis/fix-678-semantic-acceptance
    paths:
      - .github/workflows/issue-678-bootstrap.yml

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: genesis/fix-678-semantic-acceptance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact existing-file edits
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          from pathlib import Path

          learned = Path('genesis/learned_capabilities.py')
          text = learned.read_text(encoding='utf-8')
          needle = base64.b64decode('ICAgIGlmIGNhbmRpZGF0ZSBhbmQgY2FuZGlkYXRlIGluIGNob2ljZXM6CiAgICAgICAgcmV0dXJuIGNhbmRpZGF0ZQogICAgaW1wb3J0IHRvcmNoCgpyZWdpc3Rlcl9jYXBhYmlsaXR5KAogICAgJ3J1bnRpbWVfZGV2aWNlX2FsaWdubWVudF8yYWI0OGVkZWYwMDknLA==').decode()
          replacement = base64.b64decode('ICAgIGlmIGNhbmRpZGF0ZSBhbmQgY2FuZGlkYXRlIGluIGNob2ljZXM6CiAgICAgICAgcmV0dXJuIGNhbmRpZGF0ZQogICAgcGFzcwoKcmVnaXN0ZXJfY2FwYWJpbGl0eSgKICAgICdydW50aW1lX2RldmljZV9hbGlnbm1lbnRfMmFiNDhlZGVmMDA5Jyw=').decode()
          if text.count(needle) != 1:
              raise SystemExit('expected exactly one invalid #427 import torch patch')
          learned.write_text(text.replace(needle, replacement, 1), encoding='utf-8')

          worker = Path('.github/workflows/genesis-bounded-repair-worker.yml')
          body = worker.read_text(encoding='utf-8')
          old = base64.b64decode('').decode()
          new = base64.b64decode('').decode()
          if body.count(old) != 1:
              raise SystemExit('bounded worker semantic-gate insertion point not found exactly once')
          worker.write_text(body.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Focused issue 678 validation
        run: |
          python -m pytest -q tests/test_learned_capability_acceptance.py
          python -m py_compile genesis/learned_capabilities.py genesis/learned_capability_acceptance.py
      - name: Full repository tests
        run: python -m pytest -q
      - name: Commit tested repair and self-delete helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue-678-bootstrap.yml
          git config user.name "Genesis Repair"
          git config user.email "genesis-ai@users.noreply.github.com"
          git add genesis/learned_capabilities.py .github/workflows/genesis-bounded-repair-worker.yml .github/workflows/issue-678-bootstrap.yml
          git commit -m "Complete semantic acceptance repair for issue 678"
          git push origin HEAD:genesis/fix-678-semantic-acceptance
