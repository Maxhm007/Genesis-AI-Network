name: Verify Agentic Current-State-First

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-agentic-current-state-first.yml
      - scripts/recovery_solver_dispatch.py
      - scripts/agentic_strategy_repair.py
      - tests/test_agentic_lab_current_state_first.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_agentic_lab_current_state_first.py tests/test_recovery_solver_same_issue_escalation.py
