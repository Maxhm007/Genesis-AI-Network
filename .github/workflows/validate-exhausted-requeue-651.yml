name: Validate Exhausted Requeue 651

on:
  push:
    branches:
      - fix/requeue-exhausted-generation-651

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Focused requeue tests
        run: python -m pytest -q tests/test_requeue_exhausted_issues.py
      - name: Full repository tests
        run: python -m pytest -q
