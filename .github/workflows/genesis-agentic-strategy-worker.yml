name: Genesis Agentic Strategy Worker

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/genesis-agentic-strategy-worker.yml
      - scripts/agentic_parallel_dispatch.py
      - scripts/agentic_lab_capability_first_dispatch.py
      - scripts/agentic_lab_recovery_dispatch.py
      - scripts/github_issue_autorepair.py
      - genesis/human_oversight.py
      - genesis/autonomy_guard.py
      - tests/test_github_issue_autorepair.py
      - tests/test_autonomy_guard.py
      - tests/test_human_oversight.py
      - tests/test_agentic_parallel_dispatch.py
      - tests/test_agentic_lab_recovery_dispatch.py
      - tests/test_agentic_strategy_sequence.py
      - tests/test_systemwide_memory_attachment.py
      - tests/test_terminal_issue_reconciler_workflow.py
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing GitHub Issue owned by Agentic Lab
        required: true
        type: string
      strategy:
        description: Materially different Agentic Lab recovery strategy
        required: true
        type: choice
        options:
          - evidence_first
          - alternative_implementation
          - diagnostic_reframe
          - dependency_diagnosis
          - qwen3_fallback

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: genesis-agentic-strategy-${{ inputs.issue_number }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  GENESIS_REPAIR_PROVIDER_URL: http://127.0.0.1:8766
  GENESIS_PROVIDER_URL: http://127.0.0.1:8766
  GENESIS_PROVIDER_NAME: genesis-agentic-strategy-repair
  GENESIS_PROVIDER_TIMEOUT_SECONDS: '420'
  GENESIS_PROVIDER_MAX_NEW_TOKENS: '640'
  GENESIS_REPAIR_FALLBACK_MODEL: Qwen/Qwen2.5-Coder-0.5B-Instruct
  GENESIS_REPAIR_ESCALATION_MODEL: Qwen/Qwen2.5-Coder-1.5B-Instruct
  GENESIS_QWEN3_FALLBACK_MODEL: Qwen/Qwen3-4B-Instruct-2507
  GENESIS_REPAIR_ESCALATION_MAX_NEW_TOKENS: '192'
  HF_HOME: ~/.cache/huggingface
  PIP_CACHE_DIR: ~/.cache/pip

jobs:
  repair-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install smoke-test dependencies
        if: github.event_name == 'push'
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Verify clean repository baseline
        if: github.event_name == 'push'
        run: python -m pytest -q

      - name: Verify actionable Agentic Lab reservation and safe target
        if: github.event_name == 'workflow_dispatch'
        id: eligibility
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          STRATEGY: ${{ inputs.strategy }}
        shell: bash
        run: |
          set -euo pipefail
          issue_json=$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,labels,body,title)
          state=$(jq -r '.state' <<<"$issue_json")
          reserved=$(jq -r '([.labels[].name] | index("genesis-repair-in-progress")) != null' <<<"$issue_json")
          agentic=$(jq -r '([.labels[].name] | index("agentic-lab")) != null' <<<"$issue_json")
          title=$(jq -r '.title // ""' <<<"$issue_json")
          body=$(jq -r '.body // ""' <<<"$issue_json")
          target=$(printf '%s\n' "$body" | python -m genesis.issue_target)
          task_type=$(printf '%s\n' "$body" | sed -nE 's/^- \*\*Task type:\*\* `([^`]+)`.*/\1/p' | head -n1)

          actionable=true
          title_lc=$(printf '%s' "$title" | tr '[:upper:]' '[:lower:]')
          if [[ "$title_lc" == "[performance indicator]"* ]]; then actionable=false; fi
          case "$task_type" in
            frontier_benchmark_measurement|performance_indicator|benchmark_measurement|metric_measurement)
              actionable=false ;;
          esac
          if grep -Fq '<!-- genesis-performance-indicator -->' <<<"$body"; then actionable=false; fi

          safe=true
          if [[ "$actionable" != "true" ]]; then safe=false; fi
          if [[ "$state" != "OPEN" || "$reserved" != "true" || "$agentic" != "true" ]]; then safe=false; fi
          if [[ -z "$target" || "$target" == *".."* || ! -f "$target" ]]; then safe=false; fi
          if [[ "$target" != genesis/*.py && "$target" != scripts/*.py ]]; then safe=false; fi
          case "$target" in
            genesis/autonomy_guard.py|genesis/autonomy_proof.py|genesis/blockchain.py|genesis/ephemeral_validator.py|genesis/security.py|genesis/selfdev.py|genesis/issue_solver.py|genesis/file_self_review.py|genesis/file_self_review_policy.py|scripts/secret_guard.py|scripts/privileged_change_gate.py|scripts/verify_validator_votes.py|scripts/action_repair_guard.py|scripts/issue_acceptance_guard.py)
              safe=false ;;
          esac

          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "eligible=$safe" >> "$GITHUB_OUTPUT"
          echo "actionable=$actionable" >> "$GITHUB_OUTPUT"

          if [[ "$actionable" != "true" ]]; then
            for label in genesis-repair-in-progress genesis-validating genesis-claimed genesis-working genesis-verifying genesis-blocked genesis-solver-exhausted genesis-deferred genesis-waiting-capability genesis-needs-human agentic-lab genesis-qwen3-agentic genesis-autonomous; do
              gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$label" >/dev/null 2>&1 || true
            done
            printf '%s\n%s\n' \
              '<!-- genesis-non-actionable-skip -->' \
              'Genesis skipped this item because it is a performance/measurement indicator, not an actionable repair Issue. Solver and Agentic labels were released; measurement history remains authoritative.' \
              > /tmp/genesis-non-actionable-skip.md
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/genesis-non-actionable-skip.md
          elif [[ "$safe" != "true" ]]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label genesis-repair-in-progress >/dev/null 2>&1 || true
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label genesis-autonomous --add-label agentic-lab --add-label genesis-solver-exhausted >/dev/null 2>&1 || true
            printf '%s\n%s\n' \
              "<!-- genesis-agentic-strategy-result:${STRATEGY} -->" \
              "Agentic Lab strategy worker declined this reservation because the Issue is not open/owned, the target is unsafe, or the reservation is stale. The Issue remains open and authoritative. repair status: \`blocked_protected_or_unsupported_target\`. No child/successor/capability Issue is created. Worker run: ${GITHUB_RUN_ID}." \
              > /tmp/genesis-agentic-declined.md
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/genesis-agentic-declined.md
          fi

      - name: Install repository dependencies
        if: steps.eligibility.outputs.eligible == 'true'
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Verify clean repository baseline
        if: steps.eligibility.outputs.eligible == 'true'
        run: python -m pytest -q

      - name: Hydrate validated Genesis memory
        if: steps.eligibility.outputs.eligible == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/github_memory_sync.py --repository "$GITHUB_REPOSITORY" --max-issues 100 || echo "Verified memory sync unavailable; continue without hydrated memory."

      - name: Restore open-model cache
        if: steps.eligibility.outputs.eligible == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
          key: genesis-agentic-open-model-${{ runner.os }}-py312-v2
          restore-keys: |
            genesis-agentic-open-model-${{ runner.os }}-py312-

      - name: Install free local repair intelligence
        if: steps.eligibility.outputs.eligible == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers>=4.51,<5' safetensors accelerate

      - name: Start adaptive local coding provider
        if: steps.eligibility.outputs.eligible == 'true'
        env:
          STRATEGY: ${{ inputs.strategy }}
        shell: bash
        run: |
          set -euo pipefail
          primary_model="$GENESIS_REPAIR_FALLBACK_MODEL"
          escalation_model="$GENESIS_REPAIR_ESCALATION_MODEL"
          if [[ "$STRATEGY" == "qwen3_fallback" ]]; then
            primary_model="$GENESIS_QWEN3_FALLBACK_MODEL"
            escalation_model="$GENESIS_QWEN3_FALLBACK_MODEL"
            echo "Using isolated Qwen3 model for final Agentic fallback: $primary_model"
          fi
          nohup python scripts/pulse_coding_provider.py \
            --model "$primary_model" \
            --escalation-model "$escalation_model" \
            --host 127.0.0.1 \
            --port 8766 \
            --max-new-tokens "$GENESIS_PROVIDER_MAX_NEW_TOKENS" \
            --escalation-max-new-tokens "$GENESIS_REPAIR_ESCALATION_MAX_NEW_TOKENS" \
            > /tmp/genesis-agentic-strategy-provider.log 2>&1 &
          ready=false
          for i in {1..180}; do
            if python - <<'PY'
          import urllib.request
          try:
              with urllib.request.urlopen('http://127.0.0.1:8766/health', timeout=2) as response:
                  raise SystemExit(0 if response.status == 200 else 1)
          except Exception:
              raise SystemExit(1)
          PY
            then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            cat /tmp/genesis-agentic-strategy-provider.log || true
            exit 1
          fi

      - name: Configure Genesis Git identity
        if: steps.eligibility.outputs.eligible == 'true'
        run: |
          git config user.name "Genesis AI"
          git config user.email "genesis-ai@users.noreply.github.com"

      - name: Run selected Agentic Lab strategy
        if: steps.eligibility.outputs.eligible == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          STRATEGY: ${{ inputs.strategy }}
        run: |
          python scripts/agentic_strategy_repair.py \
            --issue-number "$ISSUE_NUMBER" \
            --repository "$GITHUB_REPOSITORY" \
            --strategy "$STRATEGY"

      - name: Read repair evidence
        if: steps.eligibility.outputs.eligible == 'true'
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          test -f runtime/github_issue_autorepair.json
          status=$(jq -r '.status // ""' runtime/github_issue_autorepair.json)
          reason=$(jq -r '.reason // .repair_status // .status // ""' runtime/github_issue_autorepair.json)
          candidate_branch=$(jq -r '.candidate_branch // ""' runtime/github_issue_autorepair.json)
          candidate_sha=$(jq -r '.candidate_sha // ""' runtime/github_issue_autorepair.json)
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "candidate_branch=$candidate_branch" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"

      - name: Independently validate and promote exact Agentic candidate
        if: steps.evidence.outputs.status == 'candidate_created'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          STRATEGY: ${{ inputs.strategy }}
          TARGET: ${{ steps.eligibility.outputs.target }}
          CANDIDATE_BRANCH: ${{ steps.evidence.outputs.candidate_branch }}
          CANDIDATE_SHA: ${{ steps.evidence.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CANDIDATE_BRANCH"
          test -n "$CANDIDATE_SHA"
          git fetch origin main "$CANDIDATE_BRANCH"
          git cat-file -e "${CANDIDATE_SHA}^{commit}"

          target_test="tests/test_$(basename "$TARGET" .py).py"
          mapfile -t changed_files < <(git diff-tree --no-commit-id --name-only -r "$CANDIDATE_SHA")
          if (( ${#changed_files[@]} == 0 )); then echo "Candidate contains no changed files" >&2; exit 1; fi
          for path in "${changed_files[@]}"; do
            if [[ "$path" != "$TARGET" && "$path" != "$target_test" ]]; then echo "Rejected out-of-scope Agentic candidate path: $path" >&2; exit 1; fi
          done

          gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // ""' > /tmp/genesis-agentic-issue-body.md
          promoted_sha=''
          for integration_attempt in 1 2 3; do
            git fetch origin main
            git checkout -B "genesis/agentic-integration-${ISSUE_NUMBER}-${GITHUB_RUN_ID}" origin/main
            if ! git cherry-pick "$CANDIDATE_SHA"; then git cherry-pick --abort || true; continue; fi
            if [[ "$TARGET" == genesis/*.py ]]; then
              integrated_base=$(git rev-parse HEAD^)
              git show "${integrated_base}:${TARGET}" > /tmp/genesis-agentic-semantic-base.py
              python -m genesis.learned_capability_acceptance \
                --issue-body-file /tmp/genesis-agentic-issue-body.md \
                --target "$TARGET" \
                --base-file /tmp/genesis-agentic-semantic-base.py \
                --candidate-file "$TARGET"
            fi
            python -m py_compile "$TARGET"
            if [[ -f "$target_test" ]]; then python -m pytest -q "$target_test"; fi
            python -m pytest -q
            git fetch origin main
            integrated_base=$(git rev-parse HEAD^)
            latest_main=$(git rev-parse origin/main)
            if [[ "$integrated_base" != "$latest_main" ]]; then continue; fi
            if git push origin HEAD:main; then promoted_sha=$(git rev-parse HEAD); break; fi
          done

          if [[ -z "$promoted_sha" ]]; then echo "Agentic candidate could not be promoted safely" >&2; exit 1; fi
          git fetch origin main
          git reset --hard origin/main
          python -m py_compile "$TARGET"
          if [[ -f "$target_test" ]]; then python -m pytest -q "$target_test"; fi
          python -m pytest -q

          if ! python scripts/record_verified_repair_memory.py \
            --repository "$GITHUB_REPOSITORY" \
            --issue-number "$ISSUE_NUMBER" \
            --target "$TARGET" \
            --candidate-sha "$CANDIDATE_SHA" \
            --promoted-sha "$promoted_sha" \
            --worker-run "$GITHUB_RUN_ID" \
            --evidence-file runtime/github_issue_autorepair.json
          then
            echo "Verified repair memory recording failed; repair verification remains authoritative." >&2
          fi

          printf '%s\n%s\n' \
            "<!-- genesis-agentic-strategy-result:${STRATEGY} -->" \
            "Agentic Lab strategy \`${STRATEGY}\` produced a verified repair. Candidate: \`${CANDIDATE_SHA}\`. Promoted main SHA: \`${promoted_sha}\`. repair status: \`completed\`. Full repository validation passed after promotion." \
            > /tmp/genesis-agentic-success.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/genesis-agentic-success.md
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label genesis-verified >/dev/null
          for label in genesis-repair-in-progress genesis-validating genesis-autonomous genesis-claimed genesis-working genesis-verifying genesis-blocked genesis-solver-exhausted genesis-deferred genesis-waiting-capability genesis-needs-human agentic-lab genesis-qwen3-agentic; do
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$label" >/dev/null 2>&1 || true
          done
          gh workflow run genesis-issue-closure-manager.yml --repo "$GITHUB_REPOSITORY" --ref main -f issue_number="$ISSUE_NUMBER" >/dev/null 2>&1 || true
          echo "Verified evidence recorded; Genesis Issue Closure Manager dispatched for final close/seal."
          git push origin --delete "$CANDIDATE_BRANCH" >/dev/null 2>&1 || true

      - name: Release unsuccessful Agentic reservation without closing Issue
        if: always() && steps.eligibility.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          STRATEGY: ${{ inputs.strategy }}
          STATUS: ${{ steps.evidence.outputs.status }}
          REASON: ${{ steps.evidence.outputs.reason }}
        shell: bash
        run: |
          set -euo pipefail
          issue_json=$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,labels)
          state=$(jq -r '.state' <<<"$issue_json")
          verified=$(jq -r '([.labels[].name] | index("genesis-verified")) != null' <<<"$issue_json")
          if [[ "$state" == "CLOSED" || "$verified" == "true" ]]; then exit 0; fi
          repair_status="${REASON:-${STATUS:-worker_failed_before_evidence}}"
          for label in genesis-repair-in-progress genesis-validating genesis-claimed genesis-working genesis-verifying genesis-qwen3-agentic; do
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$label" >/dev/null 2>&1 || true
          done

          if [[ "$repair_status" == "worker_failed_before_evidence" ]]; then
            recent_pre_evidence_failures=$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json comments --jq \
              '[.comments[].body | select(contains("repair status: \`worker_failed_before_evidence\`"))] | length' 2>/dev/null || echo 0)
            if [[ "$recent_pre_evidence_failures" -ge 1 ]]; then
              gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
                --add-label genesis-blocked --add-label genesis-solver-exhausted --add-label genesis-autonomous >/dev/null 2>&1 || true
              gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
                --remove-label agentic-lab --remove-label genesis-deferred >/dev/null 2>&1 || true
              printf '%s\n%s\n' \
                '<!-- genesis-agentic-infrastructure-quarantine -->' \
                "Genesis quarantined this Issue from Agentic Lab after repeated pre-evidence worker failures. No coding attempt was consumed and the Issue remains open. A repair-engine/workflow change must occur before Agentic Lab may reclaim it. Worker run: ${GITHUB_RUN_ID}." \
                > /tmp/genesis-agentic-failure.md
              gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/genesis-agentic-failure.md
              exit 0
            fi
          fi

          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label agentic-lab --add-label genesis-solver-exhausted --add-label genesis-autonomous >/dev/null 2>&1 || true
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label genesis-deferred >/dev/null 2>&1 || true
          printf '%s\n%s\n' \
            "<!-- genesis-agentic-strategy-result:${STRATEGY} -->" \
            "Agentic Lab strategy \`${STRATEGY}\` did not produce a verified promotion. repair status: \`${repair_status}\`. The Issue remains open and authoritative. The next Agentic Lab pass continues on this same Issue; no child/successor/capability Issue is created. Worker run: ${GITHUB_RUN_ID}." \
            > /tmp/genesis-agentic-failure.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/genesis-agentic-failure.md

      - name: Preserve Agentic repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-agentic-strategy-${{ inputs.issue_number }}-${{ github.run_id }}
          path: |
            runtime/github_issue_autorepair.json
            /tmp/genesis-agentic-strategy-provider.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Continue Agentic Lab lifecycle
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run genesis-agentic-lab-recovery.yml --repo "$GITHUB_REPOSITORY" --ref main >/dev/null 2>&1 || true