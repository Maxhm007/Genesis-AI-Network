name: Issue 443 Validation

on:
  push:
    branches:
      - genesis/solve-443-vllm-routing
    paths:
      - .github/workflows/issue-443-validation.yml

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: genesis/solve-443-vllm-routing
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply issue 443 patch
        run: python scripts/issue_443_patch.py
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Focused tests
        run: python -m pytest -q tests/test_task_router_model_scout.py
      - name: Full repository tests
        run: python -m pytest -q
      - name: Commit tested change and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue-443-validation.yml scripts/issue_443_patch.py
          git config user.name "Genesis Repair"
          git config user.email "genesis-ai@users.noreply.github.com"
          git add genesis/task_router.py tests/test_task_router_model_scout.py .github/workflows/issue-443-validation.yml scripts/issue_443_patch.py
          git commit -m "Route vLLM runtime work to model scout (#443)"
          git push origin HEAD:genesis/solve-443-vllm-routing
