name: Genesis Reasoning Smoke

on:
  push:
    branches: [main]
    paths:
      - 'scripts/local_repair_provider.py'
      - '.github/workflows/genesis-reasoning-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reasoning:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local open-weight reasoning runtime
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers>=4.48,<5' safetensors
      - name: Verify Genesis local repair model
        run: |
          python - <<'PY'
          from scripts.local_repair_provider import LocalRepairModel, DEFAULT_MODEL
          model = LocalRepairModel(DEFAULT_MODEL)
          response = model.reason('{"task":"Return a tiny JSON repair proposal for a hypothetical one-line Python bug.","failure_text":"tests/test_demo.py: assert 1 == 2"}')
          print(response[:1000])
          assert isinstance(response, str) and response.strip()
          print('GENESIS_LOCAL_REASONING=PASS')
          PY
