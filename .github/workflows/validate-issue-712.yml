name: Validate Issue 712

on:
  push:
    branches:
      - genesis/evidence-first-hard-repair-712
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: genesis/evidence-first-hard-repair-712
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Focused difficult-repair and capability-builder tests
        run: python -m pytest -q tests/test_evidence_first_repair_followup.py tests/test_github_issue_capability_builder.py tests/test_github_issue_autorepair.py
      - name: Full repository suite
        run: python -m pytest -q
