name: Learned Capability Cluster Validation

on:
  push:
    branches:
      - genesis/solve-learned-427-431-433
    paths:
      - .github/workflows/learned-427-431-433-validation.yml

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: genesis/solve-learned-427-431-433
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply issue-backed capabilities
        run: python scripts/issue_learned_cluster_patch.py
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Focused learned-capability tests
        run: |
          python -m py_compile genesis/learned_capabilities.py
          python -m pytest -q tests/test_learned_capabilities_issue_cluster.py tests/test_learned_capability_acceptance.py
      - name: Full repository tests
        run: python -m pytest -q
      - name: Commit tested capabilities and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/learned-427-431-433-validation.yml scripts/issue_learned_cluster_patch.py
          git config user.name "Genesis Repair"
          git config user.email "genesis-ai@users.noreply.github.com"
          git add genesis/learned_capabilities.py .github/workflows/learned-427-431-433-validation.yml scripts/issue_learned_cluster_patch.py
          git commit -m "Implement learned capabilities for #427 #431 #432 #433"
          git push origin HEAD:genesis/solve-learned-427-431-433
