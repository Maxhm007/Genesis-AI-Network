name: Genesis Self Healing

on:
  workflow_run:
    workflows: ["Genesis Independent Validator Gate"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  self_heal:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Configure Genesis Git identity
        run: |
          git config user.name "Genesis AI"
          git config user.email "genesis-ai@users.noreply.github.com"
      - name: Diagnose and attempt bounded repair
        env:
          GH_TOKEN: ${{ github.token }}
          GENESIS_REPAIR_PROVIDER_URL: ${{ secrets.GENESIS_REPAIR_PROVIDER_URL }}
        run: python scripts/self_heal.py
