name: Genesis Self Healing

# Compatibility failure-signal feeder only.
# Generalized Action Failure Watcher + Agentic Lab own diagnosis, retry, repair, verification and closure.
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Genesis Independent Validator Gate
      - Genesis Candidate PR Gate
      - Genesis Secret Guard
      - Genesis Proactive Development
    types:
      - completed
  push:
    branches: [main]
    paths:
      - .github/workflows/self-healing.yml
      - .github/workflows/genesis-action-failure-watcher.yml
      - scripts/action_failure_watchdog.py

permissions:
  contents: read
  actions: write

concurrency:
  group: genesis-self-healing
  cancel-in-progress: true

jobs:
  handoff:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Route failure handling to generalized Action watcher
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Self Healing is feeder-only. Action Failure Watcher and Agentic Lab own repair."
          gh workflow run genesis-action-failure-watcher.yml --repo "$GITHUB_REPOSITORY" --ref main
