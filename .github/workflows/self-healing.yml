name: Genesis Self Healing

on:
  workflow_run:
    workflows:
      - "Genesis Independent Validator Gate"
      - "Genesis Proactive Development"
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'

permissions:
  contents: write
  pull-requests: write
  issues: write
  models: read

jobs:
  self_heal:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Configure Genesis Git identity
        run: |
          git config user.name "Genesis AI"
          git config user.email "genesis-ai@users.noreply.github.com"
      - name: Check current health
        id: baseline
        continue-on-error: true
        run: python -m pytest -q
      - name: Install local repair intelligence
        if: steps.baseline.outcome == 'failure'
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers>=4.48,<5' safetensors
      - name: Boot Genesis local repair provider
        if: steps.baseline.outcome == 'failure'
        run: |
          nohup python scripts/local_repair_provider.py --port 8765 > local-repair.log 2>&1 &
          echo $! > local-repair.pid
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8765/health >/dev/null 2>&1; then
              echo "GENESIS_REPAIR_PROVIDER_URL=http://127.0.0.1:8765" >> "$GITHUB_ENV"
              echo "Genesis local repair model is ready"
              exit 0
            fi
            sleep 2
          done
          cat local-repair.log || true
          exit 1
      - name: Diagnose and autonomously repair
        if: steps.baseline.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GENESIS_REPAIR_MODEL: openai/gpt-4o
        run: python scripts/self_heal.py
      - name: Healthy - no repair needed
        if: steps.baseline.outcome == 'success'
        run: echo "Genesis is healthy; no repair cycle required."
      - name: Show local repair log on failure
        if: failure()
        run: cat local-repair.log || true
