name: Genesis Self Healing

# Compatibility failure-signal feeder only.
# Generalized Action Failure Watcher + Agentic Lab own diagnosis, retry, repair, verification and closure.
# Compatibility/manual dispatch only; automatic failure detection is owned by Genesis Action Failure Watcher.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: genesis-self-healing
  cancel-in-progress: true

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Route failure handling to generalized Action watcher
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Self Healing is feeder-only. Action Failure Watcher and Agentic Lab own repair."
          gh workflow run genesis-action-failure-watcher.yml --repo "$GITHUB_REPOSITORY" --ref main
