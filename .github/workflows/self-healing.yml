name: Genesis Self Healing

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/self-healing.yml
      - scripts/self_heal.py
      - scripts/ingest_workflow_failure.py
      - scripts/genesis_core_vitality.py
      - scripts/request_peer_healing.py
  workflow_run:
    workflows:
      - Genesis Independent Validator Gate
      - Genesis Candidate PR Gate
      - Genesis Secret Guard
      - Genesis Proactive Development
    types:
      - completed
  workflow_dispatch: {}
  schedule:
    - cron: "37 * * * *"

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write

jobs:
  self_heal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Ignore successful upstream runs
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'failure' }}
        run: |
          echo "Upstream workflow completed without failure; no repair required."
          echo "GENESIS_SKIP_REPAIR=true" >> "$GITHUB_ENV"

      - name: Checkout Genesis
        if: ${{ env.GENESIS_SKIP_REPAIR != 'true' }}
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        if: ${{ env.GENESIS_SKIP_REPAIR != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: ${{ env.GENESIS_SKIP_REPAIR != 'true' }}
        run: pip install -r requirements.txt

      - name: Ingest upstream workflow failure into GAPS
        if: ${{ env.GENESIS_SKIP_REPAIR != 'true' && github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GENESIS_UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          GENESIS_UPSTREAM_WORKFLOW: ${{ github.event.workflow_run.name }}
          GENESIS_UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          GENESIS_UPSTREAM_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          GENESIS_UPSTREAM_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/ingest_workflow_failure.py

      - name: Configure Genesis Git identity
        if: ${{ env.GENESIS_SKIP_REPAIR != 'true' }}
        run: |
          git config user.name "Genesis AI"
          git config user.email "genesis-ai@users.noreply.github.com"

      - name: Check tests and core vitality
        if: ${{ env.GENESIS_SKIP_REPAIR != 'true' }}
        id: baseline
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -q
          python scripts/genesis_core_vitality.py

      - name: Preserve core vitality evidence
        if: ${{ env.GENESIS_SKIP_REPAIR != 'true' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: genesis-core-vitality-${{ github.run_id }}
          path: |
            runtime/core_vitality.json
            runtime/core_vitality_repair.json
            runtime/workflow_failure_diagnosis.json
            runtime/problem_solver_history.jsonl
          if-no-files-found: ignore
          retention-days: 30

      - name: Install local repair intelligence
        if: ${{ env.GENESIS_SKIP_REPAIR != 'true' && steps.baseline.outcome == 'failure' }}
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers>=4.48,<5' safetensors

      - name: Boot Genesis local repair provider
        if: ${{ env.GENESIS_SKIP_REPAIR != 'true' && steps.baseline.outcome == 'failure' }}
        run: |
          nohup python scripts/local_repair_provider.py --port 8765 > local-repair.log 2>&1 &
          echo $! > local-repair.pid
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8765/health >/dev/null 2>&1; then
              echo "GENESIS_REPAIR_PROVIDER_URL=http://127.0.0.1:8765" >> "$GITHUB_ENV"
              echo "Genesis local repair provider is ready"
              exit 0
            fi
            sleep 2
          done
          cat local-repair.log || true
          exit 1

      - name: Diagnose and autonomously repair
        if: ${{ env.GENESIS_SKIP_REPAIR != 'true' && steps.baseline.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/self_heal.py

      - name: Publish local peer recovery request if repair still fails
        if: ${{ failure() && env.GENESIS_SKIP_REPAIR != 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          NODE_ID: genesis-node-0
        run: python scripts/request_peer_healing.py

      - name: Healthy - all core loops proven
        if: ${{ env.GENESIS_SKIP_REPAIR != 'true' && steps.baseline.outcome == 'success' }}
        run: echo "Genesis operational - tests and core vitality are healthy."

      - name: Show local repair log on failure
        if: ${{ failure() }}
        run: cat local-repair.log || true
