name: Genesis Action Queue Cleaner

on:
  push:
    paths:
      - '.github/workflows/genesis-action-queue-cleaner.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: genesis-action-queue-cleaner
  cancel-in-progress: true

jobs:
  clean-stale-queue:
    runs-on: ubuntu-latest
    steps:
      - name: Clean stale queued workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const cutoffMs = 60 * 60 * 1000;
            const now = Date.now();
            let cancelled = 0;
            let forceCancelled = 0;
            let ghosts = 0;

            for (let page = 1; page <= 10; page++) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                status: 'queued',
                per_page: 100,
                page
              });

              if (!data.workflow_runs.length) break;

              for (const run of data.workflow_runs) {
                const ageMs = now - new Date(run.created_at).getTime();
                if (ageMs < cutoffMs) continue;

                try {
                  await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
                  cancelled += 1;
                  core.info(`Cancelled stale queued run ${run.id}: ${run.name}`);
                  continue;
                } catch (cancelError) {
                  core.warning(`Normal cancel rejected for ${run.id}: ${cancelError.message}`);
                }

                try {
                  await github.rest.actions.forceCancelWorkflowRun({ owner, repo, run_id: run.id });
                  forceCancelled += 1;
                  core.info(`Force-cancelled zombie run ${run.id}: ${run.name}`);
                } catch (forceError) {
                  ghosts += 1;
                  core.warning(`GitHub backend ghost ${run.id}: ${forceError.message}`);
                }
              }

              if (data.workflow_runs.length < 100) break;
            }

            core.summary
              .addHeading('Genesis Action Queue Cleaner')
              .addRaw(`Normal cancelled: ${cancelled}\n\nForce-cancelled: ${forceCancelled}\n\nBackend ghosts still reported: ${ghosts}`)
              .write();
