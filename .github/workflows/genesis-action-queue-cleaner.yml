name: Genesis Action Queue Cleaner

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/genesis-action-queue-cleaner.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: genesis-action-queue-cleaner
  cancel-in-progress: true

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel genuinely stale queued runs
        uses: actions/github-script@v7
        with:
          script: |
            const cutoffMs = 60 * 60 * 1000;
            const now = Date.now();
            const { owner, repo } = context.repo;

            const knownLegacyGhosts = new Set([
              32219064395,
              32218467321,
              32216752873,
              32215089776,
            ]);

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, status: 'queued', per_page: 100 }
            );

            let cleaned = 0;
            let ghosts = 0;
            let recent = 0;

            for (const run of runs) {
              if (knownLegacyGhosts.has(run.id)) {
                ghosts++;
                core.notice(`Known GitHub backend ghost retained for history: ${run.id} (${run.name})`);
                continue;
              }

              const ageMs = now - new Date(run.created_at).getTime();
              if (ageMs < cutoffMs) {
                recent++;
                continue;
              }

              try {
                await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
                cleaned++;
                core.notice(`Cancelled stale queued run ${run.id} (${run.name})`);
                continue;
              } catch (cancelError) {
                core.warning(`Normal cancel rejected run ${run.id}: ${cancelError.message}`);
              }

              try {
                await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/force-cancel', {
                  owner,
                  repo,
                  run_id: run.id,
                  headers: { 'X-GitHub-Api-Version': '2022-11-28' },
                });
                cleaned++;
                core.notice(`Force-cancelled stale queued run ${run.id} (${run.name})`);
              } catch (forceError) {
                core.warning(`Force-cancel rejected run ${run.id}: ${forceError.message}`);
              }
            }

            core.notice(`Queue cleaner summary: cleaned=${cleaned}, known_legacy_ghosts=${ghosts}, recent_queued=${recent}`);
