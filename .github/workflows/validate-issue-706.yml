name: Validate Issue 706

on:
  push:
    branches:
      - genesis/solve-706-model-lab-rollback
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: genesis/solve-706-model-lab-rollback
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Focused Model Lab lifecycle and integration tests
        run: python -m pytest -q tests/test_model_lab.py tests/test_model_training.py tests/test_model_provider.py
      - name: Full repository suite
        run: python -m pytest -q
