name: Genesis Independent Merged Repair Verification

on:
  pull_request:
    paths:
      - scripts/verify_merged_issue_repair.py
      - scripts/issue_closure_manager.py
      - tests/test_merged_repair_verification.py
      - .github/workflows/genesis-independent-merged-repair-verification.yml
      - .github/merged_repair_verification_queue.json
  push:
    branches: [main]
    paths:
      - scripts/verify_merged_issue_repair.py
      - scripts/issue_closure_manager.py
      - .github/workflows/genesis-independent-merged-repair-verification.yml
      - .github/merged_repair_verification_queue.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: genesis-independent-merged-repair-verification
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify independent merged repair checks
        run: python -m pytest -q tests/test_merged_repair_verification.py tests/test_issue_closure_manager.py

  verify-and-seal:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Check every queued exact SHA is merged to main
        shell: bash
        run: |
          set -euo pipefail
          jq -r '.[].sha' .github/merged_repair_verification_queue.json | while read -r sha; do
            [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
            git merge-base --is-ancestor "$sha" HEAD
          done
      - name: Independently validate current main
        run: |
          python -m py_compile genesis/immortality_scan.py scripts/issue_closure_manager.py scripts/verify_merged_issue_repair.py
          python -m pytest -q tests/test_immortality_scan.py tests/test_merged_repair_verification.py
          python -m pytest -q
      - name: Record verified evidence, seal issue and close through Closure Manager
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.verify_merged_issue_repair
