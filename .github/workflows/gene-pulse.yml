name: Gene Pulse

on:
  workflow_dispatch:
    inputs:
      gene:
        description: Internal Gene logical id
        required: false
        default: gene-node-1
      continue_chain:
        description: Request the next pulse when this pulse finishes
        required: false
        default: "true"
      chain_budget:
        description: Remaining bounded idle-discovery pulses before checkpointing
        required: false
        default: "4"
  repository_dispatch:
    types: [gene-pulse]
  push:
    branches: [main]
    paths:
      - "genesis/**"
      - "scripts/**"
      - "config/**"
      - "GENE_REGISTRY.json"
      - ".github/workflows/gene-pulse.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: gene-pulse-${{ inputs.gene || github.event.client_payload.gene || 'gene-node-1' }}
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GENE_ID: ${{ inputs.gene || github.event.client_payload.gene || 'gene-node-1' }}
      CONTINUE_CHAIN: ${{ inputs.continue_chain || github.event.client_payload.continue_chain || 'true' }}
      IDLE_DISCOVERY_BUDGET: ${{ inputs.chain_budget || github.event.client_payload.chain_budget || '4' }}
      PYTHONPATH: ${{ github.workspace }}
      GENESIS_PROVIDER_URL: http://127.0.0.1:8766
      GENESIS_PROVIDER_NAME: qwen2.5-coder-1.5b-gene-pulse
      GENESIS_PROVIDER_TIMEOUT_SECONDS: '60'
      GENESIS_PROVIDER_MAX_NEW_TOKENS: '384'
      HF_HOME: ~/.cache/huggingface
      PIP_CACHE_DIR: ~/.cache/pip
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore Gene persistent pulse state
        uses: actions/cache/restore@v4
        with:
          path: runtime
          key: gene-runtime-${{ env.GENE_ID }}-${{ github.run_id }}
          restore-keys: |
            gene-runtime-${{ env.GENE_ID }}-

      - name: Restore reasoning caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
          key: genesis-qwen2.5-coder-1.5b-${{ runner.os }}-py312-pulse-v1
          restore-keys: |
            genesis-qwen2.5-coder-1.5b-${{ runner.os }}-py312-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install local reasoning runtime
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers>=4.51,<5' safetensors

      - name: Start Gene reasoning provider
        shell: bash
        run: |
          nohup python scripts/local_reasoning_provider.py --model Qwen/Qwen2.5-Coder-1.5B-Instruct --host 127.0.0.1 --port 8766 --max-new-tokens 384 > /tmp/genesis-gene-pulse-reasoning.log 2>&1 &
          ready=false
          for i in {1..300}; do
            if python - <<'PY'
          import urllib.request
          try:
              with urllib.request.urlopen('http://127.0.0.1:8766/health', timeout=2) as response:
                  raise SystemExit(0 if response.status == 200 else 1)
          except Exception:
              raise SystemExit(1)
          PY
            then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            cat /tmp/genesis-gene-pulse-reasoning.log || true
            exit 1
          fi

      - name: Configure Genesis Git identity
        run: |
          git config user.name "Genesis AI"
          git config user.email "genesis-ai@users.noreply.github.com"

      - name: Execute one bounded queue transition
        run: python scripts/gene_pulse.py --gene "$GENE_ID" --output runtime/pulse_result.json

      - name: Advance one bounded frontier benchmark task
        run: python scripts/benchmark_task_worker.py

      - name: Read pulse and specialist handoffs
        id: pulse
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          from genesis.pulse import DEFAULT_IDLE_DISCOVERY_BURST, workflow_chain_decision

          p = json.loads(Path('runtime/pulse_result.json').read_text())
          payload = dict(p.get('payload', {}) or {})
          pipeline = dict(payload.get('pipeline', {}) or {})
          action = str(p.get('action') or '')
          review_candidate = dict(pipeline.get('review_candidate', {}) or {})
          validation_candidate = dict(pipeline.get('validation_candidate', {}) or {})
          record = dict(pipeline.get('record', {}) or {})

          # Legacy non-pipeline tasks keep their existing direct candidate handoff.
          attempt = dict(payload.get('attempt', {}) or {})
          legacy_candidate = dict(attempt.get('candidate', {}) or {})
          legacy_security = dict(attempt.get('candidate_security', {}) or {})
          legacy_ok = (
              bool(legacy_candidate.get('committed'))
              and bool(legacy_candidate.get('branch'))
              and bool(legacy_candidate.get('commit_sha'))
              and legacy_security.get('status') == 'pass'
          )

          review_actions = {'pipeline_development_completed', 'pipeline_repair_completed'}
          has_review = action in review_actions and bool(review_candidate.get('candidate_sha')) and bool(review_candidate.get('review_ref'))
          has_validation = action == 'pipeline_internal_review_approved' and bool(validation_candidate.get('candidate_sha')) and bool(validation_candidate.get('branch'))
          rejected_review_actions = {
              'pipeline_internal_review_needs_development',
              'pipeline_internal_review_needs_repair',
              'pipeline_quarantined',
          }
          rejected_review_ref = str(record.get('review_ref') or '') if action in rejected_review_actions else ''

          try:
              idle_budget = int(os.environ.get('IDLE_DISCOVERY_BUDGET', str(DEFAULT_IDLE_DISCOVERY_BURST)))
          except ValueError:
              idle_budget = DEFAULT_IDLE_DISCOVERY_BURST
          idle_budget = max(0, idle_budget)
          dispatch_next, next_budget, chain_reason = workflow_chain_decision(
              needs_next_pulse=bool(p.get('needs_next_pulse')),
              next_pulse_reason=str(p.get('next_pulse_reason') or ''),
              idle_budget=idle_budget,
          )
          idle_continue = dispatch_next and not bool(p.get('needs_next_pulse'))

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write('continue=' + ('true' if p.get('needs_next_pulse') else 'false') + '\n')
              f.write('idle_continue=' + ('true' if idle_continue else 'false') + '\n')
              f.write('dispatch_next=' + ('true' if dispatch_next else 'false') + '\n')
              f.write('next_budget=' + str(next_budget) + '\n')
              f.write('chain_reason=' + chain_reason + '\n')
              f.write('has_review_candidate=' + ('true' if has_review else 'false') + '\n')
              f.write('has_validation_candidate=' + ('true' if has_validation else 'false') + '\n')
              f.write('has_legacy_candidate=' + ('true' if legacy_ok else 'false') + '\n')
              if has_review:
                  f.write('review_sha=' + str(review_candidate['candidate_sha']) + '\n')
                  f.write('review_ref=' + str(review_candidate['review_ref']) + '\n')
              if has_validation:
                  f.write('candidate_sha=' + str(validation_candidate['candidate_sha']) + '\n')
                  f.write('candidate_branch=' + str(validation_candidate['branch']) + '\n')
                  f.write('approved_review_ref=' + str(record.get('review_ref') or '') + '\n')
              if rejected_review_ref:
                  f.write('rejected_review_ref=' + rejected_review_ref + '\n')
              if legacy_ok:
                  f.write('legacy_sha=' + str(legacy_candidate['commit_sha']) + '\n')
                  f.write('legacy_branch=' + str(legacy_candidate['branch']) + '\n')
          PY

      - name: Push isolated candidate to review queue
        if: steps.pulse.outputs.has_review_candidate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ref='${{ steps.pulse.outputs.review_ref }}'
          candidate='${{ steps.pulse.outputs.review_sha }}'
          [[ "$ref" == genesis/review-* ]]
          git rev-parse "$candidate^{commit}" >/dev/null
          test "$(git rev-parse HEAD)" = "$candidate"
          git push --force origin "$candidate:refs/heads/$ref"

      - name: Publish internally reviewed exact candidate
        if: steps.pulse.outputs.has_validation_candidate == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch='${{ steps.pulse.outputs.candidate_branch }}'
          candidate='${{ steps.pulse.outputs.candidate_sha }}'
          [[ "$branch" == genesis/candidate-* ]]
          git rev-parse "$candidate^{commit}" >/dev/null
          test "$(git rev-parse HEAD)" = "$candidate"
          git push --force origin "$candidate:refs/heads/$branch"
          approval_ref="genesis/approved-${candidate}"
          git push --force origin "$candidate:refs/heads/$approval_ref"
          review_ref='${{ steps.pulse.outputs.approved_review_ref }}'
          if [[ "$review_ref" == genesis/review-* ]]; then
            git push origin --delete "$review_ref" || true
          fi
          if ! gh workflow run candidate-promotion.yml --repo "$GITHUB_REPOSITORY" --ref main; then
            echo 'Immediate candidate-promotion dispatch failed; hourly promotion recovery remains available.' >&2
          fi

      - name: Remove rejected isolated review ref
        if: steps.pulse.outputs.rejected_review_ref != ''
        shell: bash
        run: |
          ref='${{ steps.pulse.outputs.rejected_review_ref }}'
          if [[ "$ref" == genesis/review-* ]]; then
            git push origin --delete "$ref" || true
          fi

      - name: Push legacy exact Genesis candidate
        if: steps.pulse.outputs.has_legacy_candidate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          branch='${{ steps.pulse.outputs.legacy_branch }}'
          candidate='${{ steps.pulse.outputs.legacy_sha }}'
          [[ "$branch" == genesis/candidate-* ]]
          git rev-parse "$candidate^{commit}" >/dev/null
          test "$(git rev-parse HEAD)" = "$candidate"
          git push --set-upstream origin "$candidate:refs/heads/$branch"

      - name: Save Gene persistent pulse state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: runtime
          key: gene-runtime-${{ env.GENE_ID }}-${{ github.run_id }}

      - name: Upload pulse and queue evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gene-pulse-${{ env.GENE_ID }}-${{ github.run_id }}
          path: |
            runtime/pulse_result.json
            runtime/discovery/
            runtime/autonomy_pipeline/
            runtime/genesis_tasks.sqlite3
            runtime/competitive_benchmark_inputs/
            runtime/competitive_benchmark_candidates/
            runtime/grce/${{ env.GENE_ID }}/candidate_handoff.json
            /tmp/genesis-gene-pulse-reasoning.log
          if-no-files-found: warn
          retention-days: 30

      - name: Request next pulse
        if: env.CONTINUE_CHAIN == 'true' && (steps.pulse.outputs.continue == 'true' || steps.pulse.outputs.idle_continue == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run gene-pulse.yml --ref main \
            -f gene="$GENE_ID" \
            -f continue_chain=true \
            -f chain_budget='${{ steps.pulse.outputs.next_budget }}'
