name: Gene Pulse

on:
  workflow_dispatch:
    inputs:
      gene:
        description: Internal Gene logical id
        required: false
        default: gene-node-1
  repository_dispatch:
    types: [gene-pulse]
  push:
    branches: [main]
    paths:
      - "genesis/**"
      - "scripts/**"
      - "config/**"
      - "GENE_REGISTRY.json"
      - ".github/workflows/gene-pulse.yml"

permissions:
  contents: read

concurrency:
  group: gene-pulse-${{ inputs.gene || github.event.client_payload.gene || 'gene-node-1' }}
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    env:
      GENE_ID: ${{ inputs.gene || github.event.client_payload.gene || 'gene-node-1' }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          if [ "$GENE_ID" = "gene-node-1" ]; then
            pip install torch --index-url https://download.pytorch.org/whl/cpu
            pip install 'transformers>=4.51,<5' safetensors accelerate
          fi

      - name: Restore Gene persistent pulse state
        uses: actions/cache/restore@v4
        with:
          path: runtime
          key: gene-runtime-${{ env.GENE_ID }}-${{ github.run_id }}
          restore-keys: |
            gene-runtime-${{ env.GENE_ID }}-

      - name: Cache DeepSeek model
        if: env.GENE_ID == 'gene-node-1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: deepseek-r1-distill-qwen-1.5b-${{ runner.os }}
          restore-keys: |
            deepseek-r1-distill-qwen-1.5b-

      - name: Start Gene 0 DeepSeek provider
        if: env.GENE_ID == 'gene-node-1'
        run: |
          mkdir -p runtime
          nohup python scripts/local_reasoning_provider.py \
            --model deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B \
            --host 127.0.0.1 \
            --port 8766 \
            --max-new-tokens 512 \
            > runtime/deepseek-provider.log 2>&1 &
          echo $! > runtime/deepseek-provider.pid
          for i in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:8766/health > runtime/deepseek-health.json; then
              cat runtime/deepseek-health.json
              echo 'GENESIS_PROVIDER_ENDPOINTS=[{"url":"http://127.0.0.1:8766","name":"deepseek-gene0","timeout_seconds":180}]' >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 5
          done
          cat runtime/deepseek-provider.log || true
          exit 1

      - name: Execute one pulse
        run: python scripts/gene_pulse.py --gene "$GENE_ID" --output runtime/pulse_result.json

      - name: Save Gene persistent pulse state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: runtime
          key: gene-runtime-${{ env.GENE_ID }}-${{ github.run_id }}

      - name: Upload pulse evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gene-pulse-${{ env.GENE_ID }}-${{ github.run_id }}
          path: |
            runtime/pulse_result.json
            runtime/deepseek-health.json
            runtime/deepseek-provider.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop after one pulse
        run: echo "Pulse complete. This workflow does not self-dispatch; the Genesis controller owns future work scheduling."
