name: Gene Pulse

on:
  workflow_dispatch:
    inputs:
      gene:
        description: Internal Gene logical id
        required: false
        default: gene-node-1
      continue_chain:
        description: Request the next pulse when this pulse finishes
        required: false
        default: "true"
  repository_dispatch:
    types: [gene-pulse]
  push:
    branches: [main]
    paths:
      - "genesis/**"
      - "scripts/**"
      - "config/**"
      - "GENE_REGISTRY.json"
      - ".github/workflows/gene-pulse.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: gene-pulse-${{ inputs.gene || github.event.client_payload.gene || 'gene-node-1' }}
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GENE_ID: ${{ inputs.gene || github.event.client_payload.gene || 'gene-node-1' }}
      CONTINUE_CHAIN: ${{ inputs.continue_chain || github.event.client_payload.continue_chain || 'true' }}
      PYTHONPATH: ${{ github.workspace }}
      GENESIS_PROVIDER_URL: http://127.0.0.1:8766
      GENESIS_PROVIDER_NAME: qwen2.5-coder-1.5b-gene-pulse
      GENESIS_PROVIDER_TIMEOUT_SECONDS: '120'
      GENESIS_PROVIDER_MAX_NEW_TOKENS: '384'
      HF_HOME: ~/.cache/huggingface
      PIP_CACHE_DIR: ~/.cache/pip
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore Gene persistent pulse state
        uses: actions/cache/restore@v4
        with:
          path: runtime
          key: gene-runtime-${{ env.GENE_ID }}-${{ github.run_id }}
          restore-keys: |
            gene-runtime-${{ env.GENE_ID }}-

      - name: Restore reasoning caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
          key: genesis-qwen2.5-coder-1.5b-${{ runner.os }}-py312-pulse-v1
          restore-keys: |
            genesis-qwen2.5-coder-1.5b-${{ runner.os }}-py312-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install local reasoning runtime
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers>=4.51,<5' safetensors

      - name: Start Gene reasoning provider
        shell: bash
        run: |
          nohup python scripts/local_reasoning_provider.py --model Qwen/Qwen2.5-Coder-1.5B-Instruct --host 127.0.0.1 --port 8766 --max-new-tokens 384 > /tmp/genesis-gene-pulse-reasoning.log 2>&1 &
          ready=false
          for i in {1..300}; do
            if python - <<'PY'
          import urllib.request
          try:
              with urllib.request.urlopen('http://127.0.0.1:8766/health', timeout=2) as response:
                  raise SystemExit(0 if response.status == 200 else 1)
          except Exception:
              raise SystemExit(1)
          PY
            then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            cat /tmp/genesis-gene-pulse-reasoning.log || true
            exit 1
          fi

      - name: Configure Genesis Git identity
        run: |
          git config user.name "Genesis AI"
          git config user.email "genesis-ai@users.noreply.github.com"

      - name: Execute one pulse
        run: python scripts/gene_pulse.py --gene "$GENE_ID" --output runtime/pulse_result.json

      - name: Read pulse decision and candidate handoff
        id: pulse
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = json.loads(Path('runtime/pulse_result.json').read_text())
          payload = dict(p.get('payload', {}) or {})
          attempt = dict(payload.get('attempt', {}) or {})
          candidate = dict(attempt.get('candidate', {}) or {})
          security = dict(attempt.get('candidate_security', {}) or {})
          committed = bool(candidate.get('committed'))
          branch = str(candidate.get('branch') or '')
          sha = str(candidate.get('commit_sha') or '')
          has_candidate = committed and bool(branch) and bool(sha) and security.get('status') == 'pass'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write('continue=' + ('true' if p.get('needs_next_pulse') else 'false') + '\n')
              f.write('has_candidate=' + ('true' if has_candidate else 'false') + '\n')
              if has_candidate:
                  f.write('candidate_branch=' + branch + '\n')
                  f.write('candidate_sha=' + sha + '\n')
          PY

      - name: Push exact Genesis candidate
        if: steps.pulse.outputs.has_candidate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          branch='${{ steps.pulse.outputs.candidate_branch }}'
          candidate='${{ steps.pulse.outputs.candidate_sha }}'
          git rev-parse "$candidate^{commit}" >/dev/null
          test "$(git rev-parse HEAD)" = "$candidate"
          [[ "$branch" == genesis/candidate-* ]]
          git push --set-upstream origin "$candidate:refs/heads/$branch"

      - name: Save Gene persistent pulse state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: runtime
          key: gene-runtime-${{ env.GENE_ID }}-${{ github.run_id }}

      - name: Upload pulse evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gene-pulse-${{ env.GENE_ID }}-${{ github.run_id }}
          path: |
            runtime/pulse_result.json
            runtime/discovery/
            runtime/grce/${{ env.GENE_ID }}/candidate_handoff.json
            /tmp/genesis-gene-pulse-reasoning.log
          if-no-files-found: warn
          retention-days: 30

      - name: Request next pulse
        if: steps.pulse.outputs.continue == 'true' && env.CONTINUE_CHAIN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run gene-pulse.yml --ref main -f gene="$GENE_ID" -f continue_chain=true
