name: Gene Pulse

on:
  workflow_dispatch:
    inputs:
      gene:
        description: Internal Gene logical id
        required: false
        default: gene-node-1
      continue_chain:
        description: Legacy compatibility input; ignored by the bounded pulse
        required: false
        default: "false"
  repository_dispatch:
    types: [gene-pulse]
  push:
    branches: [main]
    paths:
      - "genesis/**"
      - "scripts/**"
      - "config/**"
      - "GENE_REGISTRY.json"
      - ".github/workflows/gene-pulse.yml"

permissions:
  contents: read

concurrency:
  group: gene-pulse-${{ inputs.gene || github.event.client_payload.gene || 'gene-node-1' }}
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    env:
      GENE_ID: ${{ inputs.gene || github.event.client_payload.gene || 'gene-node-1' }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore Gene persistent pulse state
        uses: actions/cache/restore@v4
        with:
          path: runtime
          key: gene-runtime-${{ env.GENE_ID }}-${{ github.run_id }}
          restore-keys: |
            gene-runtime-${{ env.GENE_ID }}-

      - name: Execute one pulse
        run: python scripts/gene_pulse.py --gene "$GENE_ID" --output runtime/pulse_result.json

      - name: Save Gene persistent pulse state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: runtime
          key: gene-runtime-${{ env.GENE_ID }}-${{ github.run_id }}

      - name: Upload pulse evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gene-pulse-${{ env.GENE_ID }}-${{ github.run_id }}
          path: runtime/pulse_result.json
          if-no-files-found: warn
          retention-days: 14

      - name: Stop after one pulse
        run: echo "Pulse complete. This workflow does not self-dispatch; the Genesis controller owns future work scheduling."
