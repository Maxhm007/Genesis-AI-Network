name: Genesis Terminal Issue Reconciler

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches:
      - main
    paths:
      - .github/workflows/github-issue-terminal-reconciler.yml
      - genesis/github_issue_cleanup.py
      - genesis/github_issue_terminal_reconciler.py

permissions:
  contents: read
  issues: write

concurrency:
  group: genesis-terminal-issue-reconciler
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore resumable terminal task cache
        uses: actions/cache/restore@v4
        with:
          path: runtime
          key: genesis-terminal-runtime-${{ github.run_id }}
          restore-keys: |
            genesis-terminal-runtime-
            gene-runtime-gene-node-1-

      - name: Cleanup obsolete Issue records and reconcile terminal work
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          from genesis.github_issue_cleanup import cleanup_obsolete_github_issues
          from genesis.github_issue_terminal_reconciler import reconcile_terminal_github_issues

          cleanup = cleanup_obsolete_github_issues(Path('.'))
          print("Issue cleanup:")
          print(json.dumps(cleanup, indent=2, sort_keys=True))
          if cleanup.get('status') not in {'ok', 'not_repository_runtime'}:
              raise SystemExit(f"issue cleanup failed: {cleanup}")

          result = reconcile_terminal_github_issues(Path('.'))
          print("Terminal reconciliation:")
          print(json.dumps(result, indent=2, sort_keys=True))
          if result.get('status') not in {'ok', 'not_repository_runtime'}:
              raise SystemExit(f"terminal reconciliation failed: {result}")
          PY

      - name: Save reconciled resumable task cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: runtime
          key: genesis-terminal-runtime-${{ github.run_id }}
