name: Genesis Issue Opening Manager

on:
  workflow_dispatch:
  schedule:
    - cron: '12 * * * *'
  push:
    branches: [main]
    paths:
      - genesis/issue_opening_manager.py
      - scripts/agentic_issue_opening_authority.py
      - tests/test_issue_opening_manager.py
      - tests/test_agentic_issue_opening_authority.py
      - .github/workflows/genesis-agentic-issue-opening.yml
      - scripts/github_issue_discovery.py
      - scripts/deepseek_selfdev_issue_opener.py
      - scripts/discover_recent_ai_capability.py
      - scripts/discover_missing_qwen_capability.py
      - scripts/gene_peer_issue_sync.py
      - scripts/action_failure_watchdog.py
      - scripts/discovery_silence_watchdog.py
      - scripts/dashboard_hourly_review.py
      - scripts/dashboard_continuous_improvement.py
      - .github/workflows/genesis-issue-opening-manager.yml

permissions:
  contents: read

concurrency:
  group: genesis-issue-opening-manager
  cancel-in-progress: true

jobs:
  validate-opening-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Validate shared opening policy
        run: python -m pytest -q tests/test_issue_opening_manager.py tests/test_agentic_issue_opening_authority.py

      - name: Verify every opener is attached to the manager
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            scripts/github_issue_discovery.py \
            scripts/deepseek_selfdev_issue_opener.py \
            scripts/discover_recent_ai_capability.py \
            scripts/discover_missing_qwen_capability.py \
            scripts/gene_peer_issue_sync.py \
            scripts/action_failure_watchdog.py \
            scripts/discovery_silence_watchdog.py \
            scripts/dashboard_hourly_review.py \
            scripts/dashboard_continuous_improvement.py
          do
            if ! grep -q 'issue_opening_manager' "$file"; then
              echo "::error file=$file::Issue opener bypasses Genesis Issue Opening Manager"
              exit 1
            fi
            if grep -Eq 'gh["'"'"', ]+issue["'"'"', ]+create|POST["'"'"', ]*,?[[:space:]]*["'"'"']/issues["'"'"']' "$file"; then
              echo "::error file=$file::Producer directly creates GitHub Issues; delegate to Genesis Agentic Issue Opening Authority"
              exit 1
            fi
          done
