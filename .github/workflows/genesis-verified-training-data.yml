name: Genesis Verified Training Data
# Dataset preparation only; never trains, downloads, or activates model weights.

on:
  workflow_dispatch:
  schedule:
    - cron: '25 3 * * *'
  push:
    branches: [main]
    paths:
      - genesis/model_training_dataset.py
      - scripts/build_genesis_training_dataset.py
      - tests/test_model_training_dataset.py
      - .github/workflows/genesis-verified-training-data.yml
      - scripts/prepare_genesis_training_holdout.py
      - tests/test_training_holdout.py

permissions:
  contents: read

concurrency:
  group: genesis-verified-training-data
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate dataset builder
        if: github.event_name == 'push'
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_model_training_dataset.py tests/test_training_dataset_script.py tests/test_training_holdout.py
      - name: Prepare validated examples when evidence exists
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/model_datasets
          if [[ ! -s network/blockchain.jsonl ]]; then
            echo '{"status":"no_validation_evidence","examples":0}' > runtime/model_datasets/training_status.json
            exit 0
          fi
          python scripts/build_genesis_training_dataset.py --head HEAD --max-examples 2000 > runtime/model_datasets/training_status.json || {
            echo '{"status":"dataset_build_failed_or_no_eligible_examples","examples":0}' > runtime/model_datasets/training_status.json
            exit 1
          }
      - name: Evaluate independent training and holdout readiness
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          dataset="$(find runtime/model_datasets -maxdepth 1 -name 'genesis-validated-autonomous-*.jsonl' -type f | head -n 1)"
          if [[ -z "$dataset" ]]; then
            echo 'No qualified dataset yet; holdout not produced.'
            exit 0
          fi
          python scripts/prepare_genesis_training_holdout.py --dataset "$dataset"

      - name: Archive evidence, not model weights
        if: always() && github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: genesis-verified-training-data-${{ github.run_id }}
          path: runtime/model_datasets/
          if-no-files-found: warn
          retention-days: 14
