name: Genesis GitHub Issue Autorepair Worker

on:
  workflow_call:
    inputs:
      issue_number:
        description: Authorized GitHub issue number reserved by the dispatcher
        required: true
        type: number

permissions: {}

env:
  PYTHONPATH: ${{ github.workspace }}
  GENESIS_REPAIR_PROVIDER_URL: http://127.0.0.1:8766
  GENESIS_PROVIDER_URL: http://127.0.0.1:8766
  GENESIS_PROVIDER_NAME: genesis-adaptive-github-issue-autorepair
  GENESIS_PROVIDER_TIMEOUT_SECONDS: '300'
  GENESIS_PROVIDER_MAX_NEW_TOKENS: '512'
  GENESIS_REPAIR_FALLBACK_MODEL: ${{ vars.GENESIS_REPAIR_FALLBACK_MODEL || 'Qwen/Qwen2.5-Coder-0.5B-Instruct' }}
  GENESIS_REPAIR_ESCALATION_MODEL: ${{ vars.GENESIS_REPAIR_ESCALATION_MODEL || 'Qwen/Qwen2.5-Coder-1.5B-Instruct' }}
  GENESIS_REPAIR_ESCALATION_MAX_NEW_TOKENS: '512'
  HF_HOME: ~/.cache/huggingface
  PIP_CACHE_DIR: ~/.cache/pip

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: write
      issues: write
    concurrency:
      group: genesis-github-issue-autorepair-issue-${{ inputs.issue_number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify dispatcher reservation and current issue eligibility
        id: eligibility
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          issue_json=$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,labels)
          eligible=$(jq -r '
            (.state == "OPEN") and
            (([.labels[].name] | index("genesis-autonomous")) != null) and
            (([.labels[].name] | index("genesis-repair-in-progress")) != null) and
            (([.labels[].name] | index("genesis-validating")) == null) and
            (([.labels[].name] | index("genesis-blocked")) == null) and
            (([.labels[].name] | index("genesis-solved")) == null)
          ' <<<"$issue_json")
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
          if [[ "$eligible" != "true" ]]; then
            echo "Issue #$ISSUE_NUMBER is no longer eligible for this reserved solve slot."
          fi
      - name: Install repository dependencies
        if: steps.eligibility.outputs.eligible == 'true'
        run: pip install -r requirements.txt
      - name: Verify stable baseline
        if: steps.eligibility.outputs.eligible == 'true'
        run: python -m pytest -q
      - name: Detect trusted deterministic learned-capability route
        id: deterministic
        if: steps.eligibility.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          issue_json=$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json author,title,body)
          deterministic=$(jq -r '
            (.author.login == "github-actions[bot]") and
            (.title | startswith("[Genesis Task] new capability")) and
            (.body | contains("<!-- genesis-task-id:task-")) and
            (.body | contains("- **Task type:** `new_capability`")) and
            (.body | contains("- **Source:** `genesis.evolution_learning`")) and
            (.body | contains("- **Target:** `genesis/learned_capabilities.py`")) and
            (.body | ascii_downcase | contains("verified transferable lesson")) and
            (.body | contains("External learning evidence:"))
          ' <<<"$issue_json")
          echo "eligible=$deterministic" >> "$GITHUB_OUTPUT"
          if [[ "$deterministic" == "true" ]]; then
            echo "Trusted deterministic capability envelope detected; local repair models are not required."
          fi
      - name: Compute configured repair model cache key
        id: model_cache_key
        if: steps.eligibility.outputs.eligible == 'true' && steps.deterministic.outputs.eligible != 'true'
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import os

          models = "\0".join(
              [
                  os.environ.get("GENESIS_REPAIR_FALLBACK_MODEL", ""),
                  os.environ.get("GENESIS_REPAIR_ESCALATION_MODEL", ""),
              ]
          )
          digest = hashlib.sha256(models.encode("utf-8")).hexdigest()[:16]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"model_key={digest}\n")
          PY
      - name: Restore open-model caches
        if: steps.eligibility.outputs.eligible == 'true' && steps.deterministic.outputs.eligible != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
          key: genesis-github-issue-autorepair-${{ runner.os }}-${{ steps.model_cache_key.outputs.model_key }}-v1
          restore-keys: |
            genesis-github-issue-autorepair-${{ runner.os }}-
            genesis-coding-intelligence-${{ runner.os }}-
      - name: Install free local repair intelligence
        if: steps.eligibility.outputs.eligible == 'true' && steps.deterministic.outputs.eligible != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers>=4.51,<5' safetensors
      - name: Prefetch configured repair models
        if: steps.eligibility.outputs.eligible == 'true' && steps.deterministic.outputs.eligible != 'true'
        shell: bash
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download

          model_ids = []
          for env_name in ("GENESIS_REPAIR_FALLBACK_MODEL", "GENESIS_REPAIR_ESCALATION_MODEL"):
              model_id = os.environ.get(env_name, "").strip()
              if model_id and model_id not in model_ids:
                  model_ids.append(model_id)
          for model_id in model_ids:
              print(f"Prefetching configured issue-repair model: {model_id}", flush=True)
              snapshot_download(model_id)
          PY
      - name: Start Genesis adaptive issue-repair provider
        if: steps.eligibility.outputs.eligible == 'true' && steps.deterministic.outputs.eligible != 'true'
        shell: bash
        run: |
          set -euo pipefail
          nohup python scripts/pulse_coding_provider.py \
            --model "$GENESIS_REPAIR_FALLBACK_MODEL" \
            --escalation-model "$GENESIS_REPAIR_ESCALATION_MODEL" \
            --host 127.0.0.1 \
            --port 8766 \
            --max-new-tokens "$GENESIS_PROVIDER_MAX_NEW_TOKENS" \
            --escalation-max-new-tokens "$GENESIS_REPAIR_ESCALATION_MAX_NEW_TOKENS" \
            > /tmp/genesis-github-issue-autorepair.log 2>&1 &
          ready=false
          for i in {1..120}; do
            if python - <<'PY'
          import urllib.request
          try:
              with urllib.request.urlopen('http://127.0.0.1:8766/health', timeout=2) as response:
                  raise SystemExit(0 if response.status == 200 else 1)
          except Exception:
              raise SystemExit(1)
          PY
            then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            cat /tmp/genesis-github-issue-autorepair.log || true
            exit 1
          fi
      - name: Configure Genesis Git identity
        if: steps.eligibility.outputs.eligible == 'true'
        run: |
          git config user.name "Genesis AI"
          git config user.email "genesis-ai@users.noreply.github.com"
      - name: Let Genesis solve the reserved GitHub issue
        if: steps.eligibility.outputs.eligible == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/github_issue_autorepair.py --issue-number '${{ inputs.issue_number }}' --repository "$GITHUB_REPOSITORY"
      - name: Preserve issue repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-github-issue-autorepair-${{ inputs.issue_number }}-${{ github.run_id }}
          path: |
            runtime/github_issue_autorepair.json
            /tmp/genesis-github-issue-autorepair.log
          if-no-files-found: ignore
          retention-days: 30

      # The dispatcher reservation is intentionally not released here. It stays
      # with this issue until the serialized integration workflow has either
      # promoted, requeued, or safely declined the candidate. This prevents a
      # later run from reclaiming the same issue while this batch is unfinished.
