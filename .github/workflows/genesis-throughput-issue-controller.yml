name: Genesis Throughput Issue Controller

# Compatibility feeder only.
# Agentic Lab is the single issue scheduling, reservation, and worker-dispatch authority.
# Compatibility/manual trigger only; automatic continuity is owned by Agentic Lab + Idle Repair Watchdog.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: genesis-throughput-issue-controller
  cancel-in-progress: true

jobs:
  handoff-to-agentic-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake Agentic Lab for throughput work
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Throughput Controller is feeder-only. Agentic Lab owns queue selection, reservation, and worker dispatch."
          gh workflow run genesis-agentic-lab-recovery.yml --repo "$GITHUB_REPOSITORY" --ref main
