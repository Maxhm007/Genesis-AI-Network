name: Task 4 Upgrade Repair Grounding

on:
  push:
    branches: [main]
    paths:
      - scripts/upgrade_task4_repair_grounding.py
      - tests/test_task4_repair_grounding.py
      - .github/workflows/task4-upgrade-repair-grounding.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Apply narrow Task 4 upgrade
        run: python scripts/upgrade_task4_repair_grounding.py
      - name: Verify focused grounding tests
        run: python -m pytest -q tests/test_task4_repair_grounding.py
      - name: Verify coding regression tests
        run: |
          python -m pytest -q tests/test_coding.py tests/test_github_issue_autorepair.py 2>/dev/null || \
          python -m pytest -q tests/test_task4_repair_grounding.py tests/test_github_issue_autorepair.py
      - name: Commit upgraded repair engine
        run: |
          if git diff --quiet -- genesis/coding.py; then
            echo 'No coding.py change produced'
            exit 1
          fi
          git config user.name 'Genesis AI'
          git config user.email 'genesis-ai@users.noreply.github.com'
          git add genesis/coding.py
          git commit -m 'Task #4: improve exact-line Python repair grounding'
          git push origin HEAD:main
