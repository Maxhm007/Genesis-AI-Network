name: Genesis Specialist Issue Controller

# Compatibility feeder only.
# Agentic Lab owns specialist classification, reservation, and worker dispatch.
on:
  workflow_dispatch:
  schedule:
    - cron: '5,15,25,35,45,55 * * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/genesis-specialist-issue-controller.yml
      - .github/workflows/genesis-specialist-repair-worker-v2.yml
      - scripts/agentic_lab_recovery_dispatch.py
      - scripts/agentic_parallel_dispatch.py

permissions:
  contents: read
  actions: write

concurrency:
  group: genesis-specialist-issue-controller
  cancel-in-progress: true

jobs:
  handoff-to-agentic-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake Agentic Lab for specialist work
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Specialist Issue Controller is feeder-only. Agentic Lab chooses specialist workers."
          gh workflow run genesis-agentic-lab-recovery.yml --repo "$GITHUB_REPOSITORY" --ref main
