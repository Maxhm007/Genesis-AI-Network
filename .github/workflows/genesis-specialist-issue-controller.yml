name: Genesis Specialist Issue Controller

on:
  workflow_dispatch:
  schedule:
    - cron: '5,15,25,35,45,55 * * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/genesis-specialist-issue-controller.yml
      - .github/workflows/genesis-specialist-repair-worker.yml
      - genesis/github_issue_capability_builder.py
      - scripts/requeue_exhausted_issues.py

permissions:
  contents: read
  issues: write
  actions: write

# Share the exact queue lock with the ordinary Sequential Issue Controller.
# This prevents the specialist lane from claiming work while the generic lane
# is selecting/reserving an Issue.
concurrency:
  group: genesis-sequential-issue-controller
  cancel-in-progress: false

jobs:
  route-one-specialist-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Classify specialist work and route one safe system-script Issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          ensure_label() {
            gh label create "$1" --repo "$GITHUB_REPOSITORY" --color "$2" --description "$3" --force >/dev/null
          }

          ensure_label genesis-repair-in-progress b60205 'Reserved for one bounded Genesis repair worker'
          ensure_label genesis-autonomous 1f883d 'Authorized for Genesis autonomous repair'
          ensure_label genesis-specialist 5319e7 'Requires a bounded specialist repair lane'
          ensure_label genesis-needs-routing d4c5f9 'Actionable Genesis work awaiting deterministic specialist decomposition/routing'
          ensure_label genesis-blocked d73a4a 'Genesis exhausted bounded attempts or requires an unavailable dependency'

          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=open&sort=created&direction=asc&per_page=100" --jq '.[]' | jq -s '.' > /tmp/genesis-specialist-open.json

          # Actionable work without a deterministic single-file target must never
          # disappear silently from queue inspection. Classify it once, without
          # pretending that the ordinary package-code lane can safely solve it.
          python - <<'PY' > /tmp/genesis-needs-routing.txt
          import json
          import re
          from pathlib import Path

          issues = json.loads(Path('/tmp/genesis-specialist-open.json').read_text())
          target_re = re.compile(r'^- \*\*Target:\*\* `([^`]+)`', re.MULTILINE)
          task_type_re = re.compile(r'^- \*\*Task type:\*\* `([^`]+)`', re.MULTILINE)
          actionable_prefixes = ('[Genesis Task]', '[Genesis Repair]', '[Genesis Self Improvement]')
          excluded_labels = {
              'genesis-persistent', 'genesis-control', 'duplicate', 'invalid', 'wontfix',
              'genesis-solver-exhausted', 'genesis-deferred', 'genesis-superseded',
          }

          for issue in issues:
              if issue.get('pull_request'):
                  continue
              number = int(issue.get('number') or 0)
              if number <= 1:
                  continue
              title = str(issue.get('title') or '').strip()
              body = str(issue.get('body') or '')
              lower_title = title.lower()
              lower_body = body.lower()
              labels = {str(row.get('name') or '') for row in issue.get('labels') or [] if isinstance(row, dict)}

              if not title.startswith(actionable_prefixes):
                  continue
              if labels & excluded_labels:
                  continue
              if 'genesis-needs-routing' in labels:
                  continue
              if target_re.search(body):
                  continue
              if lower_title.startswith(('[genesis escalation]', '[genesis ops]')):
                  continue
              if lower_title.startswith(('genesis chat:', '[genesis hourly report]', '[genesis gene chat]')):
                  continue
              if 'persistent github-native reporting channel' in lower_body:
                  continue

              task_type_match = task_type_re.search(body)
              task_type = task_type_match.group(1).strip() if task_type_match else ''
              if task_type == 'application_development':
                  reason = 'application_development_requires_application_lane'
              elif '.github/workflows/' in body:
                  reason = 'workflow_control_plane_requires_privileged_decomposition'
              elif 'gene lifecycle' in lower_title or 'genesis/gene_lifecycle.py' in body:
                  reason = 'multi_file_or_new_file_gene_lifecycle_requires_decomposition'
              else:
                  reason = 'missing_deterministic_single_target_requires_decomposition'
              print(f'{number}|{reason}')
          PY

          while IFS='|' read -r issue_number reason; do
            [[ -z "$issue_number" ]] && continue
            gh issue edit "$issue_number" --repo "$GITHUB_REPOSITORY" \
              --add-label genesis-specialist --add-label genesis-needs-routing >/dev/null
            gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" \
              --body "<!-- genesis-specialist-routing -->\nGenesis specialist routing classified this actionable Issue as \`${reason}\`. It is intentionally not sent through the ordinary single-file \`genesis/*.py\` repair lane and is not being closed without completion evidence. A specialist/decomposition path is required. Controller run: ${GITHUB_RUN_ID}." >/dev/null
            echo "Classified Issue #${issue_number} for specialist routing: ${reason}."
          done < /tmp/genesis-needs-routing.txt

          # A reservation from either lane owns the whole queue. Strictly preserve
          # one active repair/validation operation at a time. Classification above
          # is metadata-only and may still run while another repair is active.
          active_count=$(jq '[.[] | select(.pull_request == null) | select([.labels[].name] | any(. == "genesis-repair-in-progress" or . == "genesis-validating"))] | length' /tmp/genesis-specialist-open.json)
          if [[ "$active_count" -gt 0 ]]; then
            echo "Another Genesis repair/validation reservation is active (${active_count}); specialist repair lane will not start additional work."
            exit 0
          fi

          issue_number=$(python - <<'PY'
          import json
          import re
          from pathlib import Path

          issues = json.loads(Path('/tmp/genesis-specialist-open.json').read_text())
          target_re = re.compile(r'^- \*\*Target:\*\* `([^`]+)`', re.MULTILINE)
          active = {
              'genesis-claimed', 'genesis-working', 'genesis-verifying',
              'genesis-repair-in-progress', 'genesis-validating', 'genesis-priority-claim',
          }
          terminal = {'genesis-solver-exhausted', 'genesis-deferred', 'genesis-superseded'}
          protected_scripts = {
              'scripts/secret_guard.py',
              'scripts/privileged_change_gate.py',
              'scripts/verify_validator_votes.py',
              'scripts/action_repair_guard.py',
              'scripts/issue_acceptance_guard.py',
          }

          for issue in issues:
              if issue.get('pull_request'):
                  continue
              number = int(issue.get('number') or 0)
              if number <= 1:
                  continue
              labels = {str(row.get('name') or '') for row in issue.get('labels') or [] if isinstance(row, dict)}
              if labels & (active | terminal):
                  continue
              body = str(issue.get('body') or '')
              match = target_re.search(body)
              target = match.group(1).strip().replace('\\', '/') if match else ''
              if not target.startswith('scripts/') or not target.endswith('.py'):
                  continue
              if '..' in Path(target).parts or target in protected_scripts:
                  continue
              if not Path(target).is_file():
                  continue
              print(number)
              break
          PY
          )

          if [[ -z "$issue_number" ]]; then
            echo 'No safe system-script Issue is currently eligible for the specialist repair lane.'
            exit 0
          fi

          issue_json=$(gh issue view "$issue_number" --repo "$GITHUB_REPOSITORY" --json state,labels,body,title)
          state=$(jq -r '.state' <<<"$issue_json")
          if [[ "$state" != "OPEN" ]]; then
            exit 0
          fi

          # Claim using the same shared reservation label observed by the generic controller.
          gh issue edit "$issue_number" --repo "$GITHUB_REPOSITORY" \
            --add-label genesis-repair-in-progress \
            --add-label genesis-autonomous \
            --add-label genesis-specialist >/dev/null

          if gh workflow run genesis-specialist-repair-worker.yml \
            --repo "$GITHUB_REPOSITORY" --ref main -f issue_number="$issue_number"; then
            gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" \
              --body "Genesis Specialist Issue Controller reserved this bounded system-script repair and dispatched the privileged specialist worker. Controller run: ${GITHUB_RUN_ID}. Normal sandbox permissions were not widened."
            echo "Dispatched specialist worker for Issue #${issue_number}."
          else
            gh issue edit "$issue_number" --repo "$GITHUB_REPOSITORY" --remove-label genesis-repair-in-progress >/dev/null 2>&1 || true
            gh issue edit "$issue_number" --repo "$GITHUB_REPOSITORY" --add-label genesis-blocked >/dev/null 2>&1 || true
            gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" \
              --body "Genesis Specialist Issue Controller could not dispatch the bounded specialist worker. The reservation was released without changing code. Controller run: ${GITHUB_RUN_ID}."
            exit 1
          fi
