name: Genesis Desktop Windows Release

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'scripts/desktop_core.py'
      - '.github/workflows/desktop-windows-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: genesis-desktop-windows-release
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build standalone Genesis Core sidecar
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --clean --onefile --name genesis-core --paths . `
            --add-data "GENESIS_CONSTITUTION.md;." `
            --add-data "GENESIS_BLOCK.json;." `
            --add-data "config;config" `
            --add-data "web;web" `
            --add-data "genesis;genesis" `
            scripts/desktop_core.py
          New-Item -ItemType Directory -Force desktop/src-tauri/binaries | Out-Null
          Copy-Item dist/genesis-core.exe desktop/src-tauri/binaries/genesis-core-x86_64-pc-windows-msvc.exe

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        working-directory: desktop
        run: npm install

      - name: Build Genesis Desktop installer
        working-directory: desktop
        run: npm run tauri build

      - name: Prepare release assets
        id: assets
        shell: pwsh
        run: |
          $source = Get-ChildItem 'desktop/src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $source) { throw 'NSIS installer was not produced' }
          $tag = "v0.2.0-desktop-alpha.${{ github.run_number }}"
          $name = "Genesis-AI-Setup-$tag.exe"
          New-Item -ItemType Directory -Force desktop-release | Out-Null
          Copy-Item $source.FullName "desktop-release/$name"
          $hash = (Get-FileHash "desktop-release/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Set-Content "desktop-release/$name.sha256"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "name=$name" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: genesis-desktop-windows-${{ github.run_number }}
          path: desktop-release/
          retention-days: 30

      - name: Publish GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.assets.outputs.tag }}'
          $title = "Genesis AI Desktop $tag"
          gh release create $tag `
            --repo '${{ github.repository }}' `
            --target '${{ github.sha }}' `
            --title $title `
            --prerelease `
            --notes "First Windows desktop alpha with bundled local Genesis Core, Memory/Coding/Security/Research dashboard, GDEN status, and background release checks. Secure unattended auto-install remains disabled until a persistent Tauri updater signing key is configured." `
            "desktop-release/${{ steps.assets.outputs.name }}" `
            "desktop-release/${{ steps.assets.outputs.name }}.sha256"
