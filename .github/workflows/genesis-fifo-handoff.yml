name: Genesis FIFO Handoff

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Genesis Bounded Repair Worker
      - Genesis Sequential Issue Controller
    types:
      - completed
  push:
    branches: [main]
    paths:
      - .github/workflows/genesis-fifo-handoff.yml

permissions:
  contents: read
  issues: read
  actions: write

concurrency:
  group: genesis-fifo-handoff
  cancel-in-progress: false

jobs:
  wake-next-fifo-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake authoritative FIFO lane
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
        shell: bash
        run: |
          set -euo pipefail
          echo "FIFO handoff event: ${GITHUB_EVENT_NAME}; source: ${SOURCE_WORKFLOW:-manual_or_push}"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" && "${SOURCE_WORKFLOW}" == "Genesis Sequential Issue Controller" ]]; then
            gh workflow run genesis-agentic-lab-recovery.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main
            echo 'Agentic Lab recovery dispatched after Sequential Controller completion.'
          else
            gh workflow run genesis-sequential-issue-controller.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main
            echo 'Sequential FIFO controller dispatched.'
          fi

# This workflow only removes idle gaps between the existing authoritative lanes.
# Bounded Repair Worker completion wakes the Sequential Controller.
# Sequential Controller completion wakes Agentic Lab so handed-off issues do not sit idle.
# Existing controllers still enforce one-active-repair locking, FIFO selection,
# protected targets, validation, promotion, and issue-backed authority.
