name: Genesis FIFO Handoff

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Genesis Bounded Repair Worker
      - Genesis Agentic Strategy Worker
    types:
      - completed
  push:
    branches: [main]
    paths:
      - .github/workflows/genesis-fifo-handoff.yml

permissions:
  contents: read
  issues: read
  actions: write

concurrency:
  group: genesis-fifo-handoff
  cancel-in-progress: false

jobs:
  wake-genesis-repair-lanes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake Sequential Controller and Agentic Lab
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Genesis handoff event: ${GITHUB_EVENT_NAME}"

          gh workflow run genesis-sequential-issue-controller.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
          echo 'Sequential FIFO controller dispatched.'

          gh workflow run genesis-agentic-lab-recovery.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
          echo 'Agentic Lab recovery dispatched.'

# This workflow does not select, repair, validate, promote, or close issues.
# It only keeps the two authoritative repair lanes awake after bounded or
# Agentic workers finish. The existing controllers still enforce FIFO,
# one-active-repair locking, safe-target rules, validation, promotion,
# protected-file boundaries, and issue-backed authority.
