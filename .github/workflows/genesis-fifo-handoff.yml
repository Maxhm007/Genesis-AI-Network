name: Genesis FIFO Handoff

on:
  workflow_dispatch:
  schedule:
    # Independent watchdog: if no worker completion event fires, periodically
    # wake the authoritative Agentic controller so an idle backlog cannot stall.
    - cron: '2,12,22,32,42,52 * * * *'
  workflow_run:
    workflows:
      - Genesis Bounded Repair Worker
      - Genesis Agentic Strategy Worker
      - Genesis DeepSeek Agentic Solver
      - Genesis Action Repair Worker
    types:
      - completed
  push:
    branches: [main]
    paths:
      - .github/workflows/genesis-fifo-handoff.yml

permissions:
  contents: read
  issues: read
  actions: write

concurrency:
  group: genesis-fifo-handoff
  cancel-in-progress: false

jobs:
  wake-genesis-repair-lanes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake Agentic Lab
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Genesis handoff event: ${GITHUB_EVENT_NAME}"

          active_count="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow genesis-agentic-lab-recovery.yml \
            --limit 20 \
            --json status,createdAt,event \
            --jq '[.[] | select(.event != "push" and .event != "pull_request") | select(.status != "completed" or (now - (.createdAt | fromdateiso8601)) < 120)] | length')"

          if [[ "$active_count" -gt 0 ]]; then
            echo "Agentic Lab Recovery already active or woken <2 min ago ($active_count run(s)); duplicate wake skipped."
            exit 0
          fi

          gh workflow run genesis-agentic-lab-recovery.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
          echo 'Agentic Lab recovery dispatched.'

# This workflow does not select, repair, validate, promote, or close issues.
# It only wakes the single authoritative Agentic Lab control plane after workers finish.
# Agentic Lab owns scheduling/claim authority; workers and validators keep their existing bounded roles.
