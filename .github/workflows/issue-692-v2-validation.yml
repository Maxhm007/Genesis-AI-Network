name: Issue 692 V2 Validation

on:
  push:
    branches:
      - genesis/fix-solver-lifecycle-leaks-692-v2
    paths:
      - scripts/issue_692_v2_apply.py
      - .github/workflows/issue-692-v2-validation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: genesis/fix-solver-lifecycle-leaks-692-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply current-state lifecycle patch
        run: python scripts/issue_692_v2_apply.py
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Focused lifecycle tests
        run: >-
          python -m pytest -q
          tests/test_github_issue_cleanup.py
          tests/test_requeue_exhausted_issues.py
          tests/test_solver_terminal_policy.py
          tests/test_github_issue_autorepair_workflow.py
      - name: Full repository tests
        run: python -m pytest -q
      - name: Commit tested non-workflow changes and stage exact tested workflows
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/genesis-bounded-repair-worker.yml scripts/staged_issue_692_bounded_repair_worker.yml
          cp .github/workflows/genesis-exhausted-issue-requeue.yml scripts/staged_issue_692_exhausted_issue_requeue.yml
          git restore .github/workflows/genesis-bounded-repair-worker.yml
          git restore .github/workflows/genesis-exhausted-issue-requeue.yml
          git config user.name 'Genesis Validation'
          git config user.email 'genesis-validation@users.noreply.github.com'
          git add \
            genesis/github_issue_cleanup.py \
            scripts/requeue_exhausted_issues.py \
            tests/test_github_issue_cleanup.py \
            tests/test_requeue_exhausted_issues.py \
            tests/test_solver_terminal_policy.py \
            scripts/staged_issue_692_bounded_repair_worker.yml \
            scripts/staged_issue_692_exhausted_issue_requeue.yml
          if git diff --cached --quiet; then
            echo 'No staged permanent changes; already prepared.'
            exit 0
          fi
          git commit -m 'Implement issue 692 solver lifecycle policy'
          git push origin HEAD:genesis/fix-solver-lifecycle-leaks-692-v2
