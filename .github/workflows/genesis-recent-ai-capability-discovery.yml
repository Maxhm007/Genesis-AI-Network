name: Genesis Recent AI Capability Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/genesis-recent-ai-capability-discovery.yml
      - scripts/discover_recent_ai_capability.py
      - tests/test_recent_ai_capability_discovery.py
      - tests/test_issue_discovery_workflows.py

permissions:
  contents: read
  issues: write

concurrency:
  group: genesis-recent-ai-capability-discovery
  cancel-in-progress: true

jobs:
  discover-and-create-one-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install discovery test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Verify discovery contract
        run: python -m pytest -q tests/test_recent_ai_capability_discovery.py tests/test_issue_discovery_workflows.py

      - name: Ensure discovery labels idempotently
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh label create genesis-task \
            --repo "$GITHUB_REPOSITORY" \
            --color 0e8a16 \
            --description 'Authoritative GitHub Issue backing for Genesis autonomous tasks' \
            --force
          gh label create genesis-capability-discovery \
            --repo "$GITHUB_REPOSITORY" \
            --color 5319e7 \
            --description 'Created by the independent recent AI capability discovery task' \
            --force

      - name: Discover one recent required AI capability
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

          # One bounded discovery cycle per workflow run. GitHub's native
          # schedule starts the next cycle 30 minutes later, so this runner
          # never sleeps or recursively starts another workflow run.
          python scripts/discover_recent_ai_capability.py
