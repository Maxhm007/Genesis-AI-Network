name: Genesis Recent AI Capability Discovery

# Discovery producer only; Genesis Issue Opening Manager owns automatic scheduling.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  actions: write

concurrency:
  group: genesis-recent-ai-capability-discovery
  cancel-in-progress: true

jobs:
  discover-and-create-one-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install discovery test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Verify discovery contract
        run: python -m pytest -q tests/test_recent_ai_capability_discovery.py tests/test_issue_discovery_workflows.py

      - name: Discover one recent required AI capability
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

          # One bounded discovery cycle per workflow run. GitHub's native
          # schedule starts the next cycle 30 minutes later, so this runner
          # never sleeps or recursively starts another workflow run.
          python scripts/discover_recent_ai_capability.py
