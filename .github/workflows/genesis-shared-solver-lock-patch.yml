name: Genesis Shared Solver Lock Patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/genesis-shared-solver-lock-patch.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply minimal shared-lock hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/genesis-oldest-issue-solver.yml')
          text = path.read_text()
          old = "if labels & {'genesis-claimed', 'genesis-working', 'genesis-verifying', 'genesis-repair-in-progress'}:"
          new = "if labels & {'genesis-claimed', 'genesis-working', 'genesis-verifying', 'genesis-repair-in-progress', 'genesis-validating', 'genesis-priority-claim'}:"
          if old not in text:
              raise SystemExit('oldest solver active-label selection anchor not found')
          text = text.replace(old, new, 1)
          anchor = '              claimed_body='
          if text.count(anchor) != 1:
              raise SystemExit(f'expected exactly one claimed_body anchor, found {text.count(anchor)}')
          guard = '''              # Cross-solver race guard: either solver may work this issue later,
              # but only one may own it now. Priority backs off on oldest's temporary
              # labels; oldest backs off if priority already reached the shared reservation.
              sleep 3
              refreshed=$(gh issue view "$issue_number" --repo "$GITHUB_REPOSITORY" --json state,labels)
              state=$(printf '%s' "$refreshed" | jq -r '.state')
              shared_owner=$(printf '%s' "$refreshed" | jq -r '([.labels[].name] | any(. == "genesis-repair-in-progress" or . == "genesis-validating"))')
              if [[ "$state" != "OPEN" || "$shared_owner" == "true" ]]; then
                echo "Oldest solver backed off #$issue_number because another solver already owns the shared reservation"
                clear_active_labels "$issue_number"
                if [ "$cycle" -lt "$max_cycles" ]; then
                  echo "Next eligible issue check in $interval seconds"
                  sleep "$interval"
                fi
                continue
              fi

'''
          path.write_text(text.replace(anchor, guard + anchor, 1))
          Path('tests/test_dual_solver_issue_lock.py').write_text('''from pathlib import Path\n\ndef test_dual_solvers_share_one_temporary_issue_lock():\n    oldest = Path(".github/workflows/genesis-oldest-issue-solver.yml").read_text()\n    priority = Path(".github/workflows/genesis-priority-issue-solver.yml").read_text()\n    worker = Path(".github/workflows/genesis-bounded-repair-worker.yml").read_text()\n    assert "group: genesis-bounded-repair-${{ inputs.issue_number }}" in worker\n    assert "cancel-in-progress: false" in worker\n    assert "'genesis-priority-claim'" in oldest\n    assert "'genesis-validating'" in oldest\n    assert "shared_owner=" in oldest\n    assert "another solver already owns the shared reservation" in oldest\n    for label in ("genesis-claimed", "genesis-working", "genesis-verifying", "genesis-repair-in-progress", "genesis-validating"):\n        assert label in priority\n    assert "Priority solver backed off" in priority\n    assert "genesis-solver-exhausted" in oldest\n    assert "genesis-priority-exhausted" in priority\n''')
          PY
      - name: Install contract-test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run shared-lock contract test
        run: python -m pytest -q tests/test_dual_solver_issue_lock.py
      - name: Stage verified commit object for authorized promotion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Genesis Safety Patch"
          git config user.email "genesis-safety@users.noreply.github.com"
          rm .github/workflows/genesis-shared-solver-lock-patch.yml
          git add .github/workflows/genesis-oldest-issue-solver.yml tests/test_dual_solver_issue_lock.py .github/workflows/genesis-shared-solver-lock-patch.yml
          git commit -m "Enforce shared issue lock across dual solvers"
          git fetch origin main
          git rebase origin/main
          echo "PATCH_PARENT=$(git rev-parse HEAD^)"
          echo "PATCH_COMMIT=$(git rev-parse HEAD)"
          echo "PATCH_TREE=$(git rev-parse HEAD^{tree})"
          # Expected to be rejected because the Actions token cannot update workflow files.
          # The attempted push uploads the tested Git objects without moving main.
          git push origin HEAD:refs/heads/genesis/shared-lock-staged || true
