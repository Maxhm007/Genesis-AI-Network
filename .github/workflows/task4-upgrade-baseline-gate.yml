name: Task 4 Upgrade Baseline Gate

on:
  push:
    branches: [main]
    paths:
      - scripts/upgrade_task4_baseline_gate.py
      - .github/workflows/task4-upgrade-baseline-gate.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply narrow baseline gate upgrade
        run: python scripts/upgrade_task4_baseline_gate.py
      - name: Validate workflow YAML
        run: |
          python -m pip install --disable-pip-version-check pyyaml
          python - <<'PY'
          import yaml
          from pathlib import Path
          path = Path('.github/workflows/genesis-bounded-repair-worker.yml')
          yaml.safe_load(path.read_text(encoding='utf-8'))
          print('workflow yaml parsed')
          PY
      - name: Verify scoped gate is present
        run: |
          grep -Fq 'Verify clean or issue-scoped failing baseline' .github/workflows/genesis-bounded-repair-worker.yml
          grep -Fq 'Accepted issue-scoped failing baseline' .github/workflows/genesis-bounded-repair-worker.yml
      - name: Commit production gate upgrade
        run: |
          set -euo pipefail
          git config user.name 'Genesis AI'
          git config user.email 'genesis-ai@users.noreply.github.com'
          git add .github/workflows/genesis-bounded-repair-worker.yml
          git commit -m 'Task #4: allow isolated target-test failures into repair'
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep 2
          done
          echo 'Failed to publish baseline gate upgrade after bounded rebase retries' >&2
          exit 1
