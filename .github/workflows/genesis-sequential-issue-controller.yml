name: Genesis Sequential Issue Controller

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/genesis-sequential-issue-controller.yml

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: genesis-sequential-issue-controller
  cancel-in-progress: false

jobs:
  one-issue-closed-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Recover queue and process exactly one issue
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GENESIS_EXHAUSTED_REQUEUE_LIMIT: '5'
        shell: bash
        run: |
          set -euo pipefail

          marker='<!-- genesis-oldest-real-issue-solver -->'
          max_attempts=3
          stale_minutes=135
          stale_cutoff=$(date -u -d "${stale_minutes} minutes ago" '+%Y-%m-%dT%H:%M:%SZ')

          gh_retry() {
            local attempt=1
            local max_tries=3
            local delay
            while true; do
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -ge "$max_tries" ]; then
                echo "GitHub command failed after ${max_tries} attempts: $*" >&2
                return 1
              fi
              delay=$((attempt * 2))
              echo "Transient GitHub command failure (attempt ${attempt}/${max_tries}); retrying in ${delay}s: $*" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
            done
          }

          ensure_label() {
            local name="$1"
            local color="$2"
            local description="$3"
            if ! gh_retry gh label create "$name" --repo "$GITHUB_REPOSITORY" \
              --color "$color" --description "$description" --force >/dev/null; then
              echo "Warning: unable to ensure label '${name}' after retries; continuing because it may already exist." >&2
            fi
          }

          add_label() {
            gh_retry gh issue edit "$1" --repo "$GITHUB_REPOSITORY" --add-label "$2" >/dev/null
          }

          remove_label() {
            gh_retry gh issue edit "$1" --repo "$GITHUB_REPOSITORY" --remove-label "$2" >/dev/null 2>&1 || true
          }

          clear_transient_labels() {
            local issue_number="$1"
            for label in genesis-claimed genesis-working genesis-verifying genesis-priority-claim; do
              remove_label "$issue_number" "$label"
            done
          }

          clear_reservation_labels() {
            local issue_number="$1"
            clear_transient_labels "$issue_number"
            remove_label "$issue_number" genesis-repair-in-progress
            remove_label "$issue_number" genesis-validating
          }

          upsert_status() {
            local issue_number="$1"
            local body="$2"
            local comment_id
            comment_id=$(gh_retry gh api "repos/${GITHUB_REPOSITORY}/issues/${issue_number}/comments?per_page=100" \
              | jq -r --arg marker "$marker" '[.[] | select((.body // "") | startswith($marker))][0].id // empty')
            if [ -n "$comment_id" ]; then
              gh_retry gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
                --method PATCH -f body="$body" >/dev/null
            else
              gh_retry gh api "repos/${GITHUB_REPOSITORY}/issues/${issue_number}/comments" \
                --method POST -f body="$body" >/dev/null
            fi
          }

          get_previous_attempt() {
            local issue_number="$1"
            gh_retry gh api "repos/${GITHUB_REPOSITORY}/issues/${issue_number}/comments?per_page=100" \
              | jq -r --arg marker "$marker" \
                '[.[] | select((.body // "") | startswith($marker))][0].body // ""' \
              | sed -nE 's/.*genesis-solver-attempt:([0-9]+).*/\1/p' \
              | head -n1
          }

          mark_retry_or_blocked() {
            local issue_number="$1"
            local title="$2"
            local checked_at="$3"
            local attempt="$4"
            local result="$5"

            clear_reservation_labels "$issue_number"
            if [ "$attempt" -ge "$max_attempts" ]; then
              add_label "$issue_number" genesis-blocked
              add_label "$issue_number" genesis-solver-exhausted
              add_label "$issue_number" agentic-lab
              add_label "$issue_number" genesis-agentic-escalated
              remove_label "$issue_number" genesis-deferred
              remove_label "$issue_number" genesis-autonomous
              status_body=$(printf '%s\n<!-- genesis-solver-attempt:%s -->\n**Genesis Sequential Issue Controller — bounded attempt exhausted**\n\n- Issue: #%s — %s\n- Last check (UTC): %s\n- Controller run: %s\n- Attempt: **%s/%s**\n- Result: **%s**\n- State: **OPEN; escalated to Agentic Lab**\n\nThe current bounded repair generation exhausted its safe attempts without verified completion. The same Issue remains open and authoritative; only a verified promoted solution may close it.' \
                "$marker" "$attempt" "$issue_number" "$title" "$checked_at" "$GITHUB_RUN_ID" "$attempt" "$max_attempts" "$result")
            else
              add_label "$issue_number" genesis-autonomous
              status_body=$(printf '%s\n<!-- genesis-solver-attempt:%s -->\n**Genesis Sequential Issue Controller — retry available**\n\n- Issue: #%s — %s\n- Last check (UTC): %s\n- Controller run: %s\n- Attempt: **%s/%s**\n- Result: **%s**\n- State: **open; eligible for the next bounded controller pass**\n\nThe controller will not close this issue without verified completion evidence.' \
                "$marker" "$attempt" "$issue_number" "$title" "$checked_at" "$GITHUB_RUN_ID" "$attempt" "$max_attempts" "$result")
            fi
            upsert_status "$issue_number" "$status_body"
          }

          ensure_label genesis-claimed 1f6feb 'Claimed by the Genesis Issue Solver'
          ensure_label genesis-working fbca04 'Genesis Issue Solver is actively working this issue'
          ensure_label genesis-verifying 8250df 'Genesis is verifying completion evidence'
          ensure_label genesis-repair-in-progress b60205 'Reserved for one bounded Genesis repair worker'
          ensure_label genesis-blocked d73a4a 'Genesis exhausted bounded attempts or requires an unavailable dependency'
          ensure_label genesis-solver-exhausted 6e7781 'Genesis Issue Solver exhausted its bounded attempts and moved on'
          ensure_label genesis-verified 0e8a16 'Genesis verified the issue completion condition before closure'
          ensure_label genesis-autonomous 1f883d 'Authorized for Genesis autonomous repair'
          ensure_label agentic-lab 8250df 'Normal bounded solver exhausted; Agentic Lab recovery owns this Issue'
          ensure_label genesis-agentic-escalated 8250df 'Solver exhausted; same authoritative Issue remains open with Agentic Lab'
          ensure_label genesis-deferred 8c959f 'Legacy deferred-state label; unsolved Issues remain open under Agentic Lab'
          ensure_label genesis-architecture-route 6f42c1 'Architecture/control-plane issue routed to Agentic Lab'

          echo 'Stopping legacy long-running dispatch loops so this controller is the single queue scheduler.'
          for workflow in genesis-oldest-issue-solver.yml genesis-priority-issue-solver.yml; do
            if runs_json=$(gh_retry gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?status=in_progress&per_page=100"); then
              printf '%s' "$runs_json" \
                | jq -r '.workflow_runs[].id' \
                | while read -r run_id; do
                    [ -z "$run_id" ] && continue
                    gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
                    echo "Cancelled legacy scheduler run ${run_id} (${workflow})."
                  done
            else
              echo "Warning: could not inspect legacy workflow ${workflow}; continuing." >&2
            fi
          done

          echo "Cancelling bounded workers older than ${stale_minutes} minutes."
          if worker_runs=$(gh_retry gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/genesis-bounded-repair-worker.yml/runs?status=in_progress&per_page=100"); then
            printf '%s' "$worker_runs" \
              | jq -r --arg cutoff "$stale_cutoff" '.workflow_runs[] | select(.created_at < $cutoff) | .id' \
              | while read -r run_id; do
                  [ -z "$run_id" ] && continue
                  gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
                  echo "Cancelled stale bounded worker run ${run_id}."
                done
          else
            echo 'Warning: could not inspect bounded worker runs; continuing.' >&2
          fi

          gh_retry gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=open&sort=created&direction=asc&per_page=100" --jq '.[]' | jq -s '.' > /tmp/genesis-controller-open.json

          python - "$stale_cutoff" <<'PY' > /tmp/genesis-stale-issues.txt
          import json
          import sys
          from datetime import datetime
          from pathlib import Path

          cutoff = datetime.fromisoformat(sys.argv[1].replace('Z', '+00:00'))
          active = {'genesis-repair-in-progress', 'genesis-validating'}
          issues = json.loads(Path('/tmp/genesis-controller-open.json').read_text())
          for issue in issues:
              if issue.get('pull_request'):
                  continue
              labels = {str(row.get('name') or '') for row in issue.get('labels') or [] if isinstance(row, dict)}
              if not labels & active:
                  continue
              updated_raw = str(issue.get('updated_at') or '')
              try:
                  updated = datetime.fromisoformat(updated_raw.replace('Z', '+00:00'))
              except ValueError:
                  continue
              if updated < cutoff:
                  print(int(issue.get('number') or 0))
          PY

          while read -r issue_number; do
            [ -z "$issue_number" ] && continue
            clear_reservation_labels "$issue_number"
            add_label "$issue_number" genesis-autonomous
            gh_retry gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" \
              --body "Genesis Sequential Issue Controller recovered a stale repair reservation older than ${stale_minutes} minutes. No issue was closed and no verification rule was bypassed. Controller run: ${GITHUB_RUN_ID}." >/dev/null
            echo "Recovered stale reservation on issue #${issue_number}."
          done < /tmp/genesis-stale-issues.txt

          gh_retry gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=open&sort=created&direction=asc&per_page=100" --jq '.[]' | jq -s '.' > /tmp/genesis-controller-open.json
          python - <<'PY' > /tmp/genesis-transient-only.txt
          import json
          from pathlib import Path

          issues = json.loads(Path('/tmp/genesis-controller-open.json').read_text())
          transient = {'genesis-claimed', 'genesis-working', 'genesis-verifying', 'genesis-priority-claim'}
          reserved = {'genesis-repair-in-progress', 'genesis-validating'}
          for issue in issues:
              if issue.get('pull_request'):
                  continue
              labels = {str(row.get('name') or '') for row in issue.get('labels') or [] if isinstance(row, dict)}
              if labels & transient and not labels & reserved:
                  print(int(issue.get('number') or 0))
          PY
          while read -r issue_number; do
            [ -z "$issue_number" ] && continue
            clear_transient_labels "$issue_number"
          done < /tmp/genesis-transient-only.txt

          echo 'Routing and terminally reconciling every open Issue class before selection.'
          if ! python -m genesis.github_issue_cleanup; then
            echo 'Issue lifecycle preflight reported a partial result; continuing with safely routable work.' >&2
          fi

          echo 'Safely releasing exhausted issues only when the repair-engine generation changed.'
          if ! python scripts/requeue_exhausted_issues.py; then
            echo 'Exhausted-issue generation requeue failed; continuing with the currently eligible queue.' >&2
          fi

          gh_retry gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=open&sort=created&direction=asc&per_page=100" --jq '.[]' | jq -s '.' > /tmp/genesis-controller-open.json

          active_count=$(python - <<'PY'
          import json
          from pathlib import Path
          issues = json.loads(Path('/tmp/genesis-controller-open.json').read_text())
          active = {'genesis-repair-in-progress', 'genesis-validating'}
          count = 0
          for issue in issues:
              if issue.get('pull_request'):
                  continue
              labels = {str(row.get('name') or '') for row in issue.get('labels') or [] if isinstance(row, dict)}
              if labels & active:
                  count += 1
          print(count)
          PY
          )
          if [ "$active_count" -gt 0 ]; then
            echo "A bounded repair/validation reservation is active (${active_count}); strict sequential mode will not start another issue."
            exit 0
          fi

          selection_json=$(python scripts/sequential_issue_selector.py < /tmp/genesis-controller-open.json)
          printf '%s\n' "$selection_json" > /tmp/genesis-issue-selection.json
          issue_number=$(jq -r '.selected.number // empty' /tmp/genesis-issue-selection.json)
          selected_score=$(jq -r '.selected.score // empty' /tmp/genesis-issue-selection.json)
          selected_kind=$(jq -r '.selected.kind // empty' /tmp/genesis-issue-selection.json)
          selected_breakdown=$(jq -c '.selected.breakdown // {}' /tmp/genesis-issue-selection.json)

          if [ -n "$issue_number" ]; then
            echo "Selected issue #${issue_number} via value scoring: score=${selected_score}, lane=${selected_kind}, breakdown=${selected_breakdown}."
          fi

          if [ -z "$issue_number" ]; then
            echo 'No eligible actionable issue is currently routable through the bounded autonomous lane.'
            exit 0
          fi

          checked_at=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          issue_json=$(gh_retry gh api "repos/${GITHUB_REPOSITORY}/issues/${issue_number}")
          title=$(printf '%s' "$issue_json" | jq -r '.title')
          body_text=$(printf '%s' "$issue_json" | jq -r '.body // ""')
          previous_attempt=$(get_previous_attempt "$issue_number" || true)
          previous_attempt=${previous_attempt:-0}

          if [ "$previous_attempt" -ge "$max_attempts" ]; then
            mark_retry_or_blocked "$issue_number" "$title" "$checked_at" "$max_attempts" \
              'bounded attempt counter was already exhausted before this controller pass'
            exit 0
          fi
          attempt=$((previous_attempt + 1))

          echo "Claiming exactly one issue: #${issue_number} (attempt ${attempt}/${max_attempts})."
          add_label "$issue_number" genesis-claimed
          add_label "$issue_number" genesis-working

          sleep 3
          refreshed=$(gh_retry gh issue view "$issue_number" --repo "$GITHUB_REPOSITORY" --json state,labels)
          state=$(printf '%s' "$refreshed" | jq -r '.state')
          shared_owner=$(printf '%s' "$refreshed" | jq -r '([.labels[].name] | any(. == "genesis-repair-in-progress" or . == "genesis-validating"))')
          if [[ "$state" != "OPEN" || "$shared_owner" == "true" ]]; then
            echo "Controller backed off #${issue_number} because another worker already owns the shared reservation."
            clear_transient_labels "$issue_number"
            exit 0
          fi

          claimed_body=$(printf '%s\n<!-- genesis-solver-attempt:%s -->\n**Genesis Sequential Issue Controller — claimed**\n\n- Issue: #%s — %s\n- Claimed (UTC): %s\n- Controller run: %s\n- Attempt: **%s/%s**\n- State: **working on exactly one issue**' \
            "$marker" "$attempt" "$issue_number" "$title" "$checked_at" "$GITHUB_RUN_ID" "$attempt" "$max_attempts")
          upsert_status "$issue_number" "$claimed_body"

          resolved=false
          dispatched=false

          if [[ "$selected_kind" == "architecture" ]]; then
            clear_transient_labels "$issue_number"
            add_label "$issue_number" genesis-autonomous
            add_label "$issue_number" agentic-lab
            add_label "$issue_number" genesis-agentic-escalated
            add_label "$issue_number" genesis-architecture-route
            gh_retry gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" \
              --body "Genesis Sequential Issue Controller routed this architecture/control-plane Issue to Agentic Lab. Score: ${selected_score}. The same authoritative Issue remains open; architecture work must be solved and verified before Closure Manager may close it. Controller run: ${GITHUB_RUN_ID}." >/dev/null
            gh_retry gh workflow run genesis-agentic-lab-recovery.yml --repo "$GITHUB_REPOSITORY" --ref main >/dev/null
            dispatched=true
            echo "Routed architecture issue #${issue_number} to Agentic Lab with score ${selected_score}."
          fi

          if [[ "$dispatched" != true && ( "$title" == Genesis\ Action\ failure:* || "$title" == \[Genesis\ Action\ Failure\]* ) ]]; then
            workflow_path=$(printf '%s' "$body_text" | grep -oE '\.github/workflows/[A-Za-z0-9._-]+\.(yml|yaml)' | head -n1 || true)
            failed_run_id=$(printf '%s' "$body_text" | sed -nE 's/.*Run: `([0-9]+)`.*/\1/p' | head -n1)

            if [ -n "$workflow_path" ] && [ -n "$failed_run_id" ] && [ -f "$workflow_path" ]; then
              workflow_file=$(basename "$workflow_path")
              if gh_retry gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${failed_run_id}" > /tmp/genesis-failed-run.json \
                && gh_retry gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/runs?branch=main&per_page=100" > /tmp/genesis-workflow-runs.json; then
                recovery_json=$(python scripts/action_failure_recovery.py --failed-run /tmp/genesis-failed-run.json --workflow-runs /tmp/genesis-workflow-runs.json)
                recovered=$(jq -r '.recovered' <<<"$recovery_json")
                recovered_run=$(jq -r '.run.id // empty' <<<"$recovery_json")
                recovered_sha=$(jq -r '.run.head_sha // empty' <<<"$recovery_json")
                if [[ "$recovered" == "true" ]]; then
                  remove_label "$issue_number" genesis-working
                  add_label "$issue_number" genesis-verifying
                  gh_retry gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" \
                    --body "Genesis verification evidence: the Action failure recorded in run ${failed_run_id} for ${workflow_path} is superseded by newer successful main run ${recovered_run} at SHA ${recovered_sha}. The same workflow recovered after the recorded failure. Controller run: ${GITHUB_RUN_ID}, attempt: ${attempt}/${max_attempts}." >/dev/null
                  add_label "$issue_number" genesis-verified
                  remove_label "$issue_number" genesis-blocked
                  remove_label "$issue_number" genesis-solver-exhausted
                  clear_reservation_labels "$issue_number"
                  gh workflow run genesis-issue-closure-manager.yml --repo "$GITHUB_REPOSITORY" --ref main -f issue_number="$issue_number" >/dev/null 2>&1 || true
                  resolved=true
                  echo "Verified recovered Action failure #${issue_number} via newer successful workflow run ${recovered_run}; Closure Manager dispatched for final close/seal."
                fi
              fi
            fi

            if [ "$resolved" != true ]; then
              workflow_path=$(printf '%s' "$body_text" | grep -oE '\.github/workflows/[A-Za-z0-9._-]+\.(yml|yaml)' | head -n1 || true)
              if [ -n "$workflow_path" ] && [ ! -f "$workflow_path" ]; then
              remove_label "$issue_number" genesis-working
              add_label "$issue_number" genesis-verifying
              gh_retry gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" \
                --body "Genesis verification evidence: referenced workflow \`${workflow_path}\` is absent from current \`main\`; this exact historical failure cannot recur from that removed workflow. Controller run: ${GITHUB_RUN_ID}, attempt: ${attempt}/${max_attempts}." >/dev/null
              add_label "$issue_number" genesis-verified
              remove_label "$issue_number" genesis-blocked
              remove_label "$issue_number" genesis-solver-exhausted
              clear_reservation_labels "$issue_number"
              gh workflow run genesis-issue-closure-manager.yml --repo "$GITHUB_REPOSITORY" --ref main -f issue_number="$issue_number" >/dev/null 2>&1 || true
              resolved=true
                echo "Verified stale Action failure #${issue_number}; Closure Manager dispatched for final close/seal."
              fi
            fi
          fi

          if [ "$resolved" != true ] && printf '%s' "$body_text" | grep -qi 'Syntax error'; then
            target=$(printf '%s' "$body_text" | python -m genesis.issue_target)
            if [ -n "$target" ] && [ -f "$target" ]; then
              remove_label "$issue_number" genesis-working
              add_label "$issue_number" genesis-verifying
              if python -m py_compile "$target"; then
                gh_retry gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" \
                  --body "Genesis verification evidence: \`python -m py_compile ${target}\` passed on current \`main\`; the reported syntax-error condition is not present. Controller run: ${GITHUB_RUN_ID}, attempt: ${attempt}/${max_attempts}." >/dev/null
                add_label "$issue_number" genesis-verified
                remove_label "$issue_number" genesis-blocked
                remove_label "$issue_number" genesis-solver-exhausted
                clear_reservation_labels "$issue_number"
                gh workflow run genesis-issue-closure-manager.yml --repo "$GITHUB_REPOSITORY" --ref main -f issue_number="$issue_number" >/dev/null 2>&1 || true
                resolved=true
                echo "Verified satisfied syntax issue #${issue_number}; Closure Manager dispatched for final close/seal."
              fi
            fi
          fi

          if [ "$resolved" != true ]; then
            target=$(printf '%s' "$body_text" | python -m genesis.issue_target)
            safe_target=true
            if [[ -z "$target" || "$target" != genesis/*.py || "$target" == *".."* || ! -f "$target" ]]; then
              safe_target=false
            fi
            case "$target" in
              genesis/autonomy_guard.py|genesis/autonomy_proof.py|genesis/blockchain.py|genesis/ephemeral_validator.py|genesis/security.py|genesis/selfdev.py|genesis/issue_solver.py|genesis/file_self_review.py|genesis/file_self_review_policy.py)
                safe_target=false
                ;;
            esac

            if [[ "$safe_target" == true ]]; then
              add_label "$issue_number" genesis-repair-in-progress
              add_label "$issue_number" genesis-autonomous
              remove_label "$issue_number" genesis-blocked
              remove_label "$issue_number" genesis-solver-exhausted
              clear_transient_labels "$issue_number"
              dispatched_body=$(printf '%s\n<!-- genesis-solver-attempt:%s -->\n**Genesis Sequential Issue Controller — bounded repair dispatched**\n\n- Issue: #%s — %s\n- Dispatched (UTC): %s\n- Controller run: %s\n- Attempt: **%s/%s**\n- Target: `%s`\n- State: **the only active bounded repair reservation**\n\nThe existing worker may mark verified only after fresh full validation on current main; the Closure Manager owns final close/seal authority.' \
                "$marker" "$attempt" "$issue_number" "$title" "$checked_at" "$GITHUB_RUN_ID" "$attempt" "$max_attempts" "$target")
              upsert_status "$issue_number" "$dispatched_body"
              if gh_retry gh workflow run genesis-bounded-repair-worker.yml --repo "$GITHUB_REPOSITORY" --ref main \
                -f issue_number="$issue_number"; then
                dispatched=true
                echo "Dispatched bounded worker for #${issue_number}; controller stops here until that issue reaches a terminal/retry state."
              else
                remove_label "$issue_number" genesis-repair-in-progress
                mark_retry_or_blocked "$issue_number" "$title" "$checked_at" "$attempt" \
                  'bounded repair worker dispatch failed'
              fi
            fi
          fi

          if [ "$resolved" != true ] && [ "$dispatched" != true ]; then
            current_labels=$(gh_retry gh issue view "$issue_number" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(",")')
            if [[ "$current_labels" != *"genesis-solver-exhausted"* ]]; then
              mark_retry_or_blocked "$issue_number" "$title" "$checked_at" "$attempt" \
                'no verified completion evidence or safe bounded repair route available'
            fi
          fi
