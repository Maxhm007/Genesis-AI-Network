name: Genesis Sequential Issue Controller

# Compatibility feeder only.
# Agentic Lab is the single issue-routing and strategy authority.
# Compatibility/manual trigger only; automatic continuity is owned by Agentic Lab + Idle Repair Watchdog.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: genesis-sequential-issue-controller
  cancel-in-progress: true

jobs:
  handoff-to-agentic-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Hand off all issue control to Agentic Lab
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Sequential Controller is feeder-only. Agentic Lab owns claim, routing, strategy, recovery, verification handoff, and lifecycle state."
          gh workflow run genesis-agentic-lab-recovery.yml             --repo "$GITHUB_REPOSITORY"             --ref main
