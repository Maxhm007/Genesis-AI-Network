name: Genesis Verified Closure Guard

on:
  issues:
    types: [closed]
  workflow_dispatch:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/genesis-verified-closure-guard.yml

permissions:
  issues: write
  contents: read

concurrency:
  group: genesis-verified-closure-guard
  cancel-in-progress: false

jobs:
  enforce-verified-only-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reopen unsolved automatic closures
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          bad_labels='["genesis-deferred","genesis-superseded","genesis-terminal","genesis-recovery-terminal","genesis-solver-exhausted","genesis-blocked"]'

          reopen_if_unsolved() {
            local issue_number="$1"
            local issue_json labels verified genesis_task automatic_failure state

            issue_json=$(gh issue view "$issue_number" --repo "$GITHUB_REPOSITORY" --json state,labels,title)
            state=$(jq -r '.state' <<<"$issue_json")
            [[ "$state" == "CLOSED" ]] || return 0

            labels=$(jq -c '[.labels[].name]' <<<"$issue_json")
            verified=$(jq -r 'any(. == "genesis-verified")' <<<"$labels")
            genesis_task=$(jq -r 'any(. == "genesis-task")' <<<"$labels")
            automatic_failure=$(jq -n -r --argjson labels "$labels" --argjson bad "$bad_labels" '[$labels[] as $x | select($bad | index($x))] | length > 0')

            [[ "$genesis_task" == "true" ]] || return 0
            [[ "$verified" == "false" ]] || return 0
            [[ "$automatic_failure" == "true" ]] || return 0

            gh api "repos/${GITHUB_REPOSITORY}/issues/${issue_number}" --method PATCH -f state=open >/dev/null

            for label in genesis-deferred genesis-superseded genesis-terminal genesis-recovery-terminal genesis-repair-in-progress genesis-validating genesis-claimed genesis-working genesis-verifying; do
              gh issue edit "$issue_number" --repo "$GITHUB_REPOSITORY" --remove-label "$label" >/dev/null 2>&1 || true
            done

            gh label create agentic-lab --repo "$GITHUB_REPOSITORY" --color 8250df --description 'Agentic Lab owns strategy selection for this open Issue' --force >/dev/null 2>&1 || true
            gh label create genesis-agentic-escalated --repo "$GITHUB_REPOSITORY" --color 8250df --description 'Solver exhausted; same authoritative Issue remains open with Agentic Lab' --force >/dev/null 2>&1 || true
            gh issue edit "$issue_number" --repo "$GITHUB_REPOSITORY" \
              --add-label agentic-lab \
              --add-label genesis-agentic-escalated \
              --add-label genesis-solver-exhausted >/dev/null

            gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" \
              --body "<!-- genesis-verified-closure-guard -->
Genesis reopened this Issue because it was closed without a verified solution. Policy: unsolved Genesis tasks stay open; only a verified promoted fix may close them. The same Issue remains authoritative and is returned to Agentic Lab. Guard run: ${GITHUB_RUN_ID}." >/dev/null

            echo "Reopened unsolved Genesis Issue #${issue_number}."
          }

          if [[ "$GITHUB_EVENT_NAME" == "issues" ]]; then
            issue_number=$(jq -r '.issue.number // empty' "$GITHUB_EVENT_PATH")
            if [[ -n "$issue_number" ]]; then
              reopen_if_unsolved "$issue_number"
            fi
          fi

          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=closed&labels=genesis-task&sort=updated&direction=desc&per_page=100" --jq '.[] | select(.pull_request == null) | .number' \
            | head -n 100 \
            | while read -r issue_number; do
                reopen_if_unsolved "$issue_number"
              done
