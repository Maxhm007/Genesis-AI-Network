name: Validate Terminal Cache 656

on:
  push:
    branches:
      - fix/terminal-reconciler-persisted-cache-648
    paths:
      - .github/workflows/validate-terminal-cache-656.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/terminal-reconciler-persisted-cache-648
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Focused terminal reconciliation tests
        run: python -m pytest -q tests/test_github_issue_terminal_reconciler.py tests/test_terminal_reconciler_specialist_handoff.py tests/test_github_issue_terminal_specialist_replacement.py tests/test_terminal_issue_reconciler_workflow.py
      - name: Full repository tests
        run: python -m pytest -q
