name: Genesis Integration Issue Router

on:
  issues:
    types: [opened, reopened, edited, labeled]
  workflow_dispatch:
  schedule:
    - cron: '7,27,47 * * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/genesis-integration-issue-router.yml

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: genesis-integration-issue-router
  cancel-in-progress: false

jobs:
  route-integration-work:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Route benchmark and integration issues before generic retries
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail

          ensure_label() {
            gh label create "$1" --repo "$GITHUB_REPOSITORY" --color "$2" --description "$3" --force >/dev/null
          }
          ensure_label genesis-repair ededed 'Concrete repair work eligible for the bounded autonomous lane'
          ensure_label genesis-autonomous 1f883d 'Authorized for Genesis autonomous repair'
          ensure_label genesis-integration-route 5319e7 'Integration-sensitive work routed with deterministic repair guidance'

          if [[ -n "${EVENT_ISSUE:-}" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/issues/${EVENT_ISSUE}" | jq -s '.' > /tmp/integration-issues.json
          else
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=open&sort=created&direction=asc&per_page=100" --jq '.[]' | jq -s '.' > /tmp/integration-issues.json
          fi

          python - <<'PY' > /tmp/integration-routes.tsv
          import json
          import re
          from pathlib import Path

          issues = json.loads(Path('/tmp/integration-issues.json').read_text())
          target_re = re.compile(r'^- \*\*Target:\*\* `([^`]+)`', re.MULTILINE)
          task_type_re = re.compile(r'^- \*\*Task type:\*\* `([^`]+)`', re.MULTILINE)
          integration_task_types = {
              'benchmark_runner_integration',
              'frontier_benchmark_measurement',
              'competitive_ai_improvement',
              'integration_repair',
          }
          protected_labels = {'genesis-persistent', 'genesis-control', 'duplicate', 'invalid', 'wontfix'}
          marker = '<!-- genesis-integration-route -->'

          for issue in issues:
              if issue.get('pull_request') or str(issue.get('state') or '').lower() != 'open':
                  continue
              number = int(issue.get('number') or 0)
              if number <= 1:
                  continue
              title = str(issue.get('title') or '')
              body = str(issue.get('body') or '')
              labels = {str(row.get('name') or '') for row in issue.get('labels') or [] if isinstance(row, dict)}
              if labels & protected_labels:
                  continue

              target_match = target_re.search(body)
              target = target_match.group(1).strip().replace('\\', '/') if target_match else ''
              task_match = task_type_re.search(body)
              task_type = task_match.group(1).strip().lower() if task_match else ''
              text = f'{title}\n{body}'.lower()

              target_sensitive = target in {
                  'genesis/benchmark_execution.py',
                  'genesis/benchmark_evidence.py',
                  'genesis/competitive_benchmarks.py',
                  'genesis/evaluation.py',
              }
              language_sensitive = (
                  ('benchmark' in text and ('integration' in text or 'runner' in text or 'swe-bench' in text or 'swe_bench' in text))
                  or ('integration' in text and target.startswith('genesis/'))
              )
              if task_type not in integration_task_types and not target_sensitive and not language_sensitive:
                  continue
              if marker in body and 'genesis-integration-route' in labels:
                  continue
              if target and (not target.startswith('genesis/') or not target.endswith('.py') or '..' in target):
                  continue

              strategy = (
                  'Treat this as integration-sensitive work, not a blind generic retry. Preserve existing public behavior and '
                  'test ordering first. Add or isolate the new integration path behind the narrowest condition possible. '
                  'Use existing validation failures as contracts: do not reorder unrelated context, weaken tests, or replace '
                  'working benchmark paths. Prefer an adapter/branch specific to the requested integration. Add focused '
                  'regression coverage when allowed, then require the full repository suite before promotion.'
              )
              guidance = (
                  f'{marker}\n\n### Genesis integration repair route\n'
                  f'- **Routing class:** `integration_sensitive`\n'
                  + (f'- **Integration target:** `{target}`\n' if target else '')
                  + f'\n{strategy}\n\n'
                  'This routing narrows repair strategy only. Security, protected-file boundaries, exact candidate promotion, '
                  'independent validation, and verified closure remain mandatory.'
              )
              new_body = body.rstrip() + '\n\n' + guidance + '\n'
              print(f'{number}\t{json.dumps(new_body)}')
          PY

          routed=0
          while IFS=$'\t' read -r issue_number encoded_body; do
            [[ -z "${issue_number:-}" ]] && continue
            body=$(printf '%s' "$encoded_body" | jq -r '.')
            gh api "repos/${GITHUB_REPOSITORY}/issues/${issue_number}" --method PATCH -f body="$body" >/dev/null
            gh issue edit "$issue_number" --repo "$GITHUB_REPOSITORY" \
              --add-label genesis-repair \
              --add-label genesis-autonomous \
              --add-label genesis-integration-route >/dev/null
            for label in genesis-blocked genesis-solver-exhausted genesis-deferred genesis-waiting-user genesis-closed-sealed-not-planned; do
              gh issue edit "$issue_number" --repo "$GITHUB_REPOSITORY" --remove-label "$label" >/dev/null 2>&1 || true
            done
            echo "Routed integration-sensitive Issue #${issue_number} directly to focused bounded repair."
            routed=$((routed + 1))
          done < /tmp/integration-routes.tsv

          if (( routed > 0 )); then
            gh workflow run genesis-sequential-issue-controller.yml --repo "$GITHUB_REPOSITORY" --ref main >/dev/null 2>&1 || true
          fi
