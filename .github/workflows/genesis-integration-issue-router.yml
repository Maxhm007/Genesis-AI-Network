name: Genesis Integration Issue Router

# Compatibility/manual wake-up only.
# Agentic Lab now owns integration-sensitive classification, guidance, reservation, and worker dispatch.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: genesis-integration-issue-router
  cancel-in-progress: true

jobs:
  handoff-to-agentic-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake Agentic Lab for integration-sensitive work
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Integration routing is owned by Agentic Lab."
          echo "Agentic Lab classifies benchmark_runner_integration and genesis/benchmark_execution.py work as integration_sensitive."
          echo "It applies genesis-integration-route guidance: do not reorder unrelated context; require the full repository suite before promotion; protected-file boundaries and verified closure remain mandatory."
          gh workflow run genesis-agentic-lab-recovery.yml --repo "$GITHUB_REPOSITORY" --ref main
