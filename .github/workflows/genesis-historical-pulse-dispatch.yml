name: Genesis Historical Pulse Dispatch Test

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/genesis-historical-pulse-dispatch.yml
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch historical Gene Pulse definition
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run gene-pulse.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref test/historical-gene-pulse-reconcile \
            -f gene=gene-node-1 \
            -f continue_chain=false
