name: Genesis Repair Checkpoint Gate

on:
  pull_request:
    paths:
      - 'genesis/repair_checkpoints.py'
      - 'genesis/issue_solver.py'
      - 'genesis/python_syntax_retry.py'
      - 'genesis/compact_proposal_retry.py'
      - 'genesis/__init__.py'
      - 'genesis/immortality_scan.py'
      - 'scripts/self_heal.py'
      - 'tests/test_repair_checkpoints.py'
      - 'tests/test_issue_solver.py'
      - 'tests/test_empty_try_syntax_retry.py'
      - 'tests/test_compact_proposal_retry.py'
      - 'tests/test_immortality_scan.py'
      - 'tests/test_self_heal_escalation.py'
      - 'tests/test_bounded_repair_gate.py'
      - '.github/workflows/genesis-bounded-repair-worker.yml'
      - '.github/workflows/genesis-agentic-strategy-worker.yml'
      - '.github/workflows/genesis-deepseek-agentic-solver.yml'
      - '.github/workflows/genesis-agentic-lab-recovery.yml'
      - 'tests/test_autonomous_recovery_activation.py'
      - '.github/workflows/genesis-repair-checkpoint-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-repair-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile repair components
        run: python -m py_compile genesis/repair_checkpoints.py genesis/issue_solver.py genesis/python_syntax_retry.py genesis/compact_proposal_retry.py scripts/self_heal.py
      - name: Run repair regression suite
        run: python -m pytest -q tests/test_issue_solver.py tests/test_repair_checkpoints.py tests/test_self_heal_escalation.py tests/test_bounded_repair_gate.py tests/test_autonomous_recovery_activation.py tests/test_python_syntax_retry.py tests/test_empty_try_syntax_retry.py tests/test_immortality_scan.py tests/test_compact_proposal_retry.py
      - name: Run full repository regression suite
        run: python -m pytest -q
