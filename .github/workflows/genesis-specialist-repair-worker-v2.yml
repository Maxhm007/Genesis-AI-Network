name: Genesis Specialist Repair Worker v2

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing system-script Issue reserved by Genesis
        required: true
        type: string

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: genesis-specialist-repair-${{ inputs.issue_number }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  GENESIS_REPAIR_PROVIDER_URL: http://127.0.0.1:8766
  GENESIS_PROVIDER_URL: http://127.0.0.1:8766
  GENESIS_PROVIDER_NAME: genesis-specialist-grounded-repair
  GENESIS_PROVIDER_TIMEOUT_SECONDS: '300'
  GENESIS_PROVIDER_MAX_NEW_TOKENS: '512'
  GENESIS_REPAIR_FALLBACK_MODEL: Qwen/Qwen2.5-Coder-0.5B-Instruct
  GENESIS_REPAIR_ESCALATION_MODEL: Qwen/Qwen2.5-Coder-1.5B-Instruct
  GENESIS_REPAIR_ESCALATION_MAX_NEW_TOKENS: '512'
  HF_HOME: ~/.cache/huggingface
  PIP_CACHE_DIR: ~/.cache/pip

jobs:
  repair-and-promote-system-script:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify reservation and privileged-safe script target
        id: eligibility
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          issue_json=$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,labels,body)
          state=$(jq -r '.state' <<<"$issue_json")
          reserved=$(jq -r '([.labels[].name] | index("genesis-repair-in-progress")) != null' <<<"$issue_json")
          body=$(jq -r '.body // ""' <<<"$issue_json")
          target=$(printf '%s\n' "$body" | sed -nE 's/^- \*\*Target:\*\* `([^`]+)`.*/\1/p' | head -n1)
          safe=true
          if [[ "$state" != "OPEN" || "$reserved" != "true" ]]; then safe=false; fi
          if [[ -z "$target" || "$target" != scripts/*.py || "$target" == *".."* || ! -f "$target" ]]; then safe=false; fi
          case "$target" in
            scripts/secret_guard.py|scripts/privileged_change_gate.py|scripts/verify_validator_votes.py|scripts/action_repair_guard.py|scripts/issue_acceptance_guard.py) safe=false ;;
          esac
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "eligible=$safe" >> "$GITHUB_OUTPUT"
          if [[ "$safe" != "true" ]]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label genesis-blocked --remove-label genesis-repair-in-progress >/dev/null 2>&1 || true
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Genesis specialist v2 declined this Issue because its target is absent, protected, unsafe, or no longer reserved. No code was changed. Worker run: ${GITHUB_RUN_ID}."
          fi

      - name: Record bounded specialist attempt
        if: steps.eligibility.outputs.eligible == 'true'
        id: attempt
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          previous=0
          mapfile -t labels < <(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name')
          for label in "${labels[@]}"; do
            case "$label" in genesis-specialist-repair-attempt-[123]) n="${label##*-}"; (( n > previous )) && previous=$n || true ;; esac
          done
          attempt=$((previous + 1)); (( attempt > 3 )) && attempt=3 || true
          for n in 1 2 3; do
            label="genesis-specialist-repair-attempt-${n}"
            gh label create "$label" --repo "$GITHUB_REPOSITORY" --color d4c5f9 --description "Genesis bounded specialist repair attempt ${n}/3" --force >/dev/null
            if [[ "$n" -eq "$attempt" ]]; then
              gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "$label" >/dev/null
            else
              gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$label" >/dev/null 2>&1 || true
            fi
          done
          echo "number=$attempt" >> "$GITHUB_OUTPUT"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Genesis grounded specialist repair attempt **${attempt}/3** started. Worker run: ${GITHUB_RUN_ID}."

      - name: Install repository dependencies
        if: steps.eligibility.outputs.eligible == 'true'
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Verify clean repository baseline
        if: steps.eligibility.outputs.eligible == 'true'
        run: python -m pytest -q

      - name: Restore open-model cache
        if: steps.eligibility.outputs.eligible == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
          key: genesis-specialist-qwen-coder-${{ runner.os }}-py312-v1
          restore-keys: |
            genesis-specialist-qwen-coder-${{ runner.os }}-py312-

      - name: Install free local repair intelligence
        if: steps.eligibility.outputs.eligible == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers>=4.51,<5' safetensors

      - name: Start adaptive local coding provider
        if: steps.eligibility.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          nohup python scripts/pulse_coding_provider.py \
            --model "$GENESIS_REPAIR_FALLBACK_MODEL" \
            --escalation-model "$GENESIS_REPAIR_ESCALATION_MODEL" \
            --host 127.0.0.1 --port 8766 \
            --max-new-tokens "$GENESIS_PROVIDER_MAX_NEW_TOKENS" \
            --escalation-max-new-tokens "$GENESIS_REPAIR_ESCALATION_MAX_NEW_TOKENS" \
            > /tmp/genesis-specialist-repair-provider.log 2>&1 &
          for i in {1..120}; do
            if python - <<'PY'
          import urllib.request
          try:
              with urllib.request.urlopen('http://127.0.0.1:8766/health', timeout=2) as response:
                  raise SystemExit(0 if response.status == 200 else 1)
          except Exception:
              raise SystemExit(1)
          PY
            then exit 0; fi
            sleep 2
          done
          cat /tmp/genesis-specialist-repair-provider.log || true
          exit 1

      - name: Configure Genesis Git identity
        if: steps.eligibility.outputs.eligible == 'true'
        run: |
          git config user.name "Genesis AI"
          git config user.email "genesis-ai@users.noreply.github.com"

      - name: Run grounded guarded specialist repair engine
        if: steps.eligibility.outputs.eligible == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label genesis-autonomous --remove-label genesis-blocked >/dev/null 2>&1 || true
          python scripts/specialist_issue_autorepair.py --issue-number "$ISSUE_NUMBER" --repository "$GITHUB_REPOSITORY"

      - name: Read repair evidence
        if: steps.eligibility.outputs.eligible == 'true'
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          test -f runtime/github_issue_autorepair.json
          echo "status=$(jq -r '.status // ""' runtime/github_issue_autorepair.json)" >> "$GITHUB_OUTPUT"
          echo "candidate_branch=$(jq -r '.candidate_branch // ""' runtime/github_issue_autorepair.json)" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$(jq -r '.candidate_sha // ""' runtime/github_issue_autorepair.json)" >> "$GITHUB_OUTPUT"
          echo 'Context used:'
          jq -r '.context_paths[]?' runtime/github_issue_autorepair.json

      - name: Validate and promote exact privileged candidate
        if: steps.evidence.outputs.status == 'candidate_created'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          TARGET: ${{ steps.eligibility.outputs.target }}
          CANDIDATE_BRANCH: ${{ steps.evidence.outputs.candidate_branch }}
          CANDIDATE_SHA: ${{ steps.evidence.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          target_test="tests/test_$(basename "$TARGET" .py).py"
          git fetch origin main "$CANDIDATE_BRANCH"
          git cat-file -e "${CANDIDATE_SHA}^{commit}"
          mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r "$CANDIDATE_SHA")
          (( ${#changed[@]} > 0 ))
          for path in "${changed[@]}"; do
            [[ "$path" == "$TARGET" || "$path" == "$target_test" ]] || { echo "Rejected out-of-scope path: $path"; exit 1; }
          done
          promoted=''
          for integration_attempt in 1 2 3; do
            git fetch origin main
            git checkout -B "genesis/specialist-v2-${ISSUE_NUMBER}-${GITHUB_RUN_ID}" origin/main
            git cherry-pick "$CANDIDATE_SHA" || { git cherry-pick --abort || true; continue; }
            python -m py_compile "$TARGET"
            [[ ! -f "$target_test" ]] || python -m pytest -q "$target_test"
            python -m pytest -q
            git fetch origin main
            [[ "$(git rev-parse HEAD^)" == "$(git rev-parse origin/main)" ]] || continue
            if git push origin HEAD:main; then promoted=$(git rev-parse HEAD); break; fi
          done
          [[ -n "$promoted" ]] || { echo 'Could not promote safely'; exit 1; }
          git fetch origin main
          git reset --hard origin/main
          python -m py_compile "$TARGET"
          [[ ! -f "$target_test" ]] || python -m pytest -q "$target_test"
          python -m pytest -q
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Genesis grounded specialist repair was independently validated and promoted. Candidate: \`${CANDIDATE_SHA}\`. Main: \`${promoted}\`. Target: \`${TARGET}\`. Full validation passed. Worker run: ${GITHUB_RUN_ID}."
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label genesis-verified >/dev/null
          for label in genesis-repair-in-progress genesis-validating genesis-autonomous genesis-specialist genesis-blocked genesis-solver-exhausted genesis-deferred genesis-specialist-repair-attempt-1 genesis-specialist-repair-attempt-2 genesis-specialist-repair-attempt-3; do
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$label" >/dev/null 2>&1 || true
          done
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" --method PATCH -f state=closed -f state_reason=completed >/dev/null
          git push origin --delete "$CANDIDATE_BRANCH" >/dev/null 2>&1 || true

      - name: Release unsuccessful reservation without false closure
        if: always() && steps.eligibility.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          ATTEMPT: ${{ steps.attempt.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          state=$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq '.state')
          [[ "$state" != "CLOSED" ]] || exit 0
          status='worker_failed_before_evidence'
          [[ ! -f runtime/github_issue_autorepair.json ]] || status=$(jq -r '.status // "worker_failed_before_evidence"' runtime/github_issue_autorepair.json)
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label genesis-repair-in-progress --remove-label genesis-validating >/dev/null 2>&1 || true
          if [[ "${ATTEMPT:-1}" -ge 3 ]]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label genesis-solver-exhausted --add-label genesis-deferred --remove-label genesis-autonomous >/dev/null 2>&1 || true
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Genesis grounded specialist repair exhausted 3 bounded attempts without verified promotion (status: \`${status}\`). The Issue remains open and unresolved; it was not falsely closed."
          else
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label genesis-autonomous --add-label genesis-specialist >/dev/null 2>&1 || true
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Genesis grounded specialist repair did not promote a verified change yet (status: \`${status}\`, attempt: ${ATTEMPT:-1}/3). The Issue remains open for the next autonomous specialist pass."
          fi

      - name: Preserve specialist repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-specialist-v2-${{ inputs.issue_number }}-${{ github.run_id }}
          path: |
            runtime/github_issue_autorepair.json
            /tmp/genesis-specialist-repair-provider.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Wake specialist controller
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run genesis-specialist-issue-controller.yml --repo "$GITHUB_REPOSITORY" --ref main >/dev/null 2>&1 || true
