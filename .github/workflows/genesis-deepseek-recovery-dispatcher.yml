name: Genesis DeepSeek Recovery Dispatcher

# Compatibility feeder only. Agentic Lab chooses DeepSeek when appropriate.
on:
  workflow_dispatch:
  schedule:
    - cron: '2,12,22,32,42,52 * * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/genesis-deepseek-recovery-dispatcher.yml
      - .github/workflows/genesis-agentic-lab-recovery.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: genesis-deepseek-recovery-dispatcher
  cancel-in-progress: true

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake Agentic Lab
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "DeepSeek dispatcher is feeder-only; Agentic Lab selects the provider."
          gh workflow run genesis-agentic-lab-recovery.yml --repo "$GITHUB_REPOSITORY" --ref main
