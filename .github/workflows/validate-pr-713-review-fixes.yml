name: Validate PR 713 Review Fixes

on:
  push:
    branches:
      - genesis/evidence-first-hard-repair-712
    paths:
      - .github/workflows/validate-pr-713-review-fixes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: genesis/evidence-first-hard-repair-712
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded review fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('genesis/github_issue_capability_builder.py')
          text = path.read_text(encoding='utf-8')

          old = '''    def reason(self, prompt: str) -> str:\n        strengthened = (\n            "DIFFICULT_REPAIR_MODE\\n"\n'''
          new = '''    def reason(self, prompt: str) -> str:\n        prompt_text = str(prompt)\n        first_line = prompt_text.splitlines()[0] if prompt_text.splitlines() else ""\n        role_line = first_line if first_line.startswith("ROLE:") else "ROLE: bounded_coding_engineer"\n        strengthened = (\n            role_line + "\\n"\n            "DIFFICULT_REPAIR_MODE\\n"\n'''
          if old not in text:
              raise SystemExit('reason prompt anchor missing')
          text = text.replace(old, new, 1)
          text = text.replace('''            + str(prompt)\n        )\n''', '''            + prompt_text\n        )\n''', 1)

          old = '''        result = subprocess.run(\n            ["git", "log", "-n", "6", "--format=%h %s", "--", target_path],\n            cwd=root,\n            text=True,\n            capture_output=True,\n            check=False,\n        )\n        if result.returncode != 0:\n            return ""\n'''
          new = '''        try:\n            result = subprocess.run(\n                ["git", "log", "-n", "6", "--format=%h %s", "--", target_path],\n                cwd=root,\n                text=True,\n                capture_output=True,\n                check=False,\n                timeout=3.0,\n            )\n        except (OSError, subprocess.TimeoutExpired):\n            return ""\n        if result.returncode != 0:\n            return ""\n'''
          if old not in text:
              raise SystemExit('git history anchor missing')
          text = text.replace(old, new, 1)

          old = '''        coding.executor._validate_paths([target_path])\n        target = Path(root).resolve() / target_path\n'''
          new = '''        try:\n            coding.executor._validate_paths([target_path])\n        except (RuntimeError, ValueError):\n            return None\n        target = Path(root).resolve() / target_path\n'''
          if old not in text:
              raise SystemExit('path validation anchor missing')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Focused hard-repair safety tests
        run: python -m pytest -q tests/test_evidence_first_repair_followup.py tests/test_github_issue_capability_builder.py tests/test_github_issue_autorepair.py
      - name: Full repository suite
        run: python -m pytest -q
      - name: Commit validated source fixes
        run: |
          git config user.name "Genesis Validation"
          git config user.email "genesis-validation@users.noreply.github.com"
          git add genesis/github_issue_capability_builder.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Harden evidence-first repair fallback and prompt routing"
          git push origin HEAD:genesis/evidence-first-hard-repair-712
