name: Verify Agentic Micro Repair

on:
  push:
    paths:
      - scripts/agentic_strategy_repair.py
      - tests/test_agentic_strategy_repair.py
      - .github/workflows/verify-agentic-micro-repair.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_agentic_strategy_repair.py
