name: Genesis Exact Ref Reconcile

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/genesis-exact-ref-reconcile.yml

permissions:
  actions: write
  contents: write
  checks: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile orphaned Gene Pulse at its original main ref
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 59a1d05a44799b40b8aff6358b09f4fbfe3298bf
          STALE_RUN: "32215089776"
          STALE_SUITE: "87329536345"
        shell: bash
        run: |
          set -u
          repo="$GITHUB_REPOSITORY"
          original_sha=$(gh api "/repos/$repo/git/ref/heads/main" --jq '.object.sha')
          echo "Original main: $original_sha"
          active_file="$RUNNER_TEMP/active_workflows.txt"
          gh api --paginate "/repos/$repo/actions/workflows?per_page=100" --jq '.workflows[] | select(.state == "active") | .id' > "$active_file"
          echo "Active workflows captured: $(wc -l < "$active_file")"

          cleanup() {
            set +e
            echo "Restoring main to $original_sha"
            gh api --method PATCH "/repos/$repo/git/refs/heads/main" -f sha="$original_sha" -F force=true >/dev/null
            while read -r wid; do
              [ -n "$wid" ] || continue
              gh api --method PUT "/repos/$repo/actions/workflows/$wid/enable" >/dev/null 2>&1 || true
            done < "$active_file"
            echo "Cleanup complete"
          }
          trap cleanup EXIT

          while read -r wid; do
            [ -n "$wid" ] || continue
            gh api --method PUT "/repos/$repo/actions/workflows/$wid/disable" >/dev/null 2>&1 || true
          done < "$active_file"
          echo "Active workflows disabled for isolated ref test"

          if ! gh api --method PATCH "/repos/$repo/git/refs/heads/main" -f sha="$TARGET_SHA" -F force=true >/dev/null; then
            echo "Exact-ref move rejected; no repository history was changed"
            exit 0
          fi
          echo "main now temporarily points to $TARGET_SHA"
          sleep 5

          echo "State at exact ref:"
          gh api "/repos/$repo/actions/runs/$STALE_RUN" --jq '{id,status,conclusion,run_attempt,head_branch,head_sha,updated_at}'

          echo "Re-requesting stale check suite at exact ref"
          gh api --method POST "/repos/$repo/check-suites/$STALE_SUITE/rerequest" >/dev/null 2>&1 || true
          sleep 3

          echo "Trying normal cancel"
          gh api --method POST "/repos/$repo/actions/runs/$STALE_RUN/cancel" >/dev/null 2>&1 || true
          echo "Trying force cancel"
          gh api --method POST "/repos/$repo/actions/runs/$STALE_RUN/force-cancel" >/dev/null 2>&1 || true
          sleep 2

          echo "Trying deletion after exact-ref reconciliation"
          gh api --method DELETE "/repos/$repo/actions/runs/$STALE_RUN" >/dev/null 2>&1 || true

          echo "Final state before restoring main:"
          gh api "/repos/$repo/actions/runs/$STALE_RUN" --jq '{id,status,conclusion,run_attempt,head_branch,head_sha,updated_at}' 2>/dev/null || echo "Run record no longer exists"
