name: Genesis Issue Autorepair Promotion Recovery

on:
  workflow_run:
    workflows: ["Genesis GitHub Issue Autorepair"]
    types: [completed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Optional queued issue number to recover
        required: false
        default: ''

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: genesis-issue-prless-promotion-recovery
  cancel-in-progress: false

jobs:
  resolve:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    outputs:
      has_candidate: ${{ steps.candidate.outputs.has_candidate }}
      issue_number: ${{ steps.candidate.outputs.issue_number }}
      candidate_branch: ${{ steps.candidate.outputs.candidate_branch }}
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve queued issue and exact candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_ISSUE: ${{ inputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          n="$REQUESTED_ISSUE"
          if [[ -z "$n" ]]; then
            n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label genesis-autonomous --limit 1 --json number --jq '.[0].number // empty')
          fi
          if [[ -z "$n" ]]; then
            echo 'has_candidate=false' >> "$GITHUB_OUTPUT"
            echo 'issue_number=' >> "$GITHUB_OUTPUT"
            echo 'candidate_branch=' >> "$GITHUB_OUTPUT"
            echo 'candidate_sha=' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$n" =~ ^[0-9]+$ ]]
          gh issue view "$n" --repo "$GITHUB_REPOSITORY" --json comments > "$RUNNER_TEMP/issue-comments.json"
          ISSUE_NUMBER="$n" python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          issue = os.environ['ISSUE_NUMBER']
          payload = json.loads(Path(os.environ['RUNNER_TEMP'], 'issue-comments.json').read_text(encoding='utf-8'))
          pattern = re.compile(r"Genesis created candidate `(genesis/candidate-[A-Za-z0-9._-]+)` at `([0-9a-f]{7,40})`")
          match = None
          for row in reversed(payload.get('comments') or []):
              candidate = pattern.search(str(row.get('body') or ''))
              if candidate:
                  match = candidate
                  break
          output = Path(os.environ['GITHUB_OUTPUT'])
          if match is None:
              with output.open('a', encoding='utf-8') as handle:
                  handle.write('has_candidate=false\n')
                  handle.write(f'issue_number={issue}\n')
                  handle.write('candidate_branch=\n')
                  handle.write('candidate_sha=\n')
              raise SystemExit(0)

          branch, evidence_sha = match.groups()
          subprocess.run(['git', 'fetch', 'origin', 'main', branch], check=True)
          candidate_sha = subprocess.check_output(['git', 'rev-parse', f'origin/{branch}'], text=True).strip()
          if not candidate_sha.startswith(evidence_sha):
              raise SystemExit('candidate evidence SHA does not match branch head')
          main_sha = subprocess.check_output(['git', 'rev-parse', 'origin/main'], text=True).strip()
          if subprocess.run(['git', 'merge-base', '--is-ancestor', main_sha, candidate_sha]).returncode != 0:
              raise SystemExit('candidate is stale relative to current main')
          with output.open('a', encoding='utf-8') as handle:
              handle.write('has_candidate=true\n')
              handle.write(f'issue_number={issue}\n')
              handle.write(f'candidate_branch={branch}\n')
              handle.write(f'candidate_sha={candidate_sha}\n')
          PY

  validator_a:
    needs: resolve
    if: needs.resolve.outputs.has_candidate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Independent full test suite A
        run: python -m pytest -q
      - name: Enforce protected boundary A
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if git diff --name-only origin/main...HEAD | grep -Eq '^(GENESIS_CONSTITUTION.md|GENESIS_BLOCK.json|\.github/)'; then
            echo 'PR-less issue recovery cannot change protected control-plane files' >&2
            exit 1
          fi
      - name: Security review A
        run: |
          python - <<'PY'
          from pathlib import Path
          from genesis.security import SecurityModule
          report = SecurityModule(Path('.')).review_candidate('origin/main')
          print(report.as_dict())
          raise SystemExit(0 if report.status == 'pass' else 1)
          PY
      - name: Sign validator A approval
        run: python genesis/ephemeral_validator.py --validator-id github-issue-recovery-a --candidate ${{ needs.resolve.outputs.candidate_sha }} --output validator-a.json
      - uses: actions/upload-artifact@v4
        with:
          name: github-issue-recovery-a-${{ github.run_id }}
          path: validator-a.json

  validator_b:
    needs: resolve
    if: needs.resolve.outputs.has_candidate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Independent full test suite B
        run: python -m pytest -q
      - name: Enforce protected boundary B
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if git diff --name-only origin/main...HEAD | grep -Eq '^(GENESIS_CONSTITUTION.md|GENESIS_BLOCK.json|\.github/)'; then
            echo 'PR-less issue recovery cannot change protected control-plane files' >&2
            exit 1
          fi
      - name: Security review B
        run: |
          python - <<'PY'
          from pathlib import Path
          from genesis.security import SecurityModule
          report = SecurityModule(Path('.')).review_candidate('origin/main')
          print(report.as_dict())
          raise SystemExit(0 if report.status == 'pass' else 1)
          PY
      - name: Sign validator B approval
        run: python genesis/ephemeral_validator.py --validator-id github-issue-recovery-b --candidate ${{ needs.resolve.outputs.candidate_sha }} --output validator-b.json
      - uses: actions/upload-artifact@v4
        with:
          name: github-issue-recovery-b-${{ github.run_id }}
          path: validator-b.json

  secret_guard:
    needs: resolve
    if: needs.resolve.outputs.has_candidate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan candidate and reachable history for secrets
        run: python scripts/secret_guard.py --history

  promote:
    needs: [resolve, validator_a, validator_b, secret_guard]
    if: needs.resolve.outputs.has_candidate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: github-issue-recovery-a-${{ github.run_id }}
          path: votes/a
      - uses: actions/download-artifact@v4
        with:
          name: github-issue-recovery-b-${{ github.run_id }}
          path: votes/b
      - name: Verify independent signed quorum
        run: python scripts/verify_validator_votes.py votes/a/validator-a.json votes/b/validator-b.json
      - name: Promote exact validated candidate without requiring a PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.resolve.outputs.candidate_branch }}
          CANDIDATE_SHA: ${{ needs.resolve.outputs.candidate_sha }}
          ISSUE_NUMBER: ${{ needs.resolve.outputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BRANCH" == genesis/candidate-* ]]
          git fetch origin main "$BRANCH"
          main_sha=$(git rev-parse origin/main)
          test "$(git rev-parse origin/$BRANCH)" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor "$main_sha" "$CANDIDATE_SHA"
          if git diff --name-only "$main_sha..$CANDIDATE_SHA" | grep -Eq '^(GENESIS_CONSTITUTION.md|GENESIS_BLOCK.json|\.github/)'; then
            echo 'Protected Genesis boundary changed' >&2
            exit 1
          fi
          git push origin "$CANDIDATE_SHA:refs/heads/main"
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label genesis-solved --remove-label genesis-validating --remove-label genesis-autonomous --remove-label genesis-blocked || true
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Genesis PR-less recovery independently validated and promoted exact candidate SHA \`$CANDIDATE_SHA\` to main after signed quorum and Secret Guard."
