name: Apply Issue Pagination 649

on:
  push:
    branches:
      - fix/full-open-issue-pagination-649
    paths:
      - .github/workflows/apply-issue-pagination-649.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-open-issue-pagination-649
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch open-Issue fetches to scan all pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          targets = (
              (Path('.github/workflows/genesis-oldest-issue-solver.yml'), '/tmp/genesis-open-issues.json'),
              (Path('.github/workflows/genesis-priority-issue-solver.yml'), '/tmp/genesis-priority-open-issues.json'),
          )
          marker = 'gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&sort=created&direction=asc&per_page=100"'
          replacement = 'gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=open&sort=created&direction=asc&per_page=100" --jq \'.[]\' | jq -s \'.\''

          for path, output in targets:
              lines = path.read_text(encoding='utf-8').splitlines()
              if any('gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=open&sort=created&direction=asc&per_page=100"' in line for line in lines):
                  continue
              found = False
              new_lines = []
              skip_next = False
              for index, line in enumerate(lines):
                  if skip_next:
                      skip_next = False
                      continue
                  if marker in line:
                      indent = line[: len(line) - len(line.lstrip())]
                      new_lines.append(f"{indent}{replacement} > {output}")
                      if index + 1 < len(lines) and output in lines[index + 1]:
                          skip_next = True
                      found = True
                  else:
                      new_lines.append(line)
              if not found:
                  raise SystemExit(f'expected single-page Issue fetch not found in {path}')
              path.write_text('\n'.join(new_lines) + '\n', encoding='utf-8')
          PY
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Focused pagination contract
        run: python -m pytest -q tests/test_oldest_issue_solver_pagination.py
      - name: Full repository tests
        run: python -m pytest -q
      - name: Commit validated solver patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Genesis Repair Validation'
          git config user.email 'genesis-repair@users.noreply.github.com'
          git add .github/workflows/genesis-oldest-issue-solver.yml .github/workflows/genesis-priority-issue-solver.yml tests/test_oldest_issue_solver_pagination.py
          if git diff --cached --quiet; then
            echo 'Pagination patch already committed.'
            exit 0
          fi
          git commit -m 'Scan the full open Issue queue fairly (#649)'
          git push origin HEAD:fix/full-open-issue-pagination-649
