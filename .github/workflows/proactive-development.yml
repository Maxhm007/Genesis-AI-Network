name: Genesis Proactive Development

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/proactive-development.yml'
      - 'genesis/proactive.py'
      - 'genesis/ai_score.py'
      - 'genesis/scorecard.py'
      - 'genesis/efficiency.py'
      - 'genesis/intelligence_router.py'
      - 'genesis/capability_integration.py'
      - 'genesis/evaluation.py'
      - 'genesis/experiment.py'
      - 'genesis/resource.py'
      - 'genesis/model_scout.py'
      - 'genesis/task_router.py'
      - 'genesis/team.py'
      - 'genesis/evidence.py'
      - 'genesis/peer_compute.py'
      - 'genesis/memory.py'
      - 'genesis/operations.py'
      - 'genesis/automation.py'
      - 'genesis/competitive_reference.py'
      - 'genesis/immortality_scan.py'
      - 'genesis/research_tasks.py'
      - 'genesis/self_learning.py'
      - 'genesis/selfdev.py'
      - 'genesis/security.py'
      - 'genesis/coding.py'
      - 'genesis/autonomous_engineering.py'
      - 'genesis/efficient_engineering.py'
      - 'genesis/provider_fallback.py'
      - 'genesis/core_vitality.py'
      - 'genesis/modules/**'
      - 'genesis/devlab/**'
      - 'config/modules.json'
      - 'config/modules.d/**'
      - 'config/model_candidates.json'
      - 'config/immortality_sources.json'
      - 'config/competitive_ai_reference.json'
      - 'config/core_vitality.json'
      - 'scripts/proactive_dev.py'
      - 'scripts/task_router.py'
      - 'scripts/model_scout_worker.py'
      - 'scripts/ai_team_dispatch.py'
      - 'scripts/immortality_scan.py'
      - 'scripts/research_task_worker.py'
      - 'scripts/self_learn.py'
      - 'scripts/memory_sync.py'
      - 'scripts/autonomous_engineering.py'
      - 'scripts/local_reasoning_provider.py'
      - 'scripts/capability_growth_sync.py'
      - 'scripts/genesis_hourly_ops.py'
      - 'scripts/genesis_automation.py'
      - 'scripts/genesis_github_report.py'
      - 'scripts/genesis_core_vitality.py'
      - 'scripts/system_scorecard.py'
      - 'scripts/competitive_reference_monitor.py'
      - 'tests/test_proactive.py'
      - 'tests/test_ai_score.py'
      - 'tests/test_scorecard.py'
      - 'tests/test_efficiency.py'
      - 'tests/test_intelligence_router.py'
      - 'tests/test_capability_integration.py'
      - 'tests/test_memory.py'
      - 'tests/test_operations.py'
      - 'tests/test_automation_module.py'
      - 'tests/test_immortality_scan.py'
      - 'tests/test_task_queue.py'
      - 'tests/test_task_router_model_scout.py'
      - 'tests/test_self_learning.py'
      - 'tests/test_security_module.py'
      - 'tests/test_coding_module.py'
      - 'tests/test_autonomous_engineering.py'
      - 'tests/test_core_vitality.py'
      - 'tests/test_modules.py'
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: write
  issues: write

env:
  PYTHONPATH: ${{ github.workspace }}
  GENESIS_PROVIDER_URL: http://127.0.0.1:8766
  GENESIS_PROVIDER_NAME: qwen3-1.7b-proactive
  GENESIS_PROVIDER_TIMEOUT_SECONDS: '180'
  GENESIS_PROVIDER_MAX_NEW_TOKENS: '768'
  HF_HOME: ~/.cache/huggingface
  PIP_CACHE_DIR: ~/.cache/pip
  GENESIS_EMAIL_FROM: ${{ secrets.GENESIS_EMAIL_FROM }}
  GENESIS_EMAIL_TO: ${{ secrets.GENESIS_EMAIL_TO }}
  GENESIS_SMTP_USERNAME: ${{ secrets.GENESIS_SMTP_USERNAME }}
  GENESIS_SMTP_APP_PASSWORD: ${{ secrets.GENESIS_SMTP_APP_PASSWORD }}

concurrency:
  group: genesis-proactive-development
  cancel-in-progress: false

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      has_candidate: ${{ steps.candidate.outputs.has_candidate }}
      candidate_branch: ${{ steps.candidate.outputs.candidate_branch }}
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore validated shared Genesis runtime state
        uses: actions/cache@v4
        with:
          path: runtime
          key: gene-runtime-gene-node-1-${{ github.run_id }}-proactive
          restore-keys: |
            gene-runtime-gene-node-1-
      - name: Restore Genesis reasoning caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
          key: genesis-qwen3-1.7b-${{ runner.os }}-py312-v1
      - run: pip install -r requirements.txt
      - name: Verify stable baseline
        run: python -m pytest -q
      - name: Verify Genesis core vitality
        run: python scripts/genesis_core_vitality.py
      - name: Install active local reasoning runtime
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers>=4.51,<5' safetensors
      - name: Start validated reasoning provider
        shell: bash
        run: |
          nohup python scripts/local_reasoning_provider.py --model Qwen/Qwen3-1.7B --host 127.0.0.1 --port 8766 --max-new-tokens 768 > /tmp/genesis-reasoning.log 2>&1 &
          ready=false
          for i in {1..120}; do
            if python - <<'PY'
          import urllib.request
          try:
              with urllib.request.urlopen('http://127.0.0.1:8766/health', timeout=2) as response:
                  raise SystemExit(0 if response.status == 200 else 1)
          except Exception:
              raise SystemExit(1)
          PY
            then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" == true ]]; then
            echo 'GENESIS_AUTONOMOUS_REASONING_PROVIDER=READY'
          else
            echo 'Validated reasoning provider unavailable; Genesis will degrade to bootstrap mode.' >&2
            cat /tmp/genesis-reasoning.log || true
          fi
      - name: Check moving competitive AI reference
        run: python scripts/competitive_reference_monitor.py
      - name: Scan public scientific and cross-domain sources through immortality lens
        run: python scripts/immortality_scan.py
      - name: Advance one persistent Genesis task
        run: python scripts/research_task_worker.py
      - name: Run bounded self-learning pass
        run: python scripts/self_learn.py
      - name: Refresh validated long-term memory
        run: python scripts/memory_sync.py
      - name: Generate pre-repair KPI scorecard
        run: python scripts/system_scorecard.py
      - name: Detect persist and queue Genesis operational issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/genesis_hourly_ops.py collect
          python scripts/genesis_hourly_ops.py sync-issues
      - name: Proactively scout and recommend replacement intelligence models
        run: python scripts/model_scout_worker.py
      - name: Route next persistent TODO task to its owning module
        run: python scripts/task_router.py
      - name: Dispatch AI Team only when routed task needs cross-module specialists
        run: python scripts/ai_team_dispatch.py
      - name: Configure Genesis Git identity
        run: |
          git config user.name "Genesis AI"
          git config user.email "genesis-ai@users.noreply.github.com"
      - name: Security inspection and autonomous Coding pass
        run: python scripts/autonomous_engineering.py
      - name: Feed measured outcomes into capability growth telemetry
        run: python scripts/capability_growth_sync.py
      - name: Run legacy bounded proactive planner if Coding made no candidate
        shell: bash
        run: |
          branch=$(git branch --show-current)
          if [[ "$branch" == "main" ]]; then
            python scripts/proactive_dev.py
          else
            echo "Autonomous Coding already created $branch; skipping second candidate generator."
          fi
      - name: Generate final capability efficiency and mission scorecard
        run: python scripts/system_scorecard.py
      - name: Refresh issue ledger after repair attempt and sync GitHub Issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/genesis_hourly_ops.py collect
          python scripts/genesis_hourly_ops.py sync-issues
      - name: Evaluate repair budget and escalate unresolved issues to ChatGPT
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/genesis_automation.py all
      - name: Publish scheduled Genesis report through GitHub
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/genesis_github_report.py
      - name: Send optional scheduled SMTP copy
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python scripts/genesis_hourly_ops.py email
      - name: Preserve scan score task learning memory security coding efficiency operations and automation evidence
        uses: actions/upload-artifact@v4
        with:
          name: genesis-autonomous-evidence-${{ github.run_id }}
          path: runtime/
          retention-days: 30
      - name: Resolve generated candidate
        id: candidate
        shell: bash
        run: |
          branch=$(git branch --show-current)
          if [[ "$branch" != genesis/candidate-* ]]; then
            echo 'has_candidate=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'has_candidate=true' >> "$GITHUB_OUTPUT"
          echo "candidate_branch=$branch" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  validator_a:
    needs: develop
    if: needs.develop.outputs.has_candidate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.develop.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Independent full test suite A
        run: python -m pytest -q
      - name: Security review candidate A
        run: python - <<'PY'
          from pathlib import Path
          from genesis.security import SecurityModule
          report = SecurityModule(Path('.')).review_candidate('${{ needs.develop.outputs.candidate_sha }}^')
          print(report.as_dict())
          raise SystemExit(0 if report.status == 'pass' else 1)
          PY
      - name: Sign validator A approval
        run: python genesis/ephemeral_validator.py --validator-id proactive-validator-a --candidate ${{ needs.develop.outputs.candidate_sha }} --output validator-a.json
      - uses: actions/upload-artifact@v4
        with:
          name: proactive-validator-a
          path: validator-a.json

  validator_b:
    needs: develop
    if: needs.develop.outputs.has_candidate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.develop.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Independent full test suite B
        run: python -m pytest -q
      - name: Security review candidate B
        run: python - <<'PY'
          from pathlib import Path
          from genesis.security import SecurityModule
          report = SecurityModule(Path('.')).review_candidate('${{ needs.develop.outputs.candidate_sha }}^')
          print(report.as_dict())
          raise SystemExit(0 if report.status == 'pass' else 1)
          PY
      - name: Sign validator B approval
        run: python genesis/ephemeral_validator.py --validator-id proactive-validator-b --candidate ${{ needs.develop.outputs.candidate_sha }} --output validator-b.json
      - uses: actions/upload-artifact@v4
        with:
          name: proactive-validator-b
          path: validator-b.json

  promote:
    needs: [develop, validator_a, validator_b]
    if: needs.develop.outputs.has_candidate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: proactive-validator-a
          path: votes/a
      - uses: actions/download-artifact@v4
        with:
          name: proactive-validator-b
          path: votes/b
      - name: Verify independent signed quorum
        run: python scripts/verify_validator_votes.py votes/a/validator-a.json votes/b/validator-b.json
      - name: Protect identity and promote exact candidate
        shell: bash
        run: |
          candidate='${{ needs.develop.outputs.candidate_sha }}'
          branch='${{ needs.develop.outputs.candidate_branch }}'
          git fetch origin main "$branch"
          main_sha=$(git rev-parse origin/main)
          test "$(git rev-parse origin/$branch)" = "$candidate"
          git merge-base --is-ancestor "$main_sha" "$candidate"
          if git diff --name-only "$main_sha..$candidate" | grep -Eq '^(GENESIS_CONSTITUTION.md|GENESIS_BLOCK.json|\.github/)'; then
            echo 'Protected Genesis identity/workflow boundary changed' >&2
            exit 1
          fi
          git push origin "$candidate:refs/heads/main"
