name: Genesis Proactive Development

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/proactive-development.yml'
      - 'genesis/proactive.py'
      - 'genesis/ai_score.py'
      - 'genesis/immortality_scan.py'
      - 'genesis/selfdev.py'
      - 'genesis/modules/**'
      - 'config/modules.json'
      - 'config/immortality_sources.json'
      - 'scripts/proactive_dev.py'
      - 'scripts/immortality_scan.py'
      - 'tests/test_proactive.py'
      - 'tests/test_ai_score.py'
      - 'tests/test_immortality_scan.py'
      - 'tests/test_modules.py'
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: write

env:
  PYTHONPATH: ${{ github.workspace }}
  GENESIS_PROVIDER_URL: http://127.0.0.1:8766
  GENESIS_PROVIDER_NAME: qwen3-0.6b-local
  HF_HOME: ~/.cache/huggingface
  PIP_CACHE_DIR: ~/.cache/pip

concurrency:
  group: genesis-proactive-development
  cancel-in-progress: false

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      has_candidate: ${{ steps.candidate.outputs.has_candidate }}
      candidate_branch: ${{ steps.candidate.outputs.candidate_branch }}
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore Genesis reasoning caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
          key: genesis-qwen3-0.6b-${{ runner.os }}-py312-v1
      - run: pip install -r requirements.txt
      - name: Verify stable baseline
        run: python -m pytest -q
      - name: Install active local reasoning runtime
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers>=4.51,<5' safetensors
      - name: Start validated reasoning provider
        shell: bash
        run: |
          nohup python scripts/local_reasoning_provider.py --host 127.0.0.1 --port 8766 > /tmp/genesis-reasoning.log 2>&1 &
          ready=false
          for i in {1..60}; do
            if python - <<'PY'
          import urllib.request
          try:
              with urllib.request.urlopen('http://127.0.0.1:8766/health', timeout=2) as response:
                  raise SystemExit(0 if response.status == 200 else 1)
          except Exception:
              raise SystemExit(1)
          PY
            then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" == true ]]; then
            echo 'GENESIS_AUTONOMOUS_REASONING_PROVIDER=READY'
          else
            echo 'Validated reasoning provider unavailable; Genesis will degrade to bootstrap mode.' >&2
            cat /tmp/genesis-reasoning.log || true
          fi
      - name: Scan public scientific and cross-domain sources through immortality lens
        run: python scripts/immortality_scan.py
      - name: Preserve scan and AI score evidence
        uses: actions/upload-artifact@v4
        with:
          name: genesis-immortality-scan-${{ github.run_id }}
          path: runtime/
          retention-days: 30
      - name: Configure Genesis Git identity
        run: |
          git config user.name "Genesis AI"
          git config user.email "genesis-ai@users.noreply.github.com"
      - name: Inspect and develop one bounded improvement
        run: python scripts/proactive_dev.py
      - name: Resolve generated candidate
        id: candidate
        shell: bash
        run: |
          branch=$(git branch --show-current)
          if [[ "$branch" != genesis/candidate-* ]]; then
            echo 'has_candidate=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'has_candidate=true' >> "$GITHUB_OUTPUT"
          echo "candidate_branch=$branch" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  validator_a:
    needs: develop
    if: needs.develop.outputs.has_candidate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.develop.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Independent full test suite A
        run: python -m pytest -q
      - name: Sign validator A approval
        run: python genesis/ephemeral_validator.py --validator-id proactive-validator-a --candidate ${{ needs.develop.outputs.candidate_sha }} --output validator-a.json
      - uses: actions/upload-artifact@v4
        with:
          name: proactive-validator-a
          path: validator-a.json

  validator_b:
    needs: develop
    if: needs.develop.outputs.has_candidate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.develop.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Independent full test suite B
        run: python -m pytest -q
      - name: Sign validator B approval
        run: python genesis/ephemeral_validator.py --validator-id proactive-validator-b --candidate ${{ needs.develop.outputs.candidate_sha }} --output validator-b.json
      - uses: actions/upload-artifact@v4
        with:
          name: proactive-validator-b
          path: validator-b.json

  promote:
    needs: [develop, validator_a, validator_b]
    if: needs.develop.outputs.has_candidate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: proactive-validator-a
          path: votes/a
      - uses: actions/download-artifact@v4
        with:
          name: proactive-validator-b
          path: votes/b
      - name: Verify independent signed quorum
        run: python scripts/verify_validator_votes.py votes/a/validator-a.json votes/b/validator-b.json
      - name: Protect identity and promote exact candidate
        shell: bash
        run: |
          candidate='${{ needs.develop.outputs.candidate_sha }}'
          branch='${{ needs.develop.outputs.candidate_branch }}'
          git fetch origin main "$branch"
          main_sha=$(git rev-parse origin/main)
          test "$(git rev-parse origin/$branch)" = "$candidate"
          git merge-base --is-ancestor "$main_sha" "$candidate"
          if git diff --name-only "$main_sha..$candidate" | grep -Eq '^(GENESIS_CONSTITUTION.md|GENESIS_BLOCK.json)$'; then
            echo 'Protected Genesis identity file changed' >&2
            exit 1
          fi
          git push origin "$candidate:refs/heads/main"
