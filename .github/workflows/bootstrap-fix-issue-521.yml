name: Bootstrap Fix Issue 521

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-fix-issue-521.yml'
      - 'scripts/bootstrap_fix_issue_521.py'
      - 'tests/test_github_issue_autorepair_claim_release.py'

permissions:
  contents: write

jobs:
  repair-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository dependencies
        run: pip install -r requirements.txt
      - name: Apply bounded bootstrap repair
        run: python scripts/bootstrap_fix_issue_521.py
      - name: Run focused regression tests
        run: >-
          python -m pytest -q
          tests/test_deterministic_capability_builder.py
          tests/test_issue_scheduler_fairness.py
          tests/test_old_issue_drain_regression.py
          tests/test_adaptive_pulse_scheduler.py
          tests/test_github_issue_autorepair_claim_release.py
          tests/test_github_issue_autorepair_heartbeat_workflow.py
          tests/test_github_issue_autorepair_integration_transaction.py
      - name: Run full baseline
        run: python -m pytest -q
      - name: Commit verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Genesis Bootstrap Repair"
          git config user.email "genesis-ai@users.noreply.github.com"
          git add \
            genesis/autonomous_engineering.py \
            genesis/efficient_engineering.py \
            tests/test_adaptive_pulse_scheduler.py \
            tests/test_github_issue_autorepair_claim_release.py \
            tests/test_github_issue_autorepair_heartbeat_workflow.py \
            tests/test_github_issue_autorepair_integration_transaction.py
          if git diff --cached --quiet; then
            echo 'No repair changes were required.'
            exit 0
          fi
          git commit -m 'fix: restore Genesis autorepair baseline'
          git push origin HEAD:main
