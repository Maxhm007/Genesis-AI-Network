name: Genesis Discovery Silence Watchdog

# Discovery producer only; Genesis Issue Opening Manager owns automatic scheduling.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  actions: write

concurrency:
  group: genesis-discovery-silence-watchdog
  cancel-in-progress: true

jobs:
  detect-silent-opener:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Detect prolonged issue-opening silence
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GENESIS_DISCOVERY_SILENCE_HOURS: '6'
        run: python scripts/discovery_silence_watchdog.py --repository "$GITHUB_REPOSITORY"

