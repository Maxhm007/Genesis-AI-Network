name: Genesis recovery canary

# A safe, intentionally failing first attempt verifies real Actions retry recovery.
# No external secrets, application changes, or recurring schedule.
# After the first failed attempt, the self-heal workflow retries failed jobs once.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recovery-canary.yml'
      - '.github/workflows/self-heal.yml'

permissions:
  contents: read
  issues: write

jobs:
  recovery-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Intentional first-attempt failure to exercise autonomous recovery
        if: ${{ github.run_attempt == 1 }}
        run: |
          echo 'Expected canary failure: recovery watchdog must retry failed jobs once.'
          exit 1
      - name: Prove recovery retry succeeded
        if: ${{ github.run_attempt > 1 }}
        run: |
          echo 'RECOVERY_CANARY_PASSED: autonomous watchdog retried this workflow.'
      - name: Record successful retry as a searchable evidence issue
        if: ${{ github.run_attempt > 1 }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title="[Recovery Proof] Genesis canary run ${GITHUB_RUN_ID}"
          if gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 100 --json title --jq '.[].title' | grep -Fxq "$title"; then
            echo 'Evidence issue already exists; no duplicate created.'
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "Recovery canary succeeded on attempt ${GITHUB_RUN_ATTEMPT}. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Confirm watchdog initiated the retry before treating this as autonomous healing proof."
          fi
