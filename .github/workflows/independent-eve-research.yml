name: Genesis independent Eve peer research

on:
  pull_request:
    paths:
      - 'scripts/peer_autonomy.py'
      - 'tests/test_peer_autonomy.py'
      - '.github/workflows/independent-eve-research.yml'
  schedule:
    # Daily at 08:00 Asia/Dhaka.
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: genesis-independent-peer-research
  cancel-in-progress: false

jobs:
  unit-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_peer_autonomy.py -v

  peer-cycle:
    if: github.event_name != 'pull_request' && vars.PEER_MODEL_ENDPOINT != '' && vars.PEER_MODEL_NAME != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Genesis independent model and signing setup
        env:
          PEER_SIGNING_SECRET: ${{ secrets.PEER_SIGNING_SECRET }}
          PEER_VERIFY_SECRET: ${{ secrets.PEER_VERIFY_SECRET }}
          PEER_MODEL_ENDPOINT: ${{ vars.PEER_MODEL_ENDPOINT }}
          PEER_MODEL_NAME: ${{ vars.PEER_MODEL_NAME }}
        shell: bash
        run: |
          if [[ ${#PEER_SIGNING_SECRET} -lt 32 || ${#PEER_VERIFY_SECRET} -lt 32 || -z "$PEER_MODEL_ENDPOINT" || -z "$PEER_MODEL_NAME" ]]; then
            echo "::error::Genesis peer reasoning blocked: configure signing and verification secrets and model endpoint/name."
            echo "## Genesis peer research blocked" >> "$GITHUB_STEP_SUMMARY"
            echo "Peer credentials and independently configured model are required." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Independently critique or publish one proposal
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PEER_SIGNING_SECRET: ${{ secrets.PEER_SIGNING_SECRET }}
          PEER_VERIFY_SECRET: ${{ secrets.PEER_VERIFY_SECRET }}
          PEER_MODEL_ENDPOINT: ${{ vars.PEER_MODEL_ENDPOINT }}
          PEER_MODEL_NAME: ${{ vars.PEER_MODEL_NAME }}
          PEER_MODEL_API_KEY: ${{ secrets.PEER_MODEL_API_KEY }}
        run: python scripts/peer_autonomy.py --identity genesis
