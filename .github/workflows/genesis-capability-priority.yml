name: Genesis Capability Priority

# Manual compatibility/advisory tool only; Agentic Lab owns live priority ordering.
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: read

concurrency:
  group: genesis-capability-priority
  cancel-in-progress: false

jobs:
  prioritize-capability-issues:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Run actions/setup-python@v5
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prioritize unresolved capability issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/capability_issue_priority_dispatch.py
