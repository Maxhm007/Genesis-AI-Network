name: Genesis Recovery Solver

# Compatibility trigger only.
# Agentic Lab owns recovery strategy and worker selection.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/genesis-recovery-solver.yml
      - scripts/agentic_lab_recovery_dispatch.py
      - scripts/agentic_parallel_dispatch.py
      - .github/workflows/genesis-agentic-lab-recovery.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: genesis-recovery-solver
  cancel-in-progress: true

jobs:
  handoff-to-agentic-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake authoritative Agentic Lab
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Recovery Solver is feeder-only. Agentic Lab owns recovery strategy."
          gh workflow run genesis-agentic-lab-recovery.yml --repo "$GITHUB_REPOSITORY" --ref main
