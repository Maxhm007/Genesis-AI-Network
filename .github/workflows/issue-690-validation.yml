name: Issue 690 Validation

on:
  push:
    branches:
      - genesis/refine-universal-issue-solver

permissions:
  contents: write

concurrency:
  group: issue-690-validation
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: genesis/refine-universal-issue-solver
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply lifecycle patch
        run: python scripts/issue_690_patch.py
      - name: Install requirements
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Focused tests
        run: python -m pytest -q tests/test_github_issue_cleanup.py tests/test_requeue_exhausted_issues.py tests/test_github_issue_autorepair_workflow.py
      - name: Full repository tests
        run: python -m pytest -q
      - name: Commit tested solver refinement and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/issue_690_patch.py .github/workflows/issue-690-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Refine issue solver full lifecycle (#690)'
          git push origin HEAD:genesis/refine-universal-issue-solver
