name: Validate Issue 701

on:
  push:
    branches:
      - genesis/restore-auto-issue-discovery-701
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: genesis/restore-auto-issue-discovery-701
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Focused discovery tests
        run: python -m pytest -q tests/test_issue_discovery_engine.py tests/test_github_issue_discovery.py tests/test_recent_ai_capability_discovery.py tests/test_issue_discovery_workflows.py
      - name: Full repository suite
        run: python -m pytest -q
