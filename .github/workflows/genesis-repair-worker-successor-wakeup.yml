name: Genesis Repair Worker Successor Wakeup

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Genesis Specialist Repair Worker v2
      - Genesis DeepSeek Agentic Solver
    types:
      - completed
  push:
    branches: [main]
    paths:
      - .github/workflows/genesis-repair-worker-successor-wakeup.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: genesis-repair-worker-successor-wakeup
  cancel-in-progress: true

jobs:
  wake-agentic-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake Agentic Lab after worker completion
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run genesis-agentic-lab-recovery.yml --repo "$GITHUB_REPOSITORY" --ref main
