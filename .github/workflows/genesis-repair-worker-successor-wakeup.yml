name: Genesis Repair Worker Successor Wakeup

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Genesis Specialist Repair Worker v2
      - Genesis DeepSeek Agentic Solver
    types:
      - completed
  push:
    branches: [main]
    paths:
      - .github/workflows/genesis-repair-worker-successor-wakeup.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: genesis-repair-worker-successor-wakeup
  cancel-in-progress: true

jobs:
  wake-agentic-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake Agentic Lab after worker completion
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          active_count="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow genesis-agentic-lab-recovery.yml \
            --limit 20 \
            --json status,createdAt,event \
            --jq '[.[] | select(.event != "push" and .event != "pull_request") | select(.status != "completed" or (now - (.createdAt | fromdateiso8601)) < 120)] | length')"
          if [[ "$active_count" -gt 0 ]]; then
            echo "Agentic Lab Recovery already active or woken <2 min ago ($active_count run(s)); duplicate successor wake skipped."
            exit 0
          fi
          gh workflow run genesis-agentic-lab-recovery.yml --repo "$GITHUB_REPOSITORY" --ref main
