name: Genesis Priority Issue Solver

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/genesis-priority-issue-solver.yml

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: genesis-priority-issue-solver
  cancel-in-progress: true

jobs:
  continuous-priority-issue-solver:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run highest-priority eligible issue solver loop
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          marker='<!-- genesis-priority-issue-solver -->'
          interval=660
          max_attempts=3

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            max_cycles=1
            echo "Bootstrap mode: one immediate priority issue-solver cycle"
          else
            max_cycles=30
            echo "Continuous mode: one priority issue-solver cycle every 11 minutes"
          fi

          ensure_label() {
            local name="$1"
            local color="$2"
            local description="$3"
            if ! gh label list --repo "$GITHUB_REPOSITORY" --limit 200 --json name \
              | jq -e --arg name "$name" 'any(.[]; .name == $name)' >/dev/null; then
              gh label create "$name" --repo "$GITHUB_REPOSITORY" \
                --color "$color" --description "$description"
            fi
          }

          add_label() {
            gh issue edit "$1" --repo "$GITHUB_REPOSITORY" --add-label "$2" >/dev/null
          }

          remove_label() {
            gh issue edit "$1" --repo "$GITHUB_REPOSITORY" --remove-label "$2" >/dev/null 2>&1 || true
          }

          upsert_status() {
            local issue_number="$1"
            local body="$2"
            local comment_id
            comment_id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${issue_number}/comments?per_page=100" \
              | jq -r --arg marker "$marker" '[.[] | select((.body // "") | startswith($marker))][0].id // empty')
            if [ -n "$comment_id" ]; then
              gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
                --method PATCH -f body="$body" >/dev/null
            else
              gh api "repos/${GITHUB_REPOSITORY}/issues/${issue_number}/comments" \
                --method POST -f body="$body" >/dev/null
            fi
          }

          get_previous_attempt() {
            local issue_number="$1"
            gh api "repos/${GITHUB_REPOSITORY}/issues/${issue_number}/comments?per_page=100" \
              | jq -r --arg marker "$marker" \
                '[.[] | select((.body // "") | startswith($marker))][0].body // ""' \
              | sed -nE 's/.*genesis-priority-solver-attempt:([0-9]+).*/\1/p' \
              | head -n1
          }

          ensure_label genesis-priority-claim 8a2be2 'Temporary claim by the independent Genesis priority solver'
          ensure_label genesis-priority-exhausted 6e7781 'Priority solver exhausted its bounded dispatch attempts'
          ensure_label genesis-repair-in-progress b60205 'Reserved for one bounded Genesis repair worker'
          ensure_label genesis-autonomous 1f883d 'Authorized for Genesis autonomous repair'

          for cycle in $(seq 1 "$max_cycles"); do
            echo "=== Genesis priority issue solver cycle $cycle/$max_cycles ==="
            git fetch origin main
            git reset --hard origin/main

            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=open&sort=created&direction=asc&per_page=100" --jq '.[]' | jq -s '.' > /tmp/genesis-priority-open-issues.json

            issue_number=$(python - <<'PY'
          import json
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          issues = json.loads(Path('/tmp/genesis-priority-open-issues.json').read_text())
          protected_targets = {
              'genesis/autonomy_guard.py',
              'genesis/autonomy_proof.py',
              'genesis/blockchain.py',
              'genesis/ephemeral_validator.py',
              'genesis/security.py',
              'genesis/selfdev.py',
              'genesis/issue_solver.py',
              'genesis/file_self_review.py',
              'genesis/file_self_review_policy.py',
          }
          active_labels = {
              'genesis-claimed',
              'genesis-working',
              'genesis-verifying',
              'genesis-repair-in-progress',
              'genesis-validating',
              'genesis-priority-claim',
          }

          ranked = []
          for issue in issues:
              if issue.get('pull_request'):
                  continue
              number = int(issue.get('number') or 0)
              title = str(issue.get('title') or '')
              body = str(issue.get('body') or '')
              labels = {str(x.get('name') or '') for x in issue.get('labels') or [] if isinstance(x, dict)}
              lower_title = title.lower()
              lower_body = body.lower()

              if number == 1:
                  continue
              if lower_title.startswith(('genesis chat:', '[genesis hourly report]', '[genesis gene chat]')):
                  continue
              if 'persistent github-native reporting channel' in lower_body:
                  continue
              if 'external-authority / independent-secret provisioning blocker' in lower_body:
                  continue
              if lower_title.startswith('[genesis escalation] ai capability below target'):
                  continue
              if lower_title.startswith('[genesis ops] ai capability below target'):
                  continue
              if lower_title.startswith('genesis model lab:'):
                  continue
              if labels & active_labels:
                  continue
              if 'genesis-priority-exhausted' in labels:
                  continue

              priority_match = re.search(r'^- \*\*Priority:\*\*\s*`?(\d+)`?\s*$', body, re.MULTILINE)
              if not priority_match:
                  continue
              priority = max(0, min(100, int(priority_match.group(1))))

              requires_measurement = any(
                  phrase in lower_body
                  for phrase in (
                      'post-promotion benchmark',
                      'post-promotion remeasurement',
                      'benchmark re-measurement',
                      'benchmark remeasurement',
                      'measured score improves',
                      'same comparable benchmark',
                  )
              )
              if requires_measurement:
                  continue

              target_match = re.search(r'^- \*\*Target:\*\* `([^`]+)`', body, re.MULTILINE)
              target = target_match.group(1).strip() if target_match else ''
              if not target.startswith('genesis/') or not target.endswith('.py'):
                  continue
              if '..' in target or target in protected_targets:
                  continue
              if not Path(target).is_file():
                  continue

              created_raw = str(issue.get('created_at') or '')
              try:
                  created = datetime.fromisoformat(created_raw.replace('Z', '+00:00'))
              except ValueError:
                  created = datetime.now(timezone.utc)

              ranked.append((-priority, created, number))

          ranked.sort()
          if ranked:
              print(ranked[0][2])
          PY
            )

            checked_at=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
            if [ -z "$issue_number" ]; then
              echo "No eligible priority issue found at $checked_at"
            else
              issue_json=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${issue_number}")
              title=$(printf '%s' "$issue_json" | jq -r '.title')
              body_text=$(printf '%s' "$issue_json" | jq -r '.body // ""')
              priority=$(printf '%s' "$body_text" | sed -nE 's/^- \*\*Priority:\*\* `?([0-9]+)`?.*/\1/p' | head -n1)
              target=$(printf '%s' "$body_text" | sed -nE 's/^- \*\*Target:\*\* `([^`]+)`.*/\1/p' | head -n1)

              previous_attempt=$(get_previous_attempt "$issue_number" || true)
              previous_attempt=${previous_attempt:-0}
              attempt=$((previous_attempt + 1))
              if [ "$attempt" -gt "$max_attempts" ]; then
                add_label "$issue_number" genesis-priority-exhausted
                echo "Priority attempts already exhausted for #$issue_number"
              else
                echo "Priority solver tentatively claiming #$issue_number at priority ${priority:-0} (attempt $attempt/$max_attempts)"
                add_label "$issue_number" genesis-priority-claim

                sleep 3
                refreshed=$(gh issue view "$issue_number" --repo "$GITHUB_REPOSITORY" --json state,labels)
                state=$(printf '%s' "$refreshed" | jq -r '.state')
                conflicting=$(printf '%s' "$refreshed" | jq -r '([.labels[].name] | any(. == "genesis-claimed" or . == "genesis-working" or . == "genesis-verifying" or . == "genesis-repair-in-progress" or . == "genesis-validating"))')

                if [[ "$state" != "OPEN" || "$conflicting" == "true" ]]; then
                  echo "Priority solver backed off #$issue_number because another solver owns it"
                  remove_label "$issue_number" genesis-priority-claim
                else
                  add_label "$issue_number" genesis-repair-in-progress
                  add_label "$issue_number" genesis-autonomous
                  remove_label "$issue_number" genesis-blocked
                  remove_label "$issue_number" genesis-solver-exhausted
                  remove_label "$issue_number" genesis-priority-claim

                  if [ "$attempt" -ge "$max_attempts" ]; then
                    add_label "$issue_number" genesis-priority-exhausted
                  fi

                  status_body=$(printf '%s\n<!-- genesis-priority-solver-attempt:%s -->\n**Genesis Priority Issue Solver — bounded repair dispatched**\n\n- Issue: #%s — %s\n- Numeric priority: **%s**\n- Dispatched (UTC): %s\n- Priority solver run: %s\n- Cycle: %s/%s\n- Attempt: **%s/%s**\n- Target: `%s`\n- State: **reserved for the shared bounded repair worker**\n\nSelection is highest numeric priority first; creation time is used only to break equal-priority ties. Issues already owned by the oldest solver are skipped.' \
                    "$marker" "$attempt" "$issue_number" "$title" "${priority:-0}" "$checked_at" "$GITHUB_RUN_ID" "$cycle" "$max_cycles" "$attempt" "$max_attempts" "$target")
                  upsert_status "$issue_number" "$status_body"

                  if ! gh workflow run genesis-bounded-repair-worker.yml \
                    --repo "$GITHUB_REPOSITORY" --ref main -f issue_number="$issue_number"; then
                    echo "Bounded repair worker dispatch failed for #$issue_number"
                    remove_label "$issue_number" genesis-repair-in-progress
                    if [ "$attempt" -lt "$max_attempts" ]; then
                      remove_label "$issue_number" genesis-priority-exhausted
                    fi
                  fi
                fi
              fi
            fi
