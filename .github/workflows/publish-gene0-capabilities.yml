name: Publish Gene 0 Capability Manifest

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - GENE_CAPABILITY_EXPORT.json
      - GENESIS_CONSTITUTION.md
      - KNOWLEDGE_POLICY.md
      - AUTONOMY_SPEC.md
      - DISTRIBUTION_PROTOCOL.md
      - gene_core/**
      - scripts/build_capability_manifest.py
      - .github/workflows/publish-gene0-capabilities.yml

permissions:
  contents: write

concurrency:
  group: gene0-capability-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build capability manifest
        run: python scripts/build_capability_manifest.py
      - name: Validate manifest JSON
        run: python -m json.tool GENE_CAPABILITY_MANIFEST.json >/dev/null
      - name: Publish changed manifest
        run: |
          git config user.name "Gene 0"
          git config user.email "gene-0@users.noreply.github.com"
          git add GENE_CAPABILITY_MANIFEST.json
          if git diff --cached --quiet; then
            echo "Capability manifest already current"
            exit 0
          fi
          git commit -m "Publish Gene 0 capability manifest"
          git push origin HEAD:main
