name: Genesis Parallel Autonomous Development

on:
  workflow_dispatch:
  schedule:
    - cron: '22,52 * * * *'

permissions:
  contents: write
  issues: write

env:
  PYTHONPATH: ${{ github.workspace }}
  GENESIS_PROVIDER_URL: http://127.0.0.1:8766
  GENESIS_PROVIDER_NAME: qwen3-0.6b-local
  GENESIS_PROVIDER_TIMEOUT_SECONDS: '180'
  HF_HOME: ~/.cache/huggingface
  PIP_CACHE_DIR: ~/.cache/pip

concurrency:
  group: genesis-development-mutator
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      has_tasks: ${{ steps.plan.outputs.has_tasks }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore persistent Genesis runtime state
        uses: actions/cache@v4
        with:
          path: |
            runtime/genesis_tasks.sqlite3
            runtime/self_learning.sqlite3
            runtime/memory.sqlite3
            runtime/efficiency.jsonl
            runtime/ai_score_history.jsonl
            runtime/provider_telemetry.json
            runtime/operations_issues.jsonl
          key: genesis-runtime-${{ runner.os }}-${{ github.run_id }}-parallel-plan
          restore-keys: |
            genesis-runtime-${{ runner.os }}-
      - run: pip install -r requirements.txt
      - name: Plan independent bounded work
        id: plan
        run: python scripts/parallel_engineering.py plan
      - uses: actions/upload-artifact@v4
        with:
          name: parallel-plan-${{ github.run_id }}
          path: runtime/parallel_plan.json

  candidates:
    needs: plan
    if: needs.plan.outputs.has_tasks == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore exact planned runtime snapshot
        uses: actions/cache@v4
        with:
          path: |
            runtime/genesis_tasks.sqlite3
            runtime/self_learning.sqlite3
            runtime/memory.sqlite3
            runtime/efficiency.jsonl
            runtime/ai_score_history.jsonl
            runtime/provider_telemetry.json
            runtime/operations_issues.jsonl
          key: genesis-runtime-${{ runner.os }}-${{ github.run_id }}-parallel-plan
      - name: Restore reasoning caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
          key: genesis-qwen3-0.6b-${{ runner.os }}-py312-v1
      - run: pip install -r requirements.txt
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers>=4.51,<5' safetensors
      - name: Start isolated validated reasoning provider
        shell: bash
        run: |
          nohup python scripts/local_reasoning_provider.py --host 127.0.0.1 --port 8766 > /tmp/genesis-parallel-reasoning.log 2>&1 &
          for i in {1..60}; do
            if python - <<'PY'
          import urllib.request
          try:
              with urllib.request.urlopen('http://127.0.0.1:8766/health', timeout=2) as response:
                  raise SystemExit(0 if response.status == 200 else 1)
          except Exception:
              raise SystemExit(1)
          PY
            then break; fi
            sleep 2
          done
      - name: Configure Genesis Git identity
        run: |
          git config user.name "Genesis AI"
          git config user.email "genesis-ai@users.noreply.github.com"
      - name: Execute exact isolated task
        env:
          GENESIS_PARALLEL_RANK: ${{ matrix.rank }}
        run: python scripts/parallel_engineering.py worker --task-id '${{ matrix.task_id }}'
      - name: Push candidate branch only when a candidate exists
        shell: bash
        run: |
          result='runtime/parallel_result_${{ matrix.task_id }}.json'
          has=$(python -c "import json; print(str(json.load(open('$result')).get('has_candidate', False)).lower())")
          if [[ "$has" != "true" ]]; then exit 0; fi
          branch=$(python -c "import json; print(json.load(open('$result'))['candidate_branch'])")
          sha=$(python -c "import json; print(json.load(open('$result'))['candidate_sha'])")
          test "$(git rev-parse HEAD)" = "$sha"
          git push origin "HEAD:refs/heads/$branch"
      - uses: actions/upload-artifact@v4
        with:
          name: parallel-candidate-${{ matrix.task_id }}
          path: runtime/parallel_result_${{ matrix.task_id }}.json
          if-no-files-found: warn

  validator_a:
    needs: [plan, candidates]
    if: needs.plan.outputs.has_tasks == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: parallel-candidate-${{ matrix.task_id }}
          path: candidate
      - id: meta
        shell: bash
        run: |
          file='candidate/parallel_result_${{ matrix.task_id }}.json'
          if [[ ! -f "$file" ]]; then echo 'has_candidate=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "has_candidate=$(python -c "import json; print(str(json.load(open('$file')).get('has_candidate', False)).lower())")" >> "$GITHUB_OUTPUT"
          echo "sha=$(python -c "import json; print(json.load(open('$file')).get('candidate_sha',''))")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.meta.outputs.has_candidate == 'true'
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
        if: steps.meta.outputs.has_candidate == 'true'
      - name: Checkout exact candidate A
        if: steps.meta.outputs.has_candidate == 'true'
        run: |
          git fetch origin '${{ steps.meta.outputs.sha }}'
          git checkout --detach '${{ steps.meta.outputs.sha }}'
      - name: Independent full test suite A
        if: steps.meta.outputs.has_candidate == 'true'
        run: python -m pytest -q
      - name: Security review A
        if: steps.meta.outputs.has_candidate == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          from genesis.security import SecurityModule
          report = SecurityModule(Path('.')).review_candidate('HEAD^')
          print(report.as_dict())
          raise SystemExit(0 if report.status == 'pass' else 1)
          PY
      - name: Sign validator A
        if: steps.meta.outputs.has_candidate == 'true'
        run: python genesis/ephemeral_validator.py --validator-id parallel-validator-a --candidate '${{ steps.meta.outputs.sha }}' --output 'validator_a_${{ matrix.task_id }}.json'
      - uses: actions/upload-artifact@v4
        if: steps.meta.outputs.has_candidate == 'true'
        with:
          name: parallel-validator-a-${{ matrix.task_id }}
          path: validator_a_${{ matrix.task_id }}.json

  validator_b:
    needs: [plan, candidates]
    if: needs.plan.outputs.has_tasks == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: parallel-candidate-${{ matrix.task_id }}
          path: candidate
      - id: meta
        shell: bash
        run: |
          file='candidate/parallel_result_${{ matrix.task_id }}.json'
          if [[ ! -f "$file" ]]; then echo 'has_candidate=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "has_candidate=$(python -c "import json; print(str(json.load(open('$file')).get('has_candidate', False)).lower())")" >> "$GITHUB_OUTPUT"
          echo "sha=$(python -c "import json; print(json.load(open('$file')).get('candidate_sha',''))")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.meta.outputs.has_candidate == 'true'
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
        if: steps.meta.outputs.has_candidate == 'true'
      - name: Checkout exact candidate B
        if: steps.meta.outputs.has_candidate == 'true'
        run: |
          git fetch origin '${{ steps.meta.outputs.sha }}'
          git checkout --detach '${{ steps.meta.outputs.sha }}'
      - name: Independent full test suite B
        if: steps.meta.outputs.has_candidate == 'true'
        run: python -m pytest -q
      - name: Security review B
        if: steps.meta.outputs.has_candidate == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          from genesis.security import SecurityModule
          report = SecurityModule(Path('.')).review_candidate('HEAD^')
          print(report.as_dict())
          raise SystemExit(0 if report.status == 'pass' else 1)
          PY
      - name: Sign validator B
        if: steps.meta.outputs.has_candidate == 'true'
        run: python genesis/ephemeral_validator.py --validator-id parallel-validator-b --candidate '${{ steps.meta.outputs.sha }}' --output 'validator_b_${{ matrix.task_id }}.json'
      - uses: actions/upload-artifact@v4
        if: steps.meta.outputs.has_candidate == 'true'
        with:
          name: parallel-validator-b-${{ matrix.task_id }}
          path: validator_b_${{ matrix.task_id }}.json

  select_promotion:
    needs: [plan, candidates, validator_a, validator_b]
    if: always() && needs.plan.outputs.has_tasks == 'true'
    runs-on: ubuntu-latest
    outputs:
      has_candidate: ${{ steps.select.outputs.has_candidate }}
      task_id: ${{ steps.select.outputs.task_id }}
      candidate_branch: ${{ steps.select.outputs.candidate_branch }}
      candidate_sha: ${{ steps.select.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: parallel-candidate-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: parallel-validator-*
          path: artifacts
          merge-multiple: true
      - id: select
        run: python scripts/parallel_engineering.py select --artifacts artifacts
      - uses: actions/upload-artifact@v4
        if: steps.select.outputs.has_candidate == 'true'
        with:
          name: parallel-promotion-selection-${{ github.run_id }}
          path: |
            runtime/parallel_promotion.json
            runtime/selected_validator_a.json
            runtime/selected_validator_b.json

  promote:
    needs: select_promotion
    if: needs.select_promotion.outputs.has_candidate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: parallel-promotion-selection-${{ github.run_id }}
          path: runtime
      - name: Verify exact signed validator quorum
        run: python scripts/verify_validator_votes.py runtime/selected_validator_a.json runtime/selected_validator_b.json
      - name: Recheck exact candidate and promote serially
        shell: bash
        run: |
          set -euo pipefail
          candidate='${{ needs.select_promotion.outputs.candidate_sha }}'
          branch='${{ needs.select_promotion.outputs.candidate_branch }}'
          git fetch origin main "$branch"
          test "$(git rev-parse origin/$branch)" = "$candidate"
          main_sha=$(git rev-parse origin/main)
          if ! git merge-base --is-ancestor "$main_sha" "$candidate"; then
            echo 'Main moved; keep candidate for a fresh rebase/revalidation cycle.'
            exit 2
          fi
          if git diff --name-only "$main_sha..$candidate" | grep -Eq '^(GENESIS_CONSTITUTION.md|GENESIS_BLOCK.json|\.github/)'; then
            echo 'Protected boundary changed' >&2
            exit 1
          fi
          git checkout --detach "$candidate"
          python -m pytest -q
          python - <<PY
          from pathlib import Path
          from genesis.security import SecurityModule
          report = SecurityModule(Path('.')).review_candidate('$main_sha')
          print(report.as_dict())
          raise SystemExit(0 if report.status == 'pass' else 1)
          PY
          git push origin "$candidate:refs/heads/main"
      - name: Record successful serial promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('runtime/parallel_promotion.json')
          data = json.loads(path.read_text())
          data['promoted'] = True
          path.write_text(json.dumps(data, indent=2, sort_keys=True) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: parallel-promotion-result-${{ github.run_id }}
          path: runtime/parallel_promotion.json

  reconcile:
    needs: [plan, candidates, select_promotion, promote]
    if: always() && needs.plan.outputs.has_tasks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore exact planned runtime snapshot
        uses: actions/cache@v4
        with:
          path: |
            runtime/genesis_tasks.sqlite3
            runtime/self_learning.sqlite3
            runtime/memory.sqlite3
            runtime/efficiency.jsonl
            runtime/ai_score_history.jsonl
            runtime/provider_telemetry.json
            runtime/operations_issues.jsonl
          key: genesis-runtime-${{ runner.os }}-${{ github.run_id }}-parallel-plan
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: parallel-candidate-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: parallel-promotion-result-${{ github.run_id }}
          path: runtime
      - name: Reconcile isolated outcomes into persistent task state
        run: python scripts/parallel_engineering.py reconcile --artifacts artifacts
      - name: Save reconciled runtime for next Genesis cycle
        uses: actions/cache/save@v4
        with:
          path: |
            runtime/genesis_tasks.sqlite3
            runtime/self_learning.sqlite3
            runtime/memory.sqlite3
            runtime/efficiency.jsonl
            runtime/ai_score_history.jsonl
            runtime/provider_telemetry.json
            runtime/operations_issues.jsonl
          key: genesis-runtime-${{ runner.os }}-${{ github.run_id }}-parallel-reconciled
      - uses: actions/upload-artifact@v4
        with:
          name: parallel-development-evidence-${{ github.run_id }}
          path: |
            runtime/parallel_plan.json
            runtime/parallel_reconcile.json
            runtime/parallel_promotion.json
          if-no-files-found: warn
