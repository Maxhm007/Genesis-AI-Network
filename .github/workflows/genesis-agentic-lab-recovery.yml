name: Genesis Agentic Lab Recovery

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  issues:
    types: [labeled, reopened]

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: genesis-agentic-lab-recovery
  cancel-in-progress: false

jobs:
  dispatch-oldest-agentic-issue:
    if: >-
      github.event_name != 'issues' ||
      github.event.label.name == 'agentic-lab'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Select and reserve oldest Agentic Lab issue
        id: queue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          rows=$(gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/issues?state=all&labels=agentic-lab&sort=created&direction=asc&per_page=100" \
            --jq '.[] | select(.pull_request == null) | {number,state,body,labels:[.labels[].name]}')

          issue_number=''
          target=''
          lane=''

          while IFS= read -r row; do
            [[ -n "$row" ]] || continue
            number=$(jq -r '.number' <<<"$row")
            state=$(jq -r '.state' <<<"$row")
            verified=$(jq -r '([.labels[]] | index("genesis-verified")) != null' <<<"$row")
            [[ "$verified" == 'false' ]] || continue
            active=$(jq -r '([.labels[]] | any(. == "genesis-repair-in-progress" or . == "genesis-validating" or . == "genesis-working" or . == "genesis-verifying"))' <<<"$row")
            [[ "$active" == 'false' ]] || continue

            body=$(jq -r '.body // ""' <<<"$row")
            candidate=$(printf '%s\n' "$body" | sed -nE 's/^- \*\*Target:\*\* `([^`]+)`.*/\1/p' | head -n1)
            [[ -n "$candidate" && "$candidate" != *".."* && -f "$candidate" ]] || continue

            case "$candidate" in
              genesis/autonomy_guard.py|genesis/autonomy_proof.py|genesis/blockchain.py|genesis/ephemeral_validator.py|genesis/security.py|genesis/selfdev.py|genesis/issue_solver.py|genesis/file_self_review.py|genesis/file_self_review_policy.py|scripts/secret_guard.py|scripts/privileged_change_gate.py|scripts/verify_validator_votes.py|scripts/action_repair_guard.py|scripts/issue_acceptance_guard.py)
                continue
                ;;
              genesis/*.py)
                lane='generic'
                ;;
              scripts/*.py)
                lane='specialist'
                ;;
              *)
                continue
                ;;
            esac

            issue_number="$number"
            target="$candidate"
            if [[ "$state" == 'closed' ]]; then
              gh api "repos/${GITHUB_REPOSITORY}/issues/${issue_number}" \
                --method PATCH -f state=open >/dev/null
            fi
            break
          done <<<"$rows"

          if [[ -z "$issue_number" ]]; then
            echo 'No safely routable Agentic Lab issue is waiting.'
            echo 'found=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for label in genesis-deferred genesis-blocked; do
            gh issue edit "$issue_number" --repo "$GITHUB_REPOSITORY" --remove-label "$label" >/dev/null 2>&1 || true
          done
          gh issue edit "$issue_number" --repo "$GITHUB_REPOSITORY" --add-label genesis-repair-in-progress >/dev/null

          marker='<!-- genesis-agentic-production-recovery -->'
          if ! gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${issue_number}/comments?per_page=100" \
              --jq '.[].body // ""' | grep -Fq "$marker"; then
            gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body "${marker}
Agentic Lab production recovery has taken ownership after bounded-solver exhaustion. The same authoritative Issue is being retried through the existing guarded repair, validation, Security, and exact-promotion path. No protected-file or permission boundary is widened."
          fi

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "lane=$lane" >> "$GITHUB_OUTPUT"

      - name: Dispatch guarded generic recovery worker
        if: steps.queue.outputs.found == 'true' && steps.queue.outputs.lane == 'generic'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.queue.outputs.issue_number }}
        run: |
          gh workflow run genesis-bounded-repair-worker.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f issue_number="$ISSUE_NUMBER"

      - name: Dispatch guarded specialist recovery worker
        if: steps.queue.outputs.found == 'true' && steps.queue.outputs.lane == 'specialist'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.queue.outputs.issue_number }}
        run: |
          gh workflow run genesis-specialist-repair-worker.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f issue_number="$ISSUE_NUMBER"

      - name: Release reservation if dispatch fails
        if: failure() && steps.queue.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.queue.outputs.issue_number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label genesis-repair-in-progress >/dev/null 2>&1 || true
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label agentic-lab >/dev/null 2>&1 || true
