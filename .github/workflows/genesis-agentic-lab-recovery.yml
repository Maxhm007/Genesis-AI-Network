name: Genesis Agentic Lab Recovery
# canonical-capability-retry-v1
# sequential-handoff-v6

on:
  issues:
    types: [opened, reopened]
  push:
    branches: [main]
    paths:
      - .github/workflows/genesis-agentic-lab-recovery.yml
      - .github/workflows/genesis-android-issue-worker.yml
      - .github/workflows/genesis-missing-qwen-capability-discovery.yml
      - scripts/discover_missing_qwen_capability.py
      - scripts/agentic_lab_recovery_dispatch.py
      - scripts/agentic_strategy_repair.py
      - genesis/selfdev.py
      - genesis/system_issue_repair_policy.py
      - tests/test_agentic_strategy_repair.py
      - tests/test_github_issue_capability_builder.py
      - tests/test_system_issue_repair_policy.py
      - scripts/agentic_lab_capability_first_dispatch.py
      - scripts/agentic_lab_fifo_router.py
      - scripts/agentic_parallel_dispatch.py
      - scripts/deepseek_agentic_selector.py
      - .github/workflows/genesis-deepseek-agentic-solver.yml
      - scripts/park_exhausted_agentic_issues.py
      - scripts/android_issue_repair.py
      - scripts/capability_issue_priority_dispatch.py
      - scripts/requeue_exhausted_issues.py
      - scripts/pulse_coding_provider.py
      - genesis/github_issue_capability_builder.py
      - genesis/anti_stuck.py
      - genesis/architecture_decomposer.py
      - scripts/advance_architecture_plan.py
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: genesis-agentic-lab-recovery
  # Genesis has one authoritative sequential controller. A newer recovery event
  # supersedes stale controller state so old runs cannot retarget/reclaim the
  # focused issue after policy or evidence changes.
  cancel-in-progress: true

env:
  GENESIS_AGENTIC_MAX_PARALLEL: '1'

jobs:
  dispatch-agentic-pool:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dispatch authoritative sequential Agentic chain
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/agentic_parallel_dispatch.py
