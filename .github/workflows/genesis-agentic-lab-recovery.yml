name: Genesis Agentic Lab Recovery

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/genesis-agentic-lab-recovery.yml
      - scripts/agentic_lab_recovery_dispatch.py
      - scripts/agentic_lab_capability_first_dispatch.py
      - scripts/capability_issue_priority_dispatch.py
      - scripts/requeue_exhausted_issues.py
      - scripts/pulse_coding_provider.py
      - genesis/github_issue_capability_builder.py
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: genesis-agentic-lab-recovery
  cancel-in-progress: false

jobs:
  dispatch-oldest-agentic-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dispatch one Agentic Lab recovery issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/agentic_lab_capability_first_dispatch.py
