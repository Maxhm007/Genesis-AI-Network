name: Genesis Agentic Lab Recovery
# canonical-capability-retry-v1
# parallel-lanes-v1

on:
  pull_request:
    paths:
      - .github/workflows/genesis-agentic-lab-recovery.yml
      - scripts/agentic*.py
      - tests/test_agentic*.py
      - genesis/communication_server.py
      - genesis/node.py
      - tests/test_gene_node_identity.py
      - web/index.html
      - '**/team-chat/index.html'
  issues:
    types: [opened, reopened]
  push:
    branches: [main]
    paths:
      - .github/workflows/genesis-agentic-lab-recovery.yml
      - .github/workflows/genesis-android-issue-worker.yml
      - .github/workflows/genesis-missing-qwen-capability-discovery.yml
      - scripts/discover_missing_qwen_capability.py
      - scripts/agentic_lab_recovery_dispatch.py
      - scripts/agentic_strategy_repair.py
      - genesis/selfdev.py
      - genesis/system_issue_repair_policy.py
      - tests/test_agentic_strategy_repair.py
      - tests/test_github_issue_capability_builder.py
      - tests/test_system_issue_repair_policy.py
      - scripts/agentic_lab_capability_first_dispatch.py
      - scripts/agentic_lab_fifo_router.py
      - scripts/agentic_parallel_dispatch.py
      - scripts/deepseek_agentic_selector.py
      - .github/workflows/genesis-deepseek-agentic-solver.yml
      - scripts/park_exhausted_agentic_issues.py
      - scripts/android_issue_repair.py
      - scripts/capability_issue_priority_dispatch.py
      - scripts/requeue_exhausted_issues.py
      - scripts/pulse_coding_provider.py
      - genesis/github_issue_capability_builder.py
      - genesis/anti_stuck.py
      - genesis/architecture_decomposer.py
      - scripts/advance_architecture_plan.py
      - genesis/architecture_extensions/architecture_route_gene_0_backlog_work_to_idle_gene_002_and_gene_003.py
      - genesis/pulse.py
      - tests/test_gene_backlog_delegation_router.py
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('genesis-agentic-lab-recovery-pr-{0}', github.event.pull_request.number) || 'genesis-agentic-lab-recovery' }}
  # Keep one controller instance running at a time. The controller itself
  # admits up to three target-safe worker lanes, so overlapping controller
  # wake-ups are unnecessary and would only race on reservations.
  cancel-in-progress: false

env:
  GENESIS_AGENTIC_MAX_PARALLEL: '3'

jobs:
  validate-baseline:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Verify full repair-worker baseline
        run: python -m pytest -q

  dispatch-agentic-pool:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused delegation validation dependencies
        if: github.event_name == 'push'
        run: python -m pip install --disable-pip-version-check pytest cryptography

      - name: Validate cross-Gene backlog delegation
        if: github.event_name == 'push'
        run: python -m pytest -q tests/test_gene_backlog_delegation_router.py

      - name: Dispatch bounded parallel Agentic lanes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/agentic_parallel_dispatch.py
