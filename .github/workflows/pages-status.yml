name: Genesis Live Status Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/status/**'
      - '.github/workflows/pages-status.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: genesis-live-status-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/status
      - name: Deploy Genesis live status
        id: deployment
        uses: actions/deploy-pages@v4
