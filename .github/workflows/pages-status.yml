name: Genesis Live Status Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/status/**'
      - 'scripts/build_live_status.py'
      - 'scripts/build_gene_chat.py'
      - 'scripts/self_evaluation_dashboard.py'
      - 'scripts/autonomy_history_backfill.py'
      - 'scripts/dashboard_live_minute_patch.py'
      - 'scripts/dashboard_resilience_patch.py'
      - 'scripts/embed_dashboard_status.py'
      - 'scripts/render_static_dashboard.py'
      - 'scripts/validate_dashboard_js.py'
      - 'scripts/gene_chat_reply.py'
      - '.github/workflows/gene-chat.yml'
      - '.github/workflows/pages-status.yml'
  issue_comment:
    types: [created]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: genesis-live-status-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'issue_comment' || github.event.issue.number == 52
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build authenticated Genesis status and self-evaluation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/build_live_status.py
          python scripts/self_evaluation_dashboard.py
          if ! python scripts/autonomy_history_backfill.py; then
            echo "::warning::Autonomy history backfill failed; deploying the current strict snapshot instead of keeping a stale Pages artifact."
          fi
          python scripts/dashboard_live_minute_patch.py
          python scripts/dashboard_resilience_patch.py
          python scripts/embed_dashboard_status.py
          python scripts/render_static_dashboard.py
          python scripts/validate_dashboard_js.py
      - name: Build Genesis chat snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/build_gene_chat.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/status
      - name: Deploy Genesis live status
        id: deployment
        uses: actions/deploy-pages@v4
