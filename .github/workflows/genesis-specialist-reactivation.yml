name: Genesis Specialist Reactivation

# Compatibility feeder only. Agentic Lab owns reactivation.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/genesis-specialist-reactivation.yml
      - .github/workflows/genesis-specialist-repair-worker-v2.yml
      - scripts/agentic_lab_recovery_dispatch.py

permissions:
  contents: read
  actions: write

concurrency:
  group: genesis-specialist-reactivation
  cancel-in-progress: true

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake Agentic Lab
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Specialist reactivation authority retired; Agentic Lab owns re-arm."
          gh workflow run genesis-agentic-lab-recovery.yml --repo "$GITHUB_REPOSITORY" --ref main
