name: Genesis Specialist Reactivation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/genesis-specialist-reactivation.yml
      - .github/workflows/genesis-specialist-issue-controller.yml
      - .github/workflows/genesis-specialist-repair-worker-v2.yml
      - scripts/specialist_issue_autorepair.py
      - scripts/github_issue_autorepair.py
      - scripts/pulse_coding_provider.py
      - genesis/coding_provider_policy.py
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: genesis-specialist-reactivation
  cancel-in-progress: true

jobs:
  release-exhausted-specialists:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reactivate exhausted specialist issues for this engine generation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          generation=$(cat \
            .github/workflows/genesis-specialist-issue-controller.yml \
            .github/workflows/genesis-specialist-repair-worker-v2.yml \
            scripts/specialist_issue_autorepair.py \
            scripts/github_issue_autorepair.py \
            scripts/pulse_coding_provider.py \
            genesis/coding_provider_policy.py | sha256sum | cut -c1-20)
          marker="<!-- genesis-specialist-engine:${generation} -->"

          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=open&sort=created&direction=asc&per_page=100" --jq '.[]' | jq -s '.' > /tmp/open-specialists.json

          python - <<'PY' > /tmp/reactivate-specialists.txt
          import json
          import re
          from pathlib import Path

          issues = json.loads(Path('/tmp/open-specialists.json').read_text())
          target_re = re.compile(r'^- \*\*Target:\*\* `([^`]+)`', re.MULTILINE)
          protected = {
              'scripts/secret_guard.py',
              'scripts/privileged_change_gate.py',
              'scripts/verify_validator_votes.py',
              'scripts/action_repair_guard.py',
              'scripts/issue_acceptance_guard.py',
          }
          active = {
              'genesis-claimed', 'genesis-working', 'genesis-verifying',
              'genesis-repair-in-progress', 'genesis-validating', 'genesis-priority-claim',
          }

          for issue in issues:
              if issue.get('pull_request'):
                  continue
              labels = {str(row.get('name') or '') for row in issue.get('labels') or [] if isinstance(row, dict)}
              if 'genesis-specialist' not in labels:
                  continue
              if not ({'genesis-solver-exhausted', 'genesis-deferred'} & labels):
                  continue
              if labels & active or 'genesis-superseded' in labels:
                  continue
              body = str(issue.get('body') or '')
              match = target_re.search(body)
              target = match.group(1).strip().replace('\\', '/') if match else ''
              if not target.startswith('scripts/') or not target.endswith('.py'):
                  continue
              if '..' in Path(target).parts or target in protected or not Path(target).is_file():
                  continue
              print(int(issue['number']))
          PY

          released=0
          while read -r issue_number; do
            [[ -n "$issue_number" ]] || continue
            if gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${issue_number}/comments?per_page=100" --jq '.[].body' | grep -Fqx "$marker"; then
              continue
            fi

            for label in \
              genesis-solver-exhausted genesis-deferred genesis-blocked agentic-lab \
              genesis-specialist-repair-attempt-1 genesis-specialist-repair-attempt-2 genesis-specialist-repair-attempt-3; do
              gh issue edit "$issue_number" --repo "$GITHUB_REPOSITORY" --remove-label "$label" >/dev/null 2>&1 || true
            done
            gh issue edit "$issue_number" --repo "$GITHUB_REPOSITORY" \
              --add-label genesis-autonomous --add-label genesis-repair --add-label genesis-specialist >/dev/null
            body=$(printf '%s\n%s\n' "$marker" "Genesis specialist repair capability changed, so this still-open unresolved Issue has been automatically reactivated for a fresh bounded attempt on the same authoritative Issue. No closed Issue was reopened and no successor was created. Engine generation: ${generation}.")
            gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body "$body" >/dev/null
            released=$((released + 1))
          done < /tmp/reactivate-specialists.txt

          echo "Reactivated ${released} exhausted specialist issue(s) for engine generation ${generation}."
          if [[ "$released" -gt 0 ]]; then
            gh workflow run genesis-specialist-issue-controller.yml --repo "$GITHUB_REPOSITORY" --ref main >/dev/null
          fi
