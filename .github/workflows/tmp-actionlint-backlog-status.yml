name: Temporary Backlog Workflow Lint

on:
  push:
    branches:
      - genesis/privileged-candidate-fix-backlog-status-workflow

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Lint backlog status workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/open-issue-backlog-status.yml
