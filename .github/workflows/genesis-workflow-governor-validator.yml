name: Genesis Workflow Governor Validator

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
    paths:
      - '.github/workflows/**'
      - 'genesis/workflow_governor.py'
      - 'scripts/workflow_governor.py'
      - 'tests/test_workflow_governor.py'

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: genesis-workflow-governor-validator-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-and-promote:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'genesis/privileged-candidate-workflow-governor-') &&
      contains(github.event.pull_request.labels.*.name, 'genesis-workflow-governance')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch authoritative base
        run: git fetch origin main:refs/remotes/origin/main

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check pytest pyyaml

      - name: Parse every workflow YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          paths = sorted(Path('.github/workflows').glob('*.yml')) + sorted(Path('.github/workflows').glob('*.yaml'))
          for path in paths:
              with path.open(encoding='utf-8') as handle:
                  yaml.safe_load(handle)
          print(f'validated {len(paths)} workflow YAML files')
          PY

      - name: Enforce privileged autonomy guard
        run: |
          python - <<'PY'
          from pathlib import Path
          from genesis.autonomy_guard import AutonomyGuard

          decision = AutonomyGuard(Path('.')).analyze_git_candidate('origin/main')
          print(decision.as_dict())
          if not decision.autonomous_allowed:
              raise SystemExit('owner escalation required: ' + '; '.join(decision.reasons))
          PY

      - name: Run governance and guard tests
        run: python -m pytest -q tests/test_workflow_governor.py tests/test_autonomy_guard.py

      - name: Reject overly broad autonomous workflow changes
        run: |
          count=$(git diff --name-only origin/main...HEAD | sed '/^$/d' | wc -l)
          echo "changed_files=$count"
          if [ "$count" -gt 2 ]; then
            echo "Autonomous workflow governance is limited to two files per candidate."
            exit 1
          fi

      - name: Promote independently validated candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}"             --repo "${{ github.repository }}"             --squash             --delete-branch             --subject "Genesis autonomous workflow governance (#${{ github.event.pull_request.number }})"
