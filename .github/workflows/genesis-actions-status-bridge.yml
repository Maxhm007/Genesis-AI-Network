name: Genesis Actions Status Bridge

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - .github/workflows/genesis-actions-status-bridge.yml
      - .github/workflows/genesis-agentic-lab-recovery.yml

permissions:
  actions: read
  issues: write
  contents: read

concurrency:
  group: genesis-actions-status-bridge
  cancel-in-progress: false

jobs:
  publish-status:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Publish recent Actions status to issue 1100
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const issue_number = 1100;
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner, repo, per_page: 60
            });
            const runs = data.workflow_runs
              .filter(r => r.name !== 'Genesis Actions Status Bridge')
              .slice(0, 30);
            const count = key => runs.filter(r => r.status === key).length;
            const failed = runs.filter(r => r.conclusion === 'failure').length;
            const summary = [
              '# Genesis Actions — Live Status',
              '',
              '> Scheduled every 5 minutes (GitHub may delay scheduled runs) by Genesis Actions Status Bridge. This issue is for observation only, not issue solving.',
              '',
              '**Last checked (UTC):** ' + new Date().toISOString(),
              '**Repository:** ' + owner + '/' + repo,
              '**Runs inspected:** ' + runs.length + ' (most recent, excluding this monitor)',
              '**In progress:** ' + count('in_progress') + ' | **Queued:** ' + count('queued') + ' | **Failures:** ' + failed,
              '',
              '| Workflow | Status | Conclusion | Started (UTC) | Run |',
              '| --- | --- | --- | --- | --- |'
            ];
            for (const r of runs) {
              const clean = s => String(s ?? '—').replace(/[|]/g, '/').replace(/[\r\n]/g, ' ');
              summary.push('| ' + clean(r.name) + ' | ' + clean(r.status) +
                ' | ' + clean(r.conclusion) + ' | ' + clean(r.created_at) +
                ' | [#' + r.run_number + '](' + r.html_url + ') |');
            }
            summary.push('', '## Issue #1106 — push validation evidence', '');
            try {
              const response = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: 'genesis-agentic-lab-recovery.yml',
                event: 'push', per_page: 10
              });
              const candidate = response.data.workflow_runs.find(r => r.head_branch === 'main');
              if (!candidate) {
                summary.push('No recent main-branch push validation run found. Do not close #1106.');
              } else {
                summary.push('Latest main push run: [#' + candidate.run_number + '](' + candidate.html_url +
                  ') — ' + candidate.status + ' / ' + (candidate.conclusion || 'pending') +
                  ' — SHA ' + candidate.head_sha);
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                  owner, repo, run_id: candidate.id, per_page: 100
                });
                const target = jobs.flatMap(j => (j.steps || []).filter(step =>
                  step.name === 'Validate parallel controller and cross-Gene delegation'
                ).map(step => ({job: j, step})));
                for (const {job, step} of target) {
                  summary.push('- Validation step in ' + job.name + ': **' +
                    (step.conclusion || step.status || 'unknown') + '**');
                }
                if (!target.length) summary.push('Validation step not reported: not verified.');
              }
            } catch (error) {
              summary.push('Push validation lookup failed: ' + String(error.message).slice(0, 200));
            }
            summary.push('', '## Recent failures', '');
            const failures = runs.filter(r => r.conclusion === 'failure').slice(0, 5);
            if (!failures.length) summary.push('No failed runs among the latest 30.');
            for (const r of failures) {
              summary.push('- **' + r.name + '** — [run](' + r.html_url + ') (ID ' + r.id + ')');
              try {
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                  owner, repo, run_id: r.id, per_page: 100
                });
                for (const job of jobs.filter(j => j.conclusion === 'failure').slice(0, 2)) {
                  const failedSteps = (job.steps || []).filter(step => step.conclusion === 'failure');
                  summary.push('  - Job: **' + job.name + '** (job ID ' + job.id + ')');
                  for (const step of failedSteps.slice(0, 5)) {
                    summary.push('    - Failed step: **' + step.name + '**');
                  }
                  if (!failedSteps.length) summary.push('    - No failed step details returned by GitHub API');
                }
              } catch (error) {
                summary.push('  - Job inspection unavailable: ' + String(error.message).slice(0, 200));
              }
            }
            await github.rest.issues.update({
              owner, repo, issue_number,
              body: summary.join('\n')
            });
            core.info('Updated Actions monitoring issue #' + issue_number);
