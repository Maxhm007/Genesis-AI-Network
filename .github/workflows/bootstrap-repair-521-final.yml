name: Bootstrap Repair 521 Final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-repair-521-final.yml'

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Apply issue 521 repair
        run: python scripts/bootstrap_fix_issue_521.py
      - name: Focused regressions
        run: python -m pytest -q tests/test_deterministic_capability_builder.py tests/test_issue_scheduler_fairness.py tests/test_old_issue_drain_regression.py tests/test_adaptive_pulse_scheduler.py tests/test_github_issue_autorepair_claim_release.py tests/test_github_issue_autorepair_heartbeat_workflow.py tests/test_github_issue_autorepair_integration_transaction.py
      - name: Full baseline
        run: python -m pytest -q
      - name: Commit verified repair
        run: |
          set -euo pipefail
          git config user.name 'Genesis Bootstrap Repair'
          git config user.email 'genesis-ai@users.noreply.github.com'
          git add genesis/autonomous_engineering.py tests/test_adaptive_pulse_scheduler.py tests/test_github_issue_autorepair_heartbeat_workflow.py tests/test_github_issue_autorepair_integration_transaction.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: restore Genesis autorepair baseline (#521)'
          git pull --rebase origin main
          git push origin HEAD:main
