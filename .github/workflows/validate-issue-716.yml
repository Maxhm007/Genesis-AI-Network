name: Validate Issue 716

on:
  push:
    branches:
      - genesis/wake-requeue-on-hard-repair-intelligence-716
    paths:
      - .github/workflows/validate-issue-716.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: genesis/wake-requeue-on-hard-repair-intelligence-716
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Focused requeue workflow contract
        run: python -m pytest -q tests/test_exhausted_requeue_workflow_paths.py tests/test_requeue_exhausted_issues.py
      - name: Full repository suite
        run: python -m pytest -q
