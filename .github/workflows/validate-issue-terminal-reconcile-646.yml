name: Validate Issue Terminal Reconcile 646

on:
  push:
    branches:
      - fix/issue-terminal-reconcile-loop

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Focused reconciler and workflow tests
        run: python -m pytest -q tests/test_github_issue_terminal_reconciler.py tests/test_terminal_reconciler_specialist_handoff.py tests/test_github_issue_terminal_specialist_replacement.py tests/test_terminal_issue_reconciler_workflow.py
      - name: Full repository tests
        run: python -m pytest -q
