name: Genesis Teammate - Recovery Troubleshooter

on:
  workflow_dispatch:
    inputs:
      objective:
        description: Objective delegated by Nexus
        required: true
        type: string
      source_comment_id:
        description: Nexus source comment id
        required: true
        type: string
      nexus_issue:
        description: Nexus workspace issue number
        required: true
        type: string
      source_issue:
        description: Existing authoritative source issue for autonomous work
        required: false
        type: string

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: genesis-teammate-recovery
  cancel-in-progress: false

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Recovery Troubleshooter
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TEAM_OBJECTIVE: ${{ inputs.objective }}
          SOURCE_COMMENT_ID: ${{ inputs.source_comment_id }}
          NEXUS_ISSUE: ${{ inputs.nexus_issue }}
          SOURCE_ISSUE: ${{ inputs.source_issue }}
        run: |
          args=(agent --agent "recovery" --objective "$TEAM_OBJECTIVE" --source-comment-id "$SOURCE_COMMENT_ID" --nexus-issue "$NEXUS_ISSUE")
          if [ -n "$SOURCE_ISSUE" ]; then args+=(--source-issue "$SOURCE_ISSUE"); fi
          python scripts/genesis_teammate.py "${args[@]}"
