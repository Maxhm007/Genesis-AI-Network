name: Deploy Genesis Pages

on:
  push:
    branches: [main]
    paths:
      - docs/status/**
      - web/**
      - .github/workflows/deploy-team-chat-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: genesis-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build Pages site
        run: |
          rm -rf _site
          mkdir -p _site/team-chat
          cp -a docs/status/. _site/
          cp web/index.html _site/team-chat/index.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
