name: Genesis Missing Qwen Capability Discovery

# Discovery producer only; Genesis Issue Opening Manager owns automatic scheduling.
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: read

concurrency:
  group: genesis-missing-qwen-capability-discovery
  cancel-in-progress: true

jobs:
  audit-and-create-one-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Verify missing-capability discovery contract
        run: python -m pytest -q tests/test_missing_qwen_capability_discovery.py

      - name: Audit Qwen-based Genesis and create at most one missing-capability issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python scripts/discover_missing_qwen_capability.py

      - name: Wake Agentic Lab for missing-capability work
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          issue_number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label genesis-missing-capability --label agentic-lab --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$issue_number" ]; then
            # Skip redundant wakes: a queued/running controller pass (or one woken <2 min ago) already covers this.
            lab_skip="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow genesis-agentic-lab-recovery.yml --limit 20 --json databaseId,status,createdAt,event --jq '[.[] | select(.event != "push" and .event != "pull_request") | select(.status != "completed" or (now - (.createdAt | fromdateiso8601)) < 120)] | if length > 0 then "run \(.[0].databaseId) \(.[0].status)" else "" end' 2>/dev/null || true)"
            if [[ -n "$lab_skip" ]]; then
              echo "Agentic Lab Recovery wake skipped (already active or recently woken): $lab_skip"
            else
              gh workflow run genesis-agentic-lab-recovery.yml --repo "$GITHUB_REPOSITORY" --ref main
            fi
          fi