name: Task 4 Fix Validation

on:
  push:
    branches:
      - fix/detected-exact-expression-repair-v2

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Focused deterministic repair tests
        run: python -m pytest -q tests/test_github_issue_detected_exact_repair.py tests/test_github_issue_capability_builder.py
      - name: Repository tests excluding intentional rollback regression
        run: python -m pytest -q --ignore=tests/test_versioning.py
