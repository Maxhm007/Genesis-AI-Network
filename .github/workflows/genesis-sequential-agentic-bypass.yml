name: Genesis Sequential Agentic Bypass

on:
  workflow_dispatch:
  schedule:
    - cron: '5,15,25,35,45,55 * * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/genesis-sequential-agentic-bypass.yml

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: genesis-sequential-issue-controller
  cancel-in-progress: false

jobs:
  dispatch-one-non-agentic-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Dispatch one ordinary issue while Agentic Lab is busy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=open&sort=created&direction=asc&per_page=100" --jq '.[]' | jq -s '.' > /tmp/open.json

          ordinary_active=$(python - <<'PY'
          import json
          from pathlib import Path
          issues = json.loads(Path('/tmp/open.json').read_text())
          active = {'genesis-repair-in-progress', 'genesis-validating'}
          count = 0
          for issue in issues:
              if issue.get('pull_request'):
                  continue
              labels = {str(x.get('name') or '') for x in issue.get('labels') or [] if isinstance(x, dict)}
              if 'agentic-lab' in labels:
                  continue
              if labels & active:
                  count += 1
          print(count)
          PY
          )

          if [ "$ordinary_active" -gt 0 ]; then
            echo "An ordinary bounded repair/validation reservation is already active (${ordinary_active}); not dispatching another."
            exit 0
          fi

          issue_number=$(python - <<'PY'
          import json
          import re
          from pathlib import Path

          issues = json.loads(Path('/tmp/open.json').read_text())
          active = {
              'genesis-claimed', 'genesis-working', 'genesis-verifying',
              'genesis-repair-in-progress', 'genesis-validating', 'genesis-priority-claim',
          }
          protected = {
              'genesis/autonomy_guard.py', 'genesis/autonomy_proof.py', 'genesis/blockchain.py',
              'genesis/ephemeral_validator.py', 'genesis/security.py', 'genesis/selfdev.py',
              'genesis/issue_solver.py', 'genesis/file_self_review.py', 'genesis/file_self_review_policy.py',
          }

          for issue in issues:
              if issue.get('pull_request'):
                  continue
              number = int(issue.get('number') or 0)
              title = str(issue.get('title') or '')
              body = str(issue.get('body') or '')
              labels = {str(x.get('name') or '') for x in issue.get('labels') or [] if isinstance(x, dict)}
              lower_title = title.lower()
              lower_body = body.lower()

              if number == 1 or 'agentic-lab' in labels:
                  continue
              if labels & active or 'genesis-solver-exhausted' in labels:
                  continue
              if lower_title.startswith(('genesis chat:', '[genesis hourly report]', '[genesis gene chat]')):
                  continue
              if 'persistent github-native reporting channel' in lower_body:
                  continue

              match = re.search(r'^- \*\*Target:\*\* `([^`]+)`', body, re.MULTILINE)
              target = match.group(1).strip() if match else ''
              if not target.startswith('genesis/') or not target.endswith('.py'):
                  continue
              if '..' in target or target in protected or not Path(target).is_file():
                  continue

              print(number)
              break
          PY
          )

          if [ -z "$issue_number" ]; then
            echo 'No eligible non-Agentic-Lab issue is currently routable.'
            exit 0
          fi

          echo "Reserving ordinary issue #${issue_number} without disturbing Agentic Lab."
          gh issue edit "$issue_number" --repo "$GITHUB_REPOSITORY" --add-label genesis-repair-in-progress --add-label genesis-autonomous >/dev/null
          gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body "Genesis Agentic-bypass scheduler reserved this ordinary issue so the sequential repair lane can continue while a separate Agentic Lab issue is running. No validation or closure rule is bypassed. Controller run: ${GITHUB_RUN_ID}." >/dev/null

          if gh workflow run genesis-bounded-repair-worker.yml --repo "$GITHUB_REPOSITORY" --ref main -f issue_number="$issue_number"; then
            echo "Dispatched bounded repair worker for #${issue_number}."
          else
            gh issue edit "$issue_number" --repo "$GITHUB_REPOSITORY" --remove-label genesis-repair-in-progress >/dev/null 2>&1 || true
            echo "Dispatch failed; released reservation on #${issue_number}." >&2
            exit 1
          fi
