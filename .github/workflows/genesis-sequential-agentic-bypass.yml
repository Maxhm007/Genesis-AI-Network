name: Genesis Sequential Agentic Bypass

# Compatibility feeder only.
# There is no independent bypass lane; Agentic Lab owns all issue scheduling.
on:
  workflow_dispatch:
  schedule:
    - cron: '5,15,25,35,45,55 * * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/genesis-sequential-agentic-bypass.yml
      - .github/workflows/genesis-agentic-lab-recovery.yml
      - scripts/agentic_parallel_dispatch.py

permissions:
  contents: read
  actions: write

concurrency:
  group: genesis-sequential-agentic-bypass
  cancel-in-progress: true

jobs:
  handoff-to-agentic-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake authoritative Agentic Lab
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Independent bypass lane retired. Agentic Lab owns all scheduling."
          gh workflow run genesis-agentic-lab-recovery.yml --repo "$GITHUB_REPOSITORY" --ref main
