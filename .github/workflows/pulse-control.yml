name: Genesis Pulse Control

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ops/pulse-request.json"

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  pulse_control:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 140 &&
       github.event.comment.author_association == 'OWNER' &&
       github.event.comment.body == '/genesis pulse self-repair')
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Prune stale queued Gene Pulse runs
        id: prune
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          cutoff_seconds=7200
          pruned=()
          failures=()
          payload=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/gene-pulse.yml/runs?branch=main&status=queued&per_page=100")
          while IFS=$'\t' read -r run_id run_url created; do
            [[ -n "$run_id" && -n "$created" ]] || continue
            created_epoch=$(date -u -d "$created" +%s 2>/dev/null || echo "$now")
            age=$((now - created_epoch))
            if (( age <= cutoff_seconds )); then
              continue
            fi
            if gh run cancel "$run_id" >/dev/null 2>&1; then
              pruned+=("run=${run_id}:method=cancel:age_seconds=${age}:url=${run_url}")
              continue
            fi
            if gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/force-cancel" >/dev/null 2>&1; then
              pruned+=("run=${run_id}:method=force-cancel:age_seconds=${age}:url=${run_url}")
            else
              failures+=("run=${run_id}:age_seconds=${age}:url=${run_url}")
            fi
          done < <(printf '%s' "$payload" | jq -r '.workflow_runs[] | [.id, .html_url, .created_at] | @tsv')
          {
            echo 'pruned_runs<<EOF'
            if (( ${#pruned[@]} > 0 )); then
              printf '%s\n' "${pruned[@]}"
            else
              echo 'none'
            fi
            echo 'EOF'
            echo 'prune_failures<<EOF'
            if (( ${#failures[@]} > 0 )); then
              printf '%s\n' "${failures[@]}"
            else
              echo 'none'
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Check whether Genesis repair work is already active
        id: busy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          active=0
          details=()
          runs=()
          for workflow in gene-pulse.yml file-self-review.yml manual-self-repair.yml; do
            for status in queued in_progress; do
              payload=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=main&status=${status}&per_page=100")
              count=$(printf '%s' "$payload" | jq '.workflow_runs | length')
              if (( count > 0 )); then
                active=$((active + count))
                details+=("${workflow}:${status}=${count}")
                while IFS=$'\t' read -r run_id run_status run_url run_sha run_event run_created; do
                  [[ -n "$run_id" ]] || continue
                  runs+=("${workflow}:${run_status}:run=${run_id}:event=${run_event}:sha=${run_sha:0:12}:created=${run_created}:url=${run_url}")
                done < <(printf '%s' "$payload" | jq -r '.workflow_runs[] | [.id, .status, .html_url, .head_sha, .event, .created_at] | @tsv')
              fi
            done
          done
          if (( active > 0 )); then
            echo 'busy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'busy=false' >> "$GITHUB_OUTPUT"
          fi
          echo "active_count=${active}" >> "$GITHUB_OUTPUT"
          printf 'details=%s\n' "${details[*]:-none}" >> "$GITHUB_OUTPUT"
          {
            echo 'active_runs<<EOF'
            if (( ${#runs[@]} > 0 )); then
              printf '%s\n' "${runs[@]}"
            else
              echo 'none'
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Report busy state and skip duplicate pulse
        if: steps.busy.outputs.busy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIVE_COUNT: ${{ steps.busy.outputs.active_count }}
          ACTIVE_DETAILS: ${{ steps.busy.outputs.details }}
          ACTIVE_RUNS: ${{ steps.busy.outputs.active_runs }}
          PRUNED_RUNS: ${{ steps.prune.outputs.pruned_runs }}
          PRUNE_FAILURES: ${{ steps.prune.outputs.prune_failures }}
        shell: bash
        run: |
          body="Genesis pulse request skipped: existing repair work is already queued/running (${ACTIVE_COUNT}). ${ACTIVE_DETAILS}"
          body+=$'\n\nStale queued runs pruned:\n```\n'
          body+="${PRUNED_RUNS}"
          body+=$'\n```\n\nStale prune failures:\n```\n'
          body+="${PRUNE_FAILURES}"
          body+=$'\n```\n\nActive runs:\n```\n'
          body+="${ACTIVE_RUNS}"
          body+=$'\n```'
          gh issue comment 140 --body "$body"

      - name: Dispatch Gene Pulse when idle
        if: steps.busy.outputs.busy == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run gene-pulse.yml
          --ref main
          -f gene=gene-node-1
          -f continue_chain=true

      - name: Report pulse dispatch
        if: steps.busy.outputs.busy == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PRUNED_RUNS: ${{ steps.prune.outputs.pruned_runs }}
          PRUNE_FAILURES: ${{ steps.prune.outputs.prune_failures }}
        shell: bash
        run: |
          body="Genesis pulse dispatched for gene-node-1. The pulse will continue chaining only while executable work remains."
          body+=$'\n\nStale queued runs pruned:\n```\n'
          body+="${PRUNED_RUNS}"
          body+=$'\n```\n\nStale prune failures:\n```\n'
          body+="${PRUNE_FAILURES}"
          body+=$'\n```'
          gh issue comment 140 --body "$body"
