name: Genesis Pulse Control

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ops/pulse-request.json"

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  pulse_control:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 140 &&
       github.event.comment.author_association == 'OWNER' &&
       github.event.comment.body == '/genesis pulse self-repair')
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Gate manual pulse against active or stale repair work
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          freshness_seconds=7200
          fresh=()
          stale=()
          stale_in_progress=()
          stale_cancelled=()
          stale_cancel_failures=()

          for workflow in gene-pulse.yml file-self-review.yml manual-self-repair.yml; do
            for status in queued in_progress; do
              payload=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=main&status=${status}&per_page=100")
              while IFS=$'\t' read -r run_id run_status run_url run_sha run_event created; do
                [[ -n "$run_id" && -n "$created" ]] || continue
                created_epoch=$(date -u -d "$created" +%s 2>/dev/null || echo "$now")
                age=$((now - created_epoch))
                detail="${workflow}:${run_status}:run=${run_id}:event=${run_event}:sha=${run_sha:0:12}:age_seconds=${age}:url=${run_url}"
                if (( age <= freshness_seconds )); then
                  fresh+=("$detail")
                  continue
                fi

                stale+=("$detail")
                if [[ "$run_status" == "in_progress" ]]; then
                  stale_in_progress+=("$detail")
                fi

                if gh run cancel "$run_id" >/dev/null 2>&1; then
                  stale_cancelled+=("${detail}:cancel=normal")
                elif gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/force-cancel" >/dev/null 2>&1; then
                  stale_cancelled+=("${detail}:cancel=force")
                else
                  stale_cancel_failures+=("$detail")
                fi
              done < <(printf '%s' "$payload" | jq -r '.workflow_runs[] | [.id, .status, .html_url, .head_sha, .event, .created_at] | @tsv')
            done
          done

          if (( ${#fresh[@]} > 0 || ${#stale_in_progress[@]} > 0 || ${#stale_cancel_failures[@]} > 0 )); then
            echo 'busy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'busy=false' >> "$GITHUB_OUTPUT"
          fi
          echo "fresh_count=${#fresh[@]}" >> "$GITHUB_OUTPUT"
          echo "stale_count=${#stale[@]}" >> "$GITHUB_OUTPUT"
          echo "stale_in_progress_count=${#stale_in_progress[@]}" >> "$GITHUB_OUTPUT"
          echo "stale_cancelled_count=${#stale_cancelled[@]}" >> "$GITHUB_OUTPUT"
          echo "stale_cancel_failure_count=${#stale_cancel_failures[@]}" >> "$GITHUB_OUTPUT"
          {
            echo 'fresh_runs<<EOF'
            if (( ${#fresh[@]} > 0 )); then printf '%s\n' "${fresh[@]}"; else echo 'none'; fi
            echo 'EOF'
            echo 'stale_runs<<EOF'
            if (( ${#stale[@]} > 0 )); then printf '%s\n' "${stale[@]}"; else echo 'none'; fi
            echo 'EOF'
            echo 'stale_in_progress_runs<<EOF'
            if (( ${#stale_in_progress[@]} > 0 )); then printf '%s\n' "${stale_in_progress[@]}"; else echo 'none'; fi
            echo 'EOF'
            echo 'stale_cancelled_runs<<EOF'
            if (( ${#stale_cancelled[@]} > 0 )); then printf '%s\n' "${stale_cancelled[@]}"; else echo 'none'; fi
            echo 'EOF'
            echo 'stale_cancel_failures<<EOF'
            if (( ${#stale_cancel_failures[@]} > 0 )); then printf '%s\n' "${stale_cancel_failures[@]}"; else echo 'none'; fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Report busy state and skip duplicate pulse
        if: steps.gate.outputs.busy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FRESH_COUNT: ${{ steps.gate.outputs.fresh_count }}
          STALE_COUNT: ${{ steps.gate.outputs.stale_count }}
          STALE_IN_PROGRESS_COUNT: ${{ steps.gate.outputs.stale_in_progress_count }}
          STALE_CANCELLED_COUNT: ${{ steps.gate.outputs.stale_cancelled_count }}
          STALE_CANCEL_FAILURE_COUNT: ${{ steps.gate.outputs.stale_cancel_failure_count }}
          FRESH_RUNS: ${{ steps.gate.outputs.fresh_runs }}
          STALE_RUNS: ${{ steps.gate.outputs.stale_runs }}
          STALE_IN_PROGRESS_RUNS: ${{ steps.gate.outputs.stale_in_progress_runs }}
          STALE_CANCELLED_RUNS: ${{ steps.gate.outputs.stale_cancelled_runs }}
          STALE_CANCEL_FAILURES: ${{ steps.gate.outputs.stale_cancel_failures }}
        shell: bash
        run: |
          body="Genesis pulse request skipped: active repair work or unresolved stale cleanup remains. Fresh=${FRESH_COUNT:-0}, stale=${STALE_COUNT:-0}, stale_in_progress=${STALE_IN_PROGRESS_COUNT:-0}, cancelled=${STALE_CANCELLED_COUNT:-0}, cancellation_failures=${STALE_CANCEL_FAILURE_COUNT:-0}."
          body+=$'\n\nFresh runs:\n```\n'"${FRESH_RUNS:-none}"$'\n```'
          body+=$'\n\nStale runs:\n```\n'"${STALE_RUNS:-none}"$'\n```'
          body+=$'\n\nStale in-progress runs:\n```\n'"${STALE_IN_PROGRESS_RUNS:-none}"$'\n```'
          body+=$'\n\nStale cancellations accepted:\n```\n'"${STALE_CANCELLED_RUNS:-none}"$'\n```'
          body+=$'\n\nStale cancellation failures:\n```\n'"${STALE_CANCEL_FAILURES:-none}"$'\n```'
          gh issue comment 140 --body "$body"

      - name: Dispatch Gene Pulse when idle
        if: steps.gate.outputs.busy == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run gene-pulse.yml
          --ref main
          -f gene=gene-node-1
          -f continue_chain=true

      - name: Report pulse dispatch
        if: steps.gate.outputs.busy == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_COUNT: ${{ steps.gate.outputs.stale_count }}
          STALE_CANCELLED_COUNT: ${{ steps.gate.outputs.stale_cancelled_count }}
        shell: bash
        run: |
          body="Genesis pulse dispatched for gene-node-1. No fresh autonomous repair worker or unresolved stale cleanup remained. Stale=${STALE_COUNT:-0}; cancellation requests accepted=${STALE_CANCELLED_COUNT:-0}."
          gh issue comment 140 --body "$body"
