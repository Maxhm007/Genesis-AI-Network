name: Genesis Action Repair Privileged Recovery

on:
  workflow_run:
    workflows: ["Genesis Action Repair Candidate"]
    types: [completed]

permissions:
  actions: read
  contents: write
  issues: read

concurrency:
  group: genesis-action-repair-privileged-recovery
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      has_candidate: ${{ steps.resolve.outputs.has_candidate }}
      issue_number: ${{ steps.resolve.outputs.issue_number }}
      candidate_branch: ${{ steps.resolve.outputs.candidate_branch }}
      candidate_sha: ${{ steps.resolve.outputs.candidate_sha }}
      workflow_id: ${{ steps.resolve.outputs.workflow_id }}
      workflow_path: ${{ steps.resolve.outputs.workflow_path }}
      repair_cycles: ${{ steps.resolve.outputs.repair_cycles }}
      candidate_status: ${{ steps.resolve.outputs.candidate_status }}
      candidate_failure: ${{ steps.resolve.outputs.candidate_failure }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Download exact candidate handoff from source run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_name="genesis-action-repair-candidate-${SOURCE_RUN_ID}"
          artifact_id=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts" \
            --jq ".artifacts[] | select(.name == \"${artifact_name}\") | .id" | head -n 1)
          if [[ -z "$artifact_id" ]]; then
            echo "No candidate handoff artifact was published by source run ${SOURCE_RUN_ID}; preserve the source failure without creating a secondary recovery failure."
            echo 'missing_candidate_handoff=true' >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p handoff
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/genesis-action-repair-candidate.zip
          unzip -q /tmp/genesis-action-repair-candidate.zip -d handoff
          mapfile -t candidate_files < <(find handoff -type f -name 'action_repair_candidate.json' -print)
          if (( ${#candidate_files[@]} != 1 )); then
            echo "Expected exactly one Action repair candidate JSON in the artifact; found ${#candidate_files[@]}. Preserve the issue open." >&2
            echo 'missing_candidate_handoff=true' >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p handoff/runtime
          canonical='handoff/runtime/action_repair_candidate.json'
          if [[ "${candidate_files[0]}" != "$canonical" ]]; then
            cp "${candidate_files[0]}" "$canonical"
          fi
      - name: Resolve exact privileged candidate or bounded failure evidence
        id: resolve
        shell: bash
        env:
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          if [[ "${missing_candidate_handoff:-false}" == true ]]; then
            echo 'has_candidate=false' >> "$GITHUB_OUTPUT"
            echo 'issue_number=0' >> "$GITHUB_OUTPUT"
            echo 'candidate_branch=' >> "$GITHUB_OUTPUT"
            echo 'candidate_sha=' >> "$GITHUB_OUTPUT"
            echo 'workflow_id=0' >> "$GITHUB_OUTPUT"
            echo 'workflow_path=' >> "$GITHUB_OUTPUT"
            echo 'repair_cycles=0' >> "$GITHUB_OUTPUT"
            echo 'candidate_status=source_failed_without_handoff' >> "$GITHUB_OUTPUT"
            echo "candidate_failure=source_conclusion=${SOURCE_CONCLUSION}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import subprocess
          from pathlib import Path

          payload = json.loads(Path('handoff/runtime/action_repair_candidate.json').read_text(encoding='utf-8'))
          status = str(payload.get('status') or 'unknown')
          ok = status == 'candidate_created'
          branch = str(payload.get('candidate_branch') or '')
          sha = str(payload.get('candidate_sha') or '')
          if ok and (not branch.startswith('genesis/privileged-candidate-') or len(sha) != 40):
              raise SystemExit('invalid privileged Action candidate handoff')
          if ok:
              subprocess.run(['git', 'fetch', 'origin', 'main', branch], check=True)
              actual = subprocess.check_output(['git', 'rev-parse', f'origin/{branch}'], text=True).strip()
              if actual != sha:
                  raise SystemExit('candidate branch head changed after generation')
          feedback = payload.get('feedback')
          if isinstance(feedback, list):
              failure = ' | '.join(str(item) for item in feedback[-3:])
          else:
              failure = str(payload.get('reason') or payload.get('error') or '')
          failure = ' '.join(failure.split())[:900]
          print(f"has_candidate={'true' if ok else 'false'}")
          print(f"issue_number={int(payload.get('issue_number') or 0)}")
          print(f"candidate_branch={branch if ok else ''}")
          print(f"candidate_sha={sha if ok else ''}")
          print(f"workflow_id={int(payload.get('workflow_id') or 0)}")
          print(f"workflow_path={str(payload.get('workflow_path') or '')}")
          print(f"repair_cycles={int(payload.get('repair_cycles') or 0)}")
          print(f"candidate_status={status}")
          print(f"candidate_failure={failure}")
          PY

  validator_a:
    needs: resolve
    if: needs.resolve.outputs.has_candidate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Independent full test suite A
        run: python -m pytest -q
      - name: Privileged Action boundary A
        run: |
          git fetch origin main
          python scripts/action_repair_guard.py origin/main
      - name: Security review A
        run: |
          python - <<'PY'
          from pathlib import Path
          from genesis.security import SecurityModule
          report = SecurityModule(Path('.')).review_candidate('origin/main')
          print(report.as_dict())
          raise SystemExit(0 if report.status == 'pass' else 1)
          PY
      - name: Sign Action validator A approval
        run: python genesis/ephemeral_validator.py --validator-id action-repair-validator-a --candidate ${{ needs.resolve.outputs.candidate_sha }} --output validator-a.json
      - uses: actions/upload-artifact@v4
        with:
          name: action-repair-validator-a-${{ github.run_id }}
          path: validator-a.json

  validator_b:
    needs: resolve
    if: needs.resolve.outputs.has_candidate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Independent full test suite B
        run: python -m pytest -q
      - name: Privileged Action boundary B
        run: |
          git fetch origin main
          python scripts/action_repair_guard.py origin/main
      - name: Security review B
        run: |
          python - <<'PY'
          from pathlib import Path
          from genesis.security import SecurityModule
          report = SecurityModule(Path('.')).review_candidate('origin/main')
          print(report.as_dict())
          raise SystemExit(0 if report.status == 'pass' else 1)
          PY
      - name: Sign Action validator B approval
        run: python genesis/ephemeral_validator.py --validator-id action-repair-validator-b --candidate ${{ needs.resolve.outputs.candidate_sha }} --output validator-b.json
      - uses: actions/upload-artifact@v4
        with:
          name: action-repair-validator-b-${{ github.run_id }}
          path: validator-b.json

  secret_guard:
    needs: resolve
    if: needs.resolve.outputs.has_candidate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Secret Guard on Action candidate and history
        run: python scripts/secret_guard.py --history

  promote:
    needs: [resolve, validator_a, validator_b, secret_guard]
    if: needs.resolve.outputs.has_candidate == 'true'
    runs-on: ubuntu-latest
    outputs:
      promoted_sha: ${{ steps.promote.outputs.promoted_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Download exact validator votes through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for validator in a b; do
            artifact_name="action-repair-validator-${validator}-${GITHUB_RUN_ID}"
            artifact_id=''
            for attempt in {1..5}; do
              artifact_id=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
                --jq ".artifacts[] | select(.name == \"${artifact_name}\") | .id" | head -n 1)
              [[ -n "$artifact_id" ]] && break
              sleep 2
            done
            [[ -n "$artifact_id" ]] || { echo "Missing validator artifact ${artifact_name}" >&2; exit 1; }
            mkdir -p "votes/${validator}"
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "/tmp/validator-${validator}.zip"
            unzip -q "/tmp/validator-${validator}.zip" -d "votes/${validator}"
          done
      - name: Verify independent signed quorum
        run: python scripts/verify_validator_votes.py votes/a/validator-a.json votes/b/validator-b.json
      - name: Promote exact validated Action candidate
        id: promote
        env:
          BRANCH: ${{ needs.resolve.outputs.candidate_branch }}
          CANDIDATE_SHA: ${{ needs.resolve.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BRANCH" == genesis/privileged-candidate-* ]]
          git fetch origin main "$BRANCH"
          test "$(git rev-parse origin/$BRANCH)" = "$CANDIDATE_SHA"
          main_sha=$(git rev-parse origin/main)
          git merge-base --is-ancestor "$main_sha" "$CANDIDATE_SHA"
          git checkout --detach "$CANDIDATE_SHA"
          python scripts/action_repair_guard.py origin/main
          git push origin "$CANDIDATE_SHA:refs/heads/main"
          echo "promoted_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"

  report:
    needs: [resolve, validator_a, validator_b, secret_guard, promote]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Build recovery status handoff
        shell: bash
        env:
          ISSUE_NUMBER: ${{ needs.resolve.outputs.issue_number }}
          WORKFLOW_ID: ${{ needs.resolve.outputs.workflow_id }}
          WORKFLOW_PATH: ${{ needs.resolve.outputs.workflow_path }}
          REPAIR_CYCLES: ${{ needs.resolve.outputs.repair_cycles }}
          CANDIDATE_STATUS: ${{ needs.resolve.outputs.candidate_status }}
          CANDIDATE_FAILURE: ${{ needs.resolve.outputs.candidate_failure }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          PROMOTED_SHA: ${{ needs.promote.outputs.promoted_sha }}
          PROMOTE_RESULT: ${{ needs.promote.result }}
          VALIDATOR_A: ${{ needs.validator_a.result }}
          VALIDATOR_B: ${{ needs.validator_b.result }}
          SECRET_GUARD: ${{ needs.secret_guard.result }}
        run: |
          mkdir -p runtime
          python - <<'PY'
          import json, os
          success = os.environ.get('PROMOTE_RESULT') == 'success' and bool(os.environ.get('PROMOTED_SHA'))
          candidate_status = os.environ.get('CANDIDATE_STATUS') or 'unknown'
          candidate_failure = os.environ.get('CANDIDATE_FAILURE') or ''
          if success:
              failure_excerpt = ''
          elif candidate_status != 'candidate_created':
              failure_excerpt = (
                  f"candidate_status={candidate_status} source_conclusion={os.environ.get('SOURCE_CONCLUSION')} "
                  f"candidate_failure={candidate_failure or '[no bounded candidate failure detail]'}"
              )
          else:
              failure_excerpt = (
                  f"validator_a={os.environ.get('VALIDATOR_A')} validator_b={os.environ.get('VALIDATOR_B')} "
                  f"secret_guard={os.environ.get('SECRET_GUARD')} promote={os.environ.get('PROMOTE_RESULT')}"
              )
          payload = {
              'status': 'promoted' if success else 'validation_failed',
              'issue_number': int(os.environ.get('ISSUE_NUMBER') or 0),
              'workflow_id': int(os.environ.get('WORKFLOW_ID') or 0),
              'workflow_path': os.environ.get('WORKFLOW_PATH') or '',
              'repair_cycles': int(os.environ.get('REPAIR_CYCLES') or 0),
              'promoted_sha': os.environ.get('PROMOTED_SHA') or '',
              'failure_excerpt': failure_excerpt[:1600],
          }
          open('runtime/action_repair_recovery_status.json', 'w', encoding='utf-8').write(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: genesis-action-repair-status-${{ github.run_id }}
          path: runtime/action_repair_recovery_status.json
          retention-days: 30
