name: Genesis Autonomy Heartbeat

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_run:
    workflows: ["Genesis GitHub Issue Autorepair"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/autonomy-heartbeat.yml"
      - "genesis/pulse.py"

permissions:
  actions: write
  contents: read
  issues: read

concurrency:
  group: genesis-autonomy-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Measure repository pressure and active autonomous work
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          freshness_seconds=7200
          fresh=()
          stale=()
          stale_in_progress=()
          stale_cancelled=()
          stale_cancel_failures=()

          for workflow in gene-pulse.yml coding-intelligence-pulse.yml file-self-review.yml manual-self-repair.yml; do
            for status in queued in_progress; do
              payload=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=main&status=${status}&per_page=100")
              while IFS=$'\t' read -r run_id run_status run_url run_sha run_event created; do
                [[ -n "$run_id" && -n "$created" ]] || continue
                created_epoch=$(date -u -d "$created" +%s 2>/dev/null || echo "$now")
                age=$((now - created_epoch))
                detail="${workflow}:${run_status}:run=${run_id}:event=${run_event}:sha=${run_sha:0:12}:age_seconds=${age}:url=${run_url}"
                if (( age <= freshness_seconds )); then
                  fresh+=("$detail")
                  continue
                fi

                stale+=("$detail")
                if [[ "$run_status" == "in_progress" ]]; then
                  stale_in_progress+=("$detail")
                fi

                if gh run cancel "$run_id" >/dev/null 2>&1; then
                  stale_cancelled+=("${detail}:cancel=normal")
                elif gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/force-cancel" >/dev/null 2>&1; then
                  stale_cancelled+=("${detail}:cancel=force")
                else
                  stale_cancel_failures+=("$detail")
                fi
              done < <(printf '%s' "$payload" | jq -r '.workflow_runs[] | [.id, .status, .html_url, .head_sha, .event, .created_at] | @tsv')
            done
          done

          if (( ${#fresh[@]} > 0 || ${#stale_in_progress[@]} > 0 )); then
            busy=true
          else
            busy=false
          fi

          gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --limit 500 \
            --json number,title,labels \
            > "$RUNNER_TEMP/open-issues.json"

          backlog_count=$(jq '[
            .[]
            | ([.labels[].name] // []) as $labels
            | select(
                ($labels | index("genesis-autonomous")) != null or
                ($labels | index("genesis-task")) != null or
                (.title | startswith("[Genesis Task]")) or
                (.title | startswith("[Genesis Repair]")) or
                (.title | startswith("[Genesis Self Improvement]")) or
                (.title | startswith("Genesis challenge:")) or
                (.title | startswith("Genesis Control:"))
              )
            | select(($labels | index("genesis-blocked")) == null)
            | select(($labels | index("genesis-solved")) == null)
          ] | length' "$RUNNER_TEMP/open-issues.json")
          action_failure_count=$(jq '[.[] | select(([.labels[].name] | index("genesis-action-failure")) != null)] | length' "$RUNNER_TEMP/open-issues.json")

          completed=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/gene-pulse.yml/runs?branch=main&status=completed&per_page=1")
          last_completed=$(jq -r '.workflow_runs[0].updated_at // empty' <<<"$completed")
          last_completed_age_seconds=''
          if [[ -n "$last_completed" ]]; then
            last_completed_epoch=$(date -u -d "$last_completed" +%s 2>/dev/null || echo "$now")
            last_completed_age_seconds=$((now - last_completed_epoch))
            if (( last_completed_age_seconds < 0 )); then
              last_completed_age_seconds=0
            fi
          fi

          BACKLOG_COUNT="$backlog_count" \
          ACTION_FAILURE_COUNT="$action_failure_count" \
          LAST_COMPLETED_AGE_SECONDS="$last_completed_age_seconds" \
          python - <<'PY'
          import os
          from genesis.pulse import adaptive_recovery_interval, recovery_pulse_due

          decision = adaptive_recovery_interval(
              backlog_count=int(os.environ["BACKLOG_COUNT"]),
              action_failure_count=int(os.environ["ACTION_FAILURE_COUNT"]),
          )
          age_text = os.environ.get("LAST_COMPLETED_AGE_SECONDS", "")
          age = int(age_text) if age_text else None
          due = os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch" or recovery_pulse_due(
              last_completed_age_seconds=age,
              interval_minutes=decision.interval_minutes,
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"desired_interval_minutes={decision.interval_minutes}\n")
              output.write(f"schedule_reason={decision.reason}\n")
              output.write(f"pulse_due={'true' if due else 'false'}\n")
          PY

          echo "busy=$busy" >> "$GITHUB_OUTPUT"
          echo "backlog_count=$backlog_count" >> "$GITHUB_OUTPUT"
          echo "action_failure_count=$action_failure_count" >> "$GITHUB_OUTPUT"
          echo "last_completed_age_seconds=${last_completed_age_seconds:-none}" >> "$GITHUB_OUTPUT"
          echo "fresh_count=${#fresh[@]}" >> "$GITHUB_OUTPUT"
          echo "stale_count=${#stale[@]}" >> "$GITHUB_OUTPUT"
          echo "stale_in_progress_count=${#stale_in_progress[@]}" >> "$GITHUB_OUTPUT"
          echo "stale_cancelled_count=${#stale_cancelled[@]}" >> "$GITHUB_OUTPUT"
          echo "stale_cancel_failure_count=${#stale_cancel_failures[@]}" >> "$GITHUB_OUTPUT"
          {
            echo 'fresh_runs<<EOF'
            if (( ${#fresh[@]} > 0 )); then
              printf '%s\n' "${fresh[@]}"
            else
              echo 'none'
            fi
            echo 'EOF'
            echo 'stale_runs<<EOF'
            if (( ${#stale[@]} > 0 )); then
              printf '%s\n' "${stale[@]}"
            else
              echo 'none'
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch Gene Pulse when adaptive scheduler says due
        if: steps.gate.outputs.busy == 'false' && steps.gate.outputs.pulse_due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DESIRED_INTERVAL_MINUTES: ${{ steps.gate.outputs.desired_interval_minutes }}
        run: >-
          gh workflow run gene-pulse.yml
          --ref main
          -f gene=gene-node-1
          -f continue_chain=true

      - name: Record adaptive heartbeat decision
        if: always()
        env:
          BUSY: ${{ steps.gate.outputs.busy }}
          PULSE_DUE: ${{ steps.gate.outputs.pulse_due }}
          DESIRED_INTERVAL_MINUTES: ${{ steps.gate.outputs.desired_interval_minutes }}
          SCHEDULE_REASON: ${{ steps.gate.outputs.schedule_reason }}
          BACKLOG_COUNT: ${{ steps.gate.outputs.backlog_count }}
          ACTION_FAILURE_COUNT: ${{ steps.gate.outputs.action_failure_count }}
          LAST_COMPLETED_AGE_SECONDS: ${{ steps.gate.outputs.last_completed_age_seconds }}
          FRESH_COUNT: ${{ steps.gate.outputs.fresh_count }}
          STALE_COUNT: ${{ steps.gate.outputs.stale_count }}
          STALE_IN_PROGRESS_COUNT: ${{ steps.gate.outputs.stale_in_progress_count }}
          STALE_CANCELLED_COUNT: ${{ steps.gate.outputs.stale_cancelled_count }}
          STALE_CANCEL_FAILURE_COUNT: ${{ steps.gate.outputs.stale_cancel_failure_count }}
        shell: bash
        run: |
          {
            echo "## Genesis Adaptive Autonomy Heartbeat"
            echo
            echo "Scheduler interval: ${DESIRED_INTERVAL_MINUTES:-unknown} minutes (${SCHEDULE_REASON:-unknown})"
            echo "Eligible backlog: ${BACKLOG_COUNT:-0}"
            echo "Open Action failures: ${ACTION_FAILURE_COUNT:-0}"
            echo "Last completed Pulse age: ${LAST_COMPLETED_AGE_SECONDS:-unknown} seconds"
            echo "Pulse due: ${PULSE_DUE:-false}"
            echo "Autonomy busy: ${BUSY:-unknown}"
            echo
            if [[ "$BUSY" == "true" ]]; then
              echo "An autonomous chain is active; duplicate Gene Pulse was skipped."
            elif [[ "$PULSE_DUE" == "true" ]]; then
              echo "Adaptive recovery threshold was reached; Gene Pulse was dispatched."
            else
              echo "Recovery threshold has not been reached; no duplicate Pulse was launched."
            fi
            echo
            echo "The cron only checks every five minutes. Active Gene Pulse chains still continue immediately, and GitHub Issue autorepair has its own event-driven refill path."
            echo
            echo "Fresh runs: ${FRESH_COUNT:-0}"
            echo "Stale runs detected: ${STALE_COUNT:-0}"
            echo "Stale in-progress runs: ${STALE_IN_PROGRESS_COUNT:-0}"
            echo "Stale cancellation requests accepted: ${STALE_CANCELLED_COUNT:-0}"
            echo "Stale cancellation failures: ${STALE_CANCEL_FAILURE_COUNT:-0}"
          } >> "$GITHUB_STEP_SUMMARY"
