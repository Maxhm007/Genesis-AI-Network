name: Genesis verifies Eve code-repair engine

# Runs immutable peer-authored repair code against an isolated disposable
# Python fixture. Does not break main or grant cross-repository write access.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/peer-code-repair-canary.yml'
      - 'scripts/peer_repair_acceptance.py'

permissions:
  contents: read
  issues: write

jobs:
  peer-code-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Maxhm007/Eve
          ref: 8e6a770725288cca0de491ba126f298a7f6f978e
          path: peer-engine
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute Eve-authored repair against a real failing test fixture
        run: python scripts/peer_repair_acceptance.py peer-engine/repair_v2.py
      - name: Record verified peer code-repair result
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "Peer Eve fixture repair passed on ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "Source peer SHA: 8e6a770725288cca0de491ba126f298a7f6f978e" >> "$GITHUB_STEP_SUMMARY"
          title="[Peer Repair Proof] Genesis verified Eve code-repair engine run ${GITHUB_RUN_ID}"
          if ! gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 100 --json title --jq '.[].title' | grep -Fxq "$title"; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "The Eve-authored pinned repair engine executed in Genesis. A disposable unittest fixture failed before its one-file literal patch and passed afterward. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. This is peer-engine fixture acceptance, not production bug repair."
          fi
