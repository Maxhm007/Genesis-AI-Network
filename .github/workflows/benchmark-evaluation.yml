name: Genesis Benchmark Evaluation

on:
  workflow_run:
    workflows:
      - Genesis Proactive Development
    types:
      - completed
  workflow_dispatch: {}

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  evaluate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore and return shared Gene runtime state
        uses: actions/cache@v4
        with:
          path: runtime
          key: gene-runtime-gene-node-1-${{ github.run_id }}-benchmark-evaluation
          restore-keys: |
            gene-runtime-gene-node-1-
      - run: pip install -r requirements.txt
      - name: Advance one frontier benchmark evaluation task
        run: python scripts/benchmark_task_worker.py
      - name: Preserve benchmark evaluation evidence
        uses: actions/upload-artifact@v4
        with:
          name: genesis-benchmark-evaluation-${{ github.run_id }}
          path: |
            runtime/competitive_benchmark_candidates/
          if-no-files-found: ignore
          retention-days: 30
