name: Genesis Worker Safety Cancel

# Manual legacy cleanup only; no automatic control-plane authority.
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel obsolete solver instance
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/33327369728/cancel" || true
