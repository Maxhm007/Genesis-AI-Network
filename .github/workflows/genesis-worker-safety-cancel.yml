name: Genesis Worker Safety Cancel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/genesis-worker-safety-cancel.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel unsafe in-flight worker
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/33327388862/cancel" || true
